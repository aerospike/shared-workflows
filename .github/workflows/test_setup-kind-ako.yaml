name: Test Setup kind and AKO Action
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/actions/setup-kind-ako/**
      - .github/workflows/test_setup-kind-ako.yaml

permissions:
  contents: read

jobs:
  test-helpers:
    name: Helper unit tests
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install bats
        run: |
          git init bats-core
          cd bats-core
          git remote add origin https://github.com/bats-core/bats-core.git
          git fetch --depth 1 origin cf931b7b7c79998ded0f364126dbc9d46739a76f # v1.12.0
          git checkout --detach FETCH_HEAD
          sudo ./install.sh /usr/local
          cd ..
          rm -rf bats-core

      - name: Run bats tests
        run: bats .github/actions/setup-kind-ako/tests/
