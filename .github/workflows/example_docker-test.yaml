name: Example Docker Build & Deploy
permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version override (leave empty for auto-detection)
        required: false
        default: ""

concurrency:
  group: jfrog-test-deploy
  cancel-in-progress: false

jobs:
  extract-version:
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9ca718d3bf646d6534007c269a635b3e54cadf99 # v2.19.2
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Extract Version
        id: extract
        uses: ./.github/actions/extract-version-from-tag
        with:
          version: ${{ inputs.version }}
          version-file: .github/workflows/VERSION.example
    outputs:
      version: ${{ steps.extract.outputs.version }}
      git_tag: ${{ steps.extract.outputs.git_tag }}

  # Delete existing bundle before deploy. Promoted bundles can lock artifacts
  # in dev-local repos, causing deploy uploads to fail.
  delete-existing-bundle:
    needs: [extract-version]
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9ca718d3bf646d6534007c269a635b3e54cadf99 # v2.19.2
        with:
          egress-policy: audit
      - name: Checkout shared-workflows (actions)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
      - name: Setup JFrog CLI
        uses: step-security/setup-jfrog-cli@893a92f96c7727242adf0e603c77b1f2a22390e1 # v4.9.1
        env:
          JF_URL: https://artifact.aerospike.io
          JF_PROJECT: test
        with:
          oidc-provider-name: gh-dev-test
          oidc-audience: aerospike/testing
      - name: Delete existing bundle (if any)
        uses: ./.github/actions/delete-release-bundle
        with:
          bundle-name: test-docker-release
          version: ${{ needs.extract-version.outputs.version }}
          jf-project: test

  build-test-deploy:
    uses: ./.github/workflows/reusable_docker-build-deploy.yaml
    needs: [extract-version, delete-existing-bundle]
    with:
      jf-project: test
      image-name: test-image
      app-version: ${{ needs.extract-version.outputs.version }}
      context: ./.github/workflows/execute-build/test_apps/hi
      file: ./.github/workflows/execute-build/test_apps/hi/Dockerfile
      jf-build-name: test-container
      oidc-provider-name: gh-dev-test
      oidc-audience: aerospike/testing
  create-release-bundle:
    needs: [build-test-deploy, extract-version]
    uses: ./.github/workflows/reusable_create-release-bundle.yaml
    if: github.event_name == 'workflow_dispatch'
    with:
      gh-workflows-ref: ${{ github.sha }}
      jf-project: test
      jf-build-names: test-container:${{ github.run_number }}
      jf-bundle-name: test-docker-release
      version: ${{ needs.extract-version.outputs.version }}
      oidc-provider-name: gh-dev-test
      oidc-audience: aerospike/testing
