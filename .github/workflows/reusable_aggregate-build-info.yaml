name: Aggregate Build Info

on:
  workflow_call:
    inputs:
      project:
        description: JFrog Artifactory project name
        required: true
        type: string
      parent-build-name:
        description: Name for the parent aggregated build
        required: true
        type: string
      parent-build-version:
        description: Version for the parent aggregated build
        required: true
        type: string
      build-name-pattern:
        description: Pattern to match matrix build names (e.g., "test-build-*")
        required: true
        type: string
      artifactory-url:
        description: JFrog Artifactory URL
        required: false
        type: string
        default: https://artifact.aerospike.io
      artifactory-oidc-provider-name:
        description: OIDC provider name
        required: false
        type: string
        default: gh-aerospike
      artifactory-oidc-audience:
        description: OIDC audience
        required: false
        type: string
        default: aerospike
    outputs:
      parent-build-name:
        description: The parent build name
        value: ${{ jobs.aggregate.outputs.parent-build-name }}
      parent-build-version:
        description: The parent build version
        value: ${{ jobs.aggregate.outputs.parent-build-version }}

permissions:
  contents: read
  id-token: write

jobs:
  aggregate:
    runs-on: ubuntu-22.04
    outputs:
      parent-build-name: ${{ steps.aggregate.outputs.parent-build-name }}
      parent-build-version: ${{ steps.aggregate.outputs.parent-build-version }}
    steps:
      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@751c204e8e1d3fe053e30218a2143ab4fe100d95 # v4.6.0
        env:
          JF_URL: ${{ inputs.artifactory-url }}
          JF_PROJECT: ${{ inputs.project }}
        with:
          oidc-provider-name: ${{ inputs.artifactory-oidc-provider-name }}
          oidc-audience: ${{ inputs.artifactory-oidc-audience }}

      - name: Check JFrog Configuration
        run: |
          jf c show
          jf rt ping

      - name: Aggregate Matrix Builds
        id: aggregate
        run: |
          PARENT_BUILD_NAME="${{ inputs.parent-build-name }}"
          PARENT_BUILD_VERSION="${{ inputs.parent-build-version }}"
          BUILD_PATTERN="${{ inputs.build-name-pattern }}"

          echo "parent-build-name=$PARENT_BUILD_NAME" >> $GITHUB_OUTPUT
          echo "parent-build-version=$PARENT_BUILD_VERSION" >> $GITHUB_OUTPUT

          echo "Aggregating child builds into parent build: $PARENT_BUILD_NAME/$PARENT_BUILD_VERSION"
          echo "Searching for child builds matching pattern: $BUILD_PATTERN"

          # Query JFrog to find all child builds matching the pattern
          # This will find builds like test-build-jammy-x86_64, test-build-noble-x86_64, etc.
          jf rt search --spec='{"name": "'"$BUILD_PATTERN"'", "type": "build"}' --project="${{ inputs.project }}" | jq -r '.[] | "\(.name) \(.number)"' | while read build_name build_version; do
            if [[ -n "$build_name" && -n "$build_version" ]]; then
              echo "Found child build: $build_name/$build_version"
              echo "Appending to parent build: $PARENT_BUILD_NAME/$PARENT_BUILD_VERSION"
              
              jf rt build-append "$PARENT_BUILD_NAME" "$PARENT_BUILD_VERSION" "$build_name" "$build_version" --project="${{ inputs.project }}" || true
            fi
          done

          # Publish the parent build
          jf rt build-publish "$PARENT_BUILD_NAME" "$PARENT_BUILD_VERSION" --project="${{ inputs.project }}" || true

          echo "Parent build published: $PARENT_BUILD_NAME/$PARENT_BUILD_VERSION"
