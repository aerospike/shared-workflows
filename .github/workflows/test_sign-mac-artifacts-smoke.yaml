name: "Smoke Test: Sign Mac Artifacts (Manual)"

# End-to-end smoke test for Mac signing with real Apple certificates.
# Requires repository variables and secrets to be configured:
#   vars: APPLE_SIGNING_IDENTITY, APPLE_INSTALLER_IDENTITY
#   secrets: APPLE_APPLICATION_CERT, APPLE_ID, APPLE_INSTALLER_CERT,
#            APPLE_PASSWORD, APPLE_TEAM_ID

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  create-test-pkg:
    runs-on: macos-14
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit

      - name: Validate required repository variables
        run: |
          set -euo pipefail
          missing=()
          [ -z "${{ vars.APPLE_SIGNING_IDENTITY }}" ] && missing+=("APPLE_SIGNING_IDENTITY")
          [ -z "${{ vars.APPLE_INSTALLER_IDENTITY }}" ] && missing+=("APPLE_INSTALLER_IDENTITY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Error: Missing required repository variables: ${missing[*]}" >&2
            echo "Set these in Settings > Secrets and variables > Actions > Variables" >&2
            exit 1
          fi

      - name: Create a minimal unsigned .pkg for testing
        env:
          TEST_VERSION: 0.0.0-smoke
        run: |
          set -euo pipefail
          mkdir -p pkg-root/usr/local/bin
          cat > pkg-root/usr/local/bin/hello-smoke <<'SCRIPT'
          #!/bin/bash
          echo "Hello from smoke test"
          SCRIPT
          chmod +x pkg-root/usr/local/bin/hello-smoke

          pkgbuild \
            --root pkg-root \
            --identifier com.aerospike.smoke-test \
            --version "$TEST_VERSION" \
            --install-location / \
            "test-artifacts/smoke-test-${TEST_VERSION}.pkg"

      - name: Upload unsigned test .pkg
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: build-artifacts
          path: test-artifacts

  sign-mac:
    needs: create-test-pkg
    uses: ./.github/workflows/reusable_sign-mac-artifacts.yaml
    with:
      gh-unsigned-artifacts: build-artifacts
      gh-workflows-ref: ${{ github.sha }}
      signing-identity: ${{ vars.APPLE_SIGNING_IDENTITY }}
      installer-identity: ${{ vars.APPLE_INSTALLER_IDENTITY }}
      notarize: true
      runs-on: macos-14
    secrets:
      apple-application-cert: ${{ secrets.APPLE_APPLICATION_CERT }}
      apple-id: ${{ secrets.APPLE_ID }}
      apple-installer-cert: ${{ secrets.APPLE_INSTALLER_CERT }}
      apple-password: ${{ secrets.APPLE_PASSWORD }}
      apple-team-id: ${{ secrets.APPLE_TEAM_ID }}

  verify:
    needs: sign-mac
    runs-on: macos-14
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit

      - name: Download signed artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts
          path: signed

      - name: Verify .pkg signature
        env:
          TEST_VERSION: 0.0.0-smoke
        run: |
          set -euo pipefail
          PKG="signed/smoke-test-${TEST_VERSION}.pkg"
          echo "==> Checking package signature"
          pkgutil --check-signature "$PKG"

          echo "==> Checking spctl assessment"
          spctl --assess --type install "$PKG" || echo "spctl assessment returned non-zero (may require notarization)"

          echo "==> Checking staple"
          xcrun stapler validate "$PKG"
