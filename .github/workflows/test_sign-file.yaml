name: GPG sign file
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
permissions: read-all
jobs:
  sign-file:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-22.04
          # - ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: setup GPG
        uses: aerospike/shared-workflows/.github/actions/setup-gpg@32dc23ccc107220d20aa02e3acc273332935dc1d # v2.0.0
        with:
          gpg-private-key: ${{ secrets.GPG_SECRET_KEY }}
          gpg-public-key: ${{ secrets.GPG_PUBLIC_KEY }}
          gpg-key-pass: ${{ secrets.GPG_PASS }}

      - name: GPG sign artifacts # Signing other artifacts
        env:
          GPG_TTY: /dev/null
          HOME: /home/runner
          GNUPGHOME: /home/runner/.gnupg
        run: |
          # Ensure environment variables are exported
          export HOME="${HOME}"
          export GNUPGHOME="${GNUPGHOME}"

          # Sign the file
          gpg --detach-sign --no-tty --batch --yes --output README.md.asc --passphrase-file "$GNUPGHOME/passphrase" README.md
          # Verify the signature
          gpg --verify README.md.asc README.md
