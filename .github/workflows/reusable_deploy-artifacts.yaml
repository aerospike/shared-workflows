name: Deploy to Artifactory

on:
  workflow_call:
    inputs:
      project:
        description: JFrog Artifactory project name
        required: true
        type: string
      build-name:
        description: JFrog build name
        required: true
        type: string
      version:
        description: Version of the artifact to upload
        required: true
        type: string
      artifactory-url:
        required: false
        description: JFrog Artifactory URL
        type: string
        default: https://aerospike.jfrog.io
      artifactory-oidc-provider-name:
        required: false
        description: OIDC provider name
        type: string
        default: gh-citrusleaf
      artifactory-oidc-audience:
        required: false
        description: OIDC audience
        type: string
        default: citrusleaf
      artifact-name:
        description: Name of signed artifacts on github
        required: false
        type: string
        default: signed-artifacts
      retention-days:
        description: Retention days for the artifacts
        required: false
        type: number
        default: 1
      runs-on:
        description: The runner to use for the build
        required: false
        type: string
        default: ubuntu-22.04
      checkout-path:
        description: Directory to checkout the shared-workflows repository into
        required: false
        type: string
        default: shared-workflows
      dry-run:
        description: Whether to run in dry-run mode. Dry-run mode will not upload any artifacts.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  upload:
    runs-on: ${{ inputs.runs-on }}
    env:
      CHECKOUT_REF: 5d338b59c75489025372fb07a80e52237181d8be # Latest commit hash for development
    steps:
      - name: Checkout shared-workflows repository
        uses: actions/checkout@v5
        with:
          repository: aerospike/shared-workflows
          ref: ${{ env.CHECKOUT_REF }}
          path: ${{ inputs.checkout-path }}
          fetch-depth: 1

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@2bc6e55719cd37dfb2f655a1e4f16c3440182a9f # v4.5.13
        env:
          JF_URL: ${{ inputs.artifactory-url }}
          JF_PROJECT: ${{ inputs.project }}
        with:
          oidc-provider-name: ${{ inputs.artifactory-oidc-provider-name }}
          oidc-audience: ${{ inputs.artifactory-oidc-audience }}

      - name: Check JFrog Configuration
        run: |
          jf c show
          jf rt ping
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ./build-artifacts

      - name: Deploy Artifacts
        shell: bash
        run: |
          chmod +x ${{ inputs.checkout-path }}/.github/workflows/deploy-artifacts/entrypoint.sh
          dry_run_arg=""
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            dry_run_arg="--dry-run"
          fi
          ${{ inputs.checkout-path }}/.github/workflows/deploy-artifacts/entrypoint.sh \
            "${{ inputs.project }}" \
            "${{ inputs.build-name }}" \
            "${{ inputs.version }}" \
            "${{ github.run_id }}" \
            $dry_run_arg
