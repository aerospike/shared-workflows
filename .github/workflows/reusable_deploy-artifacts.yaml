name: Deploy to Artifactory

on:
  workflow_call:
    inputs:
      # Required inputs
      jf-build-id:
        description: |
          JFrog build ID for the overall build info. This will be the parent build info with sub build infos for build metadata and artifacts.
          This should be a unique build ID for the overall build info and will be uploaded to JFrog as the parent build info.
        required: true
        type: string
      jf-build-name:
        description: JFrog build name
        required: true
        type: string
      jf-metadata-build-id:
        description: JFrog build ID for the build metadata
        required: true
        type: string
      jf-project:
        description: JFrog Artifactory project name
        required: true
        type: string
      version:
        description: Version of the artifact to upload
        required: true
        type: string

      # Optional inputs
      dry-run:
        description: Whether to run in dry-run mode. Dry-run mode will not upload any artifacts.
        required: false
        type: boolean
        default: false
      jar-group-id:
        description: Maven group ID for JAR artifacts (used as fallback when metadata doesn't provide one)
        required: false
        type: string
      gh-artifact-name:
        description: Name of signed artifacts on github
        required: false
        type: string
        default: signed-artifacts
      gh-checkout-path:
        description: Directory to checkout the shared-workflows repository into
        required: false
        type: string
        default: shared-workflows
      gh-workflows-ref:
        description: Git reference to checkout shared-workflows repository (tag, branch, or SHA)
        required: false
        type: string
        default: v2.0.2
      gh-retention-days:
        description: Retention days for the artifacts
        required: false
        type: number
        default: 1
      jf-url:
        required: false
        description: JFrog Artifactory URL
        type: string
        default: https://artifact.aerospike.io
      oidc-audience:
        required: false
        description: OIDC audience
        type: string
        default: citrusleaf
      oidc-provider-name:
        required: false
        description: OIDC provider name
        type: string
        default: gh-citrusleaf
      runs-on:
        description: The runner to use for the build
        required: false
        type: string
        default: ubuntu-22.04
permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ${{ inputs.runs-on }}
    outputs:
      jf-build-id: ${{ steps.deploy.outputs.jf-build-id }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit

      - name: Checkout shared-workflows repository
        if: github.repository != 'aerospike/shared-workflows'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: aerospike/shared-workflows
          ref: ${{ inputs.gh-workflows-ref }}
          path: ${{ inputs.gh-checkout-path }}
          fetch-depth: 1

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@5b06f730cc5a6f55d78b30753f8583454b08c0aa # v4.8.1
        env:
          JF_URL: ${{ inputs.jf-url }}
          JF_PROJECT: ${{ inputs.jf-project }}
        with:
          oidc-provider-name: ${{ inputs.oidc-provider-name }}
          oidc-audience: ${{ inputs.oidc-audience }}

      - name: Check JFrog Configuration
        run: |
          jf c show
          jf rt ping

      - name: Download artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: ${{ inputs.gh-artifact-name }}
          path: ./build-artifacts

      - name: Verify artifacts
        shell: bash
        run: |
          echo "Build artifacts: $(find ./build-artifacts)"

      - name: Deploy Artifacts
        id: deploy
        shell: bash
        run: |
          chmod +x ${{ inputs.gh-checkout-path }}/.github/workflows/deploy-artifacts/entrypoint.sh
          dry_run_arg=""
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            dry_run_arg="--dry-run"
          fi

          jar_group_id_arg=""
          if [ -n "${{ inputs.jar-group-id }}" ]; then
            jar_group_id_arg="--jar-group-id ${{ inputs.jar-group-id }}"
          fi

          ${{ inputs.gh-checkout-path }}/.github/workflows/deploy-artifacts/entrypoint.sh \
            "${{ inputs.jf-project }}" \
            "${{ inputs.jf-build-name }}" \
            "${{ inputs.version }}" \
            "${{ inputs.jf-build-id }}" \
            "${{ inputs.jf-metadata-build-id }}" \
            $dry_run_arg \
            $jar_group_id_arg
          echo "jf-build-id=${{ inputs.jf-build-id }}" >> $GITHUB_OUTPUT
