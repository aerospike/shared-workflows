name: Deploy to Artifactory

on:
  workflow_call:
    inputs:
      # Required inputs
      jf-build-id:
        description: |
          JFrog build ID for the overall build info. This will be the parent build info with sub build infos for build metadata and artifacts.
          This should be a unique build ID for the overall build info and will be uploaded to JFrog as the parent build info.
        required: true
        type: string
      jf-build-name:
        description: JFrog build name
        required: true
        type: string
      jf-metadata-build-id:
        description: |
          JFrog build ID prefix used to discover child build-infos for aggregation (searches for <prefix>*.json).
          When empty, child build-info aggregation is skipped and only the parent build-info is published.
        required: false
        type: string
        default: ""
      jf-project:
        description: JFrog Artifactory project name
        required: true
        type: string
      version:
        description: Version of the artifact to upload
        required: true
        type: string
      gh-workflows-ref:
        description: |
          Git reference for shared-workflows checkout. Should match the version in your 'uses:' line.
          GitHub Actions doesn't expose the called workflow's ref, so this is required.
          See: .github/workflows/docs/why-gh-workflows-ref.md
        required: true
        type: string

      # Optional inputs
      dry-run:
        description: Whether to run in dry-run mode. Dry-run mode will not upload any artifacts.
        required: false
        type: boolean
        default: false
      jar-group-id:
        description: Maven group ID for JAR artifacts (used as fallback when metadata doesn't provide one)
        required: false
        type: string
      gh-artifact-name:
        description: Name of signed artifacts on github
        required: false
        type: string
        default: signed-artifacts
      gh-checkout-path:
        description: Directory to checkout the shared-workflows repository into
        required: false
        type: string
        default: shared-workflows
      gh-retention-days:
        description: Retention days for the artifacts
        required: false
        type: number
        default: 1
      jf-url:
        required: false
        description: JFrog Artifactory URL
        type: string
        default: https://artifact.aerospike.io
      oidc-audience:
        required: false
        description: OIDC audience
        type: string
        default: aerospike
      oidc-provider-name:
        required: false
        description: OIDC provider name
        type: string
        default: gh-aerospike
      build-type:
        description: Freeform build type label applied as a target-prop on all artifacts (e.g., release, nightly, snapshot)
        required: false
        type: string
        default: ""
      internal:
        description: Mark artifacts as internal-only (sets internal=true target-prop, used for promotion control)
        required: false
        type: boolean
        default: false
      runs-on:
        description: The runner to use for the build
        required: false
        type: string
        default: ubuntu-22.04
permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ${{ inputs.runs-on }}
    outputs:
      jf-build-id: ${{ steps.deploy.outputs.jf-build-id }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9ca718d3bf646d6534007c269a635b3e54cadf99 # v2.19.2
        with:
          egress-policy: audit

      - name: Install xmllint and Verify
        shell: bash
        run: |
          echo "Attempting to install libxml2-utils for xmllint..."

          sudo apt-get update -y
          sudo apt-get install -y libxml2-utils

          if command -v xmllint > /dev/null 2>&1; then
            echo "xmllint is installed successfully."
          else
            echo "Error: xmllint command not found after installation attempt."
            exit 1
          fi

      - name: Checkout shared-workflows repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: aerospike/shared-workflows
          ref: ${{ inputs.gh-workflows-ref }}
          path: ${{ inputs.gh-checkout-path }}
          fetch-depth: 1

      - name: Setup JFrog CLI
        id: jf
        uses: step-security/setup-jfrog-cli@893a92f96c7727242adf0e603c77b1f2a22390e1 # v4.9.1
        env:
          JF_URL: ${{ inputs.jf-url }}
          JF_PROJECT: ${{ inputs.jf-project }}
        with:
          oidc-provider-name: ${{ inputs.oidc-provider-name }}
          oidc-audience: ${{ inputs.oidc-audience }}

      - name: Check JFrog Configuration
        run: |
          jf c show
          jf rt ping

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.gh-artifact-name }}
          path: ./build-artifacts

      - name: Verify artifacts
        shell: bash
        run: |
          echo "Build artifacts: $(find ./build-artifacts)"

      # Inline logic from .github/actions/detect-artifacts (same outputs). A local
      # uses: ./.github/actions/... resolves from the consumer repo when nested under
      # reusable_artifacts-cicd, and uses: cannot reference workflow inputs (e.g. for
      # @ref). GITHUB_ACTION_PATH only exists inside a composite step, not for resolving uses.
      - name: Detect artifact types
        id: detect-artifacts
        shell: bash
        run: |
          set -euo pipefail
          script="${{ inputs.gh-checkout-path }}/.github/workflows/deploy-artifacts/detect_types.sh"
          if [[ ! -f "$script" ]]; then
            echo "Error: detect_types script not found at $script" >&2
            echo "Checkout shared-workflows (or sparse-checkout deploy-artifacts) before this step." >&2
            exit 1
          fi
          chmod +x "$script"
          "$script" --artifacts-dir build-artifacts
          struct_dir="structured_build_artifacts"
          echo "structured-artifacts-dir=$struct_dir" >>"$GITHUB_OUTPUT"
          echo "manifest-path=$struct_dir/.manifest" >>"$GITHUB_OUTPUT"

      - name: Detected Artifacts
        shell: bash
        run: |
          set -euo pipefail
          echo "Structured dir: ${{ steps.detect-artifacts.outputs.structured-artifacts-dir }}"
          manifest_path="${{ steps.detect-artifacts.outputs.manifest-path }}"
          echo "Manifest: $manifest_path"
          if [[ -f "$manifest_path" ]]; then
            echo "Manifest packages (type: path):"
            while IFS=$'\t' read -r path type || [[ -n "$path" ]]; do
              [[ -z "${path:-}" && -z "${type:-}" ]] && continue
              printf '%s: %s\n' "$type" "$path"
            done <"$manifest_path"
          else
            echo "No manifest file at $manifest_path" >&2
          fi

      - name: Deploy Artifacts
        id: deploy
        shell: bash
        run: |
          entrypoint="${{ inputs.gh-checkout-path }}/.github/workflows/deploy-artifacts/entrypoint.sh"
          chmod +x "$entrypoint"
          dry_run_arg=""
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            dry_run_arg="--dry-run"
          fi

          jar_group_id_arg=""
          if [ -n "${{ inputs.jar-group-id }}" ]; then
            jar_group_id_arg="--jar-group-id ${{ inputs.jar-group-id }}"
          fi

          build_type_arg=""
          if [ -n "${{ inputs.build-type }}" ]; then
            build_type_arg="--build-type ${{ inputs.build-type }}"
          fi

          internal_arg=""
          if [ "${{ inputs.internal }}" = "true" ]; then
            internal_arg="--internal"
          fi

          "$entrypoint" \
            "${{ inputs.jf-project }}" \
            "${{ inputs.jf-build-name }}" \
            "${{ inputs.version }}" \
            "${{ inputs.jf-build-id }}" \
            "${{ inputs.jf-metadata-build-id }}" \
            $dry_run_arg \
            $jar_group_id_arg \
            $build_type_arg \
            $internal_arg
          echo "jf-build-id=${{ inputs.jf-build-id }}" >> $GITHUB_OUTPUT
