name: Test PR Hygiene Workflow
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # End-to-end test: valid title should pass both checks
  test-valid-title:
    uses: ./.github/workflows/reusable_pr-hygiene.yml
    with:
      pr_title: "feat(workflows): [INFRA-378] add pr hygiene checks"

  # Unit tests for failure cases (can't test expected failures via reusable workflow)
  test-failure-cases:
    runs-on: ubuntu-latest
    steps:
      - name: Install commitlint
        run: |
          npm install --save-dev @commitlint/cli @commitlint/config-conventional
          echo '{"extends":["@commitlint/config-conventional"]}' > .commitlintrc.json

      - name: "Test: non-conventional title is rejected"
        run: |
          if echo "bad title no format" | npx commitlint 2>&1; then
            echo "❌ Should have failed for non-conventional title"
            exit 1
          fi
          echo "✅ Correctly rejected non-conventional title"

      - name: "Test: missing JIRA ticket is detected"
        run: |
          PR_TITLE="feat: missing jira ticket"
          JIRA_TICKET=$(echo "$PR_TITLE" | grep -oP '^[a-z]+(\([a-z0-9-]+\))?: \[\K[A-Z]{2,10}-[0-9]+(?=\] )' | head -1)
          if [ -n "$JIRA_TICKET" ]; then
            echo "❌ Should not have found JIRA ticket"
            exit 1
          fi
          echo "✅ Correctly detected missing JIRA ticket"

      - name: "Test: JIRA without brackets is rejected"
        run: |
          PR_TITLE="feat(scope): INFRA-123 missing brackets"
          JIRA_TICKET=$(echo "$PR_TITLE" | grep -oP '^[a-z]+(\([a-z0-9-]+\))?: \[\K[A-Z]{2,10}-[0-9]+(?=\] )' | head -1)
          if [ -n "$JIRA_TICKET" ]; then
            echo "❌ Should not have found JIRA ticket without brackets"
            exit 1
          fi
          echo "✅ Correctly rejected JIRA ticket without brackets"

      - name: "Test: valid title extracts JIRA ticket"
        run: |
          PR_TITLE="feat(workflows): [INFRA-378] add pr hygiene checks"
          JIRA_TICKET=$(echo "$PR_TITLE" | grep -oP '^[a-z]+(\([a-z0-9-]+\))?: \[\K[A-Z]{2,10}-[0-9]+(?=\] )' | head -1)
          if [ -z "$JIRA_TICKET" ]; then
            echo "❌ Should have found JIRA ticket"
            exit 1
          fi
          echo "✅ Correctly found JIRA ticket: $JIRA_TICKET"
