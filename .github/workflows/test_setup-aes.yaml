name: Test Setup AES Action
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  test-single-node:
    name: Single node (defaults)
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Setup AES
        id: setup-aes
        uses: ./.github/actions/setup-aes
        with:
          oidc-provider: ${{ vars.JFROG_OIDC_PROVIDER }}
          oidc-audience: ${{ vars.JFROG_OIDC_AUDIENCE }}

      - name: Verify outputs
        run: |
          echo "container-names: ${{ steps.setup-aes.outputs.container-names }}"
          echo "service-ports: ${{ steps.setup-aes.outputs.service-ports }}"
          echo "network-name: ${{ steps.setup-aes.outputs.network-name }}"

          [[ "${{ steps.setup-aes.outputs.container-names }}" == "aerospike-1" ]] \
            || { echo "Unexpected container-names"; exit 1; }
          [[ "${{ steps.setup-aes.outputs.service-ports }}" == "3000" ]] \
            || { echo "Unexpected service-ports"; exit 1; }
          [[ "${{ steps.setup-aes.outputs.network-name }}" == "aerospike-net" ]] \
            || { echo "Unexpected network-name"; exit 1; }

      - name: Verify container is running
        run: |
          docker ps --filter "name=aerospike-1" --format '{{.Names}}' | grep -q aerospike-1
          docker network inspect aerospike-net | grep -q aerospike-1

  test-multi-node:
    name: Multi-node cluster (3 nodes)
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Setup AES (3 nodes)
        id: setup-aes
        uses: ./.github/actions/setup-aes
        with:
          num-nodes: "3"
          startup-timeout: "60"
          oidc-provider: ${{ vars.JFROG_OIDC_PROVIDER }}
          oidc-audience: ${{ vars.JFROG_OIDC_AUDIENCE }}

      - name: Verify outputs
        run: |
          echo "container-names: ${{ steps.setup-aes.outputs.container-names }}"
          echo "service-ports: ${{ steps.setup-aes.outputs.service-ports }}"

          [[ "${{ steps.setup-aes.outputs.container-names }}" == "aerospike-1,aerospike-2,aerospike-3" ]] \
            || { echo "Unexpected container-names"; exit 1; }
          [[ "${{ steps.setup-aes.outputs.service-ports }}" == "3000,3001,3002" ]] \
            || { echo "Unexpected service-ports"; exit 1; }

      - name: Verify all containers are running
        run: |
          for i in 1 2 3; do
            docker ps --filter "name=aerospike-${i}" --format '{{.Names}}' | grep -q "aerospike-${i}"
          done

      - name: Verify cluster formation
        run: |
          cluster_size=$(docker exec aerospike-1 asinfo -v cluster-size)
          echo "Cluster size: $cluster_size"
          [[ "$cluster_size" == "3" ]] || { echo "Expected cluster-size=3, got $cluster_size"; exit 1; }

  test-features-content:
    name: Features from content input
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Setup AES with features-content
        id: setup-aes
        uses: ./.github/actions/setup-aes
        with:
          features-content: ${{ secrets.AES_FEATURES_CONF }}
          oidc-provider: ${{ vars.JFROG_OIDC_PROVIDER }}
          oidc-audience: ${{ vars.JFROG_OIDC_AUDIENCE }}

      - name: Verify container is running
        run: |
          docker ps --filter "name=aerospike-1" --format '{{.Names}}' | grep -q aerospike-1

  test-env-vars:
    name: Custom env-vars passthrough
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Setup AES with env-vars
        id: setup-aes
        uses: ./.github/actions/setup-aes
        with:
          env-vars: NAMESPACE=test;SERVICE_THREADS=4
          oidc-provider: ${{ vars.JFROG_OIDC_PROVIDER }}
          oidc-audience: ${{ vars.JFROG_OIDC_AUDIENCE }}

      - name: Verify env vars in container
        run: |
          ns=$(docker exec aerospike-1 printenv NAMESPACE)
          threads=$(docker exec aerospike-1 printenv SERVICE_THREADS)
          echo "NAMESPACE=$ns SERVICE_THREADS=$threads"
          [[ "$ns" == "test" ]] || { echo "Expected NAMESPACE=test"; exit 1; }
          [[ "$threads" == "4" ]] || { echo "Expected SERVICE_THREADS=4"; exit 1; }

  test-tls:
    name: Single node with TLS
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Setup AES with TLS
        id: setup-aes
        uses: ./.github/actions/setup-aes
        with:
          enable-tls: "true"
          oidc-provider: ${{ vars.JFROG_OIDC_PROVIDER }}
          oidc-audience: ${{ vars.JFROG_OIDC_AUDIENCE }}

      - name: Verify TLS outputs
        run: |
          echo "tls-service-ports: ${{ steps.setup-aes.outputs.tls-service-ports }}"
          echo "tls-cert-dir: ${{ steps.setup-aes.outputs.tls-cert-dir }}"

          [[ "${{ steps.setup-aes.outputs.tls-service-ports }}" == "4333" ]] \
            || { echo "Unexpected tls-service-ports"; exit 1; }
          [[ -n "${{ steps.setup-aes.outputs.tls-cert-dir }}" ]] \
            || { echo "tls-cert-dir is empty"; exit 1; }

      - name: Verify cert files exist
        run: |
          cert_dir="${{ steps.setup-aes.outputs.tls-cert-dir }}"
          for f in ca.crt ca.key server.crt server.key client.crt client.key; do
            [[ -f "$cert_dir/$f" ]] || { echo "Missing cert file: $f"; exit 1; }
          done
          echo "All expected cert files present"

      - name: Verify non-TLS port still works
        run: |
          status=$(docker exec aerospike-1 asinfo -v status)
          [[ "$status" == "ok" ]] || { echo "Expected status=ok, got $status"; exit 1; }

      - name: Verify TLS connection
        run: |
          cert_dir="${{ steps.setup-aes.outputs.tls-cert-dir }}"
          echo | openssl s_client -connect 127.0.0.1:4333 -CAfile "$cert_dir/ca.crt" 2>&1 | grep -q "Verify return code: 0"
          echo "TLS connection verified"
