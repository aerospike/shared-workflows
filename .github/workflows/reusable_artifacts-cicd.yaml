name: Artifacts CI/CD

on:
  workflow_call:
    inputs:
      # Required inputs
      gh-artifact-directory:
        description: Directory (relative to working-directory) where the build produces artifacts
        required: true
        type: string
      gh-workflows-ref:
        description: |
          Git reference for shared-workflows checkout. Should match the version in your 'uses:' line.
          GitHub Actions doesn't expose the called workflow's ref, so this is required.
          See: .github/workflows/docs/why-gh-workflows-ref.md
        required: true
        type: string
      jf-build-name:
        description: JFrog build name
        required: true
        type: string
      jf-project:
        description: JFrog Artifactory project name
        required: true
        type: string
      oidc-audience:
        description: OIDC audience value for token
        required: true
        type: string
      oidc-provider-name:
        description: JFrog OIDC provider name
        required: true
        type: string
      version:
        description: Version of the artifact to upload
        required: true
        type: string
      # At least one of build-script or build-script-path must be set
      build-script:
        description: Inline build script to execute (set either this or build-script-path)
        required: false
        type: string
        default: ""
      build-script-path:
        description: Path to a build script to execute (set either this or build-script)
        required: false
        type: string
        default: ""

      # Optional inputs
      build-env:
        description: |
          Semicolon-delimited KEY=VALUE pairs (use \; for literal semicolon, \\ for backslash)
          Within the build script, the key-value pairs will be available as environment variables.
        required: false
        type: string
        default: ""
      dotnet-version:
        description: Dotnet version to set up when setup-dotnet is enabled (e.g., "8.0")
        required: false
        type: string
        default: "8.0"
      dry-run:
        description: Whether to run in dry-run mode (no deploys to jfrog)
        required: false
        type: boolean
        default: false
      gh-checkout-path:
        description: Directory to checkout the shared-workflows repository into
        required: false
        type: string
        default: shared-workflows
      gh-retention-days:
        description: Retention days for GitHub artifacts
        required: false
        type: number
        default: 1
      gh-source-path:
        description: Directory to checkout the source repository into. If empty string, source checkout is skipped.
        required: false
        type: string
        default: local
      gh-source-ref:
        description: Reference to checkout for source repository (branch, tag, or commit)
        required: false
        type: string
        default: ""
      gh-source-repository:
        description: Repository to checkout for source code (format owner/repo)
        required: false
        type: string
        default: ${{ github.repository }}
      build-type:
        description: Freeform build type label applied as a target-prop on all artifacts (e.g., release, nightly, snapshot)
        required: false
        type: string
        default: ""
      internal:
        description: Mark artifacts as internal-only (sets internal=true target-prop, used for promotion control)
        required: false
        type: boolean
        default: false
      jar-group-id:
        description: Maven group ID for JAR artifacts (fallback when metadata doesn't provide one)
        required: false
        type: string
        default: ""
      matrix-json:
        description: |
          Optional limited matrix definition for simple matrix builds.
          Example:
            {"include":[
              {"runs-on":"ubuntu-22.04","distro":"jammy","arch":"x86_64","build-env":"KEY=VALUE;KEY2=VALUE2;"}
            ]}
        required: false
        type: string
        default: |-
          {
            "include": [
              {
                "runs-on": "ubuntu-22.04",
                "distro": "jammy",
                "arch": "x86_64",
                "build-env": "emulated=false"
              }
            ]
          }
      jf-url:
        description: JFrog Artifactory URL
        required: false
        type: string
        default: https://artifact.aerospike.io
      nuget-environment:
        description: NuGet signing environment when NuGet packages are present (passed to sign-artifacts)
        required: false
        type: string
        default: PROD
      runs-on:
        description: Runner to use for all jobs
        required: false
        type: string
        default: ubuntu-22.04
      setup-dotnet:
        description: Whether to set up dotnet for builds
        required: false
        type: boolean
        default: false
      # Java/Maven setup (passed through to execute-build)
      setup-java:
        description: Whether to set up Java for builds
        required: false
        type: boolean
        default: false
      java-version:
        description: Java version to set up (e.g., "8", "17", "21")
        required: false
        type: string
        default: "21"
      java-distribution:
        description: Java distribution (temurin, zulu, adopt, corretto, etc.)
        required: false
        type: string
        default: temurin
      java-cache:
        description: Package manager to cache (maven, gradle, sbt)
        required: false
        type: string
        default: maven
      # Python setup (passed through to execute-build)
      setup-python:
        description: Whether to set up Python for builds
        required: false
        type: boolean
        default: false
      python-version:
        description: Python version to set up (e.g., "3.11", "3.12")
        required: false
        type: string
        default: "3.12"
      working-directory:
        description: |
          Working directory for build script execution. Defaults to gh-source-path (so builds run inside the checked out source repo).
          Set empty string to keep the runner root.
        required: false
        type: string
        default: ""

      # Mac signing inputs (optional, all prefixed with mac-)
      sign-mac:
        description: Enable Apple code signing and notarization for Mac artifacts
        required: false
        type: boolean
        default: false
      mac-artifact-glob:
        description: Glob pattern for files to Apple-sign (controls signing scope, not download scope)
        required: false
        type: string
        default: "**/*"
      mac-installer-identity:
        description: "productsign identity (e.g. 'Developer ID Installer: Aerospike, Inc. (TEAMID)')"
        required: false
        type: string
        default: ""
      mac-notarize:
        description: Whether to notarize Mac artifacts after signing
        required: false
        type: boolean
        default: true
      mac-runs-on:
        description: macOS runner for sign-mac job
        required: false
        type: string
        default: macos-14
      mac-signing-identity:
        description: "codesign identity (e.g. 'Developer ID Application: Aerospike, Inc. (TEAMID)')"
        required: false
        type: string
        default: ""

    secrets:
      gpg-private-key:
        required: true
      gpg-public-key:
        required: true
      gpg-key-pass:
        required: true
      es-username:
        required: false
      es-password:
        required: false
      credential_id:
        required: false
      es-totp_secret:
        required: false
      apple-application-cert:
        required: false
      apple-id:
        required: false
      apple-installer-cert:
        required: false
      apple-cert-password:
        required: false
      apple-notarization-password:
        required: false
      apple-team-id:
        required: false

    outputs:
      gh-artifact-name:
        description: Final GitHub artifact name (signed-artifacts)
        value: ${{ jobs.resolve.outputs.gh-artifact-name }}
      jf-build-id:
        description: JFrog parent build id used for deploy/build-info aggregation
        value: ${{ jobs.resolve.outputs.jf-build-id }}
      jf-build-name:
        description: JFrog build name
        value: ${{ inputs.jf-build-name }}
      jf-metadata-build-id:
        description: JFrog build id used for the build-info produced during build
        value: ${{ jobs.resolve.outputs.jf-metadata-build-id }}

permissions:
  contents: read
  id-token: write

jobs:
  resolve:
    runs-on: ubuntu-22.04
    outputs:
      gh-artifact-name: ${{ steps.resolve.outputs.gh_artifact_name }}
      jf-build-id: ${{ steps.resolve.outputs.jf_build_id }}
      jf-metadata-build-id: ${{ steps.resolve.outputs.jf_metadata_build_id }}
      resolved-working-directory: ${{ steps.resolve.outputs.resolved_working_directory }}
      setup-dotnet: ${{ steps.resolve.outputs.setup_dotnet }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit

      - id: resolve
        shell: bash
        run: |
          set -euo pipefail

          setup_dotnet="${{ inputs.setup-dotnet }}"

          # Build IDs:
          # - jf_build_id: parent build id (overall pipeline)
          # - jf_metadata_build_id: build-info produced during build and later aggregated into the parent
          build_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          metadata_build_id="${build_id}-buildinfo"

          resolved_working_directory="${{ inputs.working-directory }}"
          if [[ -z "$resolved_working_directory" ]]; then
            resolved_working_directory="${{ inputs.gh-source-path }}"
          fi

          final_artifact_name="signed-artifacts"

          {
            echo "gh_artifact_name=$final_artifact_name"
            echo "jf_build_id=$build_id"
            echo "jf_metadata_build_id=$metadata_build_id"
            echo "resolved_working_directory=$resolved_working_directory"
            echo "setup_dotnet=$setup_dotnet"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(inputs.matrix-json) }}
    uses: ./.github/workflows/reusable_execute-build.yaml
    with:
      build-script: ${{ matrix['build-script'] || inputs.build-script }}
      build-script-path: ${{ matrix['build-script-path'] || inputs.build-script-path }}
      build-env: ${{ format('MATRIX_JSON={0}{1}', toJSON(matrix), (matrix['build-env'] || inputs.build-env) != '' && format(';{0}', matrix['build-env'] || inputs.build-env) || '') }}
      dry-run: ${{ inputs.dry-run }}
      gh-artifact-directory: ${{ matrix['gh-artifact-directory'] || inputs.gh-artifact-directory }}
      gh-artifact-name: build-artifacts-${{ matrix.distro }}-${{ matrix.arch }}
      gh-checkout-path: ${{ inputs.gh-checkout-path }}
      gh-retention-days: ${{ inputs.gh-retention-days }}
      gh-source-path: ${{ inputs.gh-source-path }}
      gh-source-ref: ${{ inputs.gh-source-ref }}
      gh-source-repository: ${{ inputs.gh-source-repository }}
      gh-workflows-ref: ${{ inputs.gh-workflows-ref }}
      jf-build-id: ${{ needs.resolve.outputs.jf-metadata-build-id }}-${{ matrix.distro }}-${{ matrix.arch }}
      jf-build-name: ${{ inputs.jf-build-name }}
      jf-project: ${{ inputs.jf-project }}
      jf-url: ${{ inputs.jf-url }}
      oidc-audience: ${{ inputs.oidc-audience }}
      oidc-provider-name: ${{ inputs.oidc-provider-name }}
      publish-build-info: true
      runs-on: ${{ matrix.runs-on }}
      setup-dotnet: ${{ matrix['setup-dotnet'] != null && matrix['setup-dotnet'] || matrix['setup-dotnet'] == null && needs.resolve.outputs.setup-dotnet == 'true' }}
      dotnet-version: ${{ matrix['dotnet-version'] || inputs.dotnet-version }}
      setup-java: ${{ matrix['setup-java'] != null && matrix['setup-java'] || matrix['setup-java'] == null && inputs.setup-java }}
      java-version: ${{ matrix['java-version'] || inputs.java-version }}
      java-distribution: ${{ matrix['java-distribution'] || inputs.java-distribution }}
      java-cache: ${{ matrix['java-cache'] || inputs.java-cache }}
      setup-python: ${{ matrix['setup-python'] != null && matrix['setup-python'] || matrix['setup-python'] == null && inputs.setup-python }}
      python-version: ${{ matrix['python-version'] || inputs.python-version }}
      working-directory: ${{ matrix['working-directory'] || needs.resolve.outputs.resolved-working-directory }}
    secrets: inherit

  collect-matrix-artifacts:
    needs: [resolve, build]
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit

      - name: Download matrix artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-artifacts-*
          path: build-artifacts
          merge-multiple: true
      - name: Print build-artifacts contents
        run: |
          echo Downloaded collected
          find build-artifacts
      - name: Upload merged artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: build-artifacts
          path: build-artifacts
          retention-days: ${{ inputs.gh-retention-days }}

  # Content-based type detection on merged artifacts (before sign / deploy and any create-release-bundle follow-up).
  detect-artifacts:
    needs: [resolve, collect-matrix-artifacts]
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit

      - name: Checkout shared-workflows repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: aerospike/shared-workflows
          ref: ${{ inputs.gh-workflows-ref }}
          fetch-depth: 1

      - name: Download merged build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts
          path: build-artifacts
          merge-multiple: true

      - name: Detect artifact types
        uses: ./.github/actions/detect-artifacts
        with:
          jf-project: ${{ inputs.jf-project }}
          jf-build-name: ${{ inputs.jf-build-name }}
          version: ${{ inputs.version }}
          jf-build-id: ${{ needs.resolve.outputs.jf-build-id }}
          artifacts-dir: build-artifacts
          jar-group-id: ${{ inputs.jar-group-id }}
          build-type: ${{ inputs.build-type }}
          internal: ${{ inputs.internal }}
          dry-run: ${{ inputs.dry-run }}

  sign-mac:
    if: inputs.sign-mac
    needs: [resolve, collect-matrix-artifacts, detect-artifacts]
    uses: ./.github/workflows/reusable_sign-mac-artifacts.yaml
    with:
      gh-unsigned-artifacts: build-artifacts
      gh-checkout-path: ${{ inputs.gh-checkout-path }}
      gh-retention-days: ${{ inputs.gh-retention-days }}
      gh-workflows-ref: ${{ inputs.gh-workflows-ref }}
      runs-on: ${{ inputs.mac-runs-on }}
      signing-identity: ${{ inputs.mac-signing-identity }}
      installer-identity: ${{ inputs.mac-installer-identity }}
      notarize: ${{ inputs.mac-notarize }}
      artifact-glob: ${{ inputs.mac-artifact-glob }}
      dry-run: ${{ inputs.dry-run }}
    secrets: inherit

  sign:
    needs: [resolve, collect-matrix-artifacts, sign-mac, detect-artifacts]
    if: always() && !cancelled() && needs.collect-matrix-artifacts.result == 'success' && needs.sign-mac.result != 'failure'
    uses: ./.github/workflows/reusable_sign-artifacts.yaml
    with:
      gh-artifact-name: signed-artifacts
      gh-checkout-path: ${{ inputs.gh-checkout-path }}
      gh-retention-days: ${{ inputs.gh-retention-days }}
      gh-unsigned-artifacts: build-artifacts
      gh-workflows-ref: ${{ inputs.gh-workflows-ref }}
      nuget-environment: ${{ inputs.nuget-environment }}
      runs-on: ${{ inputs.runs-on }}
    secrets: inherit

  deploy-signed:
    needs: [resolve, sign]
    if: always() && !cancelled() && needs.sign.result == 'success'
    uses: ./.github/workflows/reusable_deploy-artifacts.yaml
    with:
      build-type: ${{ inputs.build-type }}
      dry-run: ${{ inputs.dry-run }}
      gh-artifact-name: signed-artifacts
      gh-checkout-path: ${{ inputs.gh-checkout-path }}
      gh-retention-days: ${{ inputs.gh-retention-days }}
      gh-workflows-ref: ${{ inputs.gh-workflows-ref }}
      internal: ${{ inputs.internal }}
      jar-group-id: ${{ inputs.jar-group-id }}
      jf-build-id: ${{ needs.resolve.outputs.jf-build-id }}
      jf-build-name: ${{ inputs.jf-build-name }}
      jf-metadata-build-id: ${{ needs.resolve.outputs.jf-metadata-build-id }}
      jf-project: ${{ inputs.jf-project }}
      jf-url: ${{ inputs.jf-url }}
      oidc-audience: ${{ inputs.oidc-audience }}
      oidc-provider-name: ${{ inputs.oidc-provider-name }}
      runs-on: ${{ inputs.runs-on }}
      version: ${{ inputs.version }}
