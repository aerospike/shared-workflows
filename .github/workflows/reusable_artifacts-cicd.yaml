name: Artifacts CI/CD

on:
  workflow_call:
    inputs:
      # Required inputs
      gh-artifact-directory:
        description: Directory (relative to working-directory) where the build produces artifacts
        required: true
        type: string
      gh-workflows-ref:
        description: |
          Git reference for shared-workflows checkout. Should match the version in your 'uses:' line.
          GitHub Actions doesn't expose the called workflow's ref, so this is required.
          See: .github/workflows/docs/CICD-with-shared-actions.md#why-gh-workflows-ref-is-required
        required: true
        type: string
      jf-build-name:
        description: JFrog build name
        required: true
        type: string
      jf-project:
        description: JFrog Artifactory project name
        required: true
        type: string
      version:
        description: Version of the artifact to upload
        required: true
        type: string

      # Optional inputs (minimal surface)
      build-script:
        description: Inline build script to execute (set either this or build-script-path)
        required: false
        type: string
        default: ""
      build-script-path:
        description: Path to a build script to execute (set either this or build-script)
        required: false
        type: string
        default: ""
      build-action:
        description: |
          Optional build action to run instead of build-script/build-script-path.
          When set, build-script/build-script-path must be empty.
        required: false
        type: string
        default: ""
      build-action-inputs:
        description: JSON object of inputs to pass to build-action
        required: false
        type: string
        default: "{}"
      build-info-mode:
        description: |
          When using build-action, controls build-info publishing.
          Allowed values: "orchestrator" (default) or "action"
        required: false
        type: string
        default: orchestrator
      dotnet-version:
        description: Dotnet version to set up when preset=dotnet (e.g., "8.0")
        required: false
        type: string
        default: "8.0"
      dry-run:
        description: Whether to run in dry-run mode (no uploads)
        required: false
        type: boolean
        default: false
      gh-checkout-path:
        description: Directory to checkout the shared-workflows repository into
        required: false
        type: string
        default: shared-workflows
      gh-retention-days:
        description: Retention days for GitHub artifacts
        required: false
        type: number
        default: 1
      gh-source-path:
        description: Directory to checkout the source repository into. If empty string, source checkout is skipped.
        required: false
        type: string
        default: local
      gh-source-ref:
        description: Reference to checkout for source repository (branch, tag, or commit)
        required: false
        type: string
        default: ""
      gh-source-repository:
        description: Repository to checkout for source code (format owner/repo)
        required: false
        type: string
        default: ${{ github.repository }}
      jar-group-id:
        description: Maven group ID for JAR artifacts (fallback when metadata doesn't provide one)
        required: false
        type: string
        default: ""
      matrix-json:
        description: |
          Optional limited matrix definition for simple matrix builds.
          Expected schema: {"include":[{"runs-on":"ubuntu-22.04","distro":"jammy","arch":"x86_64","emulated":false}]}
        required: false
        type: string
        default: >-
          {"include":[{"runs-on":"ubuntu-22.04","distro":"jammy","arch":"x86_64"}]}
      jf-url:
        description: JFrog Artifactory URL
        required: false
        type: string
        default: https://artifact.aerospike.io
      nuget-environment:
        description: NuGet signing environment when NuGet packages are present (passed to sign-artifacts)
        required: false
        type: string
        default: PROD
      oidc-audience:
        description: OIDC audience value for token
        required: false
        type: string
        default: aerospike/testing
      oidc-provider-name:
        description: JFrog OIDC provider name
        required: false
        type: string
        default: gh-dev-test
      preset:
        description: |
          Preset controlling sensible defaults.
          - default/custom: setup-dotnet=false
          - dotnet: setup-dotnet=true
          - docker: not supported here (use reusable_docker-build-deploy.yaml directly)
        required: false
        type: string
        default: default
      runs-on:
        description: Runner to use for all jobs
        required: false
        type: string
        default: ubuntu-22.04
      working-directory:
        description: |
          Working directory for build script execution. Defaults to gh-source-path (so builds run inside the checked out source repo).
          Set empty string to keep the runner root.
        required: false
        type: string
        default: ""

    secrets:
      gpg-private-key:
        required: false
      gpg-public-key:
        required: false
      gpg-key-pass:
        required: false
      es-username:
        required: false
      es-password:
        required: false
      credential_id:
        required: false
      es-totp_secret:
        required: false

    outputs:
      gh-artifact-name:
        description: Final GitHub artifact name (signed-artifacts)
        value: ${{ jobs.resolve.outputs.gh-artifact-name }}
      jf-build-id:
        description: JFrog parent build id used for deploy/build-info aggregation
        value: ${{ jobs.resolve.outputs.jf-build-id }}
      jf-build-name:
        description: JFrog build name
        value: ${{ inputs.jf-build-name }}
      jf-metadata-build-id:
        description: JFrog build id used for the build-info produced during build
        value: ${{ jobs.resolve.outputs.jf-metadata-build-id }}

permissions:
  contents: read
  id-token: write

jobs:
  resolve:
    runs-on: ubuntu-22.04
    outputs:
      gh-artifact-name: ${{ steps.resolve.outputs.gh_artifact_name }}
      jf-build-id: ${{ steps.resolve.outputs.jf_build_id }}
      jf-metadata-build-id: ${{ steps.resolve.outputs.jf_metadata_build_id }}
      resolved-working-directory: ${{ steps.resolve.outputs.resolved_working_directory }}
      setup-dotnet: ${{ steps.resolve.outputs.setup_dotnet }}
    steps:
      - id: resolve
        shell: bash
        run: |
          set -euo pipefail

          case "${{ inputs.preset }}" in
            default|custom)
              setup_dotnet=false
              ;;
            dotnet)
              setup_dotnet=true
              ;;
            docker)
              echo "Error: preset=docker is not supported by reusable_artifacts-cicd.yaml. Use reusable_docker-build-deploy.yaml directly." >&2
              exit 1
              ;;
            *)
              echo "Error: unknown preset '${{ inputs.preset }}' (allowed: default, dotnet, docker, custom)" >&2
              exit 1
              ;;
          esac

          if [[ -n "${{ inputs.build-action }}" ]]; then
            if [[ -n "${{ inputs.build-script }}" || -n "${{ inputs.build-script-path }}" ]]; then
              echo "Error: build-action cannot be combined with build-script/build-script-path" >&2
              exit 1
            fi
            case "${{ inputs.build-info-mode }}" in
              orchestrator|action) ;;
              *)
                echo "Error: build-info-mode must be 'orchestrator' or 'action'" >&2
                exit 1
                ;;
            esac
          else
            if [[ -z "${{ inputs.build-script }}" && -z "${{ inputs.build-script-path }}" ]]; then
              echo "Error: Either build-script or build-script-path must be given when build-action is not set" >&2
              exit 1
            fi
          fi

          # Build IDs:
          # - jf_build_id: parent build id (overall pipeline)
          # - jf_metadata_build_id: build-info produced during build and later aggregated into the parent
          build_id="$(date +%s%3N)"
          metadata_build_id="${build_id}-buildinfo"

          resolved_working_directory="${{ inputs.working-directory }}"
          if [[ -z "$resolved_working_directory" ]]; then
            resolved_working_directory="${{ inputs.gh-source-path }}"
          fi

          final_artifact_name="signed-artifacts"

          {
            echo "gh_artifact_name=$final_artifact_name"
            echo "jf_build_id=$build_id"
            echo "jf_metadata_build_id=$metadata_build_id"
            echo "resolved_working_directory=$resolved_working_directory"
            echo "setup_dotnet=$setup_dotnet"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(inputs.matrix-json) }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - name: Checkout shared-workflows repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: aerospike/shared-workflows
          ref: ${{ inputs.gh-workflows-ref }}
          path: ${{ inputs.gh-checkout-path }}
          fetch-depth: 1

      - name: Checkout source repository
        if: inputs.gh-source-path != ''
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: ${{ inputs.gh-source-repository }}
          ref: ${{ inputs.gh-source-ref }}
          path: ${{ inputs.gh-source-path }}
          fetch-tags: true
          submodules: recursive
          fetch-depth: 0

      - name: Set up Dotnet
        if: needs.resolve.outputs.setup-dotnet == 'true'
        uses: actions/setup-dotnet@2016bd2012dba4e32de620c46fe006a3ac9f0602 # v5.0.1
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Set up JFrog CLI
        uses: step-security/setup-jfrog-cli@a6b41f8338bea0983ddff6bd4ede7d2dcd81e1fa # v4.8.1
        env:
          JF_URL: ${{ inputs.jf-url }}
          JF_PROJECT: ${{ inputs.jf-project }}
        with:
          oidc-provider-name: ${{ inputs.oidc-provider-name }}
          oidc-audience: ${{ inputs.oidc-audience }}

      - name: Parse build action reference
        if: inputs.build-action != ''
        id: build-action-ref
        shell: bash
        run: |
          action_ref="${{ inputs.build-action }}"
          if [[ "$action_ref" != *@* ]]; then
            echo "Error: build-action must include a ref (owner/repo/path@ref)" >&2
            exit 1
          fi

          repo_path="${action_ref%@*}"
          ref="${action_ref#*@}"

          owner="${repo_path%%/*}"
          rest="${repo_path#*/}"
          repo="${rest%%/*}"
          path=""
          if [[ "$rest" != "$repo" ]]; then
            path="${rest#*/}"
          fi

          if [[ -z "$owner" || -z "$repo" ]]; then
            echo "Error: build-action must start with owner/repo" >&2
            exit 1
          fi

          echo "repo=$owner/$repo" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Checkout build action repository
        if: inputs.build-action != ''
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: ${{ steps.build-action-ref.outputs.repo }}
          ref: ${{ steps.build-action-ref.outputs.ref }}
          path: build-action-src
          fetch-depth: 1

      - name: Link build action
        if: inputs.build-action != ''
        shell: bash
        run: |
          rm -f build-action
          if [[ -n "${{ steps.build-action-ref.outputs.path }}" ]]; then
            ln -s "build-action-src/${{ steps.build-action-ref.outputs.path }}" build-action
          else
            ln -s "build-action-src" build-action
          fi

      - name: Run build action
        if: inputs.build-action != ''
        id: build-action
        uses: ./build-action
        env:
          ARTIFACT_DIRECTORY: ${{ inputs.gh-artifact-directory }}
          BUILD_ID: ${{ needs.resolve.outputs.jf-metadata-build-id }}-${{ matrix.distro }}-${{ matrix.arch }}
          BUILD_NAME: ${{ inputs.jf-build-name }}
          BUILD_ACTION_INPUTS: ${{ inputs.build-action-inputs }}
          GH_SOURCE_PATH: ${{ inputs.gh-source-path }}
          PROJECT: ${{ inputs.jf-project }}
          VERSION: ${{ inputs.version }}
          WORKING_DIRECTORY: ${{ needs.resolve.outputs.resolved-working-directory }}

      - name: Execute build script
        if: inputs.build-action == ''
        shell: bash
        run: |
          entrypoint=$(realpath "${{ inputs.gh-checkout-path }}/.github/workflows/execute-build/entrypoint.sh")
          chmod +x "$entrypoint"
          if [[ -n "${{ needs.resolve.outputs.resolved-working-directory }}" ]]; then
            cd "${{ needs.resolve.outputs.resolved-working-directory }}"
          fi
          echo "Working directory: $(pwd)"
          echo "Entrypoint script: $entrypoint"

          if ${{ inputs.build-script != '' }}; then
            script_arg="--build-script"
            script_value='${{ inputs.build-script }}'
          elif ${{ inputs.build-script-path != '' }}; then
            script_arg="--build-script-path"
            script_value="${{ inputs.build-script-path }}"
          else
            echo "Error: Either build-script or build-script-path must be given"
            exit 1
          fi

          "$entrypoint" \
            "$script_arg" "$script_value" \
            --artifact-directory "${{ inputs.gh-artifact-directory }}" \
            --build-name "${{ inputs.jf-build-name }}" \
            --build-id "${{ needs.resolve.outputs.jf-metadata-build-id }}-${{ matrix.distro }}-${{ matrix.arch }}" \
            --project "${{ inputs.jf-project }}" \
            --publish-build-info \
            ${{ inputs.dry-run && '--dry-run' || '' }}

      - name: Publish build-info (build action)
        if: inputs.build-action != '' && inputs.build-info-mode == 'orchestrator'
        shell: bash
        run: |
          build_id="${{ needs.resolve.outputs.jf-metadata-build-id }}-${{ matrix.distro }}-${{ matrix.arch }}"
          if [[ -n "${{ needs.resolve.outputs.resolved-working-directory }}" ]]; then
            cd "${{ needs.resolve.outputs.resolved-working-directory }}"
          fi

          run_optional() {
            "$@" || echo "Warning: $*" >&2
          }

          run_optional jf rt build-collect-env "${{ inputs.jf-build-name }}" "$build_id" --project="${{ inputs.jf-project }}"
          run_optional jf rt build-add-git "${{ inputs.jf-build-name }}" "$build_id" --project="${{ inputs.jf-project }}"
          jf rt build-publish "${{ inputs.jf-build-name }}" "$build_id" --project="${{ inputs.jf-project }}"

      - name: Resolve artifacts
        id: artifacts
        shell: bash
        env:
          ACTION_ARTIFACT_DIR: ${{ steps.build-action.outputs.artifact-directory }}
          ACTION_ARTIFACT_NAME: ${{ steps.build-action.outputs.artifact-name }}
        run: |
          artifact_dir=""
          artifact_name=""

          if [[ "${{ inputs.build-action }}" != "" ]]; then
            if [[ -z "$ACTION_ARTIFACT_DIR" || -z "$ACTION_ARTIFACT_NAME" ]]; then
              echo "Error: build action must output artifact-directory and artifact-name" >&2
              exit 1
            fi
            artifact_dir="$ACTION_ARTIFACT_DIR"
            artifact_name="$ACTION_ARTIFACT_NAME"
          else
            artifact_dir="${{ inputs.gh-artifact-directory }}"
            artifact_name="build-artifacts-${{ matrix.distro }}-${{ matrix.arch }}"
          fi

          if [[ -z "$artifact_dir" ]]; then
            echo "Error: artifact-directory is required (from build action or input)" >&2
            exit 1
          fi

          upload_path="$artifact_dir"
          if [[ -n "${{ needs.resolve.outputs.resolved-working-directory }}" ]]; then
            upload_path="${{ needs.resolve.outputs.resolved-working-directory }}/$artifact_dir"
          fi

          {
            echo "artifact_dir=$artifact_dir"
            echo "artifact_name=$artifact_name"
            echo "upload_path=$upload_path"
          } >> "$GITHUB_OUTPUT"

      - name: Upload Artifacts
        if: inputs.dry-run != true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ steps.artifacts.outputs.artifact_name }}
          path: ${{ steps.artifacts.outputs.upload_path }}
          retention-days: ${{ inputs.gh-retention-days }}

  collect-matrix-artifacts:
    needs: [resolve, build]
    runs-on: ubuntu-22.04
    steps:
      - name: Download matrix artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: "*"
          path: build-artifacts
          merge-multiple: true
      - name: Upload merged artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: build-artifacts
          path: build-artifacts
          retention-days: ${{ inputs.gh-retention-days }}

  sign:
    needs: [resolve, collect-matrix-artifacts]
    uses: ./.github/workflows/reusable_sign-artifacts.yaml
    with:
      gh-artifact-name: signed-artifacts
      gh-checkout-path: ${{ inputs.gh-checkout-path }}
      gh-retention-days: ${{ inputs.gh-retention-days }}
      gh-unsigned-artifacts: build-artifacts
      gh-workflows-ref: ${{ inputs.gh-workflows-ref }}
      nuget-environment: ${{ inputs.nuget-environment }}
      runs-on: ${{ inputs.runs-on }}
    secrets: inherit

  deploy-signed:
    needs: [resolve, sign]
    uses: ./.github/workflows/reusable_deploy-artifacts.yaml
    with:
      dry-run: ${{ inputs.dry-run }}
      gh-artifact-name: signed-artifacts
      gh-checkout-path: ${{ inputs.gh-checkout-path }}
      gh-retention-days: ${{ inputs.gh-retention-days }}
      gh-workflows-ref: ${{ inputs.gh-workflows-ref }}
      jar-group-id: ${{ inputs.jar-group-id }}
      jf-build-id: ${{ needs.resolve.outputs.jf-build-id }}
      jf-build-name: ${{ inputs.jf-build-name }}
      jf-metadata-build-id: ${{ needs.resolve.outputs.jf-metadata-build-id }}
      jf-project: ${{ inputs.jf-project }}
      jf-url: ${{ inputs.jf-url }}
      oidc-audience: ${{ inputs.oidc-audience }}
      oidc-provider-name: ${{ inputs.oidc-provider-name }}
      runs-on: ${{ inputs.runs-on }}
      version: ${{ inputs.version }}
