name: Example Setup kind and AKO
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    name: kind plus AKO ${{ matrix.alternate-access }}${{ matrix.multi-pod-per-host == 'false' && ' one pod per node' || '' }}${{ matrix.enable-tls && ' with TLS' || '' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - alternate-access: configuredIP
            enable-tls: false
          - alternate-access: configuredIP
            enable-tls: true
          - alternate-access: networkLoadBalancer
            ako-version: 4.8.0-dev1
            ako-helm-repo: https://aerospike.github.io/aerospike-kubernetes-operator
            cluster-chart-version: 4.7.0
            multi-pod-per-host: "true"
            enable-tls: true
          - alternate-access: networkLoadBalancer
            ako-version: 4.8.0-dev1
            ako-helm-repo: https://aerospike.github.io/aerospike-kubernetes-operator
            cluster-chart-version: 4.7.0
            multi-pod-per-host: "false"
            enable-tls: false
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup kind and AKO
        id: kind-ako
        uses: ./.github/actions/setup-kind-ako
        with:
          features-content: ${{ secrets.AES_FEATURES_CONF }}
          enable-tls: ${{ matrix.enable-tls }}
          alternate-access: ${{ matrix.alternate-access }}
          ako-version: ${{ matrix.ako-version || 'latest' }}
          ako-helm-repo: ${{ matrix.ako-helm-repo || 'https://aerospike.github.io/aerospike-kubernetes-operator' }}
          cluster-chart-version: ${{ matrix.cluster-chart-version }}
          multi-pod-per-host: ${{ matrix.multi-pod-per-host || 'true' }}

      - name: Verify the outputs
        run: |
          [[ -n "${{ steps.kind-ako.outputs.ingress-ports }}" ]]
          [[ -n "${{ steps.kind-ako.outputs.service-node-ports }}" ]]
          [[ "${{ steps.kind-ako.outputs.alternate-access }}" == "${{ matrix.alternate-access }}" ]]
          echo "endpoint ${{ steps.kind-ako.outputs.endpoint-hostname }}"
          echo "ingress ${{ steps.kind-ako.outputs.ingress-ports }}"
          echo "node ports ${{ steps.kind-ako.outputs.service-node-ports }}"

      - name: Check the networkLoadBalancer cluster
        if: ${{ matrix.alternate-access == 'networkLoadBalancer' }}
        env:
          ENDPOINT: ${{ steps.kind-ako.outputs.endpoint-hostname }}
          ENABLE_TLS: ${{ matrix.enable-tls }}
          MULTI_POD_PER_HOST: ${{ matrix.multi-pod-per-host }}
        run: |
          set -euo pipefail
          policy() {
            kubectl -n aerospike get aerospikecluster aerocluster -o "jsonpath={.spec.aerospikeNetworkPolicy.$1}"
          }
          [[ "$(policy alternateAccess)" == networkLoadBalancer ]]
          [[ "$(policy loadBalancerAlternateAccessAddress)" == "$ENDPOINT" ]]
          if [[ "$ENABLE_TLS" == true ]]; then
            [[ "$(policy tlsAlternateAccess)" == networkLoadBalancer ]]
            [[ "$(policy loadBalancerTLSAlternateAccessAddress)" == "$ENDPOINT" ]]
          fi
          echo "the AerospikeCluster advertises ${ENDPOINT}"
          labeled=$(kubectl get nodes -l aerospike.com/configured-alternate-access-address -o name)
          [[ -z "$labeled" ]] || { echo "::error::labeled nodes: ${labeled}"; exit 1; }
          echo "no node carries the configuredIP label"
          pods=$(kubectl -n aerospike get pods -l aerospike.com/cr=aerocluster -o jsonpath='{.items[*].metadata.name}')
          [[ -n "$pods" ]]
          for pod in $pods; do
            type=$(kubectl -n aerospike get svc "$pod" -o jsonpath='{.spec.type}')
            node_port=$(kubectl -n aerospike get svc "$pod" -o jsonpath='{.spec.ports[?(@.port==3000)].nodePort}')
            [[ "$type" == NodePort && -n "$node_port" ]] || { echo "::error::${pod} has no NodePort Service"; exit 1; }
            host_ports=$(kubectl -n aerospike get pod "$pod" -o jsonpath='{.spec.containers[*].ports[*].hostPort}')
            [[ -z "$host_ports" ]] || { echo "::error::${pod} sets hostPort ${host_ports}"; exit 1; }
            echo "${pod}: Service NodePort ${node_port}, no hostPort"
          done
          if [[ "$MULTI_POD_PER_HOST" == false ]]; then
            [[ "$(kubectl -n aerospike get aerospikecluster aerocluster -o jsonpath='{.spec.podSpec.multiPodPerHost}')" == false ]]
            nodes=$(kubectl -n aerospike get pods -l aerospike.com/cr=aerocluster -o jsonpath='{range .items[*]}{.spec.nodeName}{"\n"}{end}')
            [[ "$(sort <<<"$nodes" | uniq -d)" == "" ]] || { echo "::error::pods share a node: ${nodes}"; exit 1; }
            echo "every pod runs on its own node"
          fi

      - name: Reach the seed port and every NodePort from the runner
        env:
          ENDPOINT: ${{ steps.kind-ako.outputs.endpoint-hostname }}
          PORTS: ${{ steps.kind-ako.outputs.ingress-ports }},${{ steps.kind-ako.outputs.service-node-ports }}
        run: |
          set -euo pipefail
          IFS=, read -r -a ports <<<"$PORTS"
          for port in "${ports[@]}"; do
            timeout 10 bash -c "echo >/dev/tcp/${ENDPOINT}/${port}"
            echo "reached ${ENDPOINT}:${port}"
          done

      # The certificate names only the tls-name, so verifying it against the endpoint hostname must fail
      - name: Complete a TLS handshake against the tls-name, not the endpoint hostname
        if: ${{ matrix.enable-tls }}
        env:
          ENDPOINT: ${{ steps.kind-ako.outputs.endpoint-hostname }}
          CA_FILE: ${{ steps.kind-ako.outputs.tls-ca-file }}
          TLS_NAME: ${{ steps.kind-ako.outputs.tls-name }}
        run: |
          set -euo pipefail
          port=$(kubectl -n aerospike get svc aerocluster-0-0 -o jsonpath='{.spec.ports[?(@.port==4333)].nodePort}')
          [[ -n "$port" ]]
          handshake() {
            timeout 10 openssl s_client -connect "${ENDPOINT}:${port}" -CAfile "$CA_FILE" \
              -verify_hostname "$1" -verify_return_error </dev/null >/dev/null 2>&1
          }
          handshake "$TLS_NAME"
          echo "verified ${ENDPOINT}:${port} as ${TLS_NAME}"
          if handshake "$ENDPOINT"; then
            echo "::error::the certificate verified as ${ENDPOINT}"
            exit 1
          fi
          echo "rejected ${ENDPOINT}:${port} as ${ENDPOINT}"
