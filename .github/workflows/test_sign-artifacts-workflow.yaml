name: Test Sign Workflow
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read
# TODO: Dependabot is not allowed to run this workflow
# nuget secrets are not valid for the dependabot test tokens
# until we can have test tokens/pw to use will disable this.
jobs:
  upload-test-gh-artifacts:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create Test Fixtures
        run: |
          .github/workflows/deploy-artifacts/create-test-fixtures.sh test-fixtures
      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-fixtures
          path: test-fixtures
  test-sign-workflow:
    if: github.actor != 'dependabot[bot]'
    uses: ./.github/workflows/reusable_sign-artifacts.yaml
    needs: upload-test-gh-artifacts
    secrets:
      gpg-private-key: ${{ secrets.GPG_SECRET_KEY }}
      gpg-public-key: ${{ secrets.GPG_PUBLIC_KEY }}
      gpg-key-pass: ${{ secrets.GPG_PASS }}
      es-username: ${{ secrets.ES_USERNAME }}
      es-password: ${{ secrets.ES_PASSWORD }}
      credential_id: ${{ secrets.CREDENTIAL_ID }}
      es-totp_secret: ${{ secrets.ES_TOTP_SECRET }}
    with:
      # gh-checkout-path defaults to 'shared-workflows'
      gh-unsigned-artifacts: test-fixtures
      gh-workflows-ref: ${{ github.sha }}
  verify-nuget-signatures:
    if: github.actor != 'dependabot[bot]'
    needs: test-sign-workflow
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.x
      - name: Download Signed Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.test-sign-workflow.outputs.gh-artifact-name }}
          path: signed
      - name: Verify NuGet Signatures
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.dotnet/tools:$PATH"
          shopt -s nullglob globstar
          mapfile -t pkgs < <(printf '%s\n' signed/**/*.nupkg)
          echo "Found ${#pkgs[@]} .nupkg files"
          if [ "${#pkgs[@]}" -lt 1 ]; then
            echo "No .nupkg files under signed/ — skipping NuGet signature verification."
            exit 0
          fi
          for p in "${pkgs[@]}"; do
            [[ -n "$p" && -f "$p" ]] || continue
            echo "Verifying $p"
            dotnet nuget verify "$p" --all
          done

  run-tests:
    if: github.actor != 'dependabot[bot]'
    needs: test-sign-workflow
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download Test Fixtures
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-fixtures
          path: test-fixtures
      - name: Install dpkg-sig
        run: |
          sudo apt-get update && sudo apt-get install dpkg-sig dpkg-dev -y
      - name: Test Entrypoint
        run: |
          .github/workflows/sign-artifacts/test-entrypoint.sh test-fixtures
