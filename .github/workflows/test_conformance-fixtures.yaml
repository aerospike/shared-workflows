name: Test conformance fixture actions
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/actions/fetch-conformance-fixtures/**
      - .github/actions/collect-conformance-report/**
      - .github/workflows/test_conformance-fixtures.yaml

permissions:
  contents: read

jobs:
  test:
    name: Fetch and collect
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Collector unit tests
        run: |
          python3 -m pip install -r .github/actions/collect-conformance-report/requirements.txt
          python3 -m unittest discover .github/actions/collect-conformance-report/tests -v

      - name: Fetch fixture set 1.0.0
        id: fetch
        uses: ./.github/actions/fetch-conformance-fixtures
        with:
          version: 1.0.0
          oidc-provider-name: ${{ vars.JFROG_OIDC_PROVIDER }}
          oidc-audience: ${{ vars.JFROG_OIDC_AUDIENCE }}

      - name: Check the extracted fixture set
        env:
          FIXTURES: ${{ steps.fetch.outputs.fixtures-directory }}
        run: |
          [[ "$(cat "$FIXTURES/VERSION")" == "1.0.0" ]]
          ls "$FIXTURES/discovery/translate/port-map.yaml"

      - name: Write a report with every case passing
        env:
          FIXTURES: ${{ steps.fetch.outputs.fixtures-directory }}
        run: |
          mkdir reports
          python3 - "$FIXTURES" > reports/conformance-report.json << 'EOF'
          import json, sys, yaml
          from pathlib import Path
          root = Path(sys.argv[1])
          rows = []
          for path in sorted(root.rglob("*.yaml")):
              data = yaml.safe_load(path.read_text())
              if isinstance(data, dict) and data.get("kind") in ("translate", "merge", "tls"):
                  for row in data["rows"]:
                      result = "blocked" if row.get("state") == "blocked" else "pass"
                      rows.append({"file": path.relative_to(root).as_posix(), "case": row["case"], "result": result})
          print(json.dumps({"runtime": "smoke", "clientVersion": "0", "fixtureSetVersion": "1.0.0", "counts": {}, "rows": rows}))
          EOF

      - name: Collect the report
        id: collect
        uses: ./.github/actions/collect-conformance-report
        with:
          reports-directory: reports
          fixtures-directory: ${{ steps.fetch.outputs.fixtures-directory }}

      - name: Check the gate
        run: '[[ "${{ steps.collect.outputs.gate }}" == "success" ]]'
