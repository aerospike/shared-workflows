name: "Test: Extract Version from Tag"
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/actions/extract-version-from-tag/**
      - .github/workflows/test_extract-version-from-tag.yaml

permissions:
  contents: read

jobs:
  run-tests:
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install bats
        run: |
          git clone https://github.com/bats-core/bats-core.git
          cd bats-core
          sudo ./install.sh /usr/local
          cd ..
          rm -rf bats-core
      - name: Run bats tests
        run: |
          bats .github/actions/extract-version-from-tag/tests/
