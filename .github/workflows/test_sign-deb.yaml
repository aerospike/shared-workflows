name: GPG sign DEB
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
permissions: read-all
jobs:
  sign-deb:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup GPG
        uses: aerospike/shared-workflows/.github/actions/setup-gpg@d9e4df6342163c57e7dd0e9c4a58c12524d8572b
        with:
          gpg-private-key: ${{ secrets.GPG_SECRET_KEY }}
          gpg-public-key: ${{ secrets.GPG_PUBLIC_KEY }}
          gpg-key-pass: ${{ secrets.GPG_PASS }}

      - name: GPG sign deb # gpg sign and verify deb packages
        env:
          GPG_TTY: /dev/null
          HOME: /home/runner
          GNUPGHOME: /home/runner/.gnupg
        run: |
          # Ensure environment variables are exported
          export HOME="${HOME}"
          export GNUPGHOME="${GNUPGHOME}"

          # Sign the package
          for deb in tests/*.deb; do
            gpg --batch --pinentry-mode loopback \
                --passphrase-file "$GNUPGHOME/passphrase" \
                --armor --detach-sign "$deb"
          done

          # Verify the signature
          for deb in tests/*.deb; do
            gpg --verify "${deb}.asc" "$deb"
          done
