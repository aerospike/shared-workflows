name: GPG sign DEB
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
permissions: read-all
jobs:
  sign-deb:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install dpkg-sig
        run: |
          sudo apt-get update && sudo apt-get install dpkg-dev -y
      - name: setup GPG
        uses: aerospike/shared-workflows/.github/actions/setup-gpg@mcbridem/infra-730-just-testing
        with:
          gpg-private-key: ${{ secrets.GPG_SECRET_KEY }}
          gpg-public-key: ${{ secrets.GPG_PUBLIC_KEY }}
          gpg-key-pass: ${{ secrets.GPG_PASS }}

      - name: GPG sign deb # gpg sign and verify deb packages
        env:
          GPG_TTY: /dev/null
          HOME: /home/runner
          GNUPGHOME: /home/runner/.gnupg
        run: |
          # Ensure environment variables are exported
          export HOME="${HOME}"
          export GNUPGHOME="${GNUPGHOME}"

          # Sign the package
          for deb in tests/*.deb; do
            gpg --batch --pinentry-mode loopback \
                --passphrase-file "$GNUPGHOME/passphrase" \
                --armor --detach-sign "$deb"
          done
          # dpkg-sig --sign builder --gpg-options "--batch --pinentry-mode loopback --passphrase-file $GNUPGHOME/passphrase" tests/*.deb
          # Verify the signature
          dpkg-sig --verify tests/*.deb
