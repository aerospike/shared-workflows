name: PR Hygiene

on:
  workflow_call:
    inputs:
      pr_title:
        required: true
        type: string
        description: PR title to validate
      allowed-patterns:
        required: false
        type: string
        default: ""
        description: |
          Newline-delimited list of regex patterns (ERE syntax). PR titles matching
          any pattern bypass both commitlint and JIRA validation. These are appended
          to the built-in defaults unless use-default-patterns is false.
      use-default-patterns:
        required: false
        type: boolean
        default: true
        description: >
          Include built-in default patterns for Dependabot, StepSecurity, and
          revert commits. Set to false to use only your custom patterns.

permissions:
  contents: read

jobs:
  hygiene-check:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
        with:
          egress-policy: audit

      - name: Check allowlist patterns
        id: allowlist
        env:
          PR_TITLE: ${{ inputs.pr_title }}
          ALLOWED_PATTERNS: ${{ inputs.allowed-patterns }}
          USE_DEFAULTS: ${{ inputs.use-default-patterns }}
        run: |
          PATTERNS=""

          # Built-in defaults
          if [ "$USE_DEFAULTS" = "true" ]; then
            PATTERNS="^Build\(deps.*\):
          ^\[StepSecurity\]
          ^[Rr]evert \"
          ^revert:"
          fi

          # Append consumer patterns
          if [ -n "$ALLOWED_PATTERNS" ]; then
            if [ -n "$PATTERNS" ]; then
              PATTERNS="$PATTERNS
          $ALLOWED_PATTERNS"
            else
              PATTERNS="$ALLOWED_PATTERNS"
            fi
          fi

          # Test each pattern
          if [ -n "$PATTERNS" ]; then
            while IFS= read -r pattern; do
              [ -z "$pattern" ] && continue
              if echo "$PR_TITLE" | grep -qE "$pattern"; then
                echo "✅ PR title matches allowed pattern: $pattern"
                echo "allowed=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done <<< "$PATTERNS"
          fi

          echo "allowed=false" >> "$GITHUB_OUTPUT"

      # PR title must follow: type(scope): [JIRA-123] description
      #   type:  feat|fix|refactor|docs|test|ci|chore|build|perf (validated by commitlint)
      #   scope: optional, lowercase (e.g., workflows, deploy, actions)
      #   JIRA:  uppercase project key in brackets, before the description
      # Example: feat(workflows): [INFRA-370] add artifacts-cicd integration tests
      - name: Validate PR title is conventional commit
        if: steps.allowlist.outputs.allowed != 'true'
        env:
          PR_TITLE: ${{ inputs.pr_title }}
        run: |
          npm install --save-dev @commitlint/cli @commitlint/config-conventional
          echo '{"extends":["@commitlint/config-conventional"]}' > .commitlintrc.json
          echo "$PR_TITLE" | npx commitlint

      - name: Check for JIRA ticket in PR title
        if: steps.allowlist.outputs.allowed != 'true'
        env:
          PR_TITLE: ${{ inputs.pr_title }}
        run: |
          echo "PR Title: $PR_TITLE"
          JIRA_TICKET=$(echo "$PR_TITLE" | grep -oP '^[a-z]+(\([a-z0-9-]+\))?: \[\K[A-Z]{2,10}-[0-9]+(?=\] )' | head -1)
          if [ -z "$JIRA_TICKET" ]; then
            echo "❌ ERROR: No JIRA ticket found in PR title!"
            echo "PR title must follow: type(scope): [JIRA-123] description"
            echo "Example: feat(workflows): [INFRA-370] add artifacts-cicd integration tests"
            exit 1
          else
            echo "✅ JIRA ticket found: $JIRA_TICKET"
          fi
