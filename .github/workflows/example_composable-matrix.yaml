name: Example Composable Matrix CI/CD

on:
  workflow_dispatch: # checkov:skip=CKV_GHA_7:version input is an optional override, not required for reproducibility
    inputs:
      version:
        description: Version override (leave empty for auto-detection)
        required: false
        default: ""
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

# This workflow demonstrates the composable artifact pipeline pattern.
# Unlike reusable_artifacts-cicd.yaml (which is all-in-one), this calls the
# underlying workflows individually so you can insert custom steps between them.
# It also demonstrates using a release bundle. To enable this, THE EXAMPLE
# DELETES THE PREVIOUS BUNDLE IF IT EXISTS.
#
# WORKFLOW FLOW:
# 1. extract-version    - read version from file or input
# 2. build (matrix)     - C builds across distros: el9, jammy (reusable_execute-build.yaml)
#    build-npm          - npm package build (separate job, see note below)
#    build-java         - Java/Maven build (separate job, see note below)
# 3. collect            - merge all build artifacts into one (inline download + upload)
# 4. test               - INSERT YOUR TESTS HERE
# 5. sign               - GPG sign the artifacts (reusable_sign-artifacts.yaml)
# 6. deploy             - upload to JFrog Artifactory (reusable_deploy-artifacts.yaml)
# 7. delete/bundle/promote - release bundle lifecycle (workflow_dispatch only)
#
# npm and Java are separate jobs here because they need different working
# directories and toolchains. They could also be folded into a matrix with
# per-entry overrides (see example_artifacts-cicd.yaml for that approach).
#
# BUILD ID SCHEME (no resolve job needed):
# - Per-matrix build:  ${{ github.run_id }}-${{ github.run_attempt }}-buildinfo-{distro}-{arch}
# - Deploy parent:     ${{ github.run_id }}-${{ github.run_attempt }}
# - Deploy metadata:   ${{ github.run_id }}-${{ github.run_attempt }}-buildinfo

jobs:
  extract-version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Extract Version
        id: extract
        uses: ./.github/actions/extract-version-from-tag
        with:
          version: ${{ inputs.version }}
          version-file: .github/workflows/VERSION.example

  build:
    needs: extract-version
    strategy:
      fail-fast: true
      matrix:
        include:
          - distro: el9
            arch: x86_64
            runs-on: ubuntu-22.04
            emulated: false
            pkg-type: rpm
            distro-label: el9
          - distro: jammy
            arch: x86_64
            runs-on: ubuntu-22.04
            emulated: false
            pkg-type: deb
            distro-label: ubuntu22.04
    uses: ./.github/workflows/reusable_execute-build.yaml
    with:
      gh-workflows-ref: ${{ github.sha }}
      jf-project: test
      jf-build-name: test-build
      jf-build-id: ${{ github.run_id }}-${{ github.run_attempt }}-buildinfo-${{ matrix.distro }}-${{ matrix.arch }}
      gh-source-path: repo-source
      working-directory: repo-source/.github/workflows/execute-build/test_apps/hi
      build-env: VERSION=${{ needs.extract-version.outputs.version }}
      build-script: |
        set -x # show what script is doing
        DISTRO=${{ matrix.distro }}
        ARCH=${{ matrix.arch }}
        PKG_TYPE=${{ matrix.pkg-type }}

        # Compile the binary
        DISTRO="$DISTRO" ARCH="$ARCH" EMULATED=${{ matrix.emulated }} make docker-build

        # Package into .deb or .rpm using the public tenzer/fpm container.
        # Our internal FPM containers require separate OIDC auth (see INFRA-430).
        # The distro-label is embedded in the package name so deploy-artifacts can
        # identify the deb codename (see get_codename_for_deb in package_utils.sh).
        docker run --rm \
          -v "$PWD/build:/work" -w /work \
          tenzer/fpm \
          -s dir -t "$PKG_TYPE" -n "hi-${{ matrix.distro-label }}" -v "$VERSION" -a native \
          --prefix /usr/bin \
          "$DISTRO/$ARCH/hi"

        # Move package to distro/arch dir and remove the bare binary
        mv "build/hi"*."$PKG_TYPE" "build/$DISTRO/$ARCH/"
        rm "build/$DISTRO/$ARCH/hi"
      gh-artifact-directory: build
      gh-artifact-name: build-artifacts-${{ matrix.distro }}-${{ matrix.arch }}
      oidc-provider-name: gh-dev-test
      oidc-audience: aerospike/testing
    secrets: inherit

  build-npm:
    needs: extract-version
    uses: ./.github/workflows/reusable_execute-build.yaml
    with:
      gh-workflows-ref: ${{ github.sha }}
      jf-project: test
      jf-build-name: test-build
      jf-build-id: ${{ github.run_id }}-${{ github.run_attempt }}-buildinfo-npm-x86_64
      gh-source-path: repo-source
      working-directory: repo-source/.github/workflows/execute-build/test_apps/NpmHelloWorld
      build-script: |
        npm pack
        mkdir -p output
        mv *.tgz output/
      gh-artifact-directory: output
      gh-artifact-name: build-artifacts-npm-x86_64
      oidc-provider-name: gh-dev-test
      oidc-audience: aerospike/testing
    secrets: inherit

  build-java:
    needs: extract-version
    uses: ./.github/workflows/reusable_execute-build.yaml
    with:
      gh-workflows-ref: ${{ github.sha }}
      jf-project: test
      jf-build-name: test-build
      jf-build-id: ${{ github.run_id }}-${{ github.run_attempt }}-buildinfo-java-x86_64
      gh-source-path: repo-source
      working-directory: repo-source/.github/workflows/execute-build/test_apps/JavaHelloWorld
      build-script: |
        mvn package -q
        mkdir -p output
        cp target/*.jar output/
        cp pom.xml output/hello-world-1.0.0.pom
      gh-artifact-directory: output
      gh-artifact-name: build-artifacts-java-x86_64
      oidc-provider-name: gh-dev-test
      oidc-audience: aerospike/testing
      setup-java: true
      java-version: "17"
    secrets: inherit

  # Merge all per-matrix artifacts into a single github artifact for downstream jobs.
  # This is intentionally inline (not a reusable workflow) since it is only download + upload.
  collect:
    needs: [build, build-npm, build-java]
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit
      - name: Download matrix artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-artifacts-*
          path: build-artifacts
          merge-multiple: true
      - name: Upload merged artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: build-artifacts
          path: build-artifacts
          retention-days: 1

  # ============================================================
  # INSERT YOUR CUSTOM STEPS HERE
  # This job runs after the build artifacts are collected and
  # before signing and deployment. Use it for integration tests,
  # smoke tests, security scans, or any other validation.
  # `test` here would be a placeholder name for your actual
  # testing job(s) that should be run before signing
  # ============================================================
  test:
    needs: collect
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts
          path: build-artifacts
      - name: Run tests
        run: |
          echo "Build artifacts available for testing:"
          find build-artifacts
          # Replace this step with your actual test commands, e.g.:
          # ./scripts/run-integration-tests.sh build-artifacts/
  sign:
    needs: test
    uses: ./.github/workflows/reusable_sign-artifacts.yaml
    with:
      gh-workflows-ref: ${{ github.sha }}
      # gh-unsigned-artifacts defaults to build-artifacts (matches collect job output)
      # gh-artifact-name defaults to signed-artifacts (matches deploy job input)
    secrets:
      gpg-private-key: ${{ secrets.GPG_SECRET_KEY }}
      gpg-public-key: ${{ secrets.GPG_PUBLIC_KEY }}
      gpg-key-pass: ${{ secrets.GPG_PASS }}
      es-username: ${{ secrets.ES_USERNAME }}
      es-password: ${{ secrets.ES_PASSWORD }}
      credential_id: ${{ secrets.CREDENTIAL_ID }}
      es-totp_secret: ${{ secrets.ES_TOTP_SECRET }}

  deploy:
    needs: [extract-version, sign]
    uses: ./.github/workflows/reusable_deploy-artifacts.yaml
    with:
      gh-workflows-ref: ${{ github.sha }}
      jf-project: test
      jf-build-name: test-build
      version: ${{ needs.extract-version.outputs.version }}
      jf-build-id: ${{ github.run_id }}-${{ github.run_attempt }}
      jf-metadata-build-id: ${{ github.run_id }}-${{ github.run_attempt }}-buildinfo
      oidc-provider-name: gh-dev-test
      oidc-audience: aerospike/testing
    secrets: inherit

  delete-existing-bundle:
    needs: [deploy, extract-version]
    runs-on: ubuntu-22.04
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit
      - name: Setup JFrog CLI
        uses: step-security/setup-jfrog-cli@893a92f96c7727242adf0e603c77b1f2a22390e1 # v4.9.1
        env:
          JF_URL: https://artifact.aerospike.io
          JF_PROJECT: test
        with:
          oidc-provider-name: gh-dev-test
          oidc-audience: aerospike/testing
      - name: Check for existing release bundle
        id: check
        env:
          BUNDLE_NAME: test-release
          BUNDLE_VERSION: ${{ needs.extract-version.outputs.version }}
        run: |
          echo "Checking for existing bundle: $BUNDLE_NAME $BUNDLE_VERSION"
          versions=$(jf release-bundle-search versions "$BUNDLE_NAME" --project=test --format=json)
          echo "$versions" | jq .
          if echo "$versions" | jq -e --arg v "$BUNDLE_VERSION" '.release_bundles[] | select(.release_bundle_version == $v)' >/dev/null 2>&1; then
            echo "Found existing bundle."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "No existing bundle found."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Show existing bundle details
        if: steps.check.outputs.exists == 'true'
        env:
          BUNDLE_NAME: test-release
          BUNDLE_VERSION: ${{ needs.extract-version.outputs.version }}
        run: |
          echo "Existing bundle to delete:"
          jf release-bundle-search versions "$BUNDLE_NAME" --project=test --format=json | \
            jq --arg v "$BUNDLE_VERSION" '.release_bundles[] | select(.release_bundle_version == $v)'

      - name: Delete existing release bundle
        if: steps.check.outputs.exists == 'true'
        env:
          BUNDLE_NAME: test-release
          BUNDLE_VERSION: ${{ needs.extract-version.outputs.version }}
        run: |
          echo "Deleting bundle: $BUNDLE_NAME $BUNDLE_VERSION"
          jf release-bundle-delete-local "$BUNDLE_NAME" "$BUNDLE_VERSION" \
            --project=test --quiet

  # Create a release bundle from the deployed artifacts.
  # Depends on delete-existing-bundle because create does not allow overwriting.
  # The bundle includes build: test-build at the deployed version.
  bundle:
    needs: [delete-existing-bundle, extract-version]
    uses: ./.github/workflows/reusable_create-release-bundle.yaml
    if: github.event_name == 'workflow_dispatch'
    with:
      gh-workflows-ref: ${{ github.sha }}
      jf-project: test
      jf-build-names: test-build:${{ github.run_id }}-${{ github.run_attempt }}
      jf-bundle-name: test-release
      version: ${{ needs.extract-version.outputs.version }}
      oidc-provider-name: gh-dev-test
      oidc-audience: aerospike/testing
      dry-run: false

  promote-bundle:
    needs: [bundle, extract-version]
    runs-on: ubuntu-22.04
    if: github.event_name == 'workflow_dispatch'
    env:
      BUNDLE_NAME: test-release
      BUNDLE_VERSION: ${{ needs.extract-version.outputs.version }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit
      - name: Setup JFrog CLI
        uses: step-security/setup-jfrog-cli@893a92f96c7727242adf0e603c77b1f2a22390e1 # v4.9.1
        env:
          JF_URL: https://artifact.aerospike.io
          JF_PROJECT: test
        with:
          oidc-provider-name: gh-dev-test
          oidc-audience: aerospike/testing
      - name: Show bundle before promotion
        run: |
          echo "Bundle to promote: $BUNDLE_NAME $BUNDLE_VERSION"
          jf release-bundle-search versions "$BUNDLE_NAME" --project=test --format=json | \
            jq --arg v "$BUNDLE_VERSION" '.release_bundles[] | select(.release_bundle_version == $v)'
      - name: Promote release bundle to TEST
        run: |
          echo "Promoting $BUNDLE_NAME $BUNDLE_VERSION to TEST environment..."
          jf release-bundle-promote "$BUNDLE_NAME" "$BUNDLE_VERSION" TEST \
            --project=test
