name: Example Composable Matrix CI/CD
# Demonstrates the composable artifact pipeline: calling the underlying shared
# workflows individually with custom steps between them. Builds DEB, RPM, npm,
# Java, Python, Go module, Helm chart, and macOS .pkg artifacts across a matrix,
# then signs (Apple + GPG + .prov for helm), deploys, and creates a release
# bundle with promotion.
#
# The full pipeline runs on workflow_dispatch, including the release bundle
# lifecycle.
#
# RELEASE BUNDLE STRATEGY:
# The bundle from the previous run is intentionally left in place so it can be
# inspected after the workflow completes. On the next run, the delete step cleans
# up the old bundle before deploy (promoted bundles can lock artifacts in
# dev-local repos, so deletion must happen before new artifacts are uploaded).
#
# WORKFLOW FLOW:
#  1. extract-version        - read version from file or input
#  2. build (matrix)         - DEB/RPM builds across distros using FPM for packaging
#     build-npm              - npm package build
#     build-java             - Java/Maven build
#     build-python           - Python wheel + sdist build
#     build-go               - Go module zip build
#     build-mac              - macOS .pkg build
#     build-helm             - Helm chart .tgz build
#  3. collect                - merge per-matrix artifacts into one (collect-build-artifacts action)
#  4. test                   - INSERT YOUR TESTS HERE
#  5. sign-mac               - Apple codesign + notarize (reusable_sign-mac-artifacts.yaml, optional)
#  6. sign                   - GPG sign artifacts (reusable_sign-artifacts.yaml)
#  7. delete-existing-bundle - remove previous bundle if it exists (workflow_dispatch only)
#  8. deploy                 - upload to JFrog Artifactory (reusable_deploy-artifacts.yaml)
#  9. create-release-bundle  - create bundle (reusable_create-release-bundle.yaml, workflow_dispatch only)
# 10. promote-release-bundle - promote bundle to DEV (workflow_dispatch only)
#
# npm, Java, and Mac are separate jobs because they use different working
# directories, runners, and toolchains. They could also be folded into a matrix
# with per-entry overrides (see example_artifacts-cicd.yaml for that approach).
#
# BUILD ID SCHEME:
# - Per-matrix build:  {run_id}-{run_attempt}-buildinfo-{distro}-{arch}
# - Deploy parent:     {run_id}-{run_attempt}
# - Deploy metadata:   {run_id}-{run_attempt}-buildinfo

on:
  workflow_dispatch: # checkov:skip=CKV_GHA_7:version input is an optional override, not required for reproducibility
    inputs:
      version:
        description: Version override (leave empty for auto-detection)
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

concurrency:
  group: jfrog-test-deploy
  cancel-in-progress: false

jobs:
  extract-version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9ca718d3bf646d6534007c269a635b3e54cadf99 # v2.19.2
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Extract Version
        id: extract
        uses: ./.github/actions/extract-version-from-tag
        with:
          version: ${{ inputs.version }}
          version-file: .github/workflows/VERSION.example

  build:
    needs: extract-version
    strategy:
      fail-fast: true
      matrix:
        include:
          - distro: el9
            arch: x86_64
            runs-on: ubuntu-22.04
            emulated: false
            pkg-type: rpm
            fpm-extra: --rpm-dist el9
          - distro: jammy
            arch: x86_64
            runs-on: ubuntu-22.04
            emulated: false
            pkg-type: deb
            fpm-extra: --iteration 1ubuntu22.04
    uses: ./.github/workflows/reusable_execute-build.yaml
    with:
      gh-workflows-ref: ${{ github.sha }}
      jf-project: test
      jf-build-name: test-build
      jf-build-id: ${{ github.run_id }}-${{ github.run_attempt }}-buildinfo-${{ matrix.distro }}-${{ matrix.arch }}
      gh-source-path: repo-source
      working-directory: repo-source/.github/workflows/execute-build/test_apps/hi
      build-env: VERSION=${{ needs.extract-version.outputs.version }}
      build-script: |
        set -x # show what script is doing
        DISTRO=${{ matrix.distro }}
        ARCH=${{ matrix.arch }}
        PKG_TYPE=${{ matrix.pkg-type }}

        # Compile the binary
        DISTRO="$DISTRO" ARCH="$ARCH" EMULATED=${{ matrix.emulated }} make docker-build

        # Package into .deb or .rpm using the public tenzer/fpm container.
        # Our internal FPM containers require separate OIDC auth (see INFRA-430).
        # The fpm-extra matrix field embeds the distro identifier so deploy-artifacts
        # can identify the deb codename (see get_codename_for_deb in package_utils.sh).
        # Output follows Aerospike package naming guidelines.
        docker run --rm \
          -v "$PWD/build:/work" -w /work \
          tenzer/fpm \
          -s dir -t "$PKG_TYPE" -n hi -v "$VERSION" -a native \
          ${{ matrix.fpm-extra }} \
          "$DISTRO/$ARCH/hi=/usr/local/bin/hi"

        # Move package to distro/arch dir and remove the bare binary
        mv "build/hi"*."$PKG_TYPE" "build/$DISTRO/$ARCH/"
        rm "build/$DISTRO/$ARCH/hi"
      gh-artifact-directory: build
      gh-artifact-name: build-artifacts-${{ matrix.distro }}-${{ matrix.arch }}
      oidc-provider-name: gh-dev-test
      oidc-audience: aerospike/testing
    secrets: inherit

  build-npm:
    needs: extract-version
    uses: ./.github/workflows/reusable_execute-build.yaml
    with:
      gh-workflows-ref: ${{ github.sha }}
      jf-project: test
      jf-build-name: test-build
      jf-build-id: ${{ github.run_id }}-${{ github.run_attempt }}-buildinfo-npm-x86_64
      gh-source-path: repo-source
      working-directory: repo-source/.github/workflows/execute-build/test_apps/NpmHelloWorld
      build-script: |
        npm pack
        mkdir -p output
        mv *.tgz output/
      gh-artifact-directory: output
      gh-artifact-name: build-artifacts-npm-x86_64
      oidc-provider-name: gh-dev-test
      oidc-audience: aerospike/testing
    secrets: inherit

  build-java:
    needs: extract-version
    uses: ./.github/workflows/reusable_execute-build.yaml
    with:
      gh-workflows-ref: ${{ github.sha }}
      jf-project: test
      jf-build-name: test-build
      jf-build-id: ${{ github.run_id }}-${{ github.run_attempt }}-buildinfo-java-x86_64
      gh-source-path: repo-source
      working-directory: repo-source/.github/workflows/execute-build/test_apps/JavaHelloWorld
      build-script: |
        mvn package -q
        mkdir -p output
        cp target/*.jar output/
        cp pom.xml output/hello-world-1.0.0.pom
      gh-artifact-directory: output
      gh-artifact-name: build-artifacts-java-x86_64
      oidc-provider-name: gh-dev-test
      oidc-audience: aerospike/testing
      setup-java: true
      java-version: "17"
    secrets: inherit

  build-python:
    needs: extract-version
    uses: ./.github/workflows/reusable_execute-build.yaml
    with:
      gh-workflows-ref: ${{ github.sha }}
      jf-project: test
      jf-build-name: test-build
      jf-build-id: ${{ github.run_id }}-${{ github.run_attempt }}-buildinfo-python-x86_64
      gh-source-path: repo-source
      working-directory: repo-source/.github/workflows/execute-build/test_apps/PythonHelloWorld
      build-script: |
        python -m build
        mkdir -p output
        mv dist/*.whl dist/*.tar.gz output/
      gh-artifact-directory: output
      gh-artifact-name: build-artifacts-python-x86_64
      oidc-provider-name: gh-dev-test
      oidc-audience: aerospike/testing
      setup-python: true
      python-version: "3.12"
    secrets: inherit

  build-go:
    needs: extract-version
    uses: ./.github/workflows/reusable_execute-build.yaml
    with:
      gh-workflows-ref: ${{ github.sha }}
      jf-project: test
      jf-build-name: test-build
      jf-build-id: ${{ github.run_id }}-${{ github.run_attempt }}-buildinfo-go-x86_64
      gh-source-path: repo-source
      working-directory: repo-source/.github/workflows/execute-build/test_apps/GoHelloWorld
      build-env: VERSION=${{ needs.extract-version.outputs.version }}
      build-script: |
        read -r _ MODULE < go.mod
        TMP=$(mktemp -d)
        mkdir -p "$TMP/$MODULE@v$VERSION" dist
        cp go.mod *.go "$TMP/$MODULE@v$VERSION/"
        (cd "$TMP" && zip -qr "$OLDPWD/dist/hello-v$VERSION.zip" .)
        rm -rf "$TMP"
      gh-artifact-directory: dist
      gh-artifact-name: build-artifacts-go-x86_64
      oidc-provider-name: gh-dev-test
      oidc-audience: aerospike/testing
    secrets: inherit

  build-mac:
    needs: extract-version
    uses: ./.github/workflows/reusable_execute-build.yaml
    with:
      gh-workflows-ref: ${{ github.sha }}
      jf-project: test
      jf-build-name: test-build
      jf-build-id: ${{ github.run_id }}-${{ github.run_attempt }}-buildinfo-darwin-arm64
      gh-source-path: repo-source
      working-directory: repo-source/.github/workflows/execute-build/test_apps/hi
      runs-on: macos-14
      build-env: VERSION=${{ needs.extract-version.outputs.version }}
      build-script: |
        make clean build DISTRO=darwin ARCH=arm64
        mkdir -p dist
        pkgbuild --root build/darwin/arm64 --identifier com.aerospike.test \
          --version "$VERSION" --install-location /usr/local/bin \
          dist/test-$VERSION-darwin-arm64.pkg
      gh-artifact-directory: dist
      gh-artifact-name: build-artifacts-darwin-arm64
      oidc-provider-name: gh-dev-test
      oidc-audience: aerospike/testing
    secrets: inherit

  build-helm:
    needs: extract-version
    uses: ./.github/workflows/reusable_execute-build.yaml
    with:
      gh-workflows-ref: ${{ github.sha }}
      jf-project: test
      jf-build-name: test-build
      jf-build-id: ${{ github.run_id }}-${{ github.run_attempt }}-buildinfo-helm-x86_64
      gh-source-path: repo-source
      working-directory: repo-source/.github/workflows/execute-build/test_apps/HelmHelloWorld
      build-env: VERSION=${{ needs.extract-version.outputs.version }}
      build-script: |
        mkdir -p dist
        helm package . --version "$VERSION" --app-version "$VERSION" -d dist
      gh-artifact-directory: dist
      gh-artifact-name: build-artifacts-helm-x86_64
      oidc-provider-name: gh-dev-test
      oidc-audience: aerospike/testing
      setup-helm: true
    secrets: inherit

  # Merge all per-matrix artifacts into a single github artifact for downstream jobs.
  collect:
    needs:
      [
        build,
        build-npm,
        build-java,
        build-python,
        build-go,
        build-mac,
        build-helm,
      ]
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9ca718d3bf646d6534007c269a635b3e54cadf99 # v2.19.2
        with:
          egress-policy: audit
      - name: Checkout shared-workflows (actions)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
      - name: Collect build artifacts
        uses: ./.github/actions/collect-build-artifacts

  # ============================================================
  # INSERT YOUR CUSTOM STEPS HERE
  # This job runs after the build artifacts are collected and
  # before signing and deployment. Use it for integration tests,
  # smoke tests, security scans, or any other validation.
  # `test` here would be a placeholder name for your actual
  # testing job(s) that should be run before signing
  # ============================================================
  test:
    needs: collect
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9ca718d3bf646d6534007c269a635b3e54cadf99 # v2.19.2
        with:
          egress-policy: audit
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts
          path: build-artifacts
      - name: Run tests
        run: |
          echo "Build artifacts available for testing:"
          find build-artifacts
          # Replace this step with your actual test commands, e.g.:
          # ./scripts/run-integration-tests.sh build-artifacts/

  sign-mac:
    needs: test
    uses: ./.github/workflows/reusable_sign-mac-artifacts.yaml
    with:
      gh-workflows-ref: ${{ github.sha }}
      signing-identity: "Developer ID Application: Aerospike, Inc. (22224RFU67)"
      installer-identity: "Developer ID Installer: Aerospike, Inc. (22224RFU67)"
      artifact-glob: "*.pkg"
      notarize: true
    secrets:
      apple-application-cert: ${{ secrets.APPLE_APPLICATION_CERT }}
      apple-id: ${{ secrets.APPLE_ID }}
      apple-installer-cert: ${{ secrets.APPLE_INSTALLER_CERT }}
      apple-cert-password: ${{ secrets.APPLE_CERT_PASSWORD }}
      apple-notarization-password: ${{ secrets.APPLE_NOTARIZATION_PASSWORD }}
      apple-team-id: ${{ secrets.APPLE_TEAM_ID }}

  sign:
    needs: sign-mac
    if: always() && !cancelled() && needs.sign-mac.result != 'failure'
    uses: ./.github/workflows/reusable_sign-artifacts.yaml
    with:
      gh-workflows-ref: ${{ github.sha }}
      # gh-unsigned-artifacts defaults to build-artifacts (matches collect job output)
      # gh-artifact-name defaults to signed-artifacts (matches deploy job input)
    secrets:
      gpg-private-key: ${{ secrets.GPG_SECRET_KEY }}
      gpg-public-key: ${{ secrets.GPG_PUBLIC_KEY }}
      gpg-key-pass: ${{ secrets.GPG_PASS }}
      es-username: ${{ secrets.ES_USERNAME }}
      es-password: ${{ secrets.ES_PASSWORD }}
      credential_id: ${{ secrets.CREDENTIAL_ID }}
      es-totp_secret: ${{ secrets.ES_TOTP_SECRET }}

  deploy:
    needs: [extract-version, sign, delete-existing-bundle]
    if: always() && !cancelled() && needs.sign.result == 'success'
    uses: ./.github/workflows/reusable_deploy-artifacts.yaml
    with:
      gh-workflows-ref: ${{ github.sha }}
      jf-project: test
      jf-build-name: test-build
      version: ${{ needs.extract-version.outputs.version }}
      jf-build-id: ${{ github.run_id }}-${{ github.run_attempt }}
      jf-metadata-build-id: ${{ github.run_id }}-${{ github.run_attempt }}-buildinfo
      oidc-provider-name: gh-dev-test
      oidc-audience: aerospike/testing
    secrets: inherit

  # Delete existing bundle before deploy. Promoted bundles can lock artifacts
  # in dev-local repos, causing deploy uploads to fail.
  delete-existing-bundle:
    needs: [sign, extract-version]
    runs-on: ubuntu-22.04
    if: always() && !cancelled() && needs.sign.result == 'success' && github.event_name == 'workflow_dispatch'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9ca718d3bf646d6534007c269a635b3e54cadf99 # v2.19.2
        with:
          egress-policy: audit
      - name: Checkout shared-workflows (actions)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
      - name: Setup JFrog CLI
        uses: step-security/setup-jfrog-cli@3054b554c0fb4915b3d58847fb7730c593dbb934 # v5.0.0
        env:
          JF_URL: https://artifact.aerospike.io
          JF_PROJECT: test
        with:
          oidc-provider-name: gh-dev-test
          oidc-audience: aerospike/testing
      - name: Delete existing bundle (if any)
        uses: ./.github/actions/delete-release-bundle
        with:
          bundle-name: test-release
          version: ${{ needs.extract-version.outputs.version }}
          jf-project: test

  # Create release bundle after deploy (uses reusable workflow).
  create-release-bundle:
    needs: [deploy, extract-version]
    uses: ./.github/workflows/reusable_create-release-bundle.yaml
    if: always() && !cancelled() && needs.deploy.result == 'success' && github.event_name == 'workflow_dispatch'
    with:
      gh-workflows-ref: ${{ github.sha }}
      jf-project: test
      jf-build-names: test-build:${{ github.run_id }}-${{ github.run_attempt }}
      jf-bundle-name: test-release
      version: ${{ needs.extract-version.outputs.version }}
      oidc-provider-name: gh-dev-test
      oidc-audience: aerospike/testing

  # Promote to DEV after bundle creation. Promotion is only available as a
  # composite action, so this must be a steps-based job.
  promote-release-bundle:
    needs: [create-release-bundle, extract-version]
    runs-on: ubuntu-22.04
    if: always() && !cancelled() && needs.create-release-bundle.result == 'success' && github.event_name == 'workflow_dispatch'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9ca718d3bf646d6534007c269a635b3e54cadf99 # v2.19.2
        with:
          egress-policy: audit
      - name: Checkout shared-workflows (actions)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
      - name: Setup JFrog CLI
        uses: step-security/setup-jfrog-cli@3054b554c0fb4915b3d58847fb7730c593dbb934 # v5.0.0
        env:
          JF_URL: https://artifact.aerospike.io
          JF_PROJECT: test
        with:
          oidc-provider-name: gh-dev-test
          oidc-audience: aerospike/testing
      - name: Promote release bundle to DEV
        uses: ./.github/actions/promote-release-bundle
        with:
          bundle-name: test-release
          version: ${{ needs.extract-version.outputs.version }}
          environment: DEV
          jf-project: test
          include-repos: test-deb-dev-local;test-rpm-dev-local;test-maven-dev-local;test-npm-dev-local;test-pypi-dev-local;test-go-dev-local;test-helm-dev-local;test-generic-dev-local
