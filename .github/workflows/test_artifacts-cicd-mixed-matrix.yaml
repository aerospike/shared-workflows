name: "Test: Artifacts CI/CD Mixed Matrix"

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  # Validates that different artifact types (native + dotnet) can coexist
  # Skipped for Dependabot: SSL.com NuGet signing requires real credentials
  mixed-matrix-test:
    if: github.actor != 'dependabot[bot]'
    name: Mixed Matrix Test (Native + DotNet)
    uses: ./.github/workflows/reusable_artifacts-cicd.yaml
    with:
      jf-project: test
      jf-build-name: mixed-matrix-test
      version: 1.0.1-test
      gh-workflows-ref: ${{ github.ref }}
      gh-artifact-directory: packaged
      oidc-provider-name: gh-dev-test
      oidc-audience: aerospike/testing
      build-script: echo "Will be overridden by matrix"
      matrix-json: |
        {
          "include": [
            {
              "distro": "jammy",
              "arch": "x86_64",
              "runs-on": "ubuntu-latest",
              "build-script": "DISTRO=$(echo $MATRIX_JSON | jq -r .distro) && ARCH=$(echo $MATRIX_JSON | jq -r .arch) && OUTPUT_DIR=$(pwd)/packaged && cd .github/workflows/execute-build/test_apps/hi && make docker-build DISTRO=$DISTRO ARCH=$ARCH && ./package.sh --version 1.0.1-test --packages-dir build --output-dir $OUTPUT_DIR"
            },
            {
              "distro": "dotnet",
              "arch": "any",
              "runs-on": "ubuntu-latest",
              "setup-dotnet": true,
              "build-script": "OUTPUT_DIR=$(pwd)/packaged && cd .github/workflows/execute-build/test_apps/DotnetHelloWorld/AerospikeHelloWorld && dotnet pack -c Release -p:Version=1.0.1-test -o $OUTPUT_DIR"
            }
          ]
        }
      dry-run: true
      sign-mac: true
      mac-signing-identity: "Developer ID Application: Test (TESTID)"
      mac-installer-identity: "Developer ID Installer: Test (TESTID)"
    secrets:
      gpg-private-key: ${{ secrets.GPG_SECRET_KEY }}
      gpg-public-key: ${{ secrets.GPG_PUBLIC_KEY }}
      gpg-key-pass: ${{ secrets.GPG_PASS }}
      es-username: ${{ secrets.ES_USERNAME }}
      es-password: ${{ secrets.ES_PASSWORD }}
      credential_id: ${{ secrets.CREDENTIAL_ID }}
      es-totp_secret: ${{ secrets.ES_TOTP_SECRET }}
      apple-application-cert: ${{ secrets.APPLE_APPLICATION_CERT }}
      apple-installer-cert: ${{ secrets.APPLE_INSTALLER_CERT }}
      apple-password: ${{ secrets.APPLE_PASSWORD }}
      apple-id: ${{ secrets.APPLE_ID }}
      apple-team-id: ${{ secrets.APPLE_TEAM_ID }}

  verify:
    if: github.actor != 'dependabot[bot]'
    name: Verify Mixed Matrix Artifacts
    runs-on: ubuntu-latest
    needs: mixed-matrix-test
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download collected artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts
          path: verification/mixed-matrix

      - name: Install bats
        run: |
          git clone https://github.com/bats-core/bats-core.git
          cd bats-core
          sudo ./install.sh /usr/local
          cd ..
          rm -rf bats-core

      - name: Run mixed artifact verification tests
        working-directory: .github/workflows/artifacts-cicd
        run: |
          bats tests/test_mixed_artifacts.bats
        env:
          ARTIFACTS_DIR: ${{ github.workspace }}/verification/mixed-matrix
