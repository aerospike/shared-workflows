name: Test Execute Build Workflow
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-execute-build-workflow:
    uses: ./.github/workflows/reusable_execute-build.yaml
    with:
      project: test-project
      build-name: test-build
      build-version: v1.0.0
      build-script: cd .github/workflows/execute-build/test_apps/hi && make
      artifact-directory: .github/workflows/execute-build/test_apps/hi/build
      artifact-name: test-execute-build
      dry-run: false

  # Test the entrypoint script directly
  run-tests:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test Entrypoint
        run: |
          .github/workflows/execute-build/test-entrypoint.sh
