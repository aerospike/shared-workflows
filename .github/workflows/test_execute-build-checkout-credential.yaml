name: Test Execute Build Checkout Credential
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  leak-checks:
    uses: ./.github/workflows/reusable_execute-build.yaml
    permissions:
      contents: read
      id-token: write
    with:
      jf-project: test
      jf-build-name: test-checkout-credential
      jf-build-id: ${{ github.run_id }}-${{ github.run_attempt }}
      gh-workflows-ref: ${{ github.sha }}
      gh-checkout-path: project-location
      gh-source-path: current-source
      gh-artifact-directory: leak-check-build
      gh-artifact-name: test-checkout-credential
      gh-retention-days: 1
      publish-build-info: false
      oidc-provider-name: gh-dev-test
      oidc-audience: aerospike/testing
      build-script: |
        set -euo pipefail
        src="$GITHUB_WORKSPACE/current-source"

        if git -C "$src" config --local --name-only --get-regexp extraheader; then
          echo "::error::source checkout persisted a credential into .git/config"
          exit 1
        fi

        # Never probe a credential that reaches private repos: it would hit a public log if masking failed.
        echo "masking-probe<${GH_SOURCE_TOKEN}>"

        mkdir -p leak-check-build
        echo "artifact content" >leak-check-build/payload.txt
        # Reproduces the leak path: a build script copying its tree into the artifact directory.
        cp "$src/.git/config" leak-check-build/git-config-copy

        if grep -rqF "$GH_SOURCE_TOKEN" leak-check-build; then
          echo "::error::credential found in the artifact directory"
          exit 1
        fi
    secrets:
      gh-source-token: ${{ secrets.GITHUB_TOKEN }}

  assert-masked:
    needs: leak-checks
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Assert the credential is masked in the build log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          job_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" \
            --jq '.jobs[] | select(.name | contains("execute-build")) | .id' | head -1)
          # Keep --allow-escape-sequences: gh refuses to redirect a job log without it.
          gh api --allow-escape-sequences "repos/${GITHUB_REPOSITORY}/actions/jobs/${job_id}/logs" >job.log

          # Drop the script source GitHub echoes into the log: it carries the literal variable name.
          probe=$(grep -o 'masking-probe<[^>]*>' job.log | grep -v 'GH_SOURCE_TOKEN' | head -1 || true)
          echo "probe line: ${probe}"
          if [[ "$probe" != 'masking-probe<***>' ]]; then
            echo "::error::credential was not masked in the build log"
            exit 1
          fi
