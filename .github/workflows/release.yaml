name: Release
permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 20

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx -p semantic-release@24 \
              -p @semantic-release/commit-analyzer@13 \
              -p @semantic-release/release-notes-generator@14 \
              -p @semantic-release/github@11 \
              -p conventional-changelog@7 \
              -p conventional-changelog-conventionalcommits@8 \
              semantic-release
