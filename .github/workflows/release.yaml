name: Release
permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx -p semantic-release@24 \
              -p @semantic-release/commit-analyzer@13 \
              -p @semantic-release/release-notes-generator@14 \
              -p @semantic-release/github@11 \
              -p conventional-changelog@7 \
              -p conventional-changelog-conventionalcommits@8 \
              semantic-release
