name: Test Docker Build-Deploy Multi-Arch Workflow

on:
  push:
    branches: [CLIENT-4300-C-client]
  workflow_dispatch:
    inputs:
      version:
        description: Version override (leave empty for auto-detection)
        required: false
        default: ""
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: jfrog-test-deploy-multiarch
  cancel-in-progress: false

jobs:
  extract-version:
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Extract Version
        id: extract
        uses: ./.github/actions/extract-version-from-tag
        with:
          version: ${{ inputs.version }}
          version-file: .github/workflows/VERSION.example
    outputs:
      version: ${{ steps.extract.outputs.version }}
      git_tag: ${{ steps.extract.outputs.git_tag }}

  test-docker-build-deploy-multiarch:
    uses: ./.github/workflows/reusable_docker-build-deploy-multiarch.yaml
    needs: extract-version
    with:
      jf-project: test
      image-name: image-c-build
      app-version: ${{ needs.extract-version.outputs.version }}
      context: ./.github/workflows/execute-build/test_apps/hi
      file: ./.github/workflows/execute-build/test_apps/amazonlinux-2023/Dockerfile
      jf-build-name: test-container-multiarch
      oidc-provider-name: gh-dev-test
      oidc-audience: aerospike/testing
      platforms: linux/amd64,linux/arm64
