name: Test Build Artifacts Workflow
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Test the reusable workflow
  test-build-artifacts-workflow:
    if: github.head_ref == 'feature/build-artifacts' # TODO: Update this to your branch name
    uses: aerospike/shared-workflows/.github/workflows/reusable_build-artifacts.yaml@feature/build-artifacts # TODO: Update this to your branch name
    with:
      build-script: .github/workflows/build-artifacts/test-artifacts/simple-build.sh
      artifact-directory: test-build-output
      artifact-name: test-build-artifacts
      dry-run: true

  # Test the entrypoint script directly
  run-tests:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test Entrypoint
        run: |
          .github/workflows/build-artifacts/test-entrypoint.sh
