name: Test Upload Workflow
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  upload-test-gh-artifacts:
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create Test Fixtures
        run: |
          .github/workflows/deploy-artifacts/create-test-fixtures.sh test-fixtures
      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-fixtures
          path: test-fixtures
  test-deploy-workflow:
    needs: upload-test-gh-artifacts
    uses: ./.github/workflows/reusable_deploy-artifacts.yaml
    with:
      gh-workflows-ref: ${{ github.sha }}
      jf-project: test
      jf-build-name: test-upload-workflow
      version: v1.0.0
      jf-build-id: ${{ github.run_number }}
      jf-metadata-build-id: ${{ github.run_number }}-metadata
      jf-url: https://artifact.aerospike.io
      oidc-provider-name: gh-aerospike
      oidc-audience: aerospike
      gh-checkout-path: . # Use current directory for internal calls
      # gh-checkout-path defaults to 'shared-workflows'
      gh-artifact-name: test-fixtures
      dry-run: true

  assert-bundle-metadata:
    needs: test-deploy-workflow
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Assert deploy published the metadata artifact
        env:
          AVAILABLE: ${{ needs.test-deploy-workflow.outputs.bundle-metadata-available }}
          ARTIFACT_NAME: ${{ needs.test-deploy-workflow.outputs.bundle-metadata-artifact-name }}
        run: |
          set -euo pipefail
          if [[ "$AVAILABLE" != "true" || -z "$ARTIFACT_NAME" ]]; then
            echo "::error::deploy reported bundle-metadata-available=$AVAILABLE name=$ARTIFACT_NAME; the fixtures contain a Maven POM and its sibling JAR, so metadata is expected"
            exit 1
          fi

      - name: Download the metadata artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.test-deploy-workflow.outputs.bundle-metadata-artifact-name }}
          path: bundle-metadata

      - name: Assert the metadata survived the round trip
        run: |
          set -euo pipefail
          meta="bundle-metadata/.maven-bundle-metadata.json"
          if [[ ! -f "$meta" ]]; then
            echo "::error::$meta is missing from the artifact that create-release-bundle downloads"
            ls -aR bundle-metadata
            exit 1
          fi
          jq -e 'has("maven_module_count") and .maven_module_count > 0' "$meta"

  run-tests:
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install dpkg-dev rpm nodejs npm libxml2-utils -y

      # No yq package exists for jammy, and the runner image does not ship one.
      - name: Install yq
        env:
          YQ_VERSION: v4.44.3
          YQ_SHA256: a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  /tmp/yq" | sha256sum -c -
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          yq --version
      - name: Install bats
        run: |
          # Install bats-core from source (recommended method per official documentation)
          git clone https://github.com/bats-core/bats-core.git
          cd bats-core
          sudo ./install.sh /usr/local
          cd ..
          rm -rf bats-core
      - name: Run bats tests
        run: |
          cd .github/workflows/deploy-artifacts
          bats tests/bats/
