name: Test Upload Workflow
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  upload-test-gh-artifacts:
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Create Test Fixtures
        run: |
          .github/workflows/deploy-artifacts/create-test-fixtures.sh test-fixtures
      - name: Upload Artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: test-fixtures
          path: test-fixtures
  test-deploy-workflow:
    needs: upload-test-gh-artifacts
    uses: ./.github/workflows/reusable_deploy-artifacts.yaml
    with:
      gh-workflows-ref: ${{ github.sha }}
      jf-project: test
      jf-build-name: test-upload-workflow
      version: v1.0.0
      jf-build-id: ${{ github.run_number }}
      jf-metadata-build-id: ${{ github.run_number }}-metadata
      jf-url: https://artifact.aerospike.io
      oidc-provider-name: gh-aerospike
      oidc-audience: aerospike
      gh-checkout-path: . # Use current directory for internal calls
      # gh-checkout-path defaults to 'shared-workflows'
      gh-artifact-name: test-fixtures
      dry-run: true

  run-tests:
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install dpkg-dev rpm nodejs npm -y
      - name: Install bats
        run: |
          # Install bats-core from source (recommended method per official documentation)
          git clone https://github.com/bats-core/bats-core.git
          cd bats-core
          sudo ./install.sh /usr/local
          cd ..
          rm -rf bats-core
      - name: Run bats tests
        run: |
          cd .github/workflows/deploy-artifacts
          bats tests/bats/
