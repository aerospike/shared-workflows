name: Test Docker Build-Deploy Workflow

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version override (leave empty for auto-detection)
        required: false
        default: ""
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: jfrog-test-deploy
  cancel-in-progress: false

jobs:
  extract-version:
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Extract Version
        id: extract
        uses: ./.github/actions/extract-version-from-tag
        with:
          version: ${{ inputs.version }}
          version-file: .github/workflows/VERSION.example
    outputs:
      version: ${{ steps.extract.outputs.version }}
      git_tag: ${{ steps.extract.outputs.git_tag }}

  # Multi-platform build (default platforms = linux/amd64,linux/arm64).
  test-docker-build-deploy:
    uses: ./.github/workflows/reusable_docker-build-deploy.yaml
    needs: extract-version
    with:
      jf-project: test
      image-name: test-image
      app-version: ${{ needs.extract-version.outputs.version }}
      context: ./.github/workflows/execute-build/test_apps/hi
      file: ./.github/workflows/execute-build/test_apps/hi/Dockerfile
      jf-build-name: test-container
      oidc-provider-name: gh-aerospike
      oidc-audience: aerospike

  # A single-platform call must still publish a multi-platform manifest index.
  # Distinct image-name and build-name so its artifacts and build-info do not
  # collide with the multi-platform job in the same run.
  test-docker-build-deploy-single:
    uses: ./.github/workflows/reusable_docker-build-deploy.yaml
    needs: extract-version
    with:
      jf-project: test
      image-name: test-image-single
      app-version: ${{ needs.extract-version.outputs.version }}
      platforms: linux/amd64
      context: ./.github/workflows/execute-build/test_apps/hi
      file: ./.github/workflows/execute-build/test_apps/hi/Dockerfile
      jf-build-name: test-container-single
      oidc-provider-name: gh-aerospike
      oidc-audience: aerospike

  # Produces the artifacts the build-context delivery call consumes. `ctx-decoy`
  # is deliberately not requested, so the image can be checked for its absence.
  produce-context-fixtures:
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Build fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fixture/nested extra decoy
          echo "delivered-jar-content" > fixture/app.jar
          echo "delivered-sig-content" > fixture/app.jar.asc
          echo "delivered-nested-content" > fixture/nested/inner.txt
          echo "delivered-extra-content" > extra/extra.txt
          echo "decoy-must-not-appear" > decoy/decoy.txt

      - name: Upload requested fixture
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ctx-fixture
          path: fixture/
          if-no-files-found: error
          retention-days: 1

      - name: Upload second requested fixture
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ctx-extra
          path: extra/
          if-no-files-found: error
          retention-days: 1

      - name: Upload decoy
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ctx-decoy
          path: decoy/
          if-no-files-found: error
          retention-days: 1

  # Build-context delivery. The context is a subdirectory, so a dest that
  # resolved against the workspace root instead of the context would fail the
  # Dockerfile's COPY.
  test-docker-build-deploy-ctx:
    uses: ./.github/workflows/reusable_docker-build-deploy.yaml
    needs: [extract-version, produce-context-fixtures]
    with:
      jf-project: test
      image-name: test-image-ctx
      app-version: ${{ needs.extract-version.outputs.version }}
      context: ./.github/workflows/execute-build/test_apps/ctx
      file: ./.github/workflows/execute-build/test_apps/ctx/Dockerfile
      jf-build-name: test-container-ctx
      oidc-provider-name: gh-aerospike
      oidc-audience: aerospike
      gh-context-artifacts-json: |
        [{"name": "ctx-fixture", "dest": "artifacts"}, {"name": "ctx-extra", "dest": "extra"}]

  verify:
    needs:
      [
        extract-version,
        test-docker-build-deploy,
        test-docker-build-deploy-single,
        test-docker-build-deploy-ctx,
      ]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      packages: read
    env:
      MULTI_IMMUTABLE: ${{ needs.test-docker-build-deploy.outputs.immutable-tag }}
      MULTI_DIGEST: ${{ needs.test-docker-build-deploy.outputs.digest }}
      MULTI_IMAGE_REF: ${{ needs.test-docker-build-deploy.outputs.image-ref }}
      MULTI_TAGS: ${{ needs.test-docker-build-deploy.outputs.tags }}
      SINGLE_IMMUTABLE: ${{ needs.test-docker-build-deploy-single.outputs.immutable-tag }}
      BUILD_NAME: test-container
      BUILD_NUMBER: ${{ github.run_number }}
      JF_URL: https://artifact.aerospike.io
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install JFrog CLI
        id: jf
        uses: step-security/setup-jfrog-cli@3054b554c0fb4915b3d58847fb7730c593dbb934 # v5.0.0
        env:
          JF_URL: ${{ env.JF_URL }}
          JF_PROJECT: test
        with:
          version: 2.78.8
          oidc-provider-name: gh-aerospike
          oidc-audience: aerospike

      - name: Docker login to Artifactory
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: artifact.aerospike.io
          username: ${{ steps.jf.outputs.oidc-user }}
          password: ${{ steps.jf.outputs.oidc-token }}

      - uses: step-security/setup-buildx-action@6997872a55d77391e51b87609556578131f44402 # v4.1.0

      - name: Outputs are populated and well formed
        shell: bash
        run: |
          set -euo pipefail
          for v in MULTI_IMMUTABLE MULTI_DIGEST MULTI_IMAGE_REF MULTI_TAGS SINGLE_IMMUTABLE; do
            if [ -z "${!v}" ]; then echo "::error::output $v is empty"; exit 1; fi
          done
          case "$MULTI_IMAGE_REF" in
            *@sha256:*) : ;;
            *) echo "::error::image-ref missing @sha256 digest: $MULTI_IMAGE_REF"; exit 1 ;;
          esac
          echo "outputs ok"

      - name: Multi-platform result is a manifest index carrying both arches
        shell: bash
        run: |
          set -euo pipefail
          out=$(docker buildx imagetools inspect "$MULTI_IMMUTABLE" --format '{{json .}}')
          mt=$(echo "$out" | jq -r '.manifest.mediaType')
          echo "media type: $mt"
          case "$mt" in
            *image.index*|*manifest.list*) : ;;
            *) echo "::error::multi result is not a manifest index: $mt"; exit 1 ;;
          esac
          for arch in amd64 arm64; do
            echo "$out" | jq -e --arg a "$arch" '.manifest.manifests[]?.platform | select(.os=="linux" and .architecture==$a)' >/dev/null \
              || { echo "::error::manifest index missing linux/$arch"; exit 1; }
          done
          echo "ok: index with amd64+arm64"

      - name: Single-platform result is still a manifest index
        shell: bash
        run: |
          set -euo pipefail
          mt=$(docker buildx imagetools inspect "$SINGLE_IMMUTABLE" --format '{{json .}}' | jq -r '.manifest.mediaType')
          echo "single media type: $mt"
          case "$mt" in
            *image.index*|*manifest.list*) echo "ok: index";;
            *) echo "::error::single-platform result is not a manifest index: $mt"; exit 1 ;;
          esac

      - name: Download per-leg metadata (multi)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/legmeta
          pattern: legmeta-test-image--*
          merge-multiple: true

      - name: Native runner per arch, and push completes inside the token lifetime
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("${RUNNER_TEMP}/legmeta"/*.json)
          if [ "${#files[@]}" -eq 0 ]; then echo "::error::no leg metadata found"; exit 1; fi
          for f in "${files[@]}"; do
            platform=$(jq -r '.platform' "$f")
            arch=$(jq -r '.runner_arch' "$f")
            fetched=$(jq -r '.token_fetched_at' "$f")
            pushed=$(jq -r '.push_completed_at' "$f")
            echo "leg $platform: runner_arch=$arch, push-minus-fetch=$((pushed - fetched))s"
            case "$platform" in
              linux/amd64) [ "$arch" = "X64" ]   || { echo "::error::amd64 leg not on X64 runner ($arch)"; exit 1; } ;;
              linux/arm64) [ "$arch" = "ARM64" ] || { echo "::error::arm64 leg not on ARM64 runner ($arch)"; exit 1; } ;;
            esac
            if [ "$((pushed - fetched))" -ge 1800 ]; then
              echo "::error::$platform push was not within the 30-min token lifetime"; exit 1
            fi
          done
          echo "ok: native runners, push inside token lifetime"

      - name: One build-info record references the manifest-list digest
        shell: bash
        env:
          TOKEN: ${{ steps.jf.outputs.oidc-token }}
        run: |
          set -euo pipefail
          # Build-info published under a JFrog project must be queried with the
          # project param; the global /api/build/<name>/<number> path 404s for
          # project-scoped builds. The build number is github.run_number (the
          # setup-jfrog-cli default), which is what consumer release-bundle
          # references rely on.
          code=$(curl -s -o /tmp/bi.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            "$JF_URL/artifactory/api/build/${BUILD_NAME}/${BUILD_NUMBER}?project=test")
          echo "build-info HTTP $code"
          [ "$code" = "200" ] || { echo "::error::build-info $BUILD_NAME/$BUILD_NUMBER not found ($code)"; cat /tmp/bi.json; exit 1; }
          digest="${MULTI_DIGEST#sha256:}"
          if ! grep -q "$digest" /tmp/bi.json; then
            echo "::error::build-info does not reference the manifest-list digest $MULTI_DIGEST"; exit 1
          fi
          echo "ok: record present, references manifest-list digest"

      - name: No JFROG_TOKEN build-arg in image history
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$MULTI_IMMUTABLE" >/dev/null
          if docker history --no-trunc --format '{{.CreatedBy}}' "$MULTI_IMMUTABLE" | grep -q "JFROG_TOKEN"; then
            echo "::error::JFROG_TOKEN found in image history"; exit 1
          fi
          echo "ok: no JFROG_TOKEN in history"

      - name: Download per-leg metadata (build-context delivery)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/ctxlegmeta
          pattern: legmeta-test-image-ctx--*
          merge-multiple: true

      # Extracting from each leg's own image proves COPY saw the delivered bytes
      # on that platform. Reading a file the workflow wrote would only prove the
      # workflow wrote a file. docker create does not execute the image, so a
      # foreign architecture needs no emulation.
      - name: Delivered artifacts are present in every leg's image
        shell: bash
        env:
          CTX_IMAGE: artifact.aerospike.io/test-docker-dev-local/test-image-ctx
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("${RUNNER_TEMP}/ctxlegmeta"/*.json)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no leg metadata found for the build-context delivery build"; exit 1
          fi

          for f in "${files[@]}"; do
            platform="$(jq -r '.platform' "$f")"
            digest="$(jq -r '.digest' "$f")"
            ref="${CTX_IMAGE}@${digest}"
            echo "--- $platform ($digest)"

            cid="$(docker create --platform "$platform" "$ref")"
            rm -rf /tmp/extracted && mkdir -p /tmp/extracted
            docker cp "${cid}:/delivered" /tmp/extracted/delivered
            docker cp "${cid}:/extra" /tmp/extracted/extra
            docker rm -f "$cid" >/dev/null

            # The requested bytes arrived intact, at any depth.
            grep -qx "delivered-jar-content" /tmp/extracted/delivered/app.jar \
              || { echo "::error::$platform: app.jar content missing or wrong"; exit 1; }
            grep -qx "delivered-sig-content" /tmp/extracted/delivered/app.jar.asc \
              || { echo "::error::$platform: app.jar.asc content missing or wrong"; exit 1; }
            grep -qx "delivered-nested-content" /tmp/extracted/delivered/nested/inner.txt \
              || { echo "::error::$platform: nested file missing or wrong"; exit 1; }

            # Each entry landed at its own dest, not merged or swapped.
            grep -qx "delivered-extra-content" /tmp/extracted/extra/extra.txt \
              || { echo "::error::$platform: extra entry missing or wrong"; exit 1; }
            if [ -e /tmp/extracted/extra/app.jar ] || [ -e /tmp/extracted/delivered/extra.txt ]; then
              echo "::error::$platform: entries were merged across destinations"; exit 1
            fi

            # An artifact present in the run but not requested must not be
            # pulled in by an over-broad download pattern.
            if grep -rqx "decoy-must-not-appear" /tmp/extracted 2>/dev/null; then
              echo "::error::$platform: decoy artifact reached the build context"; exit 1
            fi

            echo "    ok"
          done
          echo "build-context delivery: ok on ${#files[@]} leg(s)"
