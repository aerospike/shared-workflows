name: Test Setup DNS Server Action
on:
  workflow_dispatch:
    inputs:
      # checkov:skip=CKV_GHA_7:workflow_dispatch input used for debugging failing test cases in this repo
      enable-bash-trace-mode:
        type: boolean
        required: false
        default: false
  pull_request:
    branches: [main]
    paths:
      - .github/actions/setup-dns-server/**
      - .github/actions/setup-aerospike-server/**
      - .github/workflows/test_setup-dns-server.yaml

permissions:
  contents: read
  id-token: write

env:
  ENABLE_BASH_TRACE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.enable-bash-trace-mode || 'false' }}
  PROBE_IMAGE: docker.io/library/busybox@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e # 1.37.0

jobs:
  test-unit:
    name: Entrypoint unit tests
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install bats
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0
        with:
          bats-version: 1.12.0
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false

      - name: Run bats tests
        run: bats .github/actions/setup-dns-server/tests/

  test-records:
    name: A, AAAA, SRV and a changed record
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create Docker network
        run: docker network create dns-test-net

      - name: Setup DNS server
        id: dns
        uses: ./.github/actions/setup-dns-server
        with:
          network-name: dns-test-net
          zone-name: dns.test
          container-name: dns-test-coredns
          enable-bash-trace-mode: ${{ env.ENABLE_BASH_TRACE_MODE }}
          zone-content: |
            $ORIGIN dns.test.
            @ 3600 IN SOA ns.dns.test. admin.dns.test. 1 60 60 60 1
            @ 3600 IN NS ns.dns.test.
            ns 1 IN A 192.0.2.53
            seeds 1 IN A 192.0.2.10
            seeds 1 IN AAAA 2001:db8::10
            node-a 1 IN A 192.0.2.11
            node-b 1 IN A 192.0.2.12
            node-c 1 IN A 192.0.2.13
            _aerospike._tcp 1 IN SRV 10 10 3000 node-a
            _aerospike._tcp 1 IN SRV 10 10 3000 node-b

      - name: Verify outputs
        env:
          CONTAINER_NAME: ${{ steps.dns.outputs.container-name }}
          SERVER_ADDRESS: ${{ steps.dns.outputs.server-address }}
        run: |
          echo "container-name: $CONTAINER_NAME"
          echo "server-address: $SERVER_ADDRESS"
          [[ "$CONTAINER_NAME" == "dns-test-coredns" ]] \
            || { echo "Unexpected container-name"; exit 1; }
          expected=$(docker inspect -f '{{(index .NetworkSettings.Networks "dns-test-net").IPAddress}}' dns-test-coredns)
          [[ "$SERVER_ADDRESS" == "$expected" ]] \
            || { echo "Expected server-address $expected"; exit 1; }

      - name: Resolve A, AAAA and SRV records from a second container
        env:
          SERVER_ADDRESS: ${{ steps.dns.outputs.server-address }}
        run: |
          lookup() {
            docker run --rm --network dns-test-net "$PROBE_IMAGE" nslookup -type="$1" "$2" "$SERVER_ADDRESS" \
              | awk 'NF == 0 { body = 1 } body && /^Address/ { print $2 } body && /service =/ { sub(/.*service = /, ""); print }' \
              | sort | paste -sd, -
          }
          check() {
            local actual
            actual=$(lookup "$1" "$2")
            echo "$1 $2 -> $actual"
            [[ "$actual" == "$3" ]] || { echo "Expected $3"; exit 1; }
          }
          check a seeds.dns.test 192.0.2.10
          check aaaa seeds.dns.test 2001:db8::10
          check srv _aerospike._tcp.dns.test "10 10 3000 node-a.dns.test,10 10 3000 node-b.dns.test"

      - name: Change a record and resolve the new value
        env:
          CONTAINER_NAME: ${{ steps.dns.outputs.container-name }}
          SERVER_ADDRESS: ${{ steps.dns.outputs.server-address }}
        run: |
          zone_file="$RUNNER_TEMP/db.dns.test"
          cat >"$zone_file" <<'EOF'
          $ORIGIN dns.test.
          @ 3600 IN SOA ns.dns.test. admin.dns.test. 2 60 60 60 1
          @ 3600 IN NS ns.dns.test.
          ns 1 IN A 192.0.2.53
          seeds 1 IN A 192.0.2.20
          seeds 1 IN AAAA 2001:db8::10
          node-a 1 IN A 192.0.2.11
          node-b 1 IN A 192.0.2.12
          node-c 1 IN A 192.0.2.13
          _aerospike._tcp 1 IN SRV 10 10 3000 node-c
          EOF
          docker cp "$zone_file" "$CONTAINER_NAME:/etc/coredns/db.dns.test"

          lookup() {
            docker run --rm --network dns-test-net "$PROBE_IMAGE" nslookup -type="$1" "$2" "$SERVER_ADDRESS" \
              | awk 'NF == 0 { body = 1 } body && /^Address/ { print $2 } body && /service =/ { sub(/.*service = /, ""); print }' \
              | sort | paste -sd, -
          }
          for _ in $(seq 1 15); do
            a=$(lookup a seeds.dns.test)
            srv=$(lookup srv _aerospike._tcp.dns.test)
            [[ "$a" == "192.0.2.20" && "$srv" == "10 10 3000 node-c.dns.test" ]] && break
            sleep 1
          done
          echo "a seeds.dns.test -> $a"
          echo "srv _aerospike._tcp.dns.test -> $srv"
          docker logs "$CONTAINER_NAME" 2>&1 | grep "Successfully reloaded zone" || true
          [[ "$a" == "192.0.2.20" ]] || { echo "Expected changed A record 192.0.2.20"; exit 1; }
          [[ "$srv" == "10 10 3000 node-c.dns.test" ]] || { echo "Expected changed SRV record to node-c"; exit 1; }

      - name: Start a DNS server with an unparsable zone
        id: bad-zone
        continue-on-error: true
        uses: ./.github/actions/setup-dns-server
        with:
          network-name: dns-test-net
          zone-name: bad.test
          container-name: dns-test-bad-zone
          startup-timeout: "10"
          enable-bash-trace-mode: ${{ env.ENABLE_BASH_TRACE_MODE }}
          zone-content: |
            $ORIGIN bad.test.
            @ 3600 IN SOA ns.bad.test. admin.bad.test. 1 60 60 60 1
            seeds 1 IN A not-an-address

      - name: Verify the unparsable zone failed the action
        env:
          OUTCOME: ${{ steps.bad-zone.outcome }}
        run: |
          echo "bad-zone outcome: $OUTCOME"
          [[ "$OUTCOME" == "failure" ]] || { echo "Expected the action to fail"; exit 1; }

  test-aerospike-cluster:
    name: A records for a 3-node Aerospike cluster
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Aerospike Server (community, 3 nodes)
        id: aerospike
        uses: ./.github/actions/setup-aerospike-server
        with:
          server-container-repo: database-docker-virtual/aerospike-server
          num-nodes: "3"
          container-name-prefix: dns-as
          network-name: dns-aerospike-net
          publish-ports: "false"
          startup-timeout: "60"
          oidc-provider: ${{ vars.JFROG_OIDC_PROVIDER }}
          oidc-audience: ${{ vars.JFROG_OIDC_AUDIENCE }}
          enable-bash-trace-mode: ${{ env.ENABLE_BASH_TRACE_MODE }}

      - name: Build zone with an A record per node
        id: zone
        env:
          CONTAINER_NAMES: ${{ steps.aerospike.outputs.container-names }}
          NETWORK_NAME: ${{ steps.aerospike.outputs.network-name }}
        run: |
          {
            echo "zone-content<<EOF"
            echo '$ORIGIN aerospike.test.'
            echo "@ 3600 IN SOA ns.aerospike.test. admin.aerospike.test. 1 60 60 60 1"
            IFS=',' read -ra names <<<"$CONTAINER_NAMES"
            for name in "${names[@]}"; do
              ip=$(docker inspect -f "{{(index .NetworkSettings.Networks \"$NETWORK_NAME\").IPAddress}}" "$name")
              echo "$name 1 IN A $ip"
              echo "seeds 1 IN A $ip"
            done
            echo "EOF"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Setup DNS server
        id: dns
        uses: ./.github/actions/setup-dns-server
        with:
          network-name: ${{ steps.aerospike.outputs.network-name }}
          zone-name: aerospike.test
          zone-content: ${{ steps.zone.outputs.zone-content }}
          enable-bash-trace-mode: ${{ env.ENABLE_BASH_TRACE_MODE }}

      - name: Resolve each node's A record from a container on the Aerospike network
        env:
          CONTAINER_NAMES: ${{ steps.aerospike.outputs.container-names }}
          NETWORK_NAME: ${{ steps.aerospike.outputs.network-name }}
          SERVER_ADDRESS: ${{ steps.dns.outputs.server-address }}
        run: |
          IFS=',' read -ra names <<<"$CONTAINER_NAMES"
          [[ ${#names[@]} -eq 3 ]] || { echo "Expected 3 nodes, got: $CONTAINER_NAMES"; exit 1; }
          for name in "${names[@]}"; do
            expected=$(docker inspect -f "{{(index .NetworkSettings.Networks \"$NETWORK_NAME\").IPAddress}}" "$name")
            actual=$(docker run --rm --network "$NETWORK_NAME" "$PROBE_IMAGE" \
              nslookup -type=a "$name.aerospike.test" "$SERVER_ADDRESS" \
              | awk 'NF == 0 { body = 1 } body && /^Address/ { print $2 }')
            echo "a $name.aerospike.test -> $actual (container IP $expected)"
            [[ "$actual" == "$expected" ]] || { echo "Expected $expected"; exit 1; }
          done
