name: Create Release Bundle

on:
  workflow_call:
    inputs:
      # Required inputs
      jf-build-names:
        description: |
          Comma-separated list of build name:version pairs to include in the release bundle.
          Format: "build-name1:version1,build-name2:version2"
          Example: "database-build:v1.2.3,app-build:v2.1.0"
        required: true
        type: string
      jf-bundle-name:
        description: Name for the release bundle
        required: true
        type: string
      jf-project:
        description: JFrog Artifactory project name
        required: true
        type: string
      version:
        description: Version of the release bundle
        required: true
        type: string
      gh-workflows-ref:
        description: |
          Git reference for shared-workflows checkout. Should match the version in your 'uses:' line.
          GitHub Actions doesn't expose the called workflow's ref, so this is required.
          See: .github/workflows/docs/why-gh-workflows-ref.md
        required: true
        type: string

      # Optional inputs
      dry-run:
        description: Whether to run in dry-run mode
        required: false
        type: boolean
        default: false
      bundle-metadata-path:
        description: |
          Optional path to `.maven-bundle-metadata.json` (e.g. from detect-artifacts `bundle-metadata-path`).
          When set and the file exists, entries are applied as release bundle properties via `jf release-bundle-annotate`.
        required: false
        type: string
        default: ""
      gh-bundle-metadata-artifact-name:
        description: |
          When set, downloads this GitHub Actions artifact (e.g. deploy job output `bundle-metadata-artifact-name`)
          and uses the contained `.maven-bundle-metadata.json` for `jf release-bundle-annotate`. Takes precedence
          over `bundle-metadata-path` when both are set.
        required: false
        type: string
        default: ""
      gh-checkout-path:
        description: Directory to checkout the shared-workflows repository into
        required: false
        type: string
        default: shared-workflows
      jf-url:
        required: false
        description: JFrog Artifactory URL
        type: string
        default: https://artifact.aerospike.io
      oidc-audience:
        required: false
        description: OIDC audience
        type: string
        default: aerospike
      oidc-provider-name:
        required: false
        description: OIDC provider name
        type: string
        default: gh-aerospike
      runs-on:
        description: The runner to use for the build
        required: false
        type: string
        default: ubuntu-22.04

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  create-release-bundle:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout shared-workflows repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: aerospike/shared-workflows
          ref: ${{ inputs.gh-workflows-ref }}
          path: ${{ inputs.gh-checkout-path }}
          fetch-depth: 1

      - name: Setup JFrog CLI
        uses: step-security/setup-jfrog-cli@3054b554c0fb4915b3d58847fb7730c593dbb934 # v5.0.0
        env:
          JF_URL: ${{ inputs.jf-url }}
          JF_PROJECT: ${{ inputs.jf-project }}
        with:
          oidc-provider-name: ${{ inputs.oidc-provider-name }}
          oidc-audience: ${{ inputs.oidc-audience }}

      - name: Check JFrog Configuration
        run: |
          jf c show
          jf rt ping

      - name: Download Maven bundle metadata artifact
        if: inputs.gh-bundle-metadata-artifact-name != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.gh-bundle-metadata-artifact-name }}
          path: .bundle-metadata-dl

      - name: Resolve bundle metadata path
        id: bundle-meta
        shell: bash
        run: |
          set -euo pipefail
          meta=""
          if [[ -n "${{ inputs.gh-bundle-metadata-artifact-name }}" ]]; then
            if [[ ! -d .bundle-metadata-dl ]]; then
              echo "Error: expected .bundle-metadata-dl after downloading artifact '${{ inputs.gh-bundle-metadata-artifact-name }}'" >&2
              exit 1
            fi
            meta="$(find .bundle-metadata-dl -name '.maven-bundle-metadata.json' -type f | head -n1 || true)"
            if [[ -z "$meta" ]]; then
              echo "Error: .maven-bundle-metadata.json not found under .bundle-metadata-dl" >&2
              exit 1
            fi
          elif [[ -n "${{ inputs.bundle-metadata-path }}" ]]; then
            meta="${{ inputs.bundle-metadata-path }}"
          fi
          if [[ -n "$meta" && -f "$meta" ]]; then
            echo "path=$meta" >>"$GITHUB_OUTPUT"
            echo "Resolved bundle metadata: $meta" >&2
          fi

      - name: Create Release Bundle
        shell: bash
        run: |
          entrypoint="${{ inputs.gh-checkout-path }}/.github/workflows/create-release-bundle/entrypoint.sh"
          if [[ ! -f "$entrypoint" ]]; then
            echo "Error: entrypoint not found at $entrypoint" >&2
            exit 1
          fi
          chmod +x "$entrypoint"
          dry_run_arg=""
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            dry_run_arg="--dry-run"
          fi
          meta_arg=()
          bm="${{ steps.bundle-meta.outputs.path }}"
          if [[ -n "$bm" ]]; then
            meta_arg=(--bundle-metadata "$bm")
          fi
          "$entrypoint" \
            --project "${{ inputs.jf-project }}" \
            --build-names "${{ inputs.jf-build-names }}" \
            --bundle-name "${{ inputs.jf-bundle-name }}" \
            --version "${{ inputs.version }}" \
            "${meta_arg[@]}" \
            $dry_run_arg
