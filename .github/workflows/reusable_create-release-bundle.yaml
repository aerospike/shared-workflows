name: Create Release Bundle

on:
  workflow_call:
    inputs:
      # Required inputs
      jf-build-names:
        description: |
          Comma-separated list of build name:version pairs to include in the release bundle.
          Format: "build-name1:version1,build-name2:version2"
          Example: "database-build:v1.2.3,app-build:v2.1.0"
        required: true
        type: string
      jf-bundle-name:
        description: Name for the release bundle
        required: true
        type: string
      jf-project:
        description: JFrog Artifactory project name
        required: true
        type: string
      version:
        description: Version of the release bundle
        required: true
        type: string

      # Optional inputs
      dry-run:
        description: Whether to run in dry-run mode
        required: false
        type: boolean
        default: false
      gh-checkout-path:
        description: Directory to checkout the shared-workflows repository into
        required: false
        type: string
        default: shared-workflows
      gh-workflows-ref:
        description: Git reference to checkout shared-workflows repository (tag, branch, or SHA)
        required: false
        type: string
        default: v2.0.1
      jf-url:
        required: false
        description: JFrog Artifactory URL
        type: string
        default: https://artifact.aerospike.io
      oidc-audience:
        required: false
        description: OIDC audience
        type: string
        default: aerospike
      oidc-provider-name:
        required: false
        description: OIDC provider name
        type: string
        default: gh-aerospike
      runs-on:
        description: The runner to use for the build
        required: false
        type: string
        default: ubuntu-22.04

permissions:
  contents: read
  id-token: write

jobs:
  create-release-bundle:
    runs-on: ${{ inputs.runs-on }}
    env:
      CHECKOUT_REF: ${{ inputs.gh-workflows-ref }}
    steps:
      - name: Checkout shared-workflows repository
        uses: actions/checkout@v5
        with:
          repository: aerospike/shared-workflows
          ref: ${{ env.CHECKOUT_REF }}
          path: ${{ inputs.gh-checkout-path }}
          fetch-depth: 1

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@c32bf10843e4071112c4ea3abf622d3b27cd8c17 # v4.7.0
        env:
          JF_URL: ${{ inputs.jf-url }}
          JF_PROJECT: ${{ inputs.jf-project }}
        with:
          oidc-provider-name: ${{ inputs.oidc-provider-name }}
          oidc-audience: ${{ inputs.oidc-audience }}

      - name: Check JFrog Configuration
        run: |
          jf c show
          jf rt ping

      - name: Create Release Bundle
        shell: bash
        run: |
          chmod +x ${{ inputs.gh-checkout-path }}/.github/workflows/create-release-bundle/entrypoint.sh
          dry_run_arg=""
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            dry_run_arg="--dry-run"
          fi
          "${{ inputs.gh-checkout-path }}/.github/workflows/create-release-bundle/entrypoint.sh" \
            --project "${{ inputs.jf-project }}" \
            --build-names "${{ inputs.jf-build-names }}" \
            --bundle-name "${{ inputs.jf-bundle-name }}" \
            --version "${{ inputs.version }}" \
            $dry_run_arg
