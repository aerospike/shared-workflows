name: Create Release Bundle

on:
  workflow_call:
    inputs:
      project:
        description: JFrog Artifactory project name
        required: true
        type: string
      build-names:
        description: Comma-separated list of build names to include in the release bundle
        required: true
        type: string
      bundle-name:
        description: Name for the release bundle
        required: true
        type: string
      version:
        description: Version of the release bundle
        required: true
        type: string
      artifactory-url:
        required: false
        description: JFrog Artifactory URL
        type: string
        default: https://aerospike.jfrog.io
      artifactory-oidc-provider-name:
        required: false
        description: OIDC provider name
        type: string
        default: gh-aerospike
      artifactory-oidc-audience:
        required: false
        description: OIDC audience
        type: string
        default: aerospike
      dry-run:
        description: Whether to run in dry-run mode
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  create-release-bundle:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@2bc6e55719cd37dfb2f655a1e4f16c3440182a9f
        env:
          JF_URL: ${{ inputs.artifactory-url }}
          JF_PROJECT: ${{ inputs.project }}
        with:
          oidc-provider-name: ${{ inputs.artifactory-oidc-provider-name }}
          oidc-audience: ${{ inputs.artifactory-oidc-audience }}

      - name: Check JFrog Configuration
        run: |
          jf c show
          jf rt ping

      - name: Create Release Bundle
        shell: bash
        run: |
          chmod +x ${{ github.workspace }}/.github/workflows/create-release-bundle/entrypoint.sh
          dry_run_arg=""
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            dry_run_arg="--dry-run"
          fi
          "${{ github.workspace }}/.github/workflows/create-release-bundle/entrypoint.sh" \
            --project "${{ inputs.project }}" \
            --build-names "${{ inputs.build-names }}" \
            --bundle-name "${{ inputs.bundle-name }}" \
            --version "${{ inputs.version }}" \
            $dry_run_arg
