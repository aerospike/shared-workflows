name: GPG sign DEB
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
permissions: read-all
jobs:
  sign-deb:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: setup GPG
        uses: ./.github/actions/setup-gpg/
        with:
          gpg-private-key: ${{ secrets.GPG_SECRET_KEY }}
          gpg-public-key: ${{ secrets.GPG_PUBLIC_KEY }}
          gpg-key-pass: ${{ secrets.GPG_PASS }}
          gpg-key-name: aerospike-inc

      - name: Install deb-sigs
        run: |
          sudo apt-get update -y && sudo apt-get install deb-sigs -y

      # It is required to use ether rpm or gpg directly to cache the password.
      # This should be fixed in the future
      # You can instead use the --passphrase-file flag if you want

      - name: GPG sign deb # gpg sign and verify deb packages
        env:
          GPG_TTY: no-tty
        run: |
          deb-sigs --sign builder tests/*.deb
          deb-sigs --verify tests/*.deb
