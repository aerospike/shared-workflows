name: Example Expanded Integration
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version override (leave empty for auto-detection)
        required: false
        default: ""

permissions:
  id-token: write
  contents: read
  packages: write
  attestations: write

concurrency:
  group: jfrog-test-deploy
  cancel-in-progress: false

# Exhaustive integration exercise that builds, signs, deploys, and bundles
# artifacts across multiple ecosystems (C, .NET, npm, Java, Python) plus Docker.
# Also demonstrates consuming deployed artifacts from JFrog via apt and yum.
#
# For the recommended composable pipeline pattern, see example_composable-matrix.yaml.
# =============================================================================

jobs:
  # Manual dispatches should not take arguments.
  # here we use a file (VERSION.example) to set the test version that will be used.
  # In a real CI/CD pipeline you could trigger on version tag or commit also. Here we use the file so we can show the behaviour on demand.
  #
  # Because the version is fixed, re-running this example needs the previous bundle
  # gone first: it is immutable, and once promoted it locks its artifacts in
  # dev-local so the next deploy cannot overwrite them. Delete it by hand with
  # `jf release-bundle-delete-local test-release 1.2.9 --project=test`.
  #
  # WARNING: never do that in a real pipeline. A release bundle is the immutable
  # record of what shipped, and deleting one throws away its promotion history and
  # the guarantee that what was tested is what ships. Publish a new version instead.
  extract-version:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Extract Version
        id: extract
        uses: ./.github/actions/extract-version-from-tag
        with:
          version: ${{ inputs.version }}
          version-file: .github/workflows/VERSION.example
    outputs:
      version: ${{ steps.extract.outputs.version }}
      git_tag: ${{ steps.extract.outputs.git_tag }}
  # reusable_execute-build.yaml is a reusable workflow that enables building the project. This step
  # could be done another way, but the advantage of using the reusable workflow is that it allows
  # a single workflow that can be instrumented in the future.
  # This is also an example of using a matrix strategy to build in GHA
  build-packages:
    uses: ./.github/workflows/reusable_execute-build.yaml
    needs: extract-version
    # Matrix strategy: Multi-platform builds across Ubuntu/Debian/RPM families (x86_64 native, ARM64 emulated)
    strategy:
      matrix:
        include:
          # Ubuntu/Debian family (x86_64)
          - distro: jammy
            arch: x86_64
            runs-on: ubuntu-22.04
            emulated: false
          #   - distro: noble
          #     arch: x86_64
          #     runs-on: ubuntu-22.04
          #     emulated: false
          #   - distro: trixie
          #     arch: x86_64
          #     runs-on: ubuntu-22.04
          #     emulated: false
          #   - distro: focal
          #     arch: x86_64
          #     runs-on: ubuntu-22.04
          #     emulated: false
          #   - distro: bullseye
          #     arch: x86_64
          #     runs-on: ubuntu-22.04
          #     emulated: false
          #   - distro: bookworm
          #     arch: x86_64
          #     runs-on: ubuntu-22.04
          #     emulated: false
          #   # Ubuntu/Debian family (arm64) - emulated by default
          #   # set emulated to false to run on real arm64 runners but as of 8/14/2025, the queue times are too long
          #   - distro: jammy
          #     arch: arm64
          #     runs-on: ubuntu-22.04
          #     emulated: true
          #   - distro: noble
          #     arch: arm64
          #     runs-on: ubuntu-22.04
          #     emulated: true
          #   - distro: focal
          #     arch: arm64
          #     runs-on: ubuntu-22.04
          #     emulated: true
          #   - distro: bullseye
          #     arch: arm64
          #     runs-on: ubuntu-22.04
          #     emulated: true
          #   - distro: bookworm
          #     arch: arm64
          #     runs-on: ubuntu-22.04
          #     emulated: true
          #   # RPM family (x86_64 only - no ARM support)
          #   - distro: el8
          #     arch: x86_64
          #     runs-on: ubuntu-22.04
          #     emulated: false
          - distro: el9
            arch: x86_64
            runs-on: ubuntu-22.04
            emulated: false
        #   - distro: amzn2023
        #     arch: x86_64
        #     runs-on: ubuntu-22.04
        #     emulated: false
        # RPM family (arm64) - requires real ARM runners (commented out due to queue times)
        # - distro: el8
        #   arch: arm64
        #   runs-on: ubuntu-latest-arm64
        #   emulated: false
        # - distro: el9
        #   arch: arm64
        #   runs-on: ubuntu-latest-arm64
        #   emulated: false
        # - distro: amzn2023
        #   arch: arm64
        #   runs-on: ubuntu-latest-arm64
        #   emulated: false
    with:
      runs-on: ${{ matrix.runs-on }}
      gh-workflows-ref: ${{ github.sha }}
      jf-project: test
      jf-build-name: test-build
      jf-build-id: ${{ github.run_id }}-${{ github.run_attempt }}-buildinfo-${{ matrix.distro }}-${{ matrix.arch }}
      # gh-checkout-path defaults to 'shared-workflows'
      gh-source-path: repo-source
      working-directory: repo-source/.github/workflows/execute-build/test_apps/hi
      build-script: |
        echo "DISTRO: ${{ matrix.distro }}"
        echo "ARCH: ${{ matrix.arch }}"
        echo "EMULATED: ${{ matrix.emulated }}"
        echo "MAKEFILE: "
        cat Makefile
        which gcc
        pwd
        find .
        DISTRO=${{ matrix.distro }} \
        ARCH=${{ matrix.arch }} \
        EMULATED=${{ matrix.emulated }} \
        make docker-build
      gh-artifact-directory: build
      gh-artifact-name: build-artifacts-${{ matrix.distro }}-${{ matrix.arch }}
      gh-retention-days: 1 # default
      jf-url: https://artifact.aerospike.io # default
      oidc-provider-name: gh-dev-test
      oidc-audience: aerospike/testing
      publish-build-info: true
      dry-run: false # default
  build-dotnet-packages:
    needs: extract-version
    uses: ./.github/workflows/reusable_execute-build.yaml
    with:
      jf-project: test
      jf-build-name: test-build
      jf-build-id: ${{ github.run_id }}-${{ github.run_attempt }}-buildinfo-dotnet
      working-directory: repo-source/.github/workflows/execute-build/test_apps/DotnetHelloWorld/AerospikeHelloWorld
      build-script: |
        echo "Building dotnet project in $(pwd)"
        echo "cwd contents: $(ls -la)"
        dotnet restore
        dotnet build --configuration Release --no-restore
        echo "Creating NuGet package"
        dotnet pack --no-build
        echo "NuGet package created"
        find .
      gh-source-path: repo-source
      gh-artifact-directory: AerospikeHelloWorld/bin/Release/
      gh-artifact-name: build-artifacts-dotnet
      oidc-provider-name: gh-dev-test
      oidc-audience: aerospike/testing
      dry-run: false
      gh-workflows-ref: main
  build-npm-packages:
    needs: extract-version
    uses: ./.github/workflows/reusable_execute-build.yaml
    with:
      jf-project: test
      jf-build-name: test-build
      jf-build-id: ${{ github.run_id }}-${{ github.run_attempt }}-buildinfo-npm
      working-directory: repo-source/.github/workflows/execute-build/test_apps/NpmHelloWorld
      build-script: |
        echo "Building npm package in $(pwd)"
        npm pack
        mkdir -p output
        mv *.tgz output/
        echo "npm package created"
        ls -la output/
      gh-source-path: repo-source
      gh-artifact-directory: output
      gh-artifact-name: build-artifacts-npm
      oidc-provider-name: gh-dev-test
      oidc-audience: aerospike/testing
      dry-run: false
      gh-workflows-ref: ${{ github.sha }}
  build-java-packages:
    needs: extract-version
    uses: ./.github/workflows/reusable_execute-build.yaml
    with:
      jf-project: test
      jf-build-name: test-build
      jf-build-id: ${{ github.run_id }}-${{ github.run_attempt }}-buildinfo-java
      working-directory: repo-source/.github/workflows/execute-build/test_apps/JavaHelloWorld
      build-script: |
        echo "Building Java project in $(pwd)"
        mvn package -q
        mkdir -p output
        cp target/*.jar output/
        cp pom.xml output/hello-world-1.0.0.pom
        echo "Maven build complete"
        ls -la output/
      gh-source-path: repo-source
      gh-artifact-directory: output
      gh-artifact-name: build-artifacts-java
      oidc-provider-name: gh-dev-test
      oidc-audience: aerospike/testing
      setup-java: true
      java-version: "17"
      dry-run: false
      gh-workflows-ref: ${{ github.sha }}
  build-python-packages:
    needs: extract-version
    uses: ./.github/workflows/reusable_execute-build.yaml
    with:
      jf-project: test
      jf-build-name: test-build
      jf-build-id: ${{ github.run_id }}-${{ github.run_attempt }}-buildinfo-python
      working-directory: repo-source/.github/workflows/execute-build/test_apps/PythonHelloWorld
      build-script: |
        echo "Building Python package in $(pwd)"
        python -m build
        mkdir -p output
        mv dist/*.whl dist/*.tar.gz output/
        echo "Python build complete"
        ls -la output/
      gh-source-path: repo-source
      gh-artifact-directory: output
      gh-artifact-name: build-artifacts-python
      oidc-provider-name: gh-dev-test
      oidc-audience: aerospike/testing
      setup-python: true
      python-version: "3.12"
      dry-run: false
      gh-workflows-ref: ${{ github.sha }}
  # This job demonstrates custom packaging logic using standard GitHub Actions (actions/checkout, actions/download-artifact, actions/upload-artifact)
  # No reusable actions from shared-workflows are used here - this is custom packaging logic that could be done in the build step
  # In this case it is using fpm to generate debs and rpms and uploading them to be processed further.
  # building and packaging could be done in the build step if we wanted to package on the distro as the build
  # but here we do it separate. It takes the output from the matrix builds and uploads them to gitub in a single directory.
  package-built-artifacts:
    needs:
      [
        build-packages,
        build-dotnet-packages,
        build-npm-packages,
        build-java-packages,
        build-python-packages,
        extract-version,
      ]
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Download All Matrix Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: build-artifacts
          merge-multiple: true
      - name: Package Artifacts
        run: |
          .github/workflows/execute-build/test_apps/hi/package.sh --target hi --version ${{ needs.extract-version.outputs.version }} \
            --packages-dir build-artifacts --output-dir packaged-artifacts
      - name: Copy NuGet packages
        if: github.actor != 'dependabot[bot]'
        run: |
          cp -i build-artifacts/*.nupkg packaged-artifacts
      - name: Copy npm packages
        run: |
          cp -i build-artifacts/*.tgz packaged-artifacts
      - name: Copy Java artifacts
        run: |
          cp -i build-artifacts/*.jar packaged-artifacts
      - name: Copy Python packages
        run: |
          cp -i build-artifacts/*.whl packaged-artifacts 2>/dev/null || true
          cp -i build-artifacts/*.tar.gz packaged-artifacts 2>/dev/null || true
      - name: Upload packaged Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-artifacts
          path: packaged-artifacts
          overwrite: true
          retention-days: 1
  sign-artifacts:
    needs: package-built-artifacts
    uses: ./.github/workflows/reusable_sign-artifacts.yaml
    with:
      # gh-checkout-path defaults to 'shared-workflows'
      gh-workflows-ref: ${{ github.sha }}
      gh-retention-days: 1
      gh-artifact-name: packaged-artifacts
    secrets:
      gpg-private-key: ${{ secrets.GPG_SECRET_KEY }}
      gpg-public-key: ${{ secrets.GPG_PUBLIC_KEY }}
      gpg-key-pass: ${{ secrets.GPG_PASS }}
      es-username: ${{ secrets.ES_USERNAME }}
      es-password: ${{ secrets.ES_PASSWORD }}
      credential_id: ${{ secrets.CREDENTIAL_ID }}
      es-totp_secret: ${{ secrets.ES_TOTP_SECRET }}

  deploy-artifacts:
    needs: [sign-artifacts, extract-version]
    uses: ./.github/workflows/reusable_deploy-artifacts.yaml
    with:
      gh-workflows-ref: ${{ github.sha }}
      # gh-checkout-path defaults to 'shared-workflows'
      jf-project: test
      jf-build-name: test-build
      jf-metadata-build-id: ${{ github.run_id }}-${{ github.run_attempt }}-buildinfo
      jf-build-id: ${{ github.run_id }}-${{ github.run_attempt }}
      gh-artifact-name: ${{ needs.sign-artifacts.outputs.gh-artifact-name }}
      version: ${{ needs.extract-version.outputs.version }}
      gh-retention-days: 1
      oidc-provider-name: gh-dev-test
      oidc-audience: aerospike/testing
      dry-run: false
  build-docker-deploy:
    uses: ./.github/workflows/reusable_docker-build-deploy.yaml
    needs: [extract-version, package-built-artifacts] #don't really need package-built-artifacts but we need that to finish first.
    with:
      jf-project: test
      image-name: test-image
      app-name: Hello
      app-version: ${{ needs.extract-version.outputs.version }}
      context: ./.github/workflows/execute-build/test_apps/hi
      file: ./.github/workflows/execute-build/test_apps/hi/Dockerfile
      jf-build-name: test-build-container
      oidc-provider-name: gh-dev-test
      oidc-audience: aerospike/testing
  use-artifacts:
    needs: [build-docker-deploy, extract-version, deploy-artifacts]
    runs-on: ubuntu-22.04
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Install JFrog CLI
        id: jf
        uses: step-security/setup-jfrog-cli@53aeacb709fce45d0baf69a13ec3342f7e2d71a9 # v5.1.0
        env:
          JF_URL: https://artifact.aerospike.io
          JF_PROJECT: test
        with:
          oidc-provider-name: gh-dev-test
          oidc-audience: aerospike/testing
      - name: Docker login to Artifactory
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: artifact.aerospike.io/test-container-dev-local
          username: ${{ steps.jf.outputs.oidc-user }}
          password: ${{ steps.jf.outputs.oidc-token }}
      - name: execute-docker-build
        run: |
          docker run --rm --platform linux/amd64 artifact.aerospike.io/test-container-dev-local/test-image:${{ needs.extract-version.outputs.version }}
      - name: Install packages
        run: |
          set -euo pipefail
          wget -qO - https://artifact.aerospike.io/artifactory/api/security/keypair/aerospike/public \
          | sudo gpg --dearmor -o /usr/share/keyrings/aerospike.gpg

          export DEBIAN_FRONTEND=noninteractive
          CODENAME=$(lsb_release -sc)             # e.g. bookworm, jammy, noble
          ARCH=$(dpkg --print-architecture)       # e.g. amd64, arm64
          KEYRING=/usr/share/keyrings/aerospike.gpg
          REPO="artifact.aerospike.io/artifactory/test-deb-dev-local"

          sudo install -m 600 /dev/null /etc/apt/auth.conf.d/aerospike.conf
          {
            echo "machine artifact.aerospike.io"
            echo "login ${{ steps.jf.outputs.oidc-user }}"
            echo "password ${{ steps.jf.outputs.oidc-token }}"
          } | sudo tee /etc/apt/auth.conf.d/aerospike.conf >/dev/null

          cat <<EOF | sudo tee /etc/apt/sources.list.d/aerospike.list
          deb [arch=$ARCH signed-by=$KEYRING] https://$REPO $CODENAME main
          EOF

          sudo apt-get update && sudo apt-get install hi -y
          echo "the test binary says:"
          hi
  use-rpm-artifacts:
    runs-on: ubuntu-22.04
    if: github.actor != 'dependabot[bot]'
    container:
      image: rockylinux:9
    needs: [extract-version, deploy-artifacts]
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Install JFrog CLI
        id: jf
        uses: step-security/setup-jfrog-cli@53aeacb709fce45d0baf69a13ec3342f7e2d71a9 # v5.1.0
        env:
          JF_URL: https://artifact.aerospike.io
          JF_PROJECT: test
        with:
          oidc-provider-name: gh-dev-test
          oidc-audience: aerospike/testing
      - name: Set up RPM repository
        run: | # Detect OS distro and version
          JF_USERNAME=${{ steps.jf.outputs.oidc-user }}
          JF_TOKEN=${{ steps.jf.outputs.oidc-token }}
          if [ -f /etc/os-release ]; then
              . /etc/os-release
              case "$ID" in
                  rhel|centos|almalinux|rocky)
                      DIST="el${VERSION_ID%%.*}"
                      ;;
                  amzn)
                      if [[ "$VERSION_ID" == "2023" ]]; then
                          DIST="amzn2023"
                      else
                          echo "Unsupported Amazon Linux version: $VERSION_ID"
                          exit 1
                      fi
                      ;;
                  *)
                      echo "Unsupported distro: $ID"
                      exit 1
                      ;;
              esac
          else
              echo "Cannot determine OS version"
              exit 1
          fi

          ARCH=$(uname -m)   # e.g., x86_64, aarch64

          REPO_FILE="/etc/yum.repos.d/aerospike-${DIST,,}-all.repo"

          # Write .repo content
          tee "$REPO_FILE" > /dev/null <<EOF
          [aerospike-${DIST,,}-test]
          name=Aerospike RPM Repo DEV for ${DIST^^} (\$basearch)
          baseurl=https://artifact.aerospike.io/artifactory/test-rpm-dev-local/${DIST,,}/$ARCH/
          username=${JF_USERNAME}
          password=${JF_TOKEN}
          enabled=1
          gpgcheck=1
          gpgkey=https://artifact.aerospike.io/artifactory/api/security/keypair/aerospike/public
          EOF
          echo "--------------------------------"
          cat "$REPO_FILE"
          echo "--------------------------------"
          echo "Aerospike .repo file written to $REPO_FILE"
      - name: Install RPMs
        run: |
          yum install hi -y
          echo "the test binary says:"
          hi
  create-release-bundle:
    needs: [use-artifacts, use-rpm-artifacts, extract-version, deploy-artifacts]
    uses: ./.github/workflows/reusable_create-release-bundle.yaml
    if: github.event_name == 'workflow_dispatch'
    with:
      gh-workflows-ref: ${{ github.sha }}
      # gh-checkout-path defaults to 'shared-workflows'
      jf-project: test
      jf-build-names: test-build:${{ github.run_id }}-${{ github.run_attempt }}
      jf-bundle-name: test-release
      version: ${{ needs.extract-version.outputs.version }}
      oidc-provider-name: gh-dev-test
      oidc-audience: aerospike/testing
      dry-run: false
      gh-bundle-metadata-artifact-name: ${{ needs.deploy-artifacts.outputs.bundle-metadata-available == 'true' && needs.deploy-artifacts.outputs.bundle-metadata-artifact-name || '' }}

  # Report what the bundle can prove: digests, the bundle seal, promotion history,
  # SLSA provenance, and the authorizing pull request. Reads signed records only.
  release-evidence:
    needs: [create-release-bundle, extract-version]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout shared-workflows (actions)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
      - name: Setup JFrog CLI
        uses: step-security/setup-jfrog-cli@53aeacb709fce45d0baf69a13ec3342f7e2d71a9 # v5.1.0
        env:
          JF_URL: https://artifact.aerospike.io
          JF_PROJECT: test
        with:
          oidc-provider-name: gh-dev-test
          oidc-audience: aerospike/testing
      - name: Record release evidence
        uses: ./.github/actions/release-evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          target: bundle:test-release/${{ needs.extract-version.outputs.version }}@test
          about: the multi-ecosystem release published by this example
          output-path: release-evidence.md
          jf-url: https://artifact.aerospike.io
      - name: Publish evidence to the run summary
        run: cat release-evidence.md >>"$GITHUB_STEP_SUMMARY"
      - name: Upload evidence document
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence
          path: release-evidence.md
