name: Test Setup Aerospike Server Action
on:
  workflow_dispatch:
    inputs:
      # checkov:skip=CKV_GHA_7:workflow_dispatch input used for debugging failing test cases in this repo
      enable-bash-trace-mode:
        type: boolean
        required: false
        default: false
  pull_request:
    branches: [main]
    paths:
      - .github/actions/setup-aerospike-server/**
      - .github/workflows/test_setup-aerospike-server.yaml

permissions:
  contents: read
  id-token: write

env:
  ENABLE_BASH_TRACE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.enable-bash-trace-mode || 'false' }}

jobs:
  test-config-helpers:
    name: Config helper unit tests
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install bats
        run: |
          git init bats-core
          cd bats-core
          git remote add origin https://github.com/bats-core/bats-core.git
          git fetch --depth 1 origin cf931b7b7c79998ded0f364126dbc9d46739a76f # v1.12.0
          git checkout --detach FETCH_HEAD
          sudo ./install.sh /usr/local
          cd ..
          rm -rf bats-core

      - name: Run bats tests
        run: bats .github/actions/setup-aerospike-server/tests/

  test-single-node:
    name: Single node (defaults)
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Aerospike Server
        id: setup-aerospike-server
        uses: ./.github/actions/setup-aerospike-server
        with:
          oidc-provider: ${{ vars.JFROG_OIDC_PROVIDER }}
          oidc-audience: ${{ vars.JFROG_OIDC_AUDIENCE }}
          enable-bash-trace-mode: ${{ env.ENABLE_BASH_TRACE_MODE }}

      - name: Verify outputs
        run: |
          echo "container-names: ${{ steps.setup-aerospike-server.outputs.container-names }}"
          echo "service-ports: ${{ steps.setup-aerospike-server.outputs.service-ports }}"
          echo "network-name: ${{ steps.setup-aerospike-server.outputs.network-name }}"

          [[ "${{ steps.setup-aerospike-server.outputs.container-names }}" == "aerospike-1" ]] \
            || { echo "Unexpected container-names"; exit 1; }
          [[ "${{ steps.setup-aerospike-server.outputs.service-ports }}" == "3000" ]] \
            || { echo "Unexpected service-ports"; exit 1; }
          [[ "${{ steps.setup-aerospike-server.outputs.network-name }}" == "aerospike-net" ]] \
            || { echo "Unexpected network-name"; exit 1; }

      - name: Verify container is running
        run: |
          docker ps --filter "name=aerospike-1" --format '{{.Names}}' | grep -q aerospike-1
          docker network inspect aerospike-net | grep -q aerospike-1

      - name: Verify server status via asinfo
        run: |
          tools_image="aerospike.jfrog.io/database-docker-virtual/aerospike-tools:12.1.1_2"
          network="${{ steps.setup-aerospike-server.outputs.network-name }}"
          echo "Running: docker run --rm --network $network $tools_image asinfo -h aerospike-1 -p 3000 -v status"
          rc=0
          result=$(docker run --rm --network "$network" "$tools_image" \
            asinfo -h aerospike-1 -p 3000 -v status 2>&1) || rc=$?
          echo "Exit code: $rc"
          echo "asinfo status: $result"
          [[ $rc -eq 0 && "$result" == *"ok"* ]] || { echo "Expected status=ok"; exit 1; }

  test-unpublished-ports:
    name: Unpublished host ports
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Aerospike Server without host port publishing
        id: setup-aerospike-server
        uses: ./.github/actions/setup-aerospike-server
        with:
          publish-ports: "false"
          oidc-provider: ${{ vars.JFROG_OIDC_PROVIDER }}
          oidc-audience: ${{ vars.JFROG_OIDC_AUDIENCE }}
          enable-bash-trace-mode: ${{ env.ENABLE_BASH_TRACE_MODE }}

      - name: Verify host ports were not published
        run: |
          bindings=$(docker inspect aerospike-1 --format '{{json .HostConfig.PortBindings}}')
          echo "PortBindings: $bindings"
          [[ "$bindings" == "{}" || "$bindings" == "null" ]] \
            || { echo "Expected no host port bindings"; exit 1; }

      - name: Verify server is reachable on the Docker network
        run: |
          tools_image="aerospike.jfrog.io/database-docker-virtual/aerospike-tools:12.1.1_2"
          network="${{ steps.setup-aerospike-server.outputs.network-name }}"
          rc=0
          result=$(docker run --rm --network "$network" "$tools_image" \
            asinfo -h aerospike-1 -p 3000 -v status 2>&1) || rc=$?
          echo "Exit code: $rc"
          echo "asinfo status: $result"
          [[ $rc -eq 0 && "$result" == *"ok"* ]] || { echo "Expected status=ok"; exit 1; }

  test-multi-node:
    name: Multi-node cluster (3 nodes)
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Aerospike Server (3 nodes)
        id: setup-aerospike-server
        uses: ./.github/actions/setup-aerospike-server
        with:
          num-nodes: "3"
          startup-timeout: "60"
          features-content: ${{ secrets.AES_FEATURES_CONF }}
          oidc-provider: ${{ vars.JFROG_OIDC_PROVIDER }}
          oidc-audience: ${{ vars.JFROG_OIDC_AUDIENCE }}
          enable-bash-trace-mode: ${{ env.ENABLE_BASH_TRACE_MODE }}

      - name: Verify outputs
        run: |
          echo "container-names: ${{ steps.setup-aerospike-server.outputs.container-names }}"
          echo "service-ports: ${{ steps.setup-aerospike-server.outputs.service-ports }}"

          [[ "${{ steps.setup-aerospike-server.outputs.container-names }}" == "aerospike-1,aerospike-2,aerospike-3" ]] \
            || { echo "Unexpected container-names"; exit 1; }
          [[ "${{ steps.setup-aerospike-server.outputs.service-ports }}" == "3000,3001,3002" ]] \
            || { echo "Unexpected service-ports"; exit 1; }

      - name: Verify all containers are running
        run: |
          for i in 1 2 3; do
            docker ps --filter "name=aerospike-${i}" --format '{{.Names}}' | grep -q "aerospike-${i}"
          done

      - name: Verify cluster formation via asinfo
        run: |
          tools_image="aerospike.jfrog.io/database-docker-virtual/aerospike-tools:12.1.1_2"
          network="${{ steps.setup-aerospike-server.outputs.network-name }}"
          for container in aerospike-1 aerospike-2 aerospike-3; do
            echo "Checking cluster_size on $container..."
            rc=0
            stats=$(docker run --rm --network "$network" "$tools_image" \
              asinfo -h "$container" -p 3000 -v "statistics" 2>&1) || rc=$?
            cluster_size=$(echo "$stats" | tr ';' '\n' | grep -oP 'cluster_size=\K\d+' || echo "N/A")
            echo "$container cluster_size: $cluster_size (exit code: $rc)"
            [[ $rc -eq 0 && "$cluster_size" == "3" ]] \
              || { echo "Expected cluster_size=3 on $container, got $cluster_size"; exit 1; }
          done

  test-features-content:
    name: Features from content input
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Aerospike Server with features-content
        id: setup-aerospike-server
        uses: ./.github/actions/setup-aerospike-server
        with:
          features-content: ${{ secrets.AES_FEATURES_CONF }}
          oidc-provider: ${{ vars.JFROG_OIDC_PROVIDER }}
          oidc-audience: ${{ vars.JFROG_OIDC_AUDIENCE }}
          enable-bash-trace-mode: ${{ env.ENABLE_BASH_TRACE_MODE }}

      - name: Verify server status via asinfo
        run: |
          tools_image="aerospike.jfrog.io/database-docker-virtual/aerospike-tools:12.1.1_2"
          network="${{ steps.setup-aerospike-server.outputs.network-name }}"
          echo "Running: docker run --rm --network $network $tools_image asinfo -h aerospike-1 -p 3000 -v status"
          rc=0
          result=$(docker run --rm --network "$network" "$tools_image" \
            asinfo -h aerospike-1 -p 3000 -v status 2>&1) || rc=$?
          echo "Exit code: $rc"
          echo "asinfo status: $result"
          [[ $rc -eq 0 && "$result" == *"ok"* ]] || { echo "Expected status=ok"; exit 1; }

  test-community-multi-node:
    name: Community multi-node cluster (2 nodes)
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Aerospike Server Community (2 nodes)
        id: setup-aerospike-server
        uses: ./.github/actions/setup-aerospike-server
        with:
          server-container-repo: database-docker-virtual/aerospike-server
          num-nodes: "2"
          features-content: |
            feature-key-version 2
          startup-timeout: "60"
          oidc-provider: ${{ vars.JFROG_OIDC_PROVIDER }}
          oidc-audience: ${{ vars.JFROG_OIDC_AUDIENCE }}
          enable-bash-trace-mode: ${{ env.ENABLE_BASH_TRACE_MODE }}

      - name: Verify outputs
        run: |
          echo "container-names: ${{ steps.setup-aerospike-server.outputs.container-names }}"
          echo "service-ports: ${{ steps.setup-aerospike-server.outputs.service-ports }}"

          [[ "${{ steps.setup-aerospike-server.outputs.container-names }}" == "aerospike-1,aerospike-2" ]] \
            || { echo "Unexpected container-names"; exit 1; }
          [[ "${{ steps.setup-aerospike-server.outputs.service-ports }}" == "3000,3001" ]] \
            || { echo "Unexpected service-ports"; exit 1; }

      - name: Verify features file was not mounted
        run: |
          mounts=$(docker inspect aerospike-1 --format '{{range .Mounts}}{{println .Destination}}{{end}}')
          echo "$mounts"
          if grep -q "/etc/aerospike/features.conf" <<< "$mounts"; then
            echo "Community container should not mount features.conf"
            exit 1
          fi

      - name: Verify cluster formation via asinfo
        run: |
          tools_image="aerospike.jfrog.io/database-docker-virtual/aerospike-tools:12.1.1_2"
          network="${{ steps.setup-aerospike-server.outputs.network-name }}"
          for container in aerospike-1 aerospike-2; do
            echo "Checking cluster_size on $container..."
            rc=0
            stats=$(docker run --rm --network "$network" "$tools_image" \
              asinfo -h "$container" -p 3000 -v "statistics" 2>&1) || rc=$?
            cluster_size=$(echo "$stats" | tr ';' '\n' | grep -oP 'cluster_size=\K\d+' || echo "N/A")
            echo "$container cluster_size: $cluster_size (exit code: $rc)"
            [[ $rc -eq 0 && "$cluster_size" == "2" ]] \
              || { echo "Expected cluster_size=2 on $container, got $cluster_size"; exit 1; }
          done

  test-env-vars:
    name: Custom env-vars passthrough
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Aerospike Server with env-vars
        id: setup-aerospike-server
        uses: ./.github/actions/setup-aerospike-server
        with:
          env-vars: NAMESPACE=test;SERVICE_THREADS=4
          oidc-provider: ${{ vars.JFROG_OIDC_PROVIDER }}
          oidc-audience: ${{ vars.JFROG_OIDC_AUDIENCE }}
          enable-bash-trace-mode: ${{ env.ENABLE_BASH_TRACE_MODE }}

      - name: Verify env vars in container
        run: |
          ns=$(docker exec aerospike-1 printenv NAMESPACE)
          threads=$(docker exec aerospike-1 printenv SERVICE_THREADS)
          echo "NAMESPACE=$ns SERVICE_THREADS=$threads"
          [[ "$ns" == "test" ]] || { echo "Expected NAMESPACE=test"; exit 1; }
          [[ "$threads" == "4" ]] || { echo "Expected SERVICE_THREADS=4"; exit 1; }

  test-tls:
    name: Single node with TLS
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Aerospike Server with TLS
        id: setup-aerospike-server
        uses: ./.github/actions/setup-aerospike-server
        with:
          enable-tls: "true"
          oidc-provider: ${{ vars.JFROG_OIDC_PROVIDER }}
          oidc-audience: ${{ vars.JFROG_OIDC_AUDIENCE }}
          enable-bash-trace-mode: ${{ env.ENABLE_BASH_TRACE_MODE }}

      - name: Verify TLS outputs
        run: |
          echo "tls-service-ports: ${{ steps.setup-aerospike-server.outputs.tls-service-ports }}"
          echo "tls-cert-dir: ${{ steps.setup-aerospike-server.outputs.tls-cert-dir }}"

          [[ "${{ steps.setup-aerospike-server.outputs.tls-service-ports }}" == "4333" ]] \
            || { echo "Unexpected tls-service-ports"; exit 1; }
          [[ -n "${{ steps.setup-aerospike-server.outputs.tls-cert-dir }}" ]] \
            || { echo "tls-cert-dir is empty"; exit 1; }

      - name: Verify cert files exist
        run: |
          cert_dir="${{ steps.setup-aerospike-server.outputs.tls-cert-dir }}"
          for f in ca.crt ca.key server.crt server.key client.crt client.key; do
            [[ -f "$cert_dir/$f" ]] || { echo "Missing cert file: $f"; exit 1; }
          done
          san=$(openssl x509 -in "$cert_dir/server.crt" -noout -ext subjectAltName)
          echo "$san"
          echo "$san" | grep -Eq '(^|[[:space:],])DNS:aerospike-tls(,|$)' \
            || { echo "server.crt SAN is missing aerospike-tls"; exit 1; }
          subject=$(openssl x509 -in "$cert_dir/server.crt" -noout -subject -nameopt RFC2253)
          subject=${subject#subject=}
          [[ "$subject" == "CN=aerospike-tls" ]] \
            || { echo "Unexpected server cert CN: $subject"; exit 1; }
          openssl x509 -in "$cert_dir/client.crt" -noout -text \
            | grep -q 'Version: 3' \
            || { echo "client.crt is not an X.509 v3 certificate"; exit 1; }
          echo "All expected cert files present"

      - name: Verify non-TLS port still works
        run: |
          tools_image="aerospike.jfrog.io/database-docker-virtual/aerospike-tools:12.1.1_2"
          network="${{ steps.setup-aerospike-server.outputs.network-name }}"
          echo "Running: docker run --rm --network $network $tools_image asinfo -h aerospike-1 -p 3000 -v status"
          rc=0
          result=$(docker run --rm --network "$network" "$tools_image" \
            asinfo -h aerospike-1 -p 3000 -v status 2>&1) || rc=$?
          echo "Exit code: $rc"
          echo "asinfo status (non-TLS): $result"
          [[ $rc -eq 0 && "$result" == *"ok"* ]] || { echo "Service port 3000 is not responding"; exit 1; }

      - name: Verify TLS connection
        run: |
          cert_dir="${{ steps.setup-aerospike-server.outputs.tls-cert-dir }}"
          echo | openssl s_client -connect 127.0.0.1:4333 -CAfile "$cert_dir/ca.crt" 2>&1 | grep -q "Verify return code: 0"
          echo "TLS connection verified"

  test-security:
    name: Single node with security
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Aerospike Server with security
        id: setup-aerospike-server
        uses: ./.github/actions/setup-aerospike-server
        with:
          enable-security: "true"
          features-content: ${{ secrets.AES_FEATURES_CONF }}
          oidc-provider: ${{ vars.JFROG_OIDC_PROVIDER }}
          oidc-audience: ${{ vars.JFROG_OIDC_AUDIENCE }}
          enable-bash-trace-mode: ${{ env.ENABLE_BASH_TRACE_MODE }}

      - name: Verify admin auth works
        run: |
          tools_image="aerospike.jfrog.io/database-docker-virtual/aerospike-tools:12.1.1_2"
          network="${{ steps.setup-aerospike-server.outputs.network-name }}"
          echo "Running: docker run --rm --network $network $tools_image asinfo -h aerospike-1 -p 3000 -U admin -P admin -v status"
          rc=0
          result=$(docker run --rm --network "$network" "$tools_image" \
            asinfo -h aerospike-1 -p 3000 -U admin -P admin -v status 2>&1) || rc=$?
          echo "Exit code: $rc"
          echo "asinfo status: $result"
          [[ $rc -eq 0 && "$result" == *"ok"* ]] || { echo "Expected status=ok"; exit 1; }

      - name: Verify unauthenticated access is rejected
        run: |
          tools_image="aerospike.jfrog.io/database-docker-virtual/aerospike-tools:12.1.1_2"
          network="${{ steps.setup-aerospike-server.outputs.network-name }}"
          echo "Running: docker run --rm --network $network $tools_image asinfo -h aerospike-1 -p 3000 -v status (no auth)"
          rc=0
          result=$(docker run --rm --network "$network" "$tools_image" \
            asinfo -h aerospike-1 -p 3000 -v status 2>&1) || rc=$?
          echo "Exit code: $rc"
          echo "Unauthenticated result: $result"
          [[ "$result" == *"ERROR"* || "$result" == *"not authenticated"* || "$result" == *"error"* ]] \
            || { echo "Expected unauthenticated access to be rejected"; exit 1; }

  test-strong-consistency:
    name: Single node with strong consistency
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Aerospike Server with strong consistency
        id: setup-aerospike-server
        uses: ./.github/actions/setup-aerospike-server
        with:
          enable-strong-consistency: "true"
          features-content: ${{ secrets.AES_FEATURES_CONF }}
          startup-timeout: "60"
          oidc-provider: ${{ vars.JFROG_OIDC_PROVIDER }}
          oidc-audience: ${{ vars.JFROG_OIDC_AUDIENCE }}
          enable-bash-trace-mode: ${{ env.ENABLE_BASH_TRACE_MODE }}

      - name: Verify SC namespace
        run: |
          tools_image="aerospike.jfrog.io/database-docker-virtual/aerospike-tools:12.1.1_2"
          network="${{ steps.setup-aerospike-server.outputs.network-name }}"
          echo "Running: docker run --rm --network $network $tools_image asinfo -h aerospike-1 -p 3000 -v namespace/test"
          rc=0
          result=$(docker run --rm --network "$network" "$tools_image" \
            asinfo -h aerospike-1 -p 3000 -v "namespace/test" 2>&1) || rc=$?
          echo "Exit code: $rc"
          echo "Namespace info: $result"
          [[ $rc -eq 0 && "$result" == *"strong-consistency=true"* ]] \
            || { echo "Expected strong-consistency=true in namespace info"; exit 1; }

  test-strong-consistency-with-security:
    name: Single node with strong consistency and security
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Aerospike Server with strong consistency and security
        id: setup-aerospike-server
        uses: ./.github/actions/setup-aerospike-server
        with:
          enable-strong-consistency: "true"
          enable-security: "true"
          features-content: ${{ secrets.AES_FEATURES_CONF }}
          startup-timeout: "60"
          oidc-provider: ${{ vars.JFROG_OIDC_PROVIDER }}
          oidc-audience: ${{ vars.JFROG_OIDC_AUDIENCE }}
          enable-bash-trace-mode: ${{ env.ENABLE_BASH_TRACE_MODE }}

      - name: Verify SC namespace with auth
        run: |
          tools_image="aerospike.jfrog.io/database-docker-virtual/aerospike-tools:12.1.1_2"
          network="${{ steps.setup-aerospike-server.outputs.network-name }}"
          echo "Running: docker run --rm --network $network $tools_image asinfo -h aerospike-1 -p 3000 -U admin -P admin -v namespace/test"
          rc=0
          result=$(docker run --rm --network "$network" "$tools_image" \
            asinfo -h aerospike-1 -p 3000 -U admin -P admin -v "namespace/test" 2>&1) || rc=$?
          echo "Exit code: $rc"
          echo "Namespace info: $result"
          [[ $rc -eq 0 && "$result" == *"strong-consistency=true"* ]] \
            || { echo "Expected strong-consistency=true in namespace info"; exit 1; }

      - name: Verify unauthenticated access is rejected
        run: |
          tools_image="aerospike.jfrog.io/database-docker-virtual/aerospike-tools:12.1.1_2"
          network="${{ steps.setup-aerospike-server.outputs.network-name }}"
          echo "Running: docker run --rm --network $network $tools_image asinfo -h aerospike-1 -p 3000 -v status (no auth)"
          rc=0
          result=$(docker run --rm --network "$network" "$tools_image" \
            asinfo -h aerospike-1 -p 3000 -v status 2>&1) || rc=$?
          echo "Exit code: $rc"
          echo "Unauthenticated result: $result"
          [[ "$result" == *"ERROR"* || "$result" == *"not authenticated"* || "$result" == *"error"* ]] \
            || { echo "Expected unauthenticated access to be rejected"; exit 1; }

  test-tls-with-security:
    name: Single node with TLS and security
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Aerospike Server with TLS and security
        id: setup-aerospike-server
        uses: ./.github/actions/setup-aerospike-server
        with:
          enable-tls: "true"
          enable-security: "true"
          features-content: ${{ secrets.AES_FEATURES_CONF }}
          startup-timeout: "60"
          oidc-provider: ${{ vars.JFROG_OIDC_PROVIDER }}
          oidc-audience: ${{ vars.JFROG_OIDC_AUDIENCE }}
          enable-bash-trace-mode: ${{ env.ENABLE_BASH_TRACE_MODE }}

      - name: Verify TLS outputs
        run: |
          echo "tls-service-ports: ${{ steps.setup-aerospike-server.outputs.tls-service-ports }}"
          echo "tls-cert-dir: ${{ steps.setup-aerospike-server.outputs.tls-cert-dir }}"

          [[ "${{ steps.setup-aerospike-server.outputs.tls-service-ports }}" == "4333" ]] \
            || { echo "Unexpected tls-service-ports"; exit 1; }
          [[ -n "${{ steps.setup-aerospike-server.outputs.tls-cert-dir }}" ]] \
            || { echo "tls-cert-dir is empty"; exit 1; }

      - name: Verify cert files exist
        run: |
          cert_dir="${{ steps.setup-aerospike-server.outputs.tls-cert-dir }}"
          for f in ca.crt ca.key server.crt server.key client.crt client.key; do
            [[ -f "$cert_dir/$f" ]] || { echo "Missing cert file: $f"; exit 1; }
          done
          san=$(openssl x509 -in "$cert_dir/server.crt" -noout -ext subjectAltName)
          echo "$san"
          echo "$san" | grep -Eq '(^|[[:space:],])DNS:aerospike-tls(,|$)' \
            || { echo "server.crt SAN is missing aerospike-tls"; exit 1; }
          subject=$(openssl x509 -in "$cert_dir/server.crt" -noout -subject -nameopt RFC2253)
          subject=${subject#subject=}
          [[ "$subject" == "CN=aerospike-tls" ]] \
            || { echo "Unexpected server cert CN: $subject"; exit 1; }
          openssl x509 -in "$cert_dir/client.crt" -noout -text \
            | grep -q 'Version: 3' \
            || { echo "client.crt is not an X.509 v3 certificate"; exit 1; }
          echo "All expected cert files present"

      - name: Verify authenticated access on service port
        run: |
          tools_image="aerospike.jfrog.io/database-docker-virtual/aerospike-tools:12.1.1_2"
          network="${{ steps.setup-aerospike-server.outputs.network-name }}"
          rc=0
          result=$(docker run --rm --network "$network" "$tools_image" \
            asinfo -h aerospike-1 -p 3000 -U admin -P admin -v status 2>&1) || rc=$?
          echo "Exit code: $rc"
          echo "asinfo status (auth, non-TLS): $result"
          [[ $rc -eq 0 && "$result" == *"ok"* ]] || { echo "Expected status=ok with auth on service port"; exit 1; }

      - name: Verify authenticated access on TLS port
        run: |
          tools_image="aerospike.jfrog.io/database-docker-virtual/aerospike-tools:12.1.1_2"
          network="${{ steps.setup-aerospike-server.outputs.network-name }}"
          cert_dir="${{ steps.setup-aerospike-server.outputs.tls-cert-dir }}"
          rc=0
          result=$(docker run --rm --network "$network" \
            -v "$cert_dir:/certs:ro" "$tools_image" \
            asinfo -h aerospike-1 -p 4333 \
            --tls-enable --tls-name aerospike-tls --tls-cafile /certs/ca.crt \
            -U admin -P admin -v status 2>&1) || rc=$?
          echo "Exit code: $rc"
          echo "asinfo status (auth, TLS): $result"
          [[ $rc -eq 0 && "$result" == *"ok"* ]] || { echo "Expected status=ok with auth on TLS port"; exit 1; }

      - name: Verify unauthenticated access is rejected
        run: |
          tools_image="aerospike.jfrog.io/database-docker-virtual/aerospike-tools:12.1.1_2"
          network="${{ steps.setup-aerospike-server.outputs.network-name }}"
          rc=0
          result=$(docker run --rm --network "$network" "$tools_image" \
            asinfo -h aerospike-1 -p 3000 -v status 2>&1) || rc=$?
          echo "Exit code: $rc"
          echo "Unauthenticated result: $result"
          [[ "$result" == *"ERROR"* || "$result" == *"not authenticated"* || "$result" == *"error"* ]] \
            || { echo "Expected unauthenticated access to be rejected"; exit 1; }

      - name: Verify TLS handshake
        run: |
          cert_dir="${{ steps.setup-aerospike-server.outputs.tls-cert-dir }}"
          echo | openssl s_client -connect 127.0.0.1:4333 -CAfile "$cert_dir/ca.crt" 2>&1 | grep -q "Verify return code: 0"
          echo "TLS handshake verified"

  test-tls-with-security-multi-node:
    name: Multi-node with TLS and security (3 nodes)
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Aerospike Server with TLS and security (3 nodes)
        id: setup-aerospike-server
        uses: ./.github/actions/setup-aerospike-server
        with:
          num-nodes: "3"
          enable-tls: "true"
          enable-security: "true"
          features-content: ${{ secrets.AES_FEATURES_CONF }}
          startup-timeout: "60"
          oidc-provider: ${{ vars.JFROG_OIDC_PROVIDER }}
          oidc-audience: ${{ vars.JFROG_OIDC_AUDIENCE }}
          enable-bash-trace-mode: ${{ env.ENABLE_BASH_TRACE_MODE }}

      - name: Verify outputs
        run: |
          echo "container-names: ${{ steps.setup-aerospike-server.outputs.container-names }}"
          echo "service-ports: ${{ steps.setup-aerospike-server.outputs.service-ports }}"
          echo "tls-service-ports: ${{ steps.setup-aerospike-server.outputs.tls-service-ports }}"
          echo "tls-cert-dir: ${{ steps.setup-aerospike-server.outputs.tls-cert-dir }}"

          [[ "${{ steps.setup-aerospike-server.outputs.container-names }}" == "aerospike-1,aerospike-2,aerospike-3" ]] \
            || { echo "Unexpected container-names"; exit 1; }
          [[ "${{ steps.setup-aerospike-server.outputs.service-ports }}" == "3000,3001,3002" ]] \
            || { echo "Unexpected service-ports"; exit 1; }
          [[ "${{ steps.setup-aerospike-server.outputs.tls-service-ports }}" == "4333,4334,4335" ]] \
            || { echo "Unexpected tls-service-ports"; exit 1; }
          [[ -n "${{ steps.setup-aerospike-server.outputs.tls-cert-dir }}" ]] \
            || { echo "tls-cert-dir is empty"; exit 1; }

      - name: Verify all containers are running
        run: |
          for i in 1 2 3; do
            docker ps --filter "name=aerospike-${i}" --format '{{.Names}}' | grep -q "aerospike-${i}"
          done

      - name: Verify cluster formation via authenticated asinfo
        run: |
          tools_image="aerospike.jfrog.io/database-docker-virtual/aerospike-tools:12.1.1_2"
          network="${{ steps.setup-aerospike-server.outputs.network-name }}"
          for container in aerospike-1 aerospike-2 aerospike-3; do
            echo "Checking cluster_size on $container..."
            rc=0
            stats=$(docker run --rm --network "$network" "$tools_image" \
              asinfo -h "$container" -p 3000 -U admin -P admin -v "statistics" 2>&1) || rc=$?
            cluster_size=$(echo "$stats" | tr ';' '\n' | grep -oP 'cluster_size=\K\d+' || echo "N/A")
            echo "$container cluster_size: $cluster_size (exit code: $rc)"
            [[ $rc -eq 0 && "$cluster_size" == "3" ]] \
              || { echo "Expected cluster_size=3 on $container, got $cluster_size"; exit 1; }
          done

          echo "Checking replication-factor on aerospike-1..."
          rc=0
          ns_stats=$(docker run --rm --network "$network" "$tools_image" \
            asinfo -h aerospike-1 -p 3000 -U admin -P admin -v "namespace/test" 2>&1) || rc=$?
          replication_factor=$(echo "$ns_stats" | tr ';' '\n' | grep -oP 'replication-factor=\K\d+' || echo "N/A")
          echo "replication-factor: $replication_factor (exit code: $rc)"
          [[ $rc -eq 0 && "$replication_factor" == "2" ]] \
            || { echo "Expected replication-factor=2 on the generated TLS multi-node config, got $replication_factor"; exit 1; }

      - name: Verify authenticated TLS connection on each node
        run: |
          tools_image="aerospike.jfrog.io/database-docker-virtual/aerospike-tools:12.1.1_2"
          network="${{ steps.setup-aerospike-server.outputs.network-name }}"
          cert_dir="${{ steps.setup-aerospike-server.outputs.tls-cert-dir }}"
          for container in aerospike-1 aerospike-2 aerospike-3; do
            echo "Checking TLS on $container..."
            rc=0
            result=$(docker run --rm --network "$network" \
              -v "$cert_dir:/certs:ro" "$tools_image" \
              asinfo -h "$container" -p 4333 \
              --tls-enable --tls-name aerospike-tls --tls-cafile /certs/ca.crt \
              -U admin -P admin -v status 2>&1) || rc=$?
            echo "$container TLS status: $result (exit code: $rc)"
            [[ $rc -eq 0 && "$result" == *"ok"* ]] \
              || { echo "Expected status=ok with auth on TLS port for $container"; exit 1; }
          done

      - name: Verify unauthenticated access is rejected
        run: |
          tools_image="aerospike.jfrog.io/database-docker-virtual/aerospike-tools:12.1.1_2"
          network="${{ steps.setup-aerospike-server.outputs.network-name }}"
          rc=0
          result=$(docker run --rm --network "$network" "$tools_image" \
            asinfo -h aerospike-1 -p 3000 -v status 2>&1) || rc=$?
          echo "Exit code: $rc"
          echo "Unauthenticated result: $result"
          [[ "$result" == *"ERROR"* || "$result" == *"not authenticated"* || "$result" == *"error"* ]] \
            || { echo "Expected unauthenticated access to be rejected"; exit 1; }

  test-per-node-config:
    name: Per-node config from NODE_INDEX and NODE_NAME (3 nodes)
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Aerospike Server Community with a per-node alternate-access-port
        id: setup-aerospike-server
        uses: ./.github/actions/setup-aerospike-server
        with:
          server-container-repo: database-docker-virtual/aerospike-server
          num-nodes: "3"
          startup-timeout: "60"
          config-content: |
            service {
                cluster-name docker
                proto-fd-max 15000
            }

            logging {
                console {
                    context any info
                }
            }

            network {
                service {
                    address any
                    port 3000
                    alternate-access-address {{NODE_NAME}}
                    alternate-access-port 3{{NODE_INDEX}}00
                }
                heartbeat {
                    mode mesh
                    address any
                    port 3002
                    interval 150
                    timeout 10
                }
                fabric {
                    address any
                    port 3001
                }
            }

            namespace test {
                replication-factor 2
                storage-engine memory {
                    data-size 1G
                }
            }
          oidc-provider: ${{ vars.JFROG_OIDC_PROVIDER }}
          oidc-audience: ${{ vars.JFROG_OIDC_AUDIENCE }}
          enable-bash-trace-mode: ${{ env.ENABLE_BASH_TRACE_MODE }}

      - name: Verify each node advertises its own alternate-access-port
        env:
          CONTAINER_NAMES: ${{ steps.setup-aerospike-server.outputs.container-names }}
          NETWORK: ${{ steps.setup-aerospike-server.outputs.network-name }}
        run: |
          tools_image="aerospike.jfrog.io/database-docker-virtual/aerospike-tools:12.1.1_2"
          IFS=',' read -ra containers <<< "$CONTAINER_NAMES"
          [[ ${#containers[@]} -eq 3 ]] || { echo "Expected 3 containers, got: $CONTAINER_NAMES"; exit 1; }
          for i in "${!containers[@]}"; do
            container="${containers[$i]}"
            expected_port="3$((i + 1))00"
            rc=0
            result=$(docker run --rm --network "$NETWORK" "$tools_image" \
              asinfo -h "$container" -p 3000 -v service-clear-alt 2>&1) || rc=$?
            echo "$container service-clear-alt: $result (exit code: $rc)"
            [[ $rc -eq 0 && "$result" =~ ^[^\;]+:${expected_port}$ ]] \
              || { echo "Expected $container to advertise alternate-access-port $expected_port"; exit 1; }

            rc=0
            stats=$(docker run --rm --network "$NETWORK" "$tools_image" \
              asinfo -h "$container" -p 3000 -v "statistics" 2>&1) || rc=$?
            cluster_size=$(echo "$stats" | tr ';' '\n' | sed -n 's/^cluster_size=//p')
            echo "$container cluster_size: ${cluster_size:-N/A} (exit code: $rc)"
            [[ $rc -eq 0 && "$cluster_size" == "3" ]] \
              || { echo "Expected cluster_size=3 on $container, got ${cluster_size:-N/A}"; exit 1; }
          done

  test-extra-hosts:
    name: Extra hosts on every node (2 nodes)
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Aerospike Server Community with extra-hosts
        id: setup-aerospike-server
        uses: ./.github/actions/setup-aerospike-server
        with:
          server-container-repo: database-docker-virtual/aerospike-server
          num-nodes: "2"
          startup-timeout: "60"
          extra-hosts: db.example:10.0.0.5,cache.example:10.0.0.6
          oidc-provider: ${{ vars.JFROG_OIDC_PROVIDER }}
          oidc-audience: ${{ vars.JFROG_OIDC_AUDIENCE }}
          enable-bash-trace-mode: ${{ env.ENABLE_BASH_TRACE_MODE }}

      - name: Verify extra hosts resolve inside every node
        env:
          CONTAINER_NAMES: ${{ steps.setup-aerospike-server.outputs.container-names }}
        run: |
          IFS=',' read -ra containers <<< "$CONTAINER_NAMES"
          [[ ${#containers[@]} -eq 2 ]] || { echo "Expected 2 containers, got: $CONTAINER_NAMES"; exit 1; }
          for container in "${containers[@]}"; do
            for entry in db.example:10.0.0.5 cache.example:10.0.0.6; do
              host="${entry%%:*}"
              expected_ip="${entry#*:}"
              rc=0
              resolved=$(docker exec "$container" getent hosts "$host" 2>&1) || rc=$?
              echo "$container getent hosts $host: $resolved (exit code: $rc)"
              [[ $rc -eq 0 && "$(awk '{ print $1 }' <<< "$resolved")" == "$expected_ip" ]] \
                || { echo "Expected $host to resolve to $expected_ip in $container"; exit 1; }
            done
          done

  test-start-nodes-subnet:
    name: Start 2 of 3 nodes on a fixed subnet
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Aerospike Server Community (3 nodes, 2 started, fixed subnet)
        id: setup-aerospike-server
        uses: ./.github/actions/setup-aerospike-server
        with:
          server-container-repo: database-docker-virtual/aerospike-server
          num-nodes: "3"
          start-nodes: "2"
          network-subnet: 172.30.57.0/24
          startup-timeout: "60"
          oidc-provider: ${{ vars.JFROG_OIDC_PROVIDER }}
          oidc-audience: ${{ vars.JFROG_OIDC_AUDIENCE }}
          enable-bash-trace-mode: ${{ env.ENABLE_BASH_TRACE_MODE }}

      - name: Verify node 3 is created, fixed IPs, cluster of 2, then 3 after docker start
        env:
          NETWORK: ${{ steps.setup-aerospike-server.outputs.network-name }}
        run: |
          tools_image="aerospike.jfrog.io/database-docker-virtual/aerospike-tools:12.1.1_2"
          cluster_size() {
            docker run --rm --network "$NETWORK" "$tools_image" asinfo -h "$1" -p 3000 -v statistics \
              | tr ';' '\n' | sed -n 's/^cluster_size=//p'
          }
          state=$(docker inspect --format '{{.State.Status}}' aerospike-3)
          [[ "$state" == "created" ]] || { echo "Expected aerospike-3 created, got $state"; exit 1; }
          for i in 1 2; do
            ip=$(docker inspect --format "{{(index .NetworkSettings.Networks \"$NETWORK\").IPAddress}}" "aerospike-$i")
            echo "aerospike-$i: $ip, cluster_size $(cluster_size "aerospike-$i")"
            [[ "$ip" == "172.30.57.$((i + 1))" && "$(cluster_size "aerospike-$i")" == "2" ]] \
              || { echo "Unexpected IP or cluster size on aerospike-$i"; exit 1; }
          done
          docker start aerospike-3
          for _ in $(seq 30); do
            [[ "$(cluster_size aerospike-1)" == "3" ]] && break
            sleep 2
          done
          ip=$(docker inspect --format "{{(index .NetworkSettings.Networks \"$NETWORK\").IPAddress}}" aerospike-3)
          echo "aerospike-3: $ip, cluster_size $(cluster_size aerospike-1)"
          [[ "$ip" == "172.30.57.4" && "$(cluster_size aerospike-1)" == "3" ]] \
            || { echo "aerospike-3 did not join on 172.30.57.4"; exit 1; }
