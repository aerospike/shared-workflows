name: "Test: Composable minimal permissions (bundle metadata upload)"

# Same permission ceiling as test_composable-minimal-permissions.yaml (contents: read +
# id-token: write only) but exercises the Maven bundle metadata upload handoff enabled.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/reusable_sign-artifacts.yaml
      - .github/workflows/reusable_deploy-artifacts.yaml
      - .github/workflows/reusable_create-release-bundle.yaml
      - .github/workflows/test_composable-minimal-permissions-bundle-upload.yaml

permissions:
  contents: read
  id-token: write

jobs:
  upload-fixtures:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create test fixtures
        run: .github/workflows/deploy-artifacts/create-test-fixtures.sh composable-bundle-upload-fixtures

      - name: Drop NuGet fixtures
        run: |
          find composable-bundle-upload-fixtures \
            \( -name '*.nupkg' -o -name '*.snupkg' \
            -o -name '*.nupkg.asc' -o -name '*.snupkg.asc' \) -delete

      - name: Upload unsigned fixtures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: composable-bundle-upload-fixtures
          path: composable-bundle-upload-fixtures
          retention-days: 1

  sign:
    if: github.actor != 'dependabot[bot]'
    needs: upload-fixtures
    uses: ./.github/workflows/reusable_sign-artifacts.yaml
    secrets:
      gpg-private-key: ${{ secrets.GPG_SECRET_KEY }}
      gpg-public-key: ${{ secrets.GPG_PUBLIC_KEY }}
      gpg-key-pass: ${{ secrets.GPG_PASS }}
    with:
      gh-unsigned-artifacts: composable-bundle-upload-fixtures
      gh-artifact-name: signed-composable-bundle-upload
      gh-workflows-ref: ${{ github.sha }}

  deploy:
    if: github.actor != 'dependabot[bot]'
    needs: sign
    uses: ./.github/workflows/reusable_deploy-artifacts.yaml
    with:
      gh-workflows-ref: ${{ github.sha }}
      gh-checkout-path: .
      gh-artifact-name: signed-composable-bundle-upload
      gh-upload-bundle-metadata: true
      gh-bundle-metadata-artifact-name: bundle-metadata-minimal-${{ github.run_id }}-${{ github.run_attempt }}
      jf-project: test
      jf-build-name: composable-minimal-bundle-upload
      jf-build-id: ${{ github.run_id }}-${{ github.run_attempt }}
      jf-metadata-build-id: ${{ github.run_id }}-${{ github.run_attempt }}-metadata
      version: v1.0.0-composable-bundle-upload
      oidc-provider-name: gh-aerospike
      oidc-audience: aerospike
      dry-run: true

  verify-bundle-metadata-artifact:
    if: github.actor != 'dependabot[bot]' && needs.deploy.result == 'success'
    needs: deploy
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Assert deploy outputs under minimal permissions
        run: |
          set -euo pipefail
          [[ "${{ needs.deploy.outputs.bundle-metadata-available }}" == "true" ]]
          [[ -n "${{ needs.deploy.outputs.bundle-metadata-artifact-name }}" ]]

      - name: Download bundle metadata artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.deploy.outputs.bundle-metadata-artifact-name }}
          path: .bundle-metadata-dl

      - name: Verify hidden dotfile uploaded under minimal permissions
        run: |
          set -euo pipefail
          meta="$(find .bundle-metadata-dl -name '.maven-bundle-metadata.json' -type f | head -n1 || true)"
          [[ -n "$meta" ]] || { echo "FAIL: hidden dotfile missing from artifact" >&2; exit 1; }
          jq -e '.maven_module_count | tonumber > 0' "$meta" >/dev/null
          echo "PASS: bundle metadata upload works with contents:read + id-token:write only"

  create-release-bundle:
    if: github.actor != 'dependabot[bot]' && needs.deploy.result == 'success'
    needs: deploy
    uses: ./.github/workflows/reusable_create-release-bundle.yaml
    with:
      gh-workflows-ref: ${{ github.sha }}
      jf-project: test
      jf-build-names: composable-minimal-bundle-upload:v1.0.0-composable-bundle-upload
      jf-bundle-name: composable-minimal-bundle-upload
      version: v1.0.0-composable-bundle-upload
      oidc-provider-name: gh-aerospike
      oidc-audience: aerospike
      dry-run: true
      gh-bundle-metadata-artifact-name: ${{ needs.deploy.outputs.bundle-metadata-available == 'true' && needs.deploy.outputs.bundle-metadata-artifact-name || '' }}

  verify-chain:
    if: github.actor != 'dependabot[bot]'
    needs:
      [sign, deploy, verify-bundle-metadata-artifact, create-release-bundle]
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - run: echo "Minimal-permissions composable chain with bundle metadata upload completed."
