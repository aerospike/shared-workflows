name: Test Create Release Bundle Workflow
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  build-packages:
    uses: ./.github/workflows/reusable_execute-build.yaml
    strategy:
      matrix:
        include:
          # Ubuntu/Debian family (x86_64)
          - distro: jammy
            arch: x86_64
            runs-on: ubuntu-22.04
          - distro: noble
            arch: x86_64
            runs-on: ubuntu-22.04
          - distro: focal
            arch: x86_64
            runs-on: ubuntu-22.04
          - distro: bullseye
            arch: x86_64
            runs-on: ubuntu-22.04
          - distro: bookworm
            arch: x86_64
            runs-on: ubuntu-22.04
          # Ubuntu/Debian family (arm64)
          - distro: jammy
            arch: arm64
            runs-on: ubuntu-latest-arm64
          - distro: noble
            arch: arm64
            runs-on: ubuntu-latest-arm64
          - distro: focal
            arch: arm64
            runs-on: ubuntu-latest-arm64
          - distro: bullseye
            arch: arm64
            runs-on: ubuntu-latest-arm64
          - distro: bookworm
            arch: arm64
            runs-on: ubuntu-latest-arm64
          # RPM family (x86_64)
          - distro: el8
            arch: x86_64
            runs-on: ubuntu-22.04
          - distro: el9
            arch: x86_64
            runs-on: ubuntu-22.04
          - distro: amzn2023
            arch: x86_64
            runs-on: ubuntu-22.04
          # RPM family (arm64)
          - distro: el8
            arch: arm64
            runs-on: ubuntu-latest-arm64
          - distro: el9
            arch: arm64
            runs-on: ubuntu-latest-arm64
          - distro: amzn2023
            arch: arm64
            runs-on: ubuntu-latest-arm64
    with:
      project: database
      build-name: test-build
      build-version: v1.0.0
      build-script: |
        cd .github/workflows/execute-build/test_apps/hi
        uname -m
        uname -a
        which gcc
        DISTRO=${{ matrix.distro }} \
        ARCH=${{ matrix.arch }} \
        make docker-build
      artifact-directory: .github/workflows/execute-build/test_apps/hi/build
      artifact-name: build-artifacts-${{ matrix.distro }}-${{ matrix.arch }}
      retention-days: 1 # default
      artifactory-url: https://aerospike.jfrog.io # default
      artifactory-oidc-provider-name: gh-aerospike # default
      artifactory-oidc-audience: aerospike # default
      dry-run: false # default

  combine-artifacts:
    needs: build-packages
    runs-on: ubuntu-22.04
    steps:
      - name: Download All Matrix Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-artifacts-*
          path: ./all-packages
          merge-multiple: true

      - name: Upload Combined Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: ./all-packages
          retention-days: 1
