name: Example Reusable Integration
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# This workflow demonstrates the complete CI/CD pipeline using all four reusable
# workflows from shared-workflows. It shows how to chain workflows together to
# create a production-ready artifact pipeline.
# See the complementary docs/CICD-with-shared-actions.md for more details.
#
# WORKFLOW FLOW:
# 1. extract-version: The examples need a version to work with and this provides one from a test file.
# 2. build-packages: Build packages across multiple platforms using matrix strategy (uses reusable_execute-build.yaml)
# 3. package-built-artifacts: Package built artifacts into distributable formats (handles packaging in this example but could be done in the build step)
# 4. sign-artifacts: GPG sign the packaged artifacts for security (uses reusable_sign-artifacts.yaml)
# 5. deploy-artifacts: Deploy signed artifacts to JFrog Artifactory (uses reusable_deploy-artifacts.yaml)
# 6. create-release-bundle: Create a release bundle from deployed artifacts (uses reusable_create-release-bundle.yaml)
#
#
# USAGE:
# This is an example workflow that consumers can copy and adapt for their own
# projects. It demonstrates best practices for integrating shared-workflows
# components into a complete CI/CD pipeline.
# =============================================================================

jobs:
  # Manual dispatches should not take arguments.
  # here we use a file (VERSION.example) to set the test version that will be used.
  # Since this action actually produces an immutable release bundle you must remove it or change the version
  # to remove the test bundle use the command `jf rbdell test-release --project test 1.2.3`
  # In a real CI/CD pipeline you could trigger on version tag or commit also. Here we use the file so we can show the behaviour on demand.
  extract-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Extract Version
        id: extract
        uses: ./.github/actions/extract-version-from-tag
        with:
          version-file: .github/workflows/VERSION.example
    outputs:
      version: ${{ steps.extract.outputs.version }}
      git_tag: ${{ steps.extract.outputs.git_tag }}
  # reusable_execute-build.yaml is a reusable workflow that enables building the project. This step
  # could be done another way, but the advantage of using the reusable workflow is that it allows
  # a single workflow that can be instrumented in the future.
  # This is also an example of using a matrix strategy to build in GHA
  build-packages:
    uses: ./.github/workflows/reusable_execute-build.yaml
    needs: extract-version
    # Matrix strategy: Multi-platform builds across Ubuntu/Debian/RPM families (x86_64 native, ARM64 emulated)
    strategy:
      matrix:
        include:
          # Ubuntu/Debian family (x86_64)
          - distro: jammy
            arch: x86_64
            runs-on: ubuntu-22.04
            emulated: false
          - distro: noble
            arch: x86_64
            runs-on: ubuntu-22.04
            emulated: false
          - distro: focal
            arch: x86_64
            runs-on: ubuntu-22.04
            emulated: false
          - distro: bullseye
            arch: x86_64
            runs-on: ubuntu-22.04
            emulated: false
          - distro: bookworm
            arch: x86_64
            runs-on: ubuntu-22.04
            emulated: false
          # Ubuntu/Debian family (arm64) - emulated by default
          # set emulated to false to run on real arm64 runners but as of 8/14/2025, the queue times are too long
          - distro: jammy
            arch: arm64
            runs-on: ubuntu-22.04
            emulated: true
          - distro: noble
            arch: arm64
            runs-on: ubuntu-22.04
            emulated: true
          - distro: focal
            arch: arm64
            runs-on: ubuntu-22.04
            emulated: true
          - distro: bullseye
            arch: arm64
            runs-on: ubuntu-22.04
            emulated: true
          - distro: bookworm
            arch: arm64
            runs-on: ubuntu-22.04
            emulated: true
          # RPM family (x86_64 only - no ARM support)
          - distro: el8
            arch: x86_64
            runs-on: ubuntu-22.04
            emulated: false
          - distro: el9
            arch: x86_64
            runs-on: ubuntu-22.04
            emulated: false
          - distro: amzn2023
            arch: x86_64
            runs-on: ubuntu-22.04
            emulated: false
          # RPM family (arm64) - requires real ARM runners (commented out due to queue times)
          # - distro: el8
          #   arch: arm64
          #   runs-on: ubuntu-latest-arm64
          #   emulated: false
          # - distro: el9
          #   arch: arm64
          #   runs-on: ubuntu-latest-arm64
          #   emulated: false
          # - distro: amzn2023
          #   arch: arm64
          #   runs-on: ubuntu-latest-arm64
          #   emulated: false
    with:
      runs-on: ${{ matrix.runs-on }}
      project: test
      build-name: test-build
      build-id: ${{ github.run_number }}-${{ matrix.distro }}-${{ matrix.arch }}
      checkout-path: project-location # In the case of running in shared_workflows checkout-path and source-path will have the same content but we put them here by way of example.
      source-path: repo-source
      working-directory: repo-source/.github/workflows/execute-build/test_apps/hi
      build-script: |
        uname -m
        uname -a
        which gcc
        pwd
        find .
        DISTRO=${{ matrix.distro }} \
        ARCH=${{ matrix.arch }} \
        EMULATED=${{ matrix.emulated }} \
        make docker-build
      artifact-directory: build
      artifact-name: build-artifacts-${{ matrix.distro }}-${{ matrix.arch }}
      retention-days: 1 # default
      artifactory-url: https://artifact.aerospike.io # default
      artifactory-oidc-provider-name: gh-dev-test
      artifactory-oidc-audience: aerospike/testing
      publish-build-info: true
      dry-run: false # default
  # Aggregate all matrix build-infos into a parent build using reusable workflow
  aggregate-build-info:
    needs: build-packages
    uses: ./.github/workflows/reusable_aggregate-build-info.yaml
    with:
      project: test
      build-name: ${{needs.build-packages.outputs.build-name}}
      build-id: ${{needs.build-packages.outputs.build-id}}
      build-name-search-pattern: ${{needs.build-packages.outputs.build-name}}*
      artifact-name: ${{needs.build-packages.outputs.artifact-name}}
      combine-artifacts: true
      artifactory-url: https://artifact.aerospike.io
      artifactory-oidc-provider-name: gh-dev-test
      artifactory-oidc-audience: aerospike/testing
  # This job demonstrates custom packaging logic using standard GitHub Actions (actions/checkout, actions/download-artifact, actions/upload-artifact)
  # No reusable actions from shared-workflows are used here - this is custom packaging logic that could be done in the build step
  # In this case it is using fpm to generate debs and rpms and uploading them to be processed further.
  # building and packaging could be done in the build step if we wanted to package on the distro as the build
  # but here we do it separate. It takes the output from the matrix builds and uploads them to gitub in a single directory.
  package-built-artifacts:
    needs: [build-packages, extract-version]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Download All Matrix Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-artifacts-*
          path: build-artifacts
          merge-multiple: true
      - name: Package Artifacts
        run: |
          .github/workflows/execute-build/test_apps/hi/package.sh --target hi --version ${{ needs.extract-version.outputs.version }} \
            --packages-dir build-artifacts --output-dir packaged-artifacts
      - name: Upload packaged Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: packaged-artifacts
          overwrite: true
          retention-days: 1
  sign-artifacts:
    needs: package-built-artifacts
    uses: ./.github/workflows/reusable_sign-artifacts.yaml
    with:
      retention-days: 1
      artifactory-oidc-provider-name: gh-dev-test
      artifactory-oidc-audience: aerospike/testing
      artifact-name: packaged-artifacts
    secrets:
      gpg-private-key: ${{ secrets.GPG_SECRET_KEY }}
      gpg-public-key: ${{ secrets.GPG_PUBLIC_KEY }}
      gpg-key-pass: ${{ secrets.GPG_PASS }}

  deploy-artifacts:
    needs: [sign-artifacts, extract-version, aggregate-build-info]
    uses: ./.github/workflows/reusable_deploy-artifacts.yaml
    with:
      project: test
      build-name: ${{ needs.aggregate-build-info.outputs.build-name }}
      build-id: ${{ needs.aggregate-build-info.outputs.build-id }}
      artifact-name: ${{ needs.sign-artifacts.outputs.artifact-name }}
      version: ${{ needs.extract-version.outputs.version }}
      retention-days: 1
      artifactory-oidc-provider-name: gh-dev-test
      artifactory-oidc-audience: aerospike/testing
      dry-run: false
  # create-release-bundle - Create a release bundle from deployed artifacts for distribution
  create-release-bundle:
    needs: [deploy-artifacts, extract-version, aggregate-build-info]
    uses: ./.github/workflows/reusable_create-release-bundle.yaml
    with:
      project: test
      build-names: ${{needs.aggregate-build-info.outputs.build-name}}:${{ needs.aggregate-build-info.outputs.build-id }} # for multiple builds it would be test-build-1:build_id1,test-build-2:build_id2"
      bundle-name: test-release
      version: ${{ needs.extract-version.outputs.version }}
      artifactory-oidc-provider-name: gh-dev-test
      artifactory-oidc-audience: aerospike/testing
      dry-run: false
