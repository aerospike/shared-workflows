name: Example Reusable Integration
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  # Manual dispatches should not take arguments.
  # here we use a file (VERSION.example) to set the test version that will be used.
  # Since this action actually produces an immutable release bundle you must remove it or change the version
  # to remove the test bundle use the command `jf rbdell test-release --project test 1.2.3`
  extract-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Version
        id: extract
        uses: ./.github/actions/extract-version-from-tag
        with:
          version-file: .github/workflows/VERSION.example
    outputs:
      version: ${{ steps.extract.outputs.version }}
      git_tag: ${{ steps.extract.outputs.git_tag }}
  build-packages:
    uses: ./.github/workflows/reusable_execute-build.yaml
    needs: extract-version
    strategy:
      matrix:
        include:
          # Ubuntu/Debian family (x86_64)
          - distro: jammy
            arch: x86_64
            runs-on: ubuntu-22.04
            emulated: false
          - distro: noble
            arch: x86_64
            runs-on: ubuntu-22.04
            emulated: false
          - distro: focal
            arch: x86_64
            runs-on: ubuntu-22.04
            emulated: false
          - distro: bullseye
            arch: x86_64
            runs-on: ubuntu-22.04
            emulated: false
          - distro: bookworm
            arch: x86_64
            runs-on: ubuntu-22.04
            emulated: false
          # Ubuntu/Debian family (arm64) - emulated by default
          # set emulated to false to run on real arm64 runners but as of 8/14/2025, the queue times are too long
          - distro: jammy
            arch: arm64
            runs-on: ubuntu-22.04
            emulated: true
          - distro: noble
            arch: arm64
            runs-on: ubuntu-22.04
            emulated: true
          - distro: focal
            arch: arm64
            runs-on: ubuntu-22.04
            emulated: true
          - distro: bullseye
            arch: arm64
            runs-on: ubuntu-22.04
            emulated: true
          - distro: bookworm
            arch: arm64
            runs-on: ubuntu-22.04
            emulated: true
          # RPM family (x86_64 only - no ARM support)
          - distro: el8
            arch: x86_64
            runs-on: ubuntu-22.04
            emulated: false
          - distro: el9
            arch: x86_64
            runs-on: ubuntu-22.04
            emulated: false
          - distro: amzn2023
            arch: x86_64
            runs-on: ubuntu-22.04
            emulated: false
          # RPM family (arm64) - requires real ARM runners (commented out due to queue times)
          # - distro: el8
          #   arch: arm64
          #   runs-on: ubuntu-latest-arm64
          #   emulated: false
          # - distro: el9
          #   arch: arm64
          #   runs-on: ubuntu-latest-arm64
          #   emulated: false
          # - distro: amzn2023
          #   arch: arm64
          #   runs-on: ubuntu-latest-arm64
          #   emulated: false
    with:
      runs-on: ${{ matrix.runs-on }}
      project: test
      build-name: test-build
      build-version: v1.0.0
      checkout-path: project-location # In the case of running in shared_workflows checkout-path and source-path will have the same content but we put them here by way of example.
      source-path: repo-source
      build-script: |
        cd repo-source/.github/workflows/execute-build/test_apps/hi
        uname -m
        uname -a
        which gcc
        DISTRO=${{ matrix.distro }} \
        ARCH=${{ matrix.arch }} \
        EMULATED=${{ matrix.emulated }} \
        make docker-build
      artifact-directory: repo-source/.github/workflows/execute-build/test_apps/hi/build
      artifact-name: build-artifacts-${{ matrix.distro }}-${{ matrix.arch }}
      retention-days: 1 # default
      artifactory-url: https://artifact.aerospike.io # default
      artifactory-oidc-provider-name: gh-dev-test
      artifactory-oidc-audience: aerospike/testing
      dry-run: false # default
  # the "package-built-artifacts" workflow is just an example of how one might package the built artifacts.
  # In this case it is using fpm to generate debs and rpms and uploading them to be processed further
  package-built-artifacts:
    needs: [build-packages, extract-version]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Download All Matrix Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-artifacts-*
          path: build-artifacts
          merge-multiple: true
      - name: Package Artifacts
        run: |
          .github/workflows/execute-build/test_apps/hi/package.sh --target hi --version ${{ needs.extract-version.outputs.version }} \
            --packages-dir build-artifacts --output-dir packaged-artifacts
      - name: Upload packaged Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: packaged-artifacts
          retention-days: 1
  sign-artifacts:
    needs: package-built-artifacts
    uses: ./.github/workflows/reusable_sign-artifacts.yaml
    with:
      retention-days: 1
      artifactory-oidc-provider-name: gh-dev-test
      artifactory-oidc-audience: aerospike/testing
    secrets:
      gpg-private-key: ${{ secrets.GPG_SECRET_KEY }}
      gpg-public-key: ${{ secrets.GPG_PUBLIC_KEY }}
      gpg-key-pass: ${{ secrets.GPG_PASS }}
  deploy-artifacts:
    needs: [sign-artifacts, extract-version]
    uses: ./.github/workflows/reusable_deploy-artifacts.yaml
    with:
      project: test
      build-name: test-build
      version: ${{ needs.extract-version.outputs.version }}
      retention-days: 1
      artifactory-oidc-provider-name: gh-dev-test
      artifactory-oidc-audience: aerospike/testing
      dry-run: false
  create-release-bundle:
    needs: [deploy-artifacts, extract-version]
    uses: ./.github/workflows/reusable_create-release-bundle.yaml
    with:
      project: test
      build-names: test-build:${{ needs.deploy-artifacts.outputs.build-id }} # for multiple builds it would be test-build-1:build_id1,test-build-2:build_id2"
      bundle-name: test-release
      version: ${{ needs.extract-version.outputs.version }}
      artifactory-oidc-provider-name: gh-dev-test
      artifactory-oidc-audience: aerospike/testing
      dry-run: false
