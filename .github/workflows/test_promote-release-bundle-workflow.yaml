name: Test Promote Release Bundle Workflow
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  attestations: write
  id-token: write
  contents: read

jobs:
  # dry-run must stay true: this runs against real JFrog.
  test-promote-release-bundle-workflow:
    uses: ./.github/workflows/reusable_promote-release-bundle.yaml
    with:
      gh-workflows-ref: ${{ github.sha }}
      gh-checkout-path: .
      jf-project: test
      jf-bundle-name: test-promote-guard-probe
      version: v1.0.0
      target-stage: DEV
      jf-url: https://artifact.aerospike.io
      oidc-provider-name: gh-aerospike
      oidc-audience: aerospike
      dry-run: true

  # Never promote test-promote-guard-probe to TEST: this job needs it to have no TEST promotion.
  test-refuses-a-skipped-stage:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup JFrog CLI
        uses: step-security/setup-jfrog-cli@53aeacb709fce45d0baf69a13ec3342f7e2d71a9 # v5.1.0
        env:
          JF_URL: https://artifact.aerospike.io
          JF_PROJECT: test
        with:
          oidc-provider-name: gh-aerospike
          oidc-audience: aerospike

      - name: Promote to STAGE without TEST
        shell: bash
        run: |
          set -euo pipefail
          if output=$(.github/workflows/promote-release-bundle/entrypoint.sh \
            --bundle-name test-promote-guard-probe --version v1.0.0 --project test \
            --target-stage STAGE --dry-run 2>&1); then
            echo "$output"
            echo "::error::the promotion to STAGE was not refused"
            exit 1
          fi
          echo "$output"
          grep -Fq "is not promoted to TEST, so it cannot be promoted to STAGE" <<<"$output"

  run-tests:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install jq -y

      - name: Setup bats
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0
        with:
          bats-version: 1.12.0
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false

      - name: Promotion tests
        run: bats .github/workflows/promote-release-bundle/tests/bats/
