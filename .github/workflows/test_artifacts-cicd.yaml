name: "Test: Artifacts CI/CD"

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  # Skipped for Dependabot: SSL.com NuGet signing requires real credentials
  cicd-test:
    if: github.actor != 'dependabot[bot]'
    name: Artifacts CI/CD
    uses: ./.github/workflows/reusable_artifacts-cicd.yaml
    with:
      jf-project: test
      jf-build-name: cicd-test
      version: 1.0.0-test
      gh-workflows-ref: ${{ github.ref }}
      gh-artifact-directory: packaged
      oidc-provider-name: gh-dev-test
      oidc-audience: aerospike/testing
      build-script: echo "overridden by matrix"
      matrix-json: >-
        {"include":[
          {
            "distro":"el9",
            "arch":"x86_64",
            "runs-on":"ubuntu-latest",
            "build-script":"OUTPUT_DIR=$(pwd)/packaged && cd .github/workflows/execute-build/test_apps/hi && make docker-build DISTRO=el9 ARCH=x86_64 && ./package.sh --version 1.0.0-test --packages-dir build --output-dir $OUTPUT_DIR"
          },
          {
            "distro":"jammy",
            "arch":"x86_64",
            "runs-on":"ubuntu-latest",
            "build-script":"OUTPUT_DIR=$(pwd)/packaged && cd .github/workflows/execute-build/test_apps/hi && make docker-build DISTRO=jammy ARCH=x86_64 && ./package.sh --version 1.0.0-test --packages-dir build --output-dir $OUTPUT_DIR"
          },
          {
            "distro":"dotnet",
            "arch":"any",
            "runs-on":"ubuntu-latest",
            "setup-dotnet":true,
            "build-script":"OUTPUT_DIR=$(pwd)/packaged && cd .github/workflows/execute-build/test_apps/DotnetHelloWorld/AerospikeHelloWorld && dotnet pack -c Release -p:Version=1.0.0-test -o $OUTPUT_DIR"
          },
          {
            "distro":"darwin",
            "arch":"arm64",
            "runs-on":"macos-14",
            "build-script":"mkdir -p packaged && echo 'test-pkg-payload' > /tmp/test-binary && pkgbuild --root /tmp --identifier com.aerospike.test --version 1.0.0-test --install-location /usr/local/bin packaged/test-1.0.0-test-darwin-arm64.pkg"
          },
          {
            "distro":"win10",
            "arch":"x64",
            "runs-on":"ubuntu-latest",
            "build-script":"mkdir -p packaged && head -c 2048 /dev/zero > packaged/ci-win-upload-artifact.exe && head -c 2048 /dev/zero > packaged/ci-win-upload-artifact.msi && head -c 2048 /dev/zero > packaged/ci-win-upload-artifact.msix"
          }
        ]}
      dry-run: true
      sign-mac: true
      mac-signing-identity: "Developer ID Application: Test (TESTID)"
      mac-installer-identity: "Developer ID Installer: Test (TESTID)"
      sign-windows: true
      win-artifact-glob: "*.exe,*.msi,*.msix"
      win-runs-on: windows-2025
    secrets:
      gpg-private-key: ${{ secrets.GPG_SECRET_KEY }}
      gpg-public-key: ${{ secrets.GPG_PUBLIC_KEY }}
      gpg-key-pass: ${{ secrets.GPG_PASS }}
      es-username: ${{ secrets.ES_USERNAME }}
      es-password: ${{ secrets.ES_PASSWORD }}
      credential_id: ${{ secrets.CREDENTIAL_ID }}
      es-totp_secret: ${{ secrets.ES_TOTP_SECRET }}
      es_ov_username: ${{ secrets.ES_OV_USERNAME }}
      es_ov_password: ${{ secrets.ES_OV_PASSWORD }}
      es_ov_credential_id: ${{ secrets.ES_OV_CREDENTIAL_ID }}
      es_ov_totp_secret: ${{ secrets.ES_OV_TOTP_SECRET }}
      apple-application-cert: ${{ secrets.APPLE_APPLICATION_CERT }}
      apple-installer-cert: ${{ secrets.APPLE_INSTALLER_CERT }}
      apple-cert-password: ${{ secrets.APPLE_CERT_PASSWORD }}
      apple-notarization-password: ${{ secrets.APPLE_NOTARIZATION_PASSWORD }}
      apple-id: ${{ secrets.APPLE_ID }}
      apple-team-id: ${{ secrets.APPLE_TEAM_ID }}

  verify:
    if: github.actor != 'dependabot[bot]'
    name: Verify Artifacts
    runs-on: ubuntu-latest
    needs: cicd-test
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download signed artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-artifacts
          path: verification/signed

      - name: Install bats
        run: |
          git clone https://github.com/bats-core/bats-core.git
          cd bats-core
          sudo ./install.sh /usr/local
          cd ..
          rm -rf bats-core

      - name: Run artifact verification tests
        working-directory: .github/workflows/artifacts-cicd
        run: |
          bats tests/test_artifacts_cicd.bats
        env:
          ARTIFACTS_DIR: ${{ github.workspace }}/verification/signed
