name: "Test: Artifacts CI/CD"

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  # Do not replace this gate with a workflow-level paths: filter. The ruleset
  # requires the result check, and a workflow skipped by paths: never reports it.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check whether the pull request changes a tested path
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TESTED_PATHS: >-
            ^\.github/workflows/reusable_artifacts-cicd\.yaml$
            ^\.github/workflows/reusable_execute-build\.yaml$
            ^\.github/workflows/reusable_sign-artifacts\.yaml$
            ^\.github/workflows/reusable_sign-mac-artifacts\.yaml$
            ^\.github/workflows/reusable_sign-win-artifacts\.yaml$
            ^\.github/workflows/reusable_deploy-artifacts\.yaml$
            ^\.github/workflows/artifacts-cicd/
            ^\.github/workflows/execute-build/
            ^\.github/workflows/sign-artifacts/
            ^\.github/workflows/sign-mac-artifacts/
            ^\.github/workflows/sign-win-artifacts/
            ^\.github/workflows/deploy-artifacts/
            ^\.github/workflows/lib/
            ^\.github/actions/collect-build-artifacts/
            ^\.github/workflows/test_artifacts-cicd\.yaml$
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "run=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          read -ra patterns <<<"$TESTED_PATHS"
          regex=$(IFS='|'; echo "${patterns[*]}")
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)')
          if grep -qE "$regex" <<<"$files"; then
            echo "run=true" >>"$GITHUB_OUTPUT"
          else
            echo "run=false" >>"$GITHUB_OUTPUT"
          fi

  # Skipped for Dependabot: SSL.com NuGet signing requires real credentials
  cicd-test:
    needs: changes
    if: github.actor != 'dependabot[bot]' && needs.changes.outputs.run == 'true'
    name: Artifacts CI/CD
    uses: ./.github/workflows/reusable_artifacts-cicd.yaml
    with:
      jf-project: test
      jf-build-name: cicd-test
      version: 1.0.0-test
      gh-workflows-ref: ${{ github.ref }}
      gh-artifact-directory: packaged
      oidc-provider-name: gh-dev-test
      oidc-audience: aerospike/testing
      build-script: echo "overridden by matrix"
      matrix-json: >-
        {"include":[
          {
            "distro":"el9",
            "arch":"x86_64",
            "runs-on":"ubuntu-latest",
            "build-script":"OUTPUT_DIR=$(pwd)/packaged && cd .github/workflows/execute-build/test_apps/hi && make docker-build DISTRO=el9 ARCH=x86_64 && ./package.sh --version 1.0.0-test --packages-dir build --output-dir $OUTPUT_DIR"
          },
          {
            "distro":"jammy",
            "arch":"x86_64",
            "runs-on":"ubuntu-latest",
            "build-script":"OUTPUT_DIR=$(pwd)/packaged && cd .github/workflows/execute-build/test_apps/hi && make docker-build DISTRO=jammy ARCH=x86_64 && ./package.sh --version 1.0.0-test --packages-dir build --output-dir $OUTPUT_DIR"
          },
          {
            "distro":"dotnet",
            "arch":"any",
            "runs-on":"ubuntu-latest",
            "setup-dotnet":true,
            "build-script":"OUTPUT_DIR=$(pwd)/packaged && cd .github/workflows/execute-build/test_apps/DotnetHelloWorld/AerospikeHelloWorld && dotnet pack -c Release -p:Version=1.0.0-test -o $OUTPUT_DIR"
          },
          {
            "distro":"darwin",
            "arch":"arm64",
            "runs-on":"macos-15",
            "build-script":"mkdir -p packaged && PKG_ROOT=$(mktemp -d) && echo 'test-pkg-payload' > $PKG_ROOT/test-binary && pkgbuild --root $PKG_ROOT --identifier com.aerospike.test --version 1.0.0-test --install-location /usr/local/bin packaged/test-1.0.0-test-darwin-arm64.pkg"
          },
          {
            "distro":"win10",
            "arch":"x64",
            "runs-on":"ubuntu-latest",
            "build-script":"mkdir -p packaged && head -c 2048 /dev/zero > packaged/ci-win-upload-artifact.exe && head -c 2048 /dev/zero > packaged/ci-win-upload-artifact.msi && head -c 2048 /dev/zero > packaged/ci-win-upload-artifact.msix"
          }
        ]}
      dry-run: true
      sign-mac: true
      mac-signing-identity: "Developer ID Application: Test (TESTID)"
      mac-installer-identity: "Developer ID Installer: Test (TESTID)"
      sign-windows: true
      win-artifact-glob: "*.exe,*.msi,*.msix"
      win-runs-on: windows-2025
    secrets:
      gpg-private-key: ${{ secrets.GPG_SECRET_KEY }}
      gpg-public-key: ${{ secrets.GPG_PUBLIC_KEY }}
      gpg-key-pass: ${{ secrets.GPG_PASS }}
      es-username: ${{ secrets.ES_USERNAME }}
      es-password: ${{ secrets.ES_PASSWORD }}
      credential_id: ${{ secrets.CREDENTIAL_ID }}
      es-totp_secret: ${{ secrets.ES_TOTP_SECRET }}
      es_ov_username: ${{ secrets.ES_OV_USERNAME }}
      es_ov_password: ${{ secrets.ES_OV_PASSWORD }}
      es_ov_credential_id: ${{ secrets.ES_OV_CREDENTIAL_ID }}
      es_ov_totp_secret: ${{ secrets.ES_OV_TOTP_SECRET }}
      apple-application-cert: ${{ secrets.APPLE_APPLICATION_CERT }}
      apple-installer-cert: ${{ secrets.APPLE_INSTALLER_CERT }}
      apple-cert-password: ${{ secrets.APPLE_CERT_PASSWORD }}
      apple-notarization-password: ${{ secrets.APPLE_NOTARIZATION_PASSWORD }}
      apple-id: ${{ secrets.APPLE_ID }}
      apple-team-id: ${{ secrets.APPLE_TEAM_ID }}

  verify:
    if: github.actor != 'dependabot[bot]'
    name: Verify Artifacts
    runs-on: ubuntu-latest
    needs: cicd-test
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download signed artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-artifacts
          path: verification/signed

      - name: Install bats
        run: |
          git clone https://github.com/bats-core/bats-core.git
          cd bats-core
          sudo ./install.sh /usr/local
          cd ..
          rm -rf bats-core

      - name: Run artifact verification tests
        working-directory: .github/workflows/artifacts-cicd
        run: |
          bats tests/test_artifacts_cicd.bats
        env:
          ARTIFACTS_DIR: ${{ github.workspace }}/verification/signed

  result:
    name: test_artifacts-cicd result
    if: always()
    needs: [changes, cicd-test, verify]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Fail if a job failed or was cancelled
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: jq -e 'all(.[]; . == "success" or . == "skipped")' <<<"$RESULTS"
