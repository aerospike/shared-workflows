name: Anchore Grype vulnerability scan

on:
  workflow_call:
    inputs:
      image:
        description: The Docker image to scan
        required: true
        type: string
      fail_build:
        description: Fail the build if vulnerabilities are found
        required: false
        default: true
        type: boolean
      severity_cutoff:
        description: The severity cutoff for vulnerabilities to report
        required: false
        default: medium
        type: string

permissions:
  contents: read

jobs:
  Anchore-Build-Scan:
    permissions:
      contents: read
      security-events: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build the Docker image
        env:
          IMAGE_NAME: ${{ inputs.image }}
        run: docker build . --file Dockerfile --tag $IMAGE_NAME
      - name: Run the Anchore Grype scan action
        uses: anchore/scan-action@d5aa5b6cb9414b0c7771438046ff5bcfa2854ed7 # v3.3.0
        id: scan
        with:
          image: ${{ inputs.image }}
          fail-build: ${{ inputs.fail_build }}
          severity-cutoff: ${{ inputs.severity_cutoff }}
      - name: Upload vulnerability report
        uses: github/codeql-action/upload-sarif@5c8a8a642e79153f5d047b10ec1cba1d1cc65699 # v3.35.1
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
