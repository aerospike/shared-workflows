name: GPG sign RPM
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
permissions: read-all
jobs:
  sign-rpm:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-22.04
          # - ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: setup GPG
        uses: ./.github/actions/setup-gpg/
        with:
          gpg-private-key: ${{ secrets.GPG_SECRET_KEY }}
          gpg-public-key: ${{ secrets.GPG_PUBLIC_KEY }}
          gpg-key-pass: ${{ secrets.GPG_PASS }}

      - name: Sign and check rpm # gpg sign and verify rpm packages
        env:
          GPG_TTY: /dev/null
          GNUPGHOME: /root/.gnupg
        run: |
          # Create symlink for gpg2 (required for rpm signing)
          ln -s $(which gpg) /usr/bin/gpg2

          # Sign the package
          rpm --addsign tests/*.rpm
          # Verify the signature
          rpm --checksig tests/*.rpm
