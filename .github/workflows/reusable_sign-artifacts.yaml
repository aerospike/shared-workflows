name: Sign Artifacts

on:
  workflow_call:
    inputs:
      # Optional inputs
      gh-artifact-name:
        description: Name to upload signed artifacts as
        required: false
        type: string
        default: signed-artifacts
      gh-checkout-path:
        description: Directory to checkout the shared-workflows repository into
        required: false
        type: string
        default: shared-workflows
      gh-workflows-ref:
        description: Git reference to checkout shared-workflows repository (tag, branch, or SHA)
        required: false
        type: string
        default: v2.0.1
      gh-retention-days:
        description: Retention days for the artifacts
        required: false
        type: number
        default: 1
      gh-unsigned-artifacts:
        description: uploaded artifacts to sign
        required: false
        type: string
        default: build-artifacts
      runs-on:
        description: The runner to use for the build
        required: false
        type: string
        default: ubuntu-22.04

    secrets:
      gpg-private-key:
        required: true
      gpg-public-key:
        required: true
      gpg-key-pass:
        required: true
    outputs:
      gh-artifact-name:
        description: The name of the uploaded signed artifacts on github
        value: ${{ jobs.sign.outputs.gh-artifact-name }}
permissions:
  contents: read
  id-token: write
jobs:
  sign:
    runs-on: ${{ inputs.runs-on }}
    outputs:
      gh-artifact-name: ${{ steps.sign-outputs.outputs.gh-artifact-name }}
    env:
      CHECKOUT_REF: ${{ inputs.gh-workflows-ref }}
    steps:
      - name: Download Unsigned Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.gh-unsigned-artifacts }}
          path: unsigned-artifacts
          merge-multiple: true

      - name: Checkout shared-workflows repository
        uses: actions/checkout@v5
        with:
          repository: aerospike/shared-workflows
          ref: ${{ env.CHECKOUT_REF }}
          path: ${{ inputs.gh-checkout-path }}
          fetch-depth: 1

      - name: Set up GPG
        uses: aerospike/shared-workflows/.github/actions/setup-gpg@dda8173aca1f1e73f95267572a7d3849cd00f1b8 # v1.0.0
        with:
          gpg-private-key: ${{ secrets.gpg-private-key }}
          gpg-public-key: ${{ secrets.gpg-public-key }}
          gpg-key-pass: ${{ secrets.gpg-key-pass }}
      - name: Install dpkg-sig
        run: |
          sudo apt-get update && sudo apt-get install dpkg-sig dpkg-dev -y
      - name: Sign Artifacts
        run: |
          chmod +x ${{ inputs.gh-checkout-path }}/.github/workflows/sign-artifacts/entrypoint.sh
          ${{ inputs.gh-checkout-path }}/.github/workflows/sign-artifacts/entrypoint.sh 'unsigned-artifacts/**/*' '${{ inputs.gh-artifact-name }}'
      - name: Upload Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.gh-artifact-name }}
          path: ${{ inputs.gh-artifact-name }}
          overwrite: true
          retention-days: ${{ inputs.gh-retention-days }}
      - name: Set Outputs
        id: sign-outputs
        run: |
          echo "gh-artifact-name=${{ inputs.gh-artifact-name }}" >> $GITHUB_OUTPUT
