name: Sign Artifacts

on:
  workflow_call:
    inputs:
      # Required inputs
      gh-workflows-ref:
        description: |
          Git reference for shared-workflows checkout. Should match the version in your 'uses:' line.
          GitHub Actions doesn't expose the called workflow's ref, so this is required.
          See: .github/workflows/docs/CICD-with-shared-actions.md#why-gh-workflows-ref-is-required
        required: true
        type: string

      # Optional inputs
      gh-artifact-name:
        description: Name to upload signed artifacts as
        required: false
        type: string
        default: signed-artifacts
      gh-checkout-path:
        description: Directory to checkout the shared-workflows repository into
        required: false
        type: string
        default: shared-workflows
      gh-retention-days:
        description: Retention days for the artifacts
        required: false
        type: number
        default: 1
      gh-unsigned-artifacts:
        description: uploaded artifacts to sign
        required: false
        type: string
        default: build-artifacts
      runs-on:
        description: The runner to use for the build
        required: false
        type: string
        default: ubuntu-22.04
      nuget-environment:
        description: The environment to use for the NuGet packages
        required: false
        type: string
        default: PROD

    secrets:
      gpg-private-key:
        required: true
      gpg-public-key:
        required: true
      gpg-key-pass:
        required: true
      es-username:
        required: false
      es-password:
        required: false
      credential_id:
        required: false
      es-totp_secret:
        required: false

    outputs:
      gh-artifact-name:
        description: The name of the uploaded signed artifacts on github
        value: ${{ jobs.sign.outputs.gh-artifact-name }}
permissions:
  contents: read
  id-token: write
jobs:
  sign:
    runs-on: ${{ inputs.runs-on }}
    outputs:
      gh-artifact-name: ${{ steps.sign-outputs.outputs.gh-artifact-name }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - name: Download Unsigned Artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: ${{ inputs.gh-unsigned-artifacts }}
          path: unsigned-artifacts
          merge-multiple: true
      - name: Get nuget packages
        id: nuget-packages
        run: |
          mkdir -p unsigned-nuget-packages
          find unsigned-artifacts -name "*.nupkg" -exec mv {} unsigned-nuget-packages/ \;
          echo "Found nuget packages: $(ls unsigned-nuget-packages/)"
          echo "count=$(ls unsigned-nuget-packages/ | wc -l)" >> $GITHUB_OUTPUT
      - name: Checkout shared-workflows repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: aerospike/shared-workflows
          ref: ${{ inputs.gh-workflows-ref }}
          path: ${{ inputs.gh-checkout-path }}
          fetch-depth: 1

      - name: Set up GPG
        uses: aerospike/shared-workflows/.github/actions/setup-gpg@489212b8911ea431131ed468599db705f0767274 # v2.0.2
        with:
          gpg-private-key: ${{ secrets.gpg-private-key }}
          gpg-public-key: ${{ secrets.gpg-public-key }}
          gpg-key-pass: ${{ secrets.gpg-key-pass }}
      - name: Prepare NuGet signing
        if: steps.nuget-packages.outputs.count > 0
        run: |
          if [ -z "${{ secrets.es-username }}" ] || [ -z "${{ secrets.es-password }}" ] || [ -z "${{ secrets.credential_id }}" ] || [ -z "${{ secrets.es-totp_secret }}" ]; then
            echo 'Error: NuGet packages found but required SSL.com secrets are missing. Please provide: es-username, es-password, credential_id, es-totp_secret' >&2
            exit 1
          fi
          mkdir -p ${{ inputs.gh-artifact-name }}/nuget
      - name: Sign NuGet Packages with SSL.com
        uses: sslcom/esigner-codesign@a272724cb13abe0abc579c6c40f7899969b6942b # v1.3.1
        if: steps.nuget-packages.outputs.count > 0
        with:
          command: batch_sign
          username: ${{ secrets.es-username }}
          password: ${{ secrets.es-password }}
          credential_id: ${{ secrets.credential_id }}
          totp_secret: ${{ secrets.es-totp_secret }}
          dir_path: unsigned-nuget-packages
          output_path: ${{ inputs.gh-artifact-name }}/nuget
          malware_block: true
          environment_name: ${{ inputs.nuget-environment }}
          clean_logs: true
          signing_method: v1

      - name: Install dpkg-sig
        run: |
          sudo apt-get update && sudo apt-get install dpkg-sig dpkg-dev -y
      - name: Sign Artifacts
        run: |
          entrypoint="${{ inputs.gh-checkout-path }}/.github/workflows/sign-artifacts/entrypoint.sh"
          chmod +x "$entrypoint"
          "$entrypoint" 'unsigned-artifacts/**/*' '${{ inputs.gh-artifact-name }}'
      - name: Upload Artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ inputs.gh-artifact-name }}
          path: ${{ inputs.gh-artifact-name }}
          overwrite: true
          retention-days: ${{ inputs.gh-retention-days }}
      - name: Set Outputs
        id: sign-outputs
        run: |
          echo "gh-artifact-name=${{ inputs.gh-artifact-name }}" >> $GITHUB_OUTPUT
