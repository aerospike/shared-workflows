name: Sign Artifacts

on:
  workflow_call:
    inputs:
      artifact-glob:
        description: Glob pattern to match artifacts to sign (e.g. dist/**/*.{jar,deb,rpm})
        required: true
        type: string
      artifact-name:
        description: Name for the uploaded artifacts
        required: false
        type: string
        default: signed-artifacts
      retention-days:
        description: Retention days for the artifacts
        required: false
        type: number
        default: 1
      artifactory-url:
        required: false
        description: JFrog Artifactory URL
        type: string
        default: https://aerospike.jfrog.io
      artifactory-oidc-provider-name:
        required: false
        description: OIDC provider name
        type: string
        default: gh-aerospike
      artifactory-oidc-audience:
        required: false
        description: OIDC audience
        type: string
        default: aerospike
      checkout-path:
        description: Directory to checkout the shared-workflows repository into
        required: false
        type: string
        default: shared-workflows

      runs-on:
        description: The runner to use for the build
        required: false
        type: string
        default: ubuntu-22.04

    secrets:
      gpg-private-key:
        required: true
      gpg-public-key:
        required: true
      gpg-key-pass:
        required: true
permissions:
  contents: read
  packages: read
jobs:
  sign:
    runs-on: ${{ inputs.runs-on }}
    env:
      CHECKOUT_REF: 722626ac96e0e8569ba587bd228b9468f6e49ead # Latest commit hash for development
    steps:
      - name: Checkout shared-workflows repository
        uses: actions/checkout@v5
        with:
          repository: aerospike/shared-workflows
          ref: ${{ env.CHECKOUT_REF }}
          path: ${{ inputs.checkout-path }}
          fetch-depth: 1

      - name: Set up GPG
        uses: aerospike/shared-workflows/.github/actions/setup-gpg@dda8173aca1f1e73f95267572a7d3849cd00f1b8 # v1.0.0
        with:
          gpg-private-key: ${{ secrets.gpg-private-key }}
          gpg-public-key: ${{ secrets.gpg-public-key }}
          gpg-key-pass: ${{ secrets.gpg-key-pass }}

      - name: Install dpkg-sig
        run: |
          sudo apt-get update && sudo apt-get install dpkg-sig dpkg-dev -y

      - name: Sign Artifacts
        run: |
          chmod +x ${{ inputs.checkout-path }}/.github/workflows/sign-artifacts/entrypoint.sh
          ${{ inputs.checkout-path }}/.github/workflows/sign-artifacts/entrypoint.sh "${{ inputs.artifact-glob }}" "${{ inputs.artifact-name }}"
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-name }}
          retention-days: ${{ inputs.retention-days }}
