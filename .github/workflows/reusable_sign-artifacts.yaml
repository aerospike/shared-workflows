name: Sign Artifacts

on:
  workflow_call:
    inputs:
      # Required inputs
      gh-workflows-ref:
        description: |
          Git reference for shared-workflows checkout. Should match the version in your 'uses:' line.
          GitHub Actions doesn't expose the called workflow's ref, so this is required.
          See: .github/workflows/docs/why-gh-workflows-ref.md
        required: true
        type: string

      # Optional inputs
      gh-artifact-name:
        description: Name to upload signed artifacts as
        required: false
        type: string
        default: signed-artifacts
      gh-checkout-path:
        description: Directory to checkout the shared-workflows repository into
        required: false
        type: string
        default: shared-workflows
      gh-retention-days:
        description: Retention days for the artifacts
        required: false
        type: number
        default: 1
      gh-unsigned-artifacts:
        description: uploaded artifacts to sign
        required: false
        type: string
        default: build-artifacts
      runs-on:
        description: The runner to use for the build
        required: false
        type: string
        default: ubuntu-22.04
      nuget-environment:
        description: The environment to use for the NuGet packages
        required: false
        type: string
        default: PROD

    secrets:
      gpg-private-key:
        required: true
      gpg-public-key:
        required: true
      gpg-key-pass:
        required: true
      es-username:
        required: false
      es-password:
        required: false
      credential_id:
        required: false
      es-totp_secret:
        required: false

    outputs:
      gh-artifact-name:
        description: The name of the uploaded signed artifacts on github
        value: ${{ jobs.sign.outputs.gh-artifact-name }}
permissions:
  contents: read
  id-token: write
jobs:
  sign:
    runs-on: ${{ inputs.runs-on }}
    outputs:
      gh-artifact-name: ${{ steps.sign-outputs.outputs.gh-artifact-name }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Download Unsigned Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.gh-unsigned-artifacts }}
          path: unsigned-artifacts
          merge-multiple: true
      - name: Get nuget packages
        id: nuget-packages
        run: |
          mkdir -p unsigned-nuget-packages
          find unsigned-artifacts -name "*.nupkg" -exec mv {} unsigned-nuget-packages/ \;
          echo "Found nuget packages: $(ls unsigned-nuget-packages/)"
          echo "count=$(ls unsigned-nuget-packages/ | wc -l)" >> $GITHUB_OUTPUT
      - name: Isolate Windows Authenticode binaries (skip GPG)
        id: windows-binaries
        run: |
          set -euo pipefail
          mkdir -p unsigned-windows-staging
          count=0
          while IFS= read -r -d '' f; do
            rel="${f#unsigned-artifacts/}"
            dest_dir="unsigned-windows-staging/unsigned-artifacts/$(dirname "$rel")"
            mkdir -p "$dest_dir"
            if [[ -f "${f}.asc" ]]; then
              mv "${f}.asc" "unsigned-windows-staging/unsigned-artifacts/${rel}.asc"
            fi
            mv "$f" "unsigned-windows-staging/unsigned-artifacts/$rel"
            count=$((count + 1))
          done < <(find unsigned-artifacts -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.msix' \) -print0 2>/dev/null || true)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Isolated $count Windows installer file(s) from GPG (Authenticode-only, mirrors NuGet isolation)"
      - name: Check for GPG-signable artifacts
        id: gpg-artifacts
        run: |
          set -euo pipefail
          # Count files left in unsigned-artifacts/ after NuGet and Windows
          # Authenticode isolation. Exclude detached signatures so an orphan
          # .asc never makes us spin up GPG with nothing to actually sign.
          count=$(find unsigned-artifacts -type f ! -name '*.asc' 2>/dev/null | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo "No GPG-signable artifacts remain after NuGet/Windows isolation; skipping GPG signing."
          else
            echo "Found $count file(s) for GPG signing."
          fi
      - name: Determine GPG signing eligibility
        id: gpg-signing
        run: |
          set -euo pipefail
          count="${{ steps.gpg-artifacts.outputs.count }}"
          if [ "$count" -eq 0 ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "reason=no-artifacts"
            exit 0
          fi
          if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "reason=dependabot"
            echo "GPG signing skipped: Dependabot workflows cannot access GPG secrets."
            exit 0
          fi
          if [ -z "${{ secrets.gpg-private-key }}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "reason=missing-secrets"
            echo "GPG signing skipped: gpg-private-key is unavailable."
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - name: Checkout shared-workflows repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: aerospike/shared-workflows
          ref: ${{ inputs.gh-workflows-ref }}
          path: ${{ inputs.gh-checkout-path }}
          fetch-depth: 1

      - name: Set up GPG
        if: steps.gpg-signing.outputs.enabled == 'true'
        uses: aerospike/shared-workflows/.github/actions/setup-gpg@d70905d2259d746d19783ecfc0ea5f337c1d5176 # v3.8.1
        with:
          gpg-private-key: ${{ secrets.gpg-private-key }}
          gpg-public-key: ${{ secrets.gpg-public-key }}
          gpg-key-pass: ${{ secrets.gpg-key-pass }}
      - name: Prepare NuGet signing
        if: steps.nuget-packages.outputs.count > 0
        run: |
          if [ -z "${{ secrets.es-username }}" ] || [ -z "${{ secrets.es-password }}" ] || [ -z "${{ secrets.credential_id }}" ] || [ -z "${{ secrets.es-totp_secret }}" ]; then
            echo 'Error: NuGet packages found but required SSL.com secrets are missing. Please provide: es-username, es-password, credential_id, es-totp_secret' >&2
            exit 1
          fi
          mkdir -p ${{ inputs.gh-artifact-name }}/nuget
      - name: Sign NuGet Packages with SSL.com
        uses: step-security/esigner-codesign@389e3735dd2b2a0b6c3daa02fac03723ac17ffe0 # v1.0.1
        if: steps.nuget-packages.outputs.count > 0
        with:
          command: batch_sign
          username: ${{ secrets.es-username }}
          password: ${{ secrets.es-password }}
          credential_id: ${{ secrets.credential_id }}
          totp_secret: ${{ secrets.es-totp_secret }}
          dir_path: unsigned-nuget-packages
          output_path: ${{ inputs.gh-artifact-name }}/nuget
          malware_block: true
          environment_name: ${{ inputs.nuget-environment }}
          clean_logs: true
          signing_method: v1

      - name: Install dpkg-sig
        if: steps.gpg-signing.outputs.enabled == 'true'
        run: |
          sudo apt-get update && sudo apt-get install dpkg-sig dpkg-dev -y
      - name: Sign Artifacts
        if: steps.gpg-signing.outputs.enabled == 'true'
        run: |
          entrypoint="${{ inputs.gh-checkout-path }}/.github/workflows/sign-artifacts/entrypoint.sh"
          chmod +x "$entrypoint"
          "$entrypoint" 'unsigned-artifacts/**/*' '${{ inputs.gh-artifact-name }}'
      - name: Stage unsigned artifacts when GPG signing skipped
        if: >-
          steps.gpg-artifacts.outputs.count != '0'
          && steps.gpg-signing.outputs.enabled != 'true'
        run: |
          set -euo pipefail
          dest='${{ inputs.gh-artifact-name }}'
          mkdir -p "$dest"
          shopt -s globstar nullglob
          for f in unsigned-artifacts/**/*; do
            [[ -f "$f" ]] || continue
            cp -v --parents "$f" "$dest/"
          done
          echo "Staged unsigned artifacts under $dest (GPG signing skipped: ${{ steps.gpg-signing.outputs.reason }})"
      - name: Restore Windows Authenticode binaries into signed output
        if: steps.windows-binaries.outputs.count != '0'
        run: |
          set -euo pipefail
          dest='${{ inputs.gh-artifact-name }}'
          mkdir -p "$dest"
          cp -a unsigned-windows-staging/. "$dest/"
          echo "Restored ${{ steps.windows-binaries.outputs.count }} Windows file(s) under $dest"
      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.gh-artifact-name }}
          path: ${{ inputs.gh-artifact-name }}
          overwrite: true
          retention-days: ${{ inputs.gh-retention-days }}
      - name: Set Outputs
        id: sign-outputs
        run: |
          echo "gh-artifact-name=${{ inputs.gh-artifact-name }}" >> $GITHUB_OUTPUT
