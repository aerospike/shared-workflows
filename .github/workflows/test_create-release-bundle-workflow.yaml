name: Test Create Release Bundle Workflow
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  # Do not replace this gate with a workflow-level paths: filter. The ruleset
  # requires the result check, and a workflow skipped by paths: never reports it.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Check whether the pull request changes a tested path
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TESTED_PATHS: >-
            ^\.github/workflows/reusable_create-release-bundle\.yaml$
            ^\.github/workflows/reusable_promote-release-bundle\.yaml$
            ^\.github/workflows/create-release-bundle/
            ^\.github/workflows/promote-release-bundle/
            ^\.github/workflows/lib/
            ^\.github/actions/delete-release-bundle/
            ^\.github/gates/
            ^\.github/workflows/test_create-release-bundle-workflow\.yaml$
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "run=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          read -ra patterns <<<"$TESTED_PATHS"
          regex=$(IFS='|'; echo "${patterns[*]}")
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)')
          if grep -qE "$regex" <<<"$files"; then
            echo "run=true" >>"$GITHUB_OUTPUT"
          else
            echo "run=false" >>"$GITHUB_OUTPUT"
          fi

  test-create-release-bundle-workflow:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    uses: ./.github/workflows/reusable_create-release-bundle.yaml
    with:
      gh-workflows-ref: ${{ github.sha }}
      jf-project: test
      jf-build-names: test-build-1:1728052628123,test-build-2:1728052628123
      jf-bundle-name: test-release-bundle
      version: v1.0.0
      jf-url: https://artifact.aerospike.io
      # gh-checkout-path defaults to 'shared-workflows'
      oidc-provider-name: gh-aerospike
      oidc-audience: aerospike
      dry-run: true

  # dry-run must stay true: this runs against real JFrog.
  test-promote-release-bundle-workflow:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    uses: ./.github/workflows/reusable_promote-release-bundle.yaml
    permissions:
      attestations: write
      contents: read
      id-token: write
    with:
      gh-workflows-ref: ${{ github.sha }}
      gh-checkout-path: .
      jf-project: test
      jf-bundle-name: test-promote-guard-probe
      version: v1.0.0
      target-stage: DEV
      dry-run: true

  run-tests:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install jq -y
          pipx install check-jsonschema==0.38.2
      - name: Setup bats
        uses: bats-core/bats-action@3566550e0f594451ac0f58fcbfdeca93aa29a45e # 4.1.0
        with:
          bats-version: 1.12.0
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false
      - name: Test Entrypoint
        run: |
          .github/workflows/create-release-bundle/test-entrypoint.sh
      - name: Revision plumbing tests
        run: bats .github/workflows/create-release-bundle/tests/bats/
      - name: Delete guard tests
        run: bats .github/actions/delete-release-bundle/tests/bats/
      - name: Promotion tests
        run: bats .github/workflows/promote-release-bundle/tests/bats/

  result:
    name: test_create-release-bundle-workflow result
    if: always()
    needs:
      [
        changes,
        test-create-release-bundle-workflow,
        test-promote-release-bundle-workflow,
        run-tests,
      ]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Fail if a job failed or was cancelled
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: jq -e 'all(.[]; . == "success" or . == "skipped")' <<<"$RESULTS"
