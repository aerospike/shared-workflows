name: "Test: Notify Slack"
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  run-tests:
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install bats
        run: |
          git clone https://github.com/bats-core/bats-core.git
          cd bats-core
          sudo ./install.sh /usr/local
          cd ..
          rm -rf bats-core

      - name: Run send-slack unit tests
        run: python3 -m unittest discover .github/actions/send-slack/tests -p 'test_slack_post.py' -v

      - name: Run send-slack bats tests
        run: bats .github/actions/send-slack/tests/test_slack_post.bats

      - name: Run notify-slack unit tests
        run: python3 -m unittest discover .github/actions/notify-slack/tests -v

      - name: Run notify-slack bats tests
        run: bats .github/actions/notify-slack/tests/test_prep_blockkit.bats
