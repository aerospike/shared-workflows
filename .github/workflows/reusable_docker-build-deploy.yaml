name: Reusable Docker Build, Publish & Attest

on:
  workflow_call:
    inputs:
      # Required inputs
      app-version:
        type: string
        required: true
        description: Version of the application
      image-name:
        type: string
        required: true
        description: Docker image name (repository component, without registry). Used to construct the full image path (e.g., "test-image" becomes "registry/project-repo/test-image:tag")
      jf-project:
        type: string
        required: true
        description: JFrog project key

      # Optional inputs
      app-name:
        type: string
        required: false
        description: Human-readable application name for OCI labels (defaults to image-name). Can differ from image-name for display purposes (e.g., image-name="aerospike-server-enterprise", app-name="Aerospike Server Enterprise")
      attest:
        type: boolean
        default: true
        description: Generate SLSA build-provenance attestation
      build-args-json:
        type: string
        default: "{}"
        description: JSON object of build-args passed to docker build # {"KEY":"VALUE",...}
      context:
        type: string
        default: .
        description: Docker build context directory
      file:
        type: string
        default: Dockerfile
        description: Path to Dockerfile (relative to context)
      gh-context-artifacts-json:
        type: string
        default: ""
        description: >-
          JSON array of same-run GitHub artifacts to place inside the Docker
          build context before the image build, e.g.
          [{"name":"signed-artifacts","dest":"artifacts"}]. Each dest is a
          relative path under the build context root and must not already
          exist. Unset means no artifacts are placed.
      jf-build-name:
        type: string
        required: false
        description: Build name for JFrog build-info (defaults to workflow name)
      jf-registry:
        type: string
        required: false
        description: Full Docker registry URL including repository path (e.g., artifact.aerospike.io/test-docker-dev-local) # should be full uri for Artifactory registry eg artifact.aerospike.io/test-docker-dev-local
      jf-registry-base:
        type: string
        default: artifact.aerospike.io
        description: Registry hostname (no repo path)
      jf-url:
        type: string
        default: https://artifact.aerospike.io
        description: Base JFrog Artifactory URL
      labels-json:
        type: string
        default: "{}"
        description: JSON object of image labels # {"key":"value",...}
      oidc-audience:
        type: string
        default: aerospike
        description: OIDC audience value for token
      oidc-provider-name:
        type: string
        default: gh-aerospike
        description: JFrog OIDC provider name
      platforms:
        type: string
        default: linux/amd64,linux/arm64
        description: Comma-separated target platforms for buildx # pass-through
      provenance:
        type: string
        default: mode=max
        description: BuildKit provenance setting ('', 'false', or 'mode=max') # "", "false", or "mode=max"
      push:
        type: boolean
        default: true
        description: Whether to push the image. On a dry run (push=false) the digest and image-ref outputs are empty; tags and immutable-tag are still computed.
      repo-scope:
        type: string
        default: -docker-dev-local
        description: Repository suffix appended to jf-project (e.g., -docker-preview-public-local) # e.g. "-docker-preview-public-local"
      sbom:
        type: boolean
        default: true
        description: Enable SBOM generation (pass-through to docker/build-push-action)
      jf-go-repo:
        type: string
        required: false
        description: >-
          JFrog Go repository name for GOPROXY (e.g., "platforms-go-virtual").
          When set, a "goproxy" build secret is injected with the authenticated
          URL. Typically a virtual repo (aggregates private locals + public
          remote cache), but can be any Go repo type.
      versions-override:
        type: string
        required: false
        description: |
          Override the tags generated by the workflow (other than the immutable tag which is always generated).
          Format: comma separated list of versions eg "tag1,tag2,tag3"
          If not provided, the versions used in the tags (for app version 3.2.1) would be "3.2.1_20251202T021054Z, 3.2.1, 3, latest"
          Setting this value to "dev" would cause the versions to be "3.2.1_20251202T021054Z, dev". Only version is settable in this way. App name, repository scope, and app version are calculated.
    secrets:
      build-secrets-json:
        required: false
        description: >-
          JSON object of additional build secrets {"name": "value", ...}.
          Each is available in Dockerfile via: RUN --mount=type=secret,id=name
    outputs:
      digest:
        description: Image manifest-list (index) digest
        value: ${{ jobs.merge.outputs.digest }}
      image-ref:
        description: Primary tag with @digest
        value: ${{ jobs.merge.outputs.image-ref }}
      tags:
        description: Comma separated list of tags used
        value: ${{ jobs.merge.outputs.tags }}
      immutable-tag:
        description: Immutable tag (registry/image:version_timestamp)
        value: ${{ jobs.merge.outputs.immutable-tag }}

# INFRA-560: the single build job is split into per-platform native legs plus a
# merge job. Each platform is built on its own native runner (QEMU only for
# platforms without one), each job mints its own short-lived OIDC token, legs
# push by digest, and the merge job assembles one multi-platform manifest,
# publishes one build-info record, and attests. Internal job names/topology are
# NOT part of the workflow_call contract; the inputs/outputs surface above is.
jobs:
  # Parse the arbitrary `platforms` input into a build matrix, mapping each
  # platform to a native runner (QEMU fallback for any without one). A static
  # strategy.matrix cannot read an input at parse time, so we emit it here.
  parse-platforms:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.parse.outputs.matrix }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Parse platforms into matrix
        id: parse
        shell: bash
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          entries=()
          declare -A seen
          IFS=',' read -ra arr <<< "$PLATFORMS"
          for p in "${arr[@]}"; do
            # trim surrounding whitespace
            p="$(echo "$p" | xargs)"
            [ -z "$p" ] && continue
            # Dedupe by platform. A repeated platform would otherwise produce
            # two legs with the same sanitized name and colliding digest/legmeta
            # artifact uploads (a hard 409: same artifact name twice in one run).
            if [ -n "${seen[$p]:-}" ]; then
              echo "::warning::duplicate platform '$p' ignored"
              continue
            fi
            seen[$p]=1
            sanitized="${p//\//-}"
            # Native runner mapping. arm64 and amd64 have GitHub-hosted native
            # runners; anything else falls back to QEMU emulation on amd64. The
            # mapping is internal (consumers only pass `platforms`); the QEMU
            # fallback is intentional. Do NOT add a hard-fail guard for
            # unrecognized platforms: consumers may pass exotic platforms
            # expecting emulation.
            case "$p" in
              linux/amd64) runner="ubuntu-24.04";     qemu=false ;;
              linux/arm64) runner="ubuntu-24.04-arm"; qemu=false ;;
              *)           runner="ubuntu-24.04";     qemu=true  ;;
            esac
            entries+=("$(jq -nc \
              --arg platform "$p" \
              --arg runner "$runner" \
              --arg sanitized "$sanitized" \
              --argjson qemu "$qemu" \
              '{platform: $platform, runner: $runner, sanitized: $sanitized, qemu: $qemu}')")
          done
          if [ "${#entries[@]}" -eq 0 ]; then
            echo "::error::no platforms parsed from input '$PLATFORMS'"
            exit 1
          fi
          matrix="$(printf '%s\n' "${entries[@]}" | jq -sc '.')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Parsed platform matrix: $matrix"

  # Per-platform build leg. Builds one platform on its mapped runner, mints its
  # own OIDC token, pushes the image BY DIGEST (no tags), and uploads the digest
  # plus per-leg metadata as artifacts for the merge job. No build-info, no
  # attestation here.
  build:
    needs: parse-platforms
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.parse-platforms.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      JFROG_CLI_BUILD_NAME: ${{ inputs.jf-build-name || github.workflow }}
      JFROG_CLI_LOG_LEVEL: INFO
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Bytes a caller asks for are placed in the build context here, between
      # the checkout that creates the context and the build that reads it. That
      # is the only window a caller cannot reach itself: COPY cannot read
      # outside the context, and a job invoked with `uses:` cannot add steps.
      # Running before the OIDC token is minted means a bad input costs nothing.
      - name: Validate build-context artifacts
        id: ctx_artifacts
        if: ${{ inputs.gh-context-artifacts-json != '' }}
        shell: bash
        env:
          CONTEXT_ARTIFACTS_JSON: ${{ inputs.gh-context-artifacts-json }}
        run: |
          set -euo pipefail

          json="${CONTEXT_ARTIFACTS_JSON:-}"

          fail() {
            echo "::error::gh-context-artifacts-json: $*"
            exit 1
          }

          if ! printf '%s' "$json" | jq -e . >/dev/null 2>&1; then
            fail "input is not valid JSON"
          fi
          if ! printf '%s' "$json" | jq -e 'type == "array"' >/dev/null 2>&1; then
            fail "input must be a JSON array, got $(printf '%s' "$json" | jq -r 'type')"
          fi

          count="$(printf '%s' "$json" | jq 'length')"
          if [ "$count" -eq 0 ]; then
            echo "::notice::gh-context-artifacts-json is an empty array; no artifacts will be placed"
            {
              echo "count=0"
              echo "pattern="
              echo "entries=[]"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Shape first, so the per-entry rules below can assume two strings.
          malformed="$(printf '%s' "$json" | jq -r '
            to_entries
            | map(select(
                (.value | type) != "object"
                or (.value.name | type) != "string"
                or (.value.dest | type) != "string"
                or (.value.name == "")
                or (.value.dest == "")
              ))
            | if length > 0 then (.[0].key | tostring) else "" end
          ')"
          if [ -n "$malformed" ]; then
            fail "entry $malformed must be an object with non-empty string \"name\" and \"dest\""
          fi

          declare -A seen_names seen_dests
          names=()

          for i in $(seq 0 $((count - 1))); do
            name="$(printf '%s' "$json" | jq -r --argjson i "$i" '.[$i].name')"
            dest="$(printf '%s' "$json" | jq -r --argjson i "$i" '.[$i].dest')"

            # The charset also keeps minimatch metacharacters out of the
            # download pattern built at the end of this step.
            if ! [[ $name =~ ^[A-Za-z0-9._-]+$ ]]; then
              fail "entry $i name \"$name\" must match ^[A-Za-z0-9._-]+\$"
            fi
            # Separate from the charset rule, and not redundant with it: "." and
            # ".." are made only of permitted characters. actions/download-artifact
            # joins the name onto the staging path, so ".." would resolve the
            # per-artifact directory to RUNNER_TEMP itself and the later
            # "contains a regular file" assertion would pass against it.
            if [ "$name" = "." ] || [ "$name" = ".." ]; then
              fail "entry $i name \"$name\" is a path traversal"
            fi
            if [ -n "${seen_names[$name]:-}" ]; then
              fail "entry $i name \"$name\" is a duplicate"
            fi
            seen_names[$name]=1

            if [ "${dest:0:1}" = "/" ]; then
              fail "entry $i dest \"$dest\" must be relative to the build context root"
            fi
            # Charset is not implied by the traversal rules below: "-rf" passes
            # every one of them. Reaching a run: block through env: stops
            # interpolation, not a leading dash being read as an option by mv.
            if ! [[ $dest =~ ^[A-Za-z0-9._/-]+$ ]]; then
              fail "entry $i dest \"$dest\" must match ^[A-Za-z0-9._/-]+\$"
            fi
            # A trailing slash is not caught by the segment loop below, because
            # splitting on '/' discards the trailing empty field. Left in, it
            # would defeat the duplicate-dest rule: "x" and "x/" compare as
            # different strings but name the same directory.
            if [ "${dest: -1}" = "/" ]; then
              fail "entry $i dest \"$dest\" must not end with \"/\""
            fi
            # Per segment, so that a legitimate "a..b" is kept and a "..", an
            # empty segment from a doubled slash, or an option-like segment is
            # rejected.
            IFS='/' read -ra segments <<< "$dest"
            for seg in ${segments[@]+"${segments[@]}"}; do
              if [ -z "$seg" ]; then
                fail "entry $i dest \"$dest\" has an empty path segment"
              fi
              if [ "$seg" = "." ] || [ "$seg" = ".." ]; then
                fail "entry $i dest \"$dest\" contains a \"$seg\" segment"
              fi
              if [ "${seg:0:1}" = "-" ]; then
                fail "entry $i dest \"$dest\" has a segment beginning with \"-\""
              fi
            done
            if [ -n "${seen_dests[$dest]:-}" ]; then
              fail "entry $i dest \"$dest\" is a duplicate"
            fi
            seen_dests[$dest]=1

            names+=("$name")
          done

          # minimatch does not expand a one-element brace, so "{foo}" matches the
          # literal string "{foo}" and would download nothing.
          if [ "${#names[@]}" -eq 1 ]; then
            pattern="${names[0]}"
          else
            joined="$(printf '%s,' "${names[@]}")"
            pattern="{${joined%,}}"
          fi

          {
            echo "count=$count"
            echo "pattern=$pattern"
            echo "entries=$(printf '%s' "$json" | jq -c '.')"
          } >> "$GITHUB_OUTPUT"

          echo "Validated $count build-context artifact(s); download pattern: $pattern"

      # An empty `count` means the validate step was skipped, so the caller
      # asked for nothing. A zero `count` means an explicit empty array.
      - name: Download build-context artifacts
        if: ${{ steps.ctx_artifacts.outputs.count != '' && steps.ctx_artifacts.outputs.count != '0' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/context-artifacts
          pattern: ${{ steps.ctx_artifacts.outputs.pattern }}
          # One directory per artifact, named after it, which is what the next
          # step resolves each entry against.
          merge-multiple: false

      # A pattern matching nothing is silent in actions/download-artifact, so
      # the assertions here are the only thing standing between an artifact the
      # caller named and a green build with an empty COPY.
      - name: Place build-context artifacts
        if: ${{ steps.ctx_artifacts.outputs.count != '' && steps.ctx_artifacts.outputs.count != '0' }}
        shell: bash
        env:
          CONTEXT_ARTIFACTS_ENTRIES: ${{ steps.ctx_artifacts.outputs.entries }}
          BUILD_CONTEXT: ${{ inputs.context }}
        run: |
          set -euo pipefail

          entries="${CONTEXT_ARTIFACTS_ENTRIES:-}"
          context="${BUILD_CONTEXT:-.}"
          staging="${RUNNER_TEMP}/context-artifacts"

          fail() {
            echo "::error::gh-context-artifacts-json: $*"
            exit 1
          }

          if [ ! -d "$context" ]; then
            fail "build context \"$context\" is not a directory"
          fi
          context_root="$(realpath -- "$context")"

          count="$(printf '%s' "$entries" | jq 'length')"
          for i in $(seq 0 $((count - 1))); do
            name="$(printf '%s' "$entries" | jq -r --argjson i "$i" '.[$i].name')"
            dest="$(printf '%s' "$entries" | jq -r --argjson i "$i" '.[$i].dest')"
            src="${staging}/${name}"

            if [ ! -d "$src" ]; then
              fail "artifact \"$name\" was not downloaded; no artifact by that name exists in this run"
            fi

            # Symlinks, fifos and sockets never enter the build context. A
            # directory holding one regular file plus a symlink would satisfy
            # the emptiness check below and carry the symlink in with it.
            irregular="$(find "$src" -mindepth 1 ! -type d ! -type f -print -quit)"
            if [ -n "$irregular" ]; then
              fail "artifact \"$name\" contains a non-regular file: ${irregular#"${src}/"}"
            fi

            file_count="$(find "$src" -type f -printf '.' | wc -c | tr -d ' ')"
            if [ "$file_count" -eq 0 ]; then
              fail "artifact \"$name\" contains no regular files"
            fi
            bytes="$(find "$src" -type f -printf '%s\n' | awk '{ total += $1 } END { print total + 0 }')"

            target="${context_root}/${dest}"
            if [ -e "$target" ] || [ -L "$target" ]; then
              fail "destination \"$dest\" already exists in the build context"
            fi

            # realpath -m resolves through existing symlinks, so a committed
            # "vendor -> /" plus a dest of "vendor/out" would land outside the
            # context while still looking contained. Refuse rather than follow.
            probe="$(dirname -- "$target")"
            while [ "$probe" != "$context_root" ] && [ "$probe" != "/" ]; do
              if [ -L "$probe" ]; then
                fail "destination \"$dest\" traverses a symlink at \"${probe#"${context_root}/"}\""
              fi
              probe="$(dirname -- "$probe")"
            done

            # Exact comparison. A bare prefix test would accept a sibling whose
            # name merely starts with the context root, such as /w/repo-evil
            # against /w/repo.
            resolved="$(realpath -m -- "$target")"
            if [ "$resolved" != "$context_root" ] && [ "${resolved#"${context_root}/"}" = "$resolved" ]; then
              fail "destination \"$dest\" resolves outside the build context root"
            fi

            mkdir -p -- "$(dirname -- "$target")"
            mv -- "$src" "$target"

            echo "Placed \"$name\" at \"$dest\": $file_count file(s), $bytes byte(s)"
          done

      - name: Install JFrog CLI
        id: jf
        uses: step-security/setup-jfrog-cli@3054b554c0fb4915b3d58847fb7730c593dbb934 # v5.0.0
        env:
          JF_URL: ${{ inputs.jf-url }}
          JF_PROJECT: ${{ inputs.jf-project }}
          JFROG_CLI_BUILD_NAME: ${{ inputs.jf-build-name || github.workflow }}
        with:
          version: 2.78.8
          oidc-provider-name: ${{ inputs.oidc-provider-name }}
          oidc-audience: ${{ inputs.oidc-audience }}

      - name: Record token fetch time
        id: token_time
        shell: bash
        run: echo "fetched_at=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - name: Compute registry
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          reg='${{ inputs.jf-registry }}'
          if [ -z "$reg" ]; then
            reg='${{ inputs.jf-registry-base }}/${{ inputs.jf-project }}${{ inputs.repo-scope }}'
          fi
          echo "registry=$reg" >> "$GITHUB_OUTPUT"

      - name: Docker login to Artifactory
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ steps.registry.outputs.registry }}
          username: ${{ steps.jf.outputs.oidc-user }}
          password: ${{ steps.jf.outputs.oidc-token }}

      - name: Set up QEMU
        if: ${{ matrix.qemu }}
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: step-security/setup-buildx-action@6997872a55d77391e51b87609556578131f44402 # v4.1.0

      - name: Prepare build args/labels
        shell: bash
        run: |
          set -euo pipefail
          to_kv() { jq -r 'to_entries|map("\(.key)=\(.value)")|.[]'; }

          # Generate OCI labels
          oci_labels=$(jq -n \
            --arg title "${{ inputs.app-name || inputs.image-name }}" \
            --arg version "${{ inputs.app-version }}" \
            --arg created "$(date --utc -Iseconds)" \
            --arg revision "${{ github.sha }}" \
            --arg source "${{ github.server_url }}/${{ github.repository }}" \
            --arg url "${{ github.server_url }}/${{ github.repository }}" \
            '{
              "org.opencontainers.image.title": $title,
              "org.opencontainers.image.version": $version,
              "org.opencontainers.image.created": $created,
              "org.opencontainers.image.revision": $revision,
              "org.opencontainers.image.source": $source,
              "org.opencontainers.image.url": $url
            }')

          # Merge user labels with OCI labels (user labels override)
          user_labels='${{ inputs.labels-json }}'
          merged_labels=$(jq -n --argjson oci "$oci_labels" --argjson user "$user_labels" '$oci * $user')

          # Convert JSON to KEY=VALUE lines
          echo '${{ inputs.build-args-json }}' | to_kv > /tmp/build_args
          echo "$merged_labels" | to_kv > /tmp/labels

          # NOTE: the JFrog/OIDC token is intentionally NOT passed as a build-arg.
          # Build-args persist in image history and provenance. The token reaches
          # the build only via the jfrog_token secret-file mount (see below).

          # Use heredoc syntax so multi-line values are preserved in GITHUB_ENV
          {
            echo "BUILD_ARGS<<EOF"
            cat /tmp/build_args
            echo "EOF"
            echo "LABELS<<EOF"
            cat /tmp/labels
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Prepare build secrets
        shell: bash
        env:
          # Pass OIDC credentials via env (not command-line args) so the token
          # is never exposed in the process list, and so values are available
          # to jq for safe URL-encoding below. Built from THIS leg's own token.
          OIDC_USER: ${{ steps.jf.outputs.oidc-user }}
          OIDC_TOKEN: ${{ steps.jf.outputs.oidc-token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/docker-secrets

          # Delta 1: Always inject OIDC token as a build secret
          printf '%s' "$OIDC_TOKEN" > /tmp/docker-secrets/jfrog_token

          # Delta 2: Construct authenticated GOPROXY URL when jf-go-repo is set
          jf_go_repo='${{ inputs.jf-go-repo }}'
          if [ -n "$jf_go_repo" ]; then
            # Percent-encode the user and token before embedding them in the URL
            # userinfo component. OIDC users/tokens can contain reserved chars
            # (e.g. '@', ':', '/', '+') that would otherwise corrupt the URL and
            # break the HTTP request to Artifactory.
            oidc_user_enc=$(jq -rn 'env.OIDC_USER | @uri')
            oidc_token_enc=$(jq -rn 'env.OIDC_TOKEN | @uri')
            printf '%s' "https://${oidc_user_enc}:${oidc_token_enc}@${{ inputs.jf-registry-base }}/artifactory/api/go/${jf_go_repo}" \
              > /tmp/docker-secrets/goproxy
          fi

          # Delta 3: Write consumer-provided secrets from JSON
          secrets_json='${{ secrets.build-secrets-json }}'
          if [ -n "$secrets_json" ] && [ "$secrets_json" != "{}" ]; then
            # Validate key names before using them as filenames. Keys become
            # paths under /tmp/docker-secrets, so reject anything outside a safe
            # charset (no '/', '..', etc.). Reject, do not sanitize.
            if echo "$secrets_json" | jq -r 'keys[]' | grep -qvE '^[a-zA-Z0-9_-]+$'; then
              echo "::error::build-secrets-json contains an invalid key name; keys must match ^[a-zA-Z0-9_-]+$"
              exit 1
            fi
            echo "$secrets_json" | jq -r 'to_entries[] | "\(.key)\n\(.value)"' | \
              while IFS= read -r key && IFS= read -r value; do
                echo -n "$value" > "/tmp/docker-secrets/$key"
              done
          fi

          # Lock down secret files: readable only by the runner process user.
          chmod 600 /tmp/docker-secrets/* 2>/dev/null || true

          # Generate secret-files lines (only file paths, not values)
          secret_files=""
          for f in /tmp/docker-secrets/*; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            secret_files+="${name}=${f}"$'\n'
          done
          {
            echo "BUILD_SECRET_FILES<<EOF"
            echo -n "$secret_files"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          platforms: ${{ matrix.platform }}
          provenance: ${{ inputs.provenance }}
          sbom: ${{ inputs.sbom }}
          build-args: ${{ env.BUILD_ARGS }}
          labels: ${{ env.LABELS }}
          secret-files: ${{ env.BUILD_SECRET_FILES }}
          # GHA build-step cache (mode=max). Caches expensive builder stages;
          # scoped per platform so legs do not collide. Nothing is written to
          # JFrog (no dev-local cache-exposure surface).
          cache-from: type=gha,scope=${{ matrix.sanitized }}
          cache-to: type=gha,mode=max,scope=${{ matrix.sanitized }}
          # Push by digest, no tags. The merge job assembles the tagged manifest.
          outputs: type=image,name=${{ steps.registry.outputs.registry }}/${{ inputs.image-name }},push-by-digest=true,name-canonical=true,push=${{ inputs.push }}

      - name: Record push time
        id: push_time
        shell: bash
        run: echo "pushed_at=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - name: Cleanup build secrets
        if: always()
        shell: bash
        run: rm -rf /tmp/docker-secrets

      - name: Export digest and leg metadata
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
          SANITIZED: ${{ matrix.sanitized }}
          RUNNER_ARCH: ${{ runner.arch }}
          FETCHED_AT: ${{ steps.token_time.outputs.fetched_at }}
          PUSHED_AT: ${{ steps.push_time.outputs.pushed_at }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/digests" "${RUNNER_TEMP}/legmeta"
          # buildx-by-digest convention: an empty file named after the digest.
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
          # Per-leg metadata for test assertions (runner arch, token timing).
          jq -nc \
            --arg platform "$PLATFORM" \
            --arg digest "$DIGEST" \
            --arg runner_arch "$RUNNER_ARCH" \
            --arg fetched_at "$FETCHED_AT" \
            --arg pushed_at "$PUSHED_AT" \
            '{platform:$platform, digest:$digest, runner_arch:$runner_arch, token_fetched_at:($fetched_at|tonumber), push_completed_at:($pushed_at|tonumber)}' \
            > "${RUNNER_TEMP}/legmeta/${SANITIZED}.json"

      # Artifact names are namespaced by image-name so the workflow can be
      # invoked more than once in a single run (e.g. several images, or a
      # multi-platform plus a single-platform build) without colliding. The
      # `--` delimiter avoids glob prefix-collision between names where one is a
      # prefix of another (e.g. "test-image" vs "test-image-single"). image-name
      # must not contain `--` or characters illegal in artifact names.
      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ inputs.image-name }}--${{ matrix.sanitized }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Upload leg metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: legmeta-${{ inputs.image-name }}--${{ matrix.sanitized }}
          path: ${{ runner.temp }}/legmeta/*
          if-no-files-found: error
          retention-days: 1

  # Merge job: assemble one multi-platform manifest from the per-leg digests,
  # compute tags, publish one build-info record (under the unchanged build
  # number), and attest the manifest-list digest. Output-producing job.
  merge:
    needs: [parse-platforms, build]
    runs-on: ubuntu-24.04
    env:
      JFROG_CLI_BUILD_NAME: ${{ inputs.jf-build-name || github.workflow }}
      JFROG_CLI_LOG_LEVEL: INFO
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
      image-ref: ${{ steps.manifest.outputs.image-ref }}
      tags: ${{ steps.tags.outputs.tags }}
      immutable-tag: ${{ steps.tags.outputs.immutable-tag }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install JFrog CLI
        id: jf
        uses: step-security/setup-jfrog-cli@3054b554c0fb4915b3d58847fb7730c593dbb934 # v5.0.0
        env:
          JF_URL: ${{ inputs.jf-url }}
          JF_PROJECT: ${{ inputs.jf-project }}
          JFROG_CLI_BUILD_NAME: ${{ inputs.jf-build-name || github.workflow }}
        with:
          version: 2.78.8
          oidc-provider-name: ${{ inputs.oidc-provider-name }}
          oidc-audience: ${{ inputs.oidc-audience }}

      - name: Compute registry
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          reg='${{ inputs.jf-registry }}'
          if [ -z "$reg" ]; then
            reg='${{ inputs.jf-registry-base }}/${{ inputs.jf-project }}${{ inputs.repo-scope }}'
          fi
          echo "registry=$reg" >> "$GITHUB_OUTPUT"

      - name: Docker login to Artifactory
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ steps.registry.outputs.registry }}
          username: ${{ steps.jf.outputs.oidc-user }}
          password: ${{ steps.jf.outputs.oidc-token }}

      - uses: step-security/setup-buildx-action@6997872a55d77391e51b87609556578131f44402 # v4.1.0

      - name: Compute tags
        id: tags
        shell: bash
        run: |
          base="${{ steps.registry.outputs.registry }}/${{ inputs.image-name }}"
          timestamp=$(date --utc +%Y%m%dT%H%M%SZ)

          # Extract major version (handle 'v' prefix, take first number before first dot)
          app_version="${{ inputs.app-version }}"
          app_version="${app_version#v}"  # Strip 'v' prefix if present
          # OCI tags forbid '+' but SemVer build metadata uses it (e.g. 1.2.3+abc).
          # Replace with '-' so SemVer inputs still produce valid image tags.
          app_version="${app_version//+/-}"
          major_version="${app_version%%.*}"  # Extract first number before first dot

          # Build immutable tag (always included)
          immutable="${base}:${app_version}_${timestamp}"

          # Build tags array: always start with immutable tag
          tags_array=("${immutable}")

          if [ -n "${{ inputs.versions-override }}" ]; then
            # Parse comma-separated override tags and prepend base
            IFS=',' read -ra override_tags <<< "${{ inputs.versions-override }}"
            for tag in "${override_tags[@]}"; do
              # Trim whitespace and prepend base
              tag=$(echo "$tag" | xargs)
              if [ -n "$tag" ]; then
                tags_array+=("${base}:${tag}")
              fi
            done
          else
            # Default tags: immutable, version, major version, and latest
            tags_array+=("${base}:${app_version}" "${base}:${major_version}" "${base}:latest")
          fi

          # Join tags with comma for output
          IFS=','
          tags="${tags_array[*]}"

          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "immutable-tag=${immutable}" >> "$GITHUB_OUTPUT"

      - name: Download per-leg digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          # Scoped to this invocation's image-name (see upload namespacing note).
          pattern: digests-${{ inputs.image-name }}--*
          merge-multiple: true

      - name: Create multi-platform manifest
        id: manifest
        shell: bash
        env:
          REGISTRY: ${{ steps.registry.outputs.registry }}
          IMAGE: ${{ inputs.image-name }}
          TAGS: ${{ steps.tags.outputs.tags }}
          IMMUTABLE_TAG: ${{ steps.tags.outputs.immutable-tag }}
          PUSH: ${{ inputs.push }}
        run: |
          set -euo pipefail
          if [ "$PUSH" != "true" ]; then
            echo "push=false; skipping manifest assembly"
            echo "image-ref=" >> "$GITHUB_OUTPUT"
            echo "digest=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # -t for every requested tag
          tag_args=()
          IFS=',' read -ra TAGS_ARR <<< "$TAGS"
          for t in "${TAGS_ARR[@]}"; do
            tag_args+=("-t" "$t")
          done

          # source refs: registry/image@sha256:<digest> for each leg digest file
          src_args=()
          shopt -s nullglob
          for f in "${RUNNER_TEMP}/digests"/*; do
            src_args+=("${REGISTRY}/${IMAGE}@sha256:$(basename "$f")")
          done
          if [ "${#src_args[@]}" -eq 0 ]; then
            echo "::error::no per-leg digests found to assemble"
            exit 1
          fi

          docker buildx imagetools create "${tag_args[@]}" "${src_args[@]}"

          # The manifest-list (index) digest is what consumers pull and what we
          # attest. Read it back from the immutable tag.
          digest="$(docker buildx imagetools inspect "$IMMUTABLE_TAG" --format '{{json .Manifest}}' | jq -r '.digest')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "image-ref=${IMMUTABLE_TAG}@${digest}" >> "$GITHUB_OUTPUT"

      # TODO: Uncomment this when xray scan is ready
      #   - name: xray scan
      #     shell: bash
      #     run: |
      #       jf docker pull ${{ steps.tags.outputs.immutable-tag }} --build-name="${{ env.JFROG_CLI_BUILD_NAME }}" --build-number="$JFROG_CLI_BUILD_NUMBER"
      #       jf docker scan ${{ steps.tags.outputs.immutable-tag }} --build-name="${{ env.JFROG_CLI_BUILD_NAME }}" --build-number="$JFROG_CLI_BUILD_NUMBER"

      - name: Create build info for docker image
        if: ${{ inputs.push }}
        shell: bash
        run: |
          # Build-info is created against the multi-platform manifest-list digest,
          # under the unchanged build number (the setup-jfrog-cli default,
          # github.run_number) so existing consumer release-bundle references of
          # the form <name>:${{ github.run_number }} still resolve.
          image_ref="${{ steps.manifest.outputs.image-ref }}"
          jf rt build-docker-create --image-file <(echo "$image_ref") "${{ inputs.jf-project }}${{ inputs.repo-scope }}"

      - name: Publish Build Info
        if: ${{ inputs.push }}
        shell: bash
        run: |
          jf rt build-collect-env  "$JFROG_CLI_BUILD_NAME" "$JFROG_CLI_BUILD_NUMBER"
          jf rt build-add-git      "$JFROG_CLI_BUILD_NAME" "$JFROG_CLI_BUILD_NUMBER"
          jf rt build-publish --detailed-summary "$JFROG_CLI_BUILD_NAME" "$JFROG_CLI_BUILD_NUMBER"

      - name: Attest OCI Image
        if: ${{ inputs.attest && inputs.push }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: oci://${{ steps.tags.outputs.immutable-tag }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
