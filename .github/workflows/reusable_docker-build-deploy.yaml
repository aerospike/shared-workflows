name: Reusable Docker Build, Publish & Attest (minimal)

on:
  workflow_call:
    inputs:
      # Required inputs (alphabetical)
      image_name:
        type: string
        required: true
        description: Image repository/name (without registry)
      jf_project:
        type: string
        required: true
        description: JFrog project key
      tag:
        type: string
        required: true
        description: Full image tag to build/push (e.g., artifact.aerospike.io/repo/image:tag) # explicit tag required

      # Optional inputs
      attest:
        type: boolean
        default: true
        description: Generate SLSA build-provenance attestation
      build_args_json:
        type: string
        default: "{}"
        description: JSON object of build-args passed to docker build # {"KEY":"VALUE",...}
      context:
        type: string
        default: .
        description: Docker build context directory
      file:
        type: string
        default: Dockerfile
        description: Path to Dockerfile (relative to context)
      jf_build_name:
        type: string
        required: false
        description: Build name for JFrog build-info (defaults to workflow name)
      jf_registry:
        type: string
        required: false
        description: Full Docker registry URL including repository path (e.g., artifact.aerospike.io/test-container-dev-local) # should be full uri for Artifactory registry eg artifact.aerospike.io/test-container-dev-local
      jf_registry_base:
        type: string
        default: artifact.aerospike.io
        description: Registry hostname (no repo path)
      jf_url:
        type: string
        default: https://artifact.aerospike.io
        description: Base JFrog Artifactory URL
      labels_json:
        type: string
        default: "{}"
        description: JSON object of image labels # {"key":"value",...}
      oidc_audience:
        type: string
        default: aerospike/testing
        description: OIDC audience value for token
      oidc_provider_name:
        type: string
        default: gh-dev-test
        description: JFrog OIDC provider name
      platforms:
        type: string
        default: linux/amd64,linux/arm64
        description: Comma-separated target platforms for buildx # pass-through
      provenance:
        type: string
        default: mode=max
        description: BuildKit provenance setting ('', 'false', or 'mode=max') # "", "false", or "mode=max"
      push:
        type: boolean
        default: true
        description: Whether to push the image
      repo_scope:
        type: string
        default: -container-dev-local
        description: Repository suffix appended to jf_project (e.g., -container-preview-public-local) # e.g. "-container-preview-public-local"
      sbom:
        type: boolean
        default: true
        description: Enable SBOM generation (pass-through to docker/build-push-action)

    outputs:
      digest:
        description: Image manifest digest
        value: ${{ jobs.build.outputs.digest }}
      image_ref:
        description: Primary tag with @digest
        value: ${{ jobs.build.outputs.image_ref }}
      tag:
        description: Primary tag used
        value: ${{ jobs.build.outputs.tag }}

jobs:
  build:
    env:
      JFROG_CLI_BUILD_NAME: ${{ inputs.jf_build_name || github.workflow }}
      JFROG_CLI_LOG_LEVEL: INFO
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image_ref: ${{ steps.meta.outputs.image_ref }}
      tag: ${{ inputs.tag }}

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Install JFrog CLI
        id: jf
        uses: jfrog/setup-jfrog-cli@751c204e8e1d3fe053e30218a2143ab4fe100d95 # v4.6.0
        env:
          JF_URL: ${{ inputs.jf_url }}
          JF_PROJECT: ${{ inputs.jf_project }}
          JFROG_CLI_BUILD_NAME: ${{ inputs.jf_build_name || github.workflow }}
        with:
          version: 2.78.8
          oidc-provider-name: ${{ inputs.oidc_provider_name }}
          oidc-audience: ${{ inputs.oidc_audience }}

      - name: Compute registry
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          reg='${{ inputs.jf_registry }}'
          if [ -z "$reg" ]; then
            reg='${{ inputs.jf_registry_base }}/${{ inputs.jf_project }}${{ inputs.repo_scope }}'
          fi
          echo "registry=$reg" >> "$GITHUB_OUTPUT"

      - name: Docker login to Artifactory
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3
        with:
          registry: ${{ steps.registry.outputs.registry }}
          username: ${{ steps.jf.outputs.oidc-user }}
          password: ${{ steps.jf.outputs.oidc-token }}

      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3

      - name: Prepare build args/labels
        shell: bash
        run: |
          set -euo pipefail
          to_kv() { jq -r 'to_entries|map("\(.key)=\(.value)")|.[]'; }
          echo '${{ inputs.build_args_json }}' | to_kv > /tmp/build_args
          echo '${{ inputs.labels_json }}' | to_kv > /tmp/labels
          echo "BUILD_ARGS=$(cat /tmp/build_args)" >> "$GITHUB_ENV"
          echo "LABELS=$(cat /tmp/labels)" >> "$GITHUB_ENV"

      - name: Build and push
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ inputs.tag }}
          provenance: ${{ inputs.provenance }}
          sbom: ${{ inputs.sbom }}
          build-args: ${{ env.BUILD_ARGS }}
          labels: ${{ env.LABELS }}
      # TODO: Uncomment this when xray scan is ready
      #   - name: xray scan
      #     shell: bash
      #     run: |
      #       echo "JFROG_CLI_BUILD_NAME=${{ env.JFROG_CLI_BUILD_NAME }}"
      #       jf docker pull ${{ inputs.tag }} --build-name="${{ env.JFROG_CLI_BUILD_NAME }}" --build-number="$JFROG_CLI_BUILD_NUMBER"
      #       jf docker scan ${{ inputs.tag }} --build-name="${{ env.JFROG_CLI_BUILD_NAME }}" --build-number="$JFROG_CLI_BUILD_NUMBER"
      - name: Create build info for docker image
        id: meta
        shell: bash
        run: |
          image_ref="${{ inputs.tag }}@${{ steps.build.outputs.digest }}"
          echo "image_ref=${image_ref}" >> "$GITHUB_OUTPUT"
          jf rt build-docker-create --image-file <(echo "$image_ref") "${{ inputs.jf_project }}${{ inputs.repo_scope }}"

      - name: Publish Build Info
        shell: bash
        run: |
          jf rt build-collect-env  "$JFROG_CLI_BUILD_NAME" "$JFROG_CLI_BUILD_NUMBER"
          jf rt build-add-git      "$JFROG_CLI_BUILD_NAME" "$JFROG_CLI_BUILD_NUMBER"
          jf rt build-publish --detailed-summary "$JFROG_CLI_BUILD_NAME" "$JFROG_CLI_BUILD_NUMBER"

      - name: Attest OCI Image
        if: ${{ inputs.attest }}
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: oci://${{ inputs.tag }}
          subject-digest: ${{ steps.build.outputs.digest }}
