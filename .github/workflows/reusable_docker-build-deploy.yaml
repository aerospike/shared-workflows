name: Reusable Docker Build, Publish & Attest

on:
  workflow_call:
    inputs:
      # Required inputs
      app-version:
        type: string
        required: true
        description: Version of the application
      image-name:
        type: string
        required: true
        description: Docker image name (repository component, without registry). Used to construct the full image path (e.g., "test-image" becomes "registry/project-repo/test-image:tag")
      jf-project:
        type: string
        required: true
        description: JFrog project key

      # Optional inputs
      app-name:
        type: string
        required: false
        description: Human-readable application name for OCI labels (defaults to image-name). Can differ from image-name for display purposes (e.g., image-name="aerospike-server-enterprise", app-name="Aerospike Server Enterprise")
      attest:
        type: boolean
        default: true
        description: Generate SLSA build-provenance attestation
      build-args-json:
        type: string
        default: "{}"
        description: JSON object of build-args passed to docker build # {"KEY":"VALUE",...}
      context:
        type: string
        default: .
        description: Docker build context directory
      file:
        type: string
        default: Dockerfile
        description: Path to Dockerfile (relative to context)
      jf-build-name:
        type: string
        required: false
        description: Build name for JFrog build-info (defaults to workflow name)
      jf-registry:
        type: string
        required: false
        description: Full Docker registry URL including repository path (e.g., artifact.aerospike.io/test-container-dev-local) # should be full uri for Artifactory registry eg artifact.aerospike.io/test-container-dev-local
      jf-registry-base:
        type: string
        default: artifact.aerospike.io
        description: Registry hostname (no repo path)
      jf-url:
        type: string
        default: https://artifact.aerospike.io
        description: Base JFrog Artifactory URL
      labels-json:
        type: string
        default: "{}"
        description: JSON object of image labels # {"key":"value",...}
      oidc-audience:
        type: string
        default: aerospike/testing
        description: OIDC audience value for token
      oidc-provider-name:
        type: string
        default: gh-dev-test
        description: JFrog OIDC provider name
      platforms:
        type: string
        default: linux/amd64,linux/arm64
        description: Comma-separated target platforms for buildx # pass-through
      provenance:
        type: string
        default: mode=max
        description: BuildKit provenance setting ('', 'false', or 'mode=max') # "", "false", or "mode=max"
      push:
        type: boolean
        default: true
        description: Whether to push the image
      repo-scope:
        type: string
        default: -container-dev-local
        description: Repository suffix appended to jf-project (e.g., -container-preview-public-local) # e.g. "-container-preview-public-local"
      sbom:
        type: boolean
        default: true
        description: Enable SBOM generation (pass-through to docker/build-push-action)
      versions-override:
        type: string
        required: false
        description: |
          Override the tags generated by the workflow (other than the immutable tag which is always generated).
          Format: comma separated list of versions eg "tag1,tag2,tag3"
          If not provided, the versions used in the tags (for app version 3.2.1) would be "3.2.1_20251202T021054Z, 3.2.1, 3, latest"
          Setting this value to "dev" would cause the versions to be "3.2.1_20251202T021054Z, dev". Only version is settable in this way. App name, repository scope, and app version are calculated.
    outputs:
      digest:
        description: Image manifest digest
        value: ${{ jobs.build.outputs.digest }}
      image-ref:
        description: Primary tag with @digest
        value: ${{ jobs.build.outputs.image-ref }}
      tags:
        description: Comma separated list of tags used
        value: ${{ jobs.build.outputs.tags }}
      immutable-tag:
        description: Immutable tag (registry/image:version_timestamp)
        value: ${{ jobs.build.outputs.immutable-tag }}

jobs:
  build:
    env:
      JFROG_CLI_BUILD_NAME: ${{ inputs.jf-build-name || github.workflow }}
      JFROG_CLI_LOG_LEVEL: INFO
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image-ref: ${{ steps.meta.outputs.image-ref }}
      tags: ${{ steps.tags.outputs.tags }}
      immutable-tag: ${{ steps.tags.outputs.immutable-tag }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a90bcbc6539c36a85cdfeb73f7e2f433735f215b # v2.15.0
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v5

      - name: Install JFrog CLI
        id: jf
        uses: step-security/setup-jfrog-cli@a6b41f8338bea0983ddff6bd4ede7d2dcd81e1fa # v4.8.1
        env:
          JF_URL: ${{ inputs.jf-url }}
          JF_PROJECT: ${{ inputs.jf-project }}
          JFROG_CLI_BUILD_NAME: ${{ inputs.jf-build-name || github.workflow }}
        with:
          version: 2.78.8
          oidc-provider-name: ${{ inputs.oidc-provider-name }}
          oidc-audience: ${{ inputs.oidc-audience }}

      - name: Compute registry
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          reg='${{ inputs.jf-registry }}'
          if [ -z "$reg" ]; then
            reg='${{ inputs.jf-registry-base }}/${{ inputs.jf-project }}${{ inputs.repo-scope }}'
          fi
          echo "registry=$reg" >> "$GITHUB_OUTPUT"

      - name: Docker login to Artifactory
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ steps.registry.outputs.registry }}
          username: ${{ steps.jf.outputs.oidc-user }}
          password: ${{ steps.jf.outputs.oidc-token }}

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: step-security/setup-buildx-action@c60a792b446ef83310733d5cd9d0c8d6870d043f # v3.12.0
      - name: Compute tags
        id: tags
        shell: bash
        run: |
          base="${{ steps.registry.outputs.registry }}/${{ inputs.image-name }}"
          timestamp=$(date --utc +%Y%m%dT%H%M%SZ)

          # Extract major version (handle 'v' prefix, take first number before first dot)
          app_version="${{ inputs.app-version }}"
          app_version="${app_version#v}"  # Strip 'v' prefix if present
          major_version="${app_version%%.*}"  # Extract first number before first dot

          # Build immutable tag (always included)
          immutable="${base}:${app_version}_${timestamp}"

          # Build tags array: always start with immutable tag
          tags_array=("${immutable}")

          if [ -n "${{ inputs.versions-override }}" ]; then
            # Parse comma-separated override tags and prepend base
            IFS=',' read -ra override_tags <<< "${{ inputs.versions-override }}"
            for tag in "${override_tags[@]}"; do
              # Trim whitespace and prepend base
              tag=$(echo "$tag" | xargs)
              if [ -n "$tag" ]; then
                tags_array+=("${base}:${tag}")
              fi
            done
          else
            # Default tags: immutable, version, major version, and latest
            tags_array+=("${base}:${app_version}" "${base}:${major_version}" "${base}:latest")
          fi

          # Join tags with comma for output
          IFS=','
          tags="${tags_array[*]}"

          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "immutable-tag=${immutable}" >> "$GITHUB_OUTPUT"

      - name: Prepare build args/labels
        shell: bash
        run: |
          set -euo pipefail
          to_kv() { jq -r 'to_entries|map("\(.key)=\(.value)")|.[]'; }

          # Generate OCI labels
          oci_labels=$(jq -n \
            --arg title "${{ inputs.app-name || inputs.image-name }}" \
            --arg version "${{ inputs.app-version }}" \
            --arg created "$(date --utc -Iseconds)" \
            --arg revision "${{ github.sha }}" \
            --arg source "${{ github.server_url }}/${{ github.repository }}" \
            --arg url "${{ github.server_url }}/${{ github.repository }}" \
            '{
              "org.opencontainers.image.title": $title,
              "org.opencontainers.image.version": $version,
              "org.opencontainers.image.created": $created,
              "org.opencontainers.image.revision": $revision,
              "org.opencontainers.image.source": $source,
              "org.opencontainers.image.url": $url
            }')

          # Merge user labels with OCI labels (user labels override)
          user_labels='${{ inputs.labels-json }}'
          merged_labels=$(jq -n --argjson oci "$oci_labels" --argjson user "$user_labels" '$oci * $user')

          # Convert JSON to KEY=VALUE lines
          echo '${{ inputs.build-args-json }}' | to_kv > /tmp/build_args
          echo "$merged_labels" | to_kv > /tmp/labels

          # Add JFROG_TOKEN to build args automatically
          echo "JFROG_TOKEN=${{ steps.jf.outputs.oidc-token }}" >> /tmp/build_args

          # Use heredoc syntax so multi-line values are preserved in GITHUB_ENV
          {
            echo "BUILD_ARGS<<EOF"
            cat /tmp/build_args
            echo "EOF"
            echo "LABELS<<EOF"
            cat /tmp/labels
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Build and push
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ steps.tags.outputs.tags }}
          provenance: ${{ inputs.provenance }}
          sbom: ${{ inputs.sbom }}
          build-args: ${{ env.BUILD_ARGS }}
          labels: ${{ env.LABELS }}
      # TODO: Uncomment this when xray scan is ready
      #   - name: xray scan
      #     shell: bash
      #     run: |
      #       echo "JFROG_CLI_BUILD_NAME=${{ env.JFROG_CLI_BUILD_NAME }}"
      #       jf docker pull ${{ steps.tags.outputs.immutable-tag }} --build-name="${{ env.JFROG_CLI_BUILD_NAME }}" --build-number="$JFROG_CLI_BUILD_NUMBER"
      #       jf docker scan ${{ steps.tags.outputs.immutable-tag }} --build-name="${{ env.JFROG_CLI_BUILD_NAME }}" --build-number="$JFROG_CLI_BUILD_NUMBER"
      - name: Create build info for docker image
        id: meta
        shell: bash
        run: |
          # Use primary tag with digest for build-info
          image_ref="${{ steps.tags.outputs.immutable-tag }}@${{ steps.build.outputs.digest }}"
          echo "image-ref=${image_ref}" >> "$GITHUB_OUTPUT"
          jf rt build-docker-create --image-file <(echo "$image_ref") "${{ inputs.jf-project }}${{ inputs.repo-scope }}"

      - name: Publish Build Info
        shell: bash
        run: |
          jf rt build-collect-env  "$JFROG_CLI_BUILD_NAME" "$JFROG_CLI_BUILD_NUMBER"
          jf rt build-add-git      "$JFROG_CLI_BUILD_NAME" "$JFROG_CLI_BUILD_NUMBER"
          jf rt build-publish --detailed-summary "$JFROG_CLI_BUILD_NAME" "$JFROG_CLI_BUILD_NUMBER"

      - name: Attest OCI Image
        if: ${{ inputs.attest }}
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: oci://${{ steps.tags.outputs.immutable-tag }}
          subject-digest: ${{ steps.build.outputs.digest }}
