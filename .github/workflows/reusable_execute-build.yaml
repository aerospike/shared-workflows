name: Execute Build

on:
  workflow_call:
    inputs:
      # Required inputs
      gh-artifact-directory:
        description: Build script will place artifacts in this directory and it will be uploaded to github artifacts
        required: true
        type: string
      jf-build-id:
        description: Build ID for this build in artifactory
        required: true
        type: string
      jf-build-name:
        description: Name for this build in artifactory
        required: true
        type: string
      jf-project:
        description: JFrog Artifactory project name
        required: true
        type: string
      gh-workflows-ref:
        description: |
          Git reference for shared-workflows checkout. Should match the version in your 'uses:' line.
          GitHub Actions doesn't expose the called workflow's ref, so this is required.
          See: .github/workflows/docs/CICD-with-shared-actions.md#why-gh-workflows-ref-is-required
        required: true
        type: string

      # Optional inputs
      build-script:
        description: Inline build script to execute
        required: false
        type: string
        default: ""
      build-script-path:
        description: Path to the build script to execute
        required: false
        type: string
        default: ""
      dry-run:
        description: Whether to run in dry-run mode
        required: false
        type: boolean
        default: false
      gh-artifact-name:
        description: Name for artifacts from this build. Will be used for name of uploaded github artifacts
        required: false
        type: string
        default: build-artifacts
      gh-checkout-path:
        description: Directory to checkout the shared-workflows repository into
        required: false
        type: string
        default: shared-workflows
      gh-retention-days:
        description: Retention days for the github artifacts
        required: false
        type: number
        default: 1
      gh-source-path:
        description: Directory to checkout the source repository into. If set to empty string it will not checkout the current repository.
        required: false
        type: string
        default: local
      gh-source-ref:
        description: Reference to checkout for source repository (branch, tag, or commit)
        required: false
        type: string
        default: ""
      gh-source-repository:
        description: Repository to checkout for source code (format owner/repo)
        required: false
        type: string
        default: ${{ github.repository }}
      jf-url:
        required: false
        description: JFrog Artifactory URL
        type: string
        default: https://artifact.aerospike.io
      oidc-audience:
        type: string
        default: aerospike/testing
        description: OIDC audience value for token
      oidc-provider-name:
        type: string
        default: gh-dev-test
        description: JFrog OIDC provider name
      publish-build-info:
        description: |
          Whether to publish build-info to JFrog. If true will publish build-info to JFrog without uploading artifacts.
        required: false
        type: boolean
        default: true
      runs-on:
        description: The runner to use for the build
        required: false
        type: string
        default: ubuntu-22.04
      working-directory:
        description: Working directory for build script execution
        required: false
        type: string
        default: .

      # Dotnet setup
      setup-dotnet:
        description: Whether to set up Dotnet environment
        required: false
        type: boolean
        default: false
      dotnet-version:
        description: Dotnet version to set up (e.g., "7.0", "8.0")
        required: false
        type: string
        default: "8.0"

      # Java/Maven setup
      setup-java:
        description: Whether to set up Java environment
        required: false
        type: boolean
        default: false
      java-version:
        description: Java version to set up (e.g., "17", "21")
        required: false
        type: string
        default: "21"
      java-distribution:
        description: Java distribution (temurin, zulu, adopt, corretto, etc.)
        required: false
        type: string
        default: temurin
      java-cache:
        description: Package manager to cache (maven, gradle, sbt).
        required: false
        type: string
        default: maven

    outputs:
      gh-artifact-name:
        description: The name of the uploaded artifacts on github
        value: ${{ jobs.execute-build.outputs.gh-artifact-name }}
      jf-build-id:
        description: The build ID used for JFrog build-info
        value: ${{ jobs.execute-build.outputs.jf-build-id }}
      jf-build-name:
        description: The build name used for JFrog build-info
        value: ${{ jobs.execute-build.outputs.jf-build-name }}

permissions:
  contents: read
  id-token: write

jobs:
  execute-build:
    runs-on: ${{ inputs.runs-on }}
    outputs:
      gh-artifact-name: ${{ steps.build-info.outputs.gh-artifact-name }}
      jf-build-id: ${{ steps.build-info.outputs.jf-build-id }}
      jf-build-name: ${{ steps.build-info.outputs.jf-build-name }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit
      - name: Checkout shared-workflows repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: aerospike/shared-workflows
          ref: ${{ inputs.gh-workflows-ref }}
          path: ${{ inputs.gh-checkout-path }}
          fetch-depth: 1

      - name: Checkout source repository
        if: inputs.gh-source-path != ''
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: ${{ inputs.gh-source-repository }}
          ref: ${{ inputs.gh-source-ref }}
          path: ${{ inputs.gh-source-path }}
          fetch-tags: true
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java
        if: inputs.setup-java
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}
          cache: ${{ inputs.java-cache }}

      - name: Set up JFrog CLI
        uses: jfrog/setup-jfrog-cli@5b06f730cc5a6f55d78b30753f8583454b08c0aa # v4.8.1
        env:
          JF_URL: ${{ inputs.jf-url }}
          JF_PROJECT: ${{ inputs.jf-project }}
        with:
          oidc-provider-name: ${{ inputs.oidc-provider-name }}
          oidc-audience: ${{ inputs.oidc-audience }}

      - name: Execute Build Script
        shell: bash
        run: |
          # Entrypoint scripts are always in the shared-workflows checkout location
          entrypoint=$(realpath "${{ inputs.gh-checkout-path }}/.github/workflows/execute-build/entrypoint.sh")
          chmod +x "$entrypoint"
          if [[ -n "${{ inputs.working-directory }}" ]]; then
            cd "${{ inputs.working-directory }}"
          fi
          echo "Working directory: $(pwd)"
          echo "Entrypoint script: $entrypoint"

          if ${{ inputs.build-script != '' }}; then # Inline build script
            script_arg="--build-script"
            script_value='${{ inputs.build-script }}'
          elif ${{ inputs.build-script-path != '' }}; then # Build script file
            script_arg="--build-script-path"
            script_value="${{ inputs.build-script-path }}"
          else
            echo "Error: Either build-script or build-script-path must be given"
            exit 1
          fi

          "$entrypoint" \
            "$script_arg" "$script_value" \
            --artifact-directory "${{ inputs.gh-artifact-directory }}" \
            --build-name "${{ inputs.jf-build-name }}" \
            --build-id "${{ inputs.jf-build-id }}" \
            --project "${{ inputs.jf-project }}" \
            ${{ inputs.publish-build-info && '--publish-build-info' || '' }} \
            ${{ inputs.dry-run && '--dry-run' || '' }}
      - name: Upload Artifacts
        if: inputs.dry-run != true
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ${{ inputs.gh-artifact-name }}
          path: ${{ inputs.working-directory != '' && format('{0}/{1}', inputs.working-directory, inputs.gh-artifact-directory) || inputs.gh-artifact-directory }}
          retention-days: ${{ inputs.gh-retention-days }}

      - name: Set Build Info Outputs
        if: inputs.publish-build-info == true
        id: build-info
        run: |
          echo "jf-build-name=${{ inputs.jf-build-name }}" >> $GITHUB_OUTPUT
          echo "jf-build-id=${{ inputs.jf-build-id }}" >> $GITHUB_OUTPUT
          echo "gh-artifact-name=${{ inputs.gh-artifact-name }}" >> $GITHUB_OUTPUT
