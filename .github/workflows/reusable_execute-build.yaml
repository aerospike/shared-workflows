name: Execute Build

on:
  workflow_call:
    inputs:
      # Required inputs
      gh-artifact-directory:
        description: Build script will place artifacts in this directory and it will be uploaded to github artifacts
        required: true
        type: string
      jf-build-id:
        description: Build ID for this build in artifactory
        required: true
        type: string
      jf-build-name:
        description: Name for this build in artifactory
        required: true
        type: string
      jf-project:
        description: JFrog Artifactory project name
        required: true
        type: string
      gh-workflows-ref:
        description: |
          Git reference for shared-workflows checkout. Should match the version in your 'uses:' line.
          GitHub Actions doesn't expose the called workflow's ref, so this is required.
          See: .github/workflows/docs/why-gh-workflows-ref.md
        required: true
        type: string

      # Optional inputs
      build-script:
        description: Inline build script to execute
        required: false
        type: string
        default: ""
      build-script-path:
        description: Path to the build script to execute
        required: false
        type: string
        default: ""
      build-env:
        description: Semicolon-delimited KEY=VALUE pairs (use \; for literal semicolon, \\ for backslash)
        required: false
        type: string
        default: ""
      dry-run:
        description: Whether to run in dry-run mode
        required: false
        type: boolean
        default: false
      gh-artifact-name:
        description: Name for artifacts from this build. Will be used for name of uploaded github artifacts
        required: false
        type: string
        default: build-artifacts
      gh-checkout-path:
        description: Directory to checkout the shared-workflows repository into
        required: false
        type: string
        default: shared-workflows
      gh-retention-days:
        description: Retention days for the github artifacts
        required: false
        type: number
        default: 1
      gh-source-path:
        description: Directory to checkout the source repository into. If set to empty string it will not checkout the current repository.
        required: false
        type: string
        default: local
      gh-source-ref:
        description: Reference to checkout for source repository (branch, tag, or commit)
        required: false
        type: string
        default: ""
      gh-source-repository:
        description: Repository to checkout for source code (format owner/repo)
        required: false
        type: string
        default: ${{ github.repository }}
      jf-url:
        required: false
        description: JFrog Artifactory URL
        type: string
        default: https://artifact.aerospike.io
      matrix-json-data:
        description: JSON for the current matrix entry. Exported as MATRIX_JSON to the build subprocess.
        required: false
        type: string
        default: ""
      oidc-audience:
        type: string
        default: aerospike
        description: OIDC audience value for token
      oidc-provider-name:
        type: string
        default: gh-aerospike
        description: JFrog OIDC provider name
      publish-build-info:
        description: |
          Whether to publish build-info to JFrog. If true will publish build-info to JFrog without uploading artifacts.
        required: false
        type: boolean
        default: true
      runs-on:
        description: The runner to use for the build
        required: false
        type: string
        default: ubuntu-22.04
      working-directory:
        description: Working directory for build script execution
        required: false
        type: string
        default: .

      # Dotnet setup
      setup-dotnet:
        description: Whether to set up Dotnet environment
        required: false
        type: boolean
        default: false
      dotnet-version:
        description: Dotnet version to set up (e.g., "7.0", "8.0")
        required: false
        type: string
        default: "8.0"

      # Java/Maven setup
      setup-java:
        description: Whether to set up Java environment
        required: false
        type: boolean
        default: false
      java-version:
        description: Java version to set up (e.g., "17", "21")
        required: false
        type: string
        default: "21"
      java-distribution:
        description: Java distribution (temurin, zulu, adopt, corretto, etc.)
        required: false
        type: string
        default: temurin
      java-cache:
        description: Package manager to cache (maven, gradle, sbt).
        required: false
        type: string
        default: maven

      # Python setup
      setup-python:
        description: Whether to set up Python environment
        required: false
        type: boolean
        default: false
      python-version:
        description: Python version to set up (e.g., "3.11", "3.12")
        required: false
        type: string
        default: "3.12"

      # Helm setup
      setup-helm:
        description: Whether to install the Helm CLI for builds
        required: false
        type: boolean
        default: false
      helm-version:
        description: Helm version to set up (e.g., "v3.16.4"). "latest" by default.
        required: false
        type: string
        default: latest

      # Node.js setup
      setup-node-version:
        description: Node.js major version for actions/setup-node (e.g., "20", "24"). Empty skips setup.
        required: false
        type: string
        default: ""

    outputs:
      gh-artifact-name:
        description: The name of the uploaded artifacts on github
        value: ${{ jobs.execute-build.outputs.gh-artifact-name }}
      jf-build-id:
        description: The build ID used for JFrog build-info
        value: ${{ jobs.execute-build.outputs.jf-build-id }}
      jf-build-name:
        description: The build name used for JFrog build-info
        value: ${{ jobs.execute-build.outputs.jf-build-name }}

permissions:
  contents: read
  id-token: write

jobs:
  execute-build:
    runs-on: ${{ inputs.runs-on }}
    outputs:
      gh-artifact-name: ${{ steps.build-info.outputs.gh-artifact-name }}
      jf-build-id: ${{ steps.build-info.outputs.jf-build-id }}
      jf-build-name: ${{ steps.build-info.outputs.jf-build-name }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout shared-workflows repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: aerospike/shared-workflows
          ref: ${{ inputs.gh-workflows-ref }}
          path: ${{ inputs.gh-checkout-path }}
          fetch-depth: 1

      - name: Checkout source repository
        if: inputs.gh-source-path != ''
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ inputs.gh-source-repository }}
          ref: ${{ inputs.gh-source-ref }}
          path: ${{ inputs.gh-source-path }}
          fetch-tags: true
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node.js
        if: inputs.setup-node-version != ''
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: ${{ inputs.setup-node-version }}

      - name: Set up Java
        if: inputs.setup-java
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}
          cache: ${{ inputs.java-cache }}

      - name: Set up Dotnet
        if: inputs.setup-dotnet
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Set up Python
        if: inputs.setup-python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install Python build tools
        if: inputs.setup-python
        run: pip install build

      - name: Set up Helm
        if: inputs.setup-helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ inputs.helm-version }}

      - name: Set up JFrog CLI
        uses: step-security/setup-jfrog-cli@3054b554c0fb4915b3d58847fb7730c593dbb934 # v5.0.0
        env:
          JF_URL: ${{ inputs.jf-url }}
          JF_PROJECT: ${{ inputs.jf-project }}
        with:
          oidc-provider-name: ${{ inputs.oidc-provider-name }}
          oidc-audience: ${{ inputs.oidc-audience }}

      - name: Execute Build Script
        shell: bash
        env:
          BUILD_ENV: ${{ inputs.build-env }}
          MATRIX_JSON: ${{ inputs.matrix-json-data }}
          # INPUT_ prefix avoids clobbering entrypoint.sh's internal BUILD_SCRIPT vars.
          INPUT_BUILD_SCRIPT: ${{ inputs.build-script }}
          INPUT_BUILD_SCRIPT_PATH: ${{ inputs.build-script-path }}
        run: |
          parser="${{ inputs.gh-checkout-path }}/.github/workflows/execute-build/parse-build-env.sh"
          chmod +x "$parser"
          while IFS= read -r line; do
            [[ -z $line ]] && continue
            export "${line?}"
            echo "$line" >>"$GITHUB_ENV"
          done < <("$parser")

          entrypoint=$(realpath "${{ inputs.gh-checkout-path }}/.github/workflows/execute-build/entrypoint.sh")
          chmod +x "$entrypoint"
          if [[ -n "${{ inputs.working-directory }}" ]]; then
            cd "${{ inputs.working-directory }}"
          fi
          echo "Working directory: $(pwd)"
          echo "Entrypoint script: $entrypoint"

          if [[ -n "$INPUT_BUILD_SCRIPT" ]]; then # Inline build script
            script_arg="--build-script"
            script_value="$INPUT_BUILD_SCRIPT"
          elif [[ -n "$INPUT_BUILD_SCRIPT_PATH" ]]; then # Build script file
            script_arg="--build-script-path"
            script_value="$INPUT_BUILD_SCRIPT_PATH"
          else
            echo "Error: Either build-script or build-script-path must be given"
            exit 1
          fi
          echo "Executing entrypoint"
          echo "script_arg: $script_arg"

          echo "artifact-directory: ${{ inputs.gh-artifact-directory }}"
          echo "build-name: ${{ inputs.jf-build-name }}"
          echo "build-id: ${{ inputs.jf-build-id }}"
          echo "project: ${{ inputs.jf-project }}"
          echo "publish-build-info: ${{ inputs.publish-build-info }}"
          echo "dry-run: ${{ inputs.dry-run }}"
          "$entrypoint" \
            "$script_arg" "$script_value" \
            --artifact-directory "${{ inputs.gh-artifact-directory }}" \
            --build-name "${{ inputs.jf-build-name }}" \
            --build-id "${{ inputs.jf-build-id }}" \
            --project "${{ inputs.jf-project }}" \
            ${{ inputs.publish-build-info && '--publish-build-info' || '' }} \
            ${{ inputs.dry-run && '--dry-run' || '' }}
      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.gh-artifact-name }}
          path: ${{ inputs.working-directory != '' && format('{0}/{1}', inputs.working-directory, inputs.gh-artifact-directory) || inputs.gh-artifact-directory }}
          retention-days: ${{ inputs.gh-retention-days }}

      - name: Set Build Info Outputs
        if: inputs.publish-build-info == true
        id: build-info
        run: |
          echo "jf-build-name=${{ inputs.jf-build-name }}" >> $GITHUB_OUTPUT
          echo "jf-build-id=${{ inputs.jf-build-id }}" >> $GITHUB_OUTPUT
          echo "gh-artifact-name=${{ inputs.gh-artifact-name }}" >> $GITHUB_OUTPUT
