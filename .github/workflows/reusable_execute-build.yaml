name: Execute Build

on:
  workflow_call:
    inputs:
      # Required inputs
      gh-artifact-directory:
        description: Build script will place artifacts in this directory and it will be uploaded to github artifacts
        required: true
        type: string
      jf-build-id:
        description: Build ID for this build in artifactory
        required: true
        type: string
      jf-build-name:
        description: Name for this build in artifactory
        required: true
        type: string
      jf-project:
        description: JFrog Artifactory project name
        required: true
        type: string
      gh-workflows-ref:
        description: |
          Git reference for shared-workflows checkout. Should match the version in your 'uses:' line.
          GitHub Actions doesn't expose the called workflow's ref, so this is required.
          See: .github/workflows/docs/why-gh-workflows-ref.md
        required: true
        type: string

      # Optional inputs
      build-script:
        description: Inline build script to execute
        required: false
        type: string
        default: ""
      build-script-path:
        description: Path to the build script to execute
        required: false
        type: string
        default: ""
      build-env:
        description: Semicolon-delimited KEY=VALUE pairs (use \; for literal semicolon, \\ for backslash)
        required: false
        type: string
        default: ""
      dry-run:
        description: Whether to run in dry-run mode
        required: false
        type: boolean
        default: false
      gh-artifact-name:
        description: Name for artifacts from this build. Will be used for name of uploaded github artifacts
        required: false
        type: string
        default: build-artifacts
      gh-checkout-path:
        description: Directory to checkout the shared-workflows repository into
        required: false
        type: string
        default: shared-workflows
      gh-retention-days:
        description: Retention days for the github artifacts
        required: false
        type: number
        default: 1
      gh-source-path:
        description: Directory to checkout the source repository into. If set to empty string it will not checkout the current repository.
        required: false
        type: string
        default: local
      gh-source-ref:
        description: Reference to checkout for source repository (branch, tag, or commit)
        required: false
        type: string
        default: ""
      gh-source-repository:
        description: Repository to checkout for source code (format owner/repo)
        required: false
        type: string
        default: ${{ github.repository }}
      jf-url:
        required: false
        description: JFrog Artifactory URL
        type: string
        default: https://artifact.aerospike.io
      job-name:
        description: |
          Display name for the build job in the Actions UI. Matrix callers pass a
          per-cell value (e.g. the matrix name) so a run doesn't show every build
          as "execute-build". Defaults to the job id when omitted.
        required: false
        type: string
        default: ""
      matrix-json-data:
        description: JSON for the current matrix entry. Exported as MATRIX_JSON to the build subprocess.
        required: false
        type: string
        default: ""
      oidc-audience:
        type: string
        default: aerospike
        description: OIDC audience value for token
      oidc-provider-name:
        type: string
        default: gh-aerospike
        description: JFrog OIDC provider name
      publish-build-info:
        description: |
          Whether to publish build-info to JFrog. If true will publish build-info to JFrog without uploading artifacts.
        required: false
        type: boolean
        default: true
      runs-on:
        description: The runner to use for the build
        required: false
        type: string
        default: ubuntu-22.04
      working-directory:
        description: Working directory for build script execution
        required: false
        type: string
        default: .

      # Dotnet setup
      setup-dotnet:
        description: Whether to set up Dotnet environment
        required: false
        type: boolean
        default: false
      dotnet-version:
        description: Dotnet version to set up (e.g., "7.0", "8.0")
        required: false
        type: string
        default: "8.0"

      # Java/Maven setup
      setup-java:
        description: Whether to set up Java environment
        required: false
        type: boolean
        default: false
      java-version:
        description: Java version to set up (e.g., "17", "21")
        required: false
        type: string
        default: "21"
      java-distribution:
        description: Java distribution (temurin, zulu, adopt, corretto, etc.)
        required: false
        type: string
        default: temurin
      java-cache:
        description: Package manager to cache (maven, gradle, sbt).
        required: false
        type: string
        default: maven

      # Python setup
      setup-python:
        description: Whether to set up Python environment
        required: false
        type: boolean
        default: false
      python-version:
        description: Python version to set up (e.g., "3.11", "3.12")
        required: false
        type: string
        default: "3.12"

      # Helm setup
      setup-helm:
        description: Whether to install the Helm CLI for builds
        required: false
        type: boolean
        default: false
      helm-version:
        description: Helm version to set up (e.g., "v3.16.4"). "latest" by default.
        required: false
        type: string
        default: latest

      # Source checkout credential, GitHub App form
      gh-source-app-client-id:
        description: |
          Client ID of a GitHub App used to mint the source checkout token. Pair with the
          gh-source-app-private-key secret. Mutually exclusive with the gh-source-token secret.
        required: false
        type: string
        default: ""
      gh-source-app-repositories:
        description: |
          Newline- or comma-separated repositories the minted token may reach, unqualified names in
          the calling repo's owner. Leave empty only if the App installation is already scoped: an
          empty value gives the token every repository in the installation.
        required: false
        type: string
        default: ""

    secrets:
      gh-source-token:
        description: |
          Token for the source-repository checkout and its submodules, also exported to the build
          script as GH_SOURCE_TOKEN. Supply this when the source repo's submodules or sibling repos
          live in repositories the calling repo's GITHUB_TOKEN cannot read.
        required: false
      gh-source-app-private-key:
        description: Private key of the App named by gh-source-app-client-id.
        required: false

    outputs:
      gh-artifact-name:
        description: The name of the uploaded artifacts on github
        value: ${{ jobs.execute-build.outputs.gh-artifact-name }}
      jf-build-id:
        description: The build ID used for JFrog build-info
        value: ${{ jobs.execute-build.outputs.jf-build-id }}
      jf-build-name:
        description: The build name used for JFrog build-info
        value: ${{ jobs.execute-build.outputs.jf-build-name }}

permissions:
  contents: read
  id-token: write

jobs:
  execute-build:
    # Falls back to the job id when the caller passes nothing, so existing
    # callers see an unchanged display name.
    name: ${{ inputs.job-name || 'execute-build' }}
    runs-on: ${{ inputs.runs-on }}
    outputs:
      gh-artifact-name: ${{ steps.build-info.outputs.gh-artifact-name }}
      jf-build-id: ${{ steps.build-info.outputs.jf-build-id }}
      jf-build-name: ${{ steps.build-info.outputs.jf-build-name }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout shared-workflows repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aerospike/shared-workflows
          ref: ${{ inputs.gh-workflows-ref }}
          path: ${{ inputs.gh-checkout-path }}
          fetch-depth: 1

      - name: Reject conflicting source checkout credentials
        shell: bash
        run: |
          if [[ -n "${{ inputs.gh-source-app-client-id }}" && -n "${{ secrets.gh-source-token }}" ]]; then
            echo "::error::Set gh-source-app-client-id or the gh-source-token secret, not both."
            exit 1
          fi

      - name: Mint source checkout token
        id: gh-source-app-token
        if: inputs.gh-source-app-client-id != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.gh-source-app-client-id }}
          private-key: ${{ secrets.gh-source-app-private-key }}
          repositories: ${{ inputs.gh-source-app-repositories }}
          permission-contents: read

      - name: Checkout source repository
        if: inputs.gh-source-path != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.gh-source-repository }}
          ref: ${{ inputs.gh-source-ref }}
          path: ${{ inputs.gh-source-path }}
          fetch-tags: true
          submodules: recursive
          fetch-depth: 0
          token: ${{ steps.gh-source-app-token.outputs.token || secrets.gh-source-token || github.token }}
          # Do not persist a supplied token: it reaches past the calling repo, and .git/config
          # rides along in any artifact built from a copy of the tree.
          persist-credentials: ${{ inputs.gh-source-app-client-id == '' && secrets.gh-source-token == '' }}

      - name: Set up Java
        if: inputs.setup-java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}
          cache: ${{ inputs.java-cache }}

      - name: Set up Dotnet
        if: inputs.setup-dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Set up Python
        if: inputs.setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install Python build tools
        if: inputs.setup-python
        run: pip install build

      - name: Set up Helm
        if: inputs.setup-helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ inputs.helm-version }}

      - name: Set up JFrog CLI
        uses: step-security/setup-jfrog-cli@53aeacb709fce45d0baf69a13ec3342f7e2d71a9 # v5.1.0
        env:
          JF_URL: ${{ inputs.jf-url }}
          JF_PROJECT: ${{ inputs.jf-project }}
        with:
          oidc-provider-name: ${{ inputs.oidc-provider-name }}
          oidc-audience: ${{ inputs.oidc-audience }}

      - name: Execute Build Script
        shell: bash
        env:
          BUILD_ENV: ${{ inputs.build-env }}
          MATRIX_JSON: ${{ inputs.matrix-json-data }}
          # INPUT_ prefix avoids clobbering entrypoint.sh's internal BUILD_SCRIPT vars.
          INPUT_BUILD_SCRIPT: ${{ inputs.build-script }}
          INPUT_BUILD_SCRIPT_PATH: ${{ inputs.build-script-path }}
          GH_SOURCE_TOKEN: ${{ steps.gh-source-app-token.outputs.token || secrets.gh-source-token }}
        run: |
          parser="${{ inputs.gh-checkout-path }}/.github/workflows/execute-build/parse-build-env.sh"
          chmod +x "$parser"
          while IFS= read -r line; do
            [[ -z $line ]] && continue
            export "${line?}"
            echo "$line" >>"$GITHUB_ENV"
          done < <("$parser")

          entrypoint=$(realpath "${{ inputs.gh-checkout-path }}/.github/workflows/execute-build/entrypoint.sh")
          chmod +x "$entrypoint"
          if [[ -n "${{ inputs.working-directory }}" ]]; then
            cd "${{ inputs.working-directory }}"
          fi
          echo "Working directory: $(pwd)"
          echo "Entrypoint script: $entrypoint"

          if [[ -n "$INPUT_BUILD_SCRIPT" ]]; then # Inline build script
            script_arg="--build-script"
            script_value="$INPUT_BUILD_SCRIPT"
          elif [[ -n "$INPUT_BUILD_SCRIPT_PATH" ]]; then # Build script file
            script_arg="--build-script-path"
            script_value="$INPUT_BUILD_SCRIPT_PATH"
          else
            echo "Error: Either build-script or build-script-path must be given"
            exit 1
          fi
          echo "Executing entrypoint"
          echo "script_arg: $script_arg"

          echo "artifact-directory: ${{ inputs.gh-artifact-directory }}"
          echo "build-name: ${{ inputs.jf-build-name }}"
          echo "build-id: ${{ inputs.jf-build-id }}"
          echo "project: ${{ inputs.jf-project }}"
          echo "publish-build-info: ${{ inputs.publish-build-info }}"
          echo "dry-run: ${{ inputs.dry-run }}"
          "$entrypoint" \
            "$script_arg" "$script_value" \
            --artifact-directory "${{ inputs.gh-artifact-directory }}" \
            --build-name "${{ inputs.jf-build-name }}" \
            --build-id "${{ inputs.jf-build-id }}" \
            --project "${{ inputs.jf-project }}" \
            ${{ inputs.publish-build-info && '--publish-build-info' || '' }} \
            ${{ inputs.dry-run && '--dry-run' || '' }}
      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.gh-artifact-name }}
          path: ${{ inputs.working-directory != '' && format('{0}/{1}', inputs.working-directory, inputs.gh-artifact-directory) || inputs.gh-artifact-directory }}
          retention-days: ${{ inputs.gh-retention-days }}

      - name: Set Build Info Outputs
        if: inputs.publish-build-info == true
        id: build-info
        run: |
          echo "jf-build-name=${{ inputs.jf-build-name }}" >> $GITHUB_OUTPUT
          echo "jf-build-id=${{ inputs.jf-build-id }}" >> $GITHUB_OUTPUT
          echo "gh-artifact-name=${{ inputs.gh-artifact-name }}" >> $GITHUB_OUTPUT
