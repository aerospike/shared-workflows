name: Execute Build

on:
  workflow_call:
    inputs:
      project:
        description: JFrog Artifactory project name
        required: true
        type: string
      build-name:
        description: Name for this build in artifactory
        required: true
        type: string
      build-version:
        description: Version for this build in artifactory
        required: true
        type: string
      build-script:
        description: Inline build script to execute
        required: false
        type: string
        default: ""
      build-script-path:
        description: Path to the build script to execute
        required: false
        type: string
        default: ""
      artifact-directory:
        description: Build script will place artifacts in this directory and it will be uploaded to github artifacts
        required: true
        type: string
      artifact-name:
        description: Name for artifacts from this build. Will be used for name of uploaded github artifacts
        required: false
        type: string
        default: build-artifacts
      retention-days:
        description: Retention days for the github artifacts
        required: false
        type: number
        default: 1
      artifactory-url:
        required: false
        description: JFrog Artifactory URL
        type: string
        default: https://artifact.aerospike.io
      artifactory-oidc-provider-name:
        required: false
        description: OIDC provider name
        type: string
        default: gh-aerospike
      artifactory-oidc-audience:
        required: false
        description: OIDC audience
        type: string
        default: aerospike
      runs-on:
        description: The runner to use for the build
        required: false
        type: string
        default: ubuntu-22.04
      checkout-path:
        description: Directory to checkout the shared-workflows repository into
        required: false
        type: string
        default: shared-workflows
      source-repository:
        description: Repository to checkout for source code (format owner/repo)
        required: false
        type: string
        default: ${{ github.repository }}
      source-ref:
        description: Reference to checkout for source repository (branch, tag, or commit)
        required: false
        type: string
        default: ""
      source-path:
        description: Directory to checkout the source repository into. If set to empty string it will not checkout the current repository.
        required: false
        type: string
        default: local
      dry-run:
        description: Whether to run in dry-run mode
        required: false
        type: boolean
        default: false
      publish-build-info:
        description: |
          Whether to publish build-info to JFrog. If true will publish build-info to JFrog without uploading artifacts.
        required: false
        type: boolean
        default: false
      working-directory:
        description: Working directory for build script execution
        required: false
        type: string
        default: ""

    outputs:
      build-name:
        description: The build name used for JFrog build-info
        value: ${{ jobs.execute-build.outputs.build-name }}
      build-version:
        description: The build version used for JFrog build-info
        value: ${{ jobs.execute-build.outputs.build-version }}

permissions:
  contents: read
  id-token: write

jobs:
  execute-build:
    runs-on: ${{ inputs.runs-on }}
    outputs:
      build-name: ${{ steps.build-info.outputs.build-name }}
      build-version: ${{ steps.build-info.outputs.build-version }}
    env:
      CHECKOUT_REF: feature/INFRA-189-build-info-in-build-step # Latest commit hash for development
    steps:
      - name: Checkout shared-workflows repository
        uses: actions/checkout@v5
        with:
          repository: aerospike/shared-workflows
          ref: ${{ env.CHECKOUT_REF }}
          path: ${{ inputs.checkout-path }}
          fetch-depth: 1

      - name: Checkout source repository
        if: inputs.source-path != ''
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.source-repository }}
          ref: ${{ inputs.source-ref }}
          path: ${{ inputs.source-path }}
          fetch-depth: 1

      - name: Set up JFrog CLI
        uses: jfrog/setup-jfrog-cli@751c204e8e1d3fe053e30218a2143ab4fe100d95
        env:
          JF_URL: ${{ inputs.artifactory-url }}
          JF_PROJECT: ${{ inputs.project }}
        with:
          oidc-provider-name: ${{ inputs.artifactory-oidc-provider-name }}
          oidc-audience: ${{ inputs.artifactory-oidc-audience }}

      - name: Execute Build Script
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          chmod +x ${{ inputs.checkout-path }}/.github/workflows/execute-build/entrypoint.sh

          if ${{ inputs.build-script != '' }}; then # Inline build script
            script_arg="--build-script"
            script_value='${{ inputs.build-script }}'
          elif ${{ inputs.build-script-path != '' }}; then # Build script file
            script_arg="--build-script-path"
            script_value="${{ inputs.build-script-path }}"
          else
            echo "Error: Either build-script or build-script-path must be given"
            exit 1
          fi
          ${{ inputs.checkout-path }}/.github/workflows/execute-build/entrypoint.sh \
            "$script_arg" "$script_value" \
            --artifact-directory "${{ inputs.artifact-directory }}" \
            --build-name "${{ inputs.build-name }}" \
            --build-version "${{ inputs.build-version }}" \
            --project "${{ inputs.project }}" \
            ${{ inputs.publish-build-info && '--publish-build-info' || '' }} \
            ${{ inputs.dry-run && '--dry-run' || '' }}
      - name: Upload Artifacts
        if: inputs.dry-run != true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-directory }}
          retention-days: ${{ inputs.retention-days }}

      - name: Set Build Info Outputs
        if: inputs.publish-build-info == true
        id: build-info
        run: |
          echo "build-name=${{ inputs.build-name }}" >> $GITHUB_OUTPUT
          echo "build-version=${{ inputs.build-version }}" >> $GITHUB_OUTPUT
