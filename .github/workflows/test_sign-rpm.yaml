name: GPG sign RPM
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
permissions: read-all
jobs:
  sign-rpm:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-22.04
          # - ubuntu-24.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup GPG
        uses: aerospike/shared-workflows/.github/actions/setup-gpg@7c8b65df2568974435ab8b40c9e9de6eae13b3bb # v3.8.2
        with:
          gpg-private-key: ${{ secrets.GPG_SECRET_KEY }}
          gpg-public-key: ${{ secrets.GPG_PUBLIC_KEY }}
          gpg-key-pass: ${{ secrets.GPG_PASS }}

      - name: Sign and check rpm # gpg sign and verify rpm packages
        env:
          GPG_TTY: /dev/null
          HOME: /home/runner
          GNUPGHOME: /home/runner/.gnupg
        run: |
          # Ensure environment variables are exported
          export HOME="${HOME}"
          export GNUPGHOME="${GNUPGHOME}"

          # Create symlink for gpg2 (required for rpm signing)
          sudo ln -sf $(which gpg) /usr/bin/gpg2

          # Sign the package
          rpm --addsign tests/*.rpm
          # Verify the signature
          rpm --checksig tests/*.rpm
