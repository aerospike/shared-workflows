name: Test Sign Mac Artifacts Workflow

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/reusable_sign-mac-artifacts.yaml
      - .github/workflows/sign-mac-artifacts/**

permissions:
  id-token: write
  contents: read

jobs:
  upload-test-fixtures:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Create test fixtures
        env:
          V: 0.0.0-test
        run: |
          mkdir -p test-fixtures
          echo "fake-pkg-data" > "test-fixtures/myapp-${V}-darwin-arm64.pkg"
          echo "fake-dmg-data" > "test-fixtures/myapp-${V}-darwin-arm64.dmg"
          echo "fake-binary"   > test-fixtures/myapp-darwin-arm64
          echo "fake-deb-data" > "test-fixtures/myapp-${V}-jammy-amd64.deb"
          echo "fake-rpm-data" > "test-fixtures/myapp-${V}-el9-x86_64.rpm"

      - name: Upload test fixtures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-artifacts
          path: test-fixtures

  test-sign-mac-dry-run:
    if: github.actor != 'dependabot[bot]'
    needs: upload-test-fixtures
    uses: ./.github/workflows/reusable_sign-mac-artifacts.yaml
    with:
      gh-unsigned-artifacts: build-artifacts
      gh-workflows-ref: ${{ github.sha }}
      signing-identity: "Developer ID Application: Test (TESTID)"
      installer-identity: "Developer ID Installer: Test (TESTID)"
      notarize: false
      dry-run: true
      runs-on: macos-14

  verify-artifacts-preserved:
    if: github.actor != 'dependabot[bot]'
    needs: test-sign-mac-dry-run
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Download signed artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts
          path: output

      - name: Verify all files preserved
        env:
          V: 0.0.0-test
        run: |
          set -euo pipefail
          echo "Checking that all files survived the sign-mac pass:"
          ls -laR output/

          # All original files must still be present (full tree copy)
          for f in \
            "myapp-${V}-darwin-arm64.pkg" \
            "myapp-${V}-darwin-arm64.dmg" \
            myapp-darwin-arm64 \
            "myapp-${V}-jammy-amd64.deb" \
            "myapp-${V}-el9-x86_64.rpm"; do
            if [ ! -f "output/$f" ]; then
              echo "FAIL: Missing file: $f"
              exit 1
            fi
            echo "OK: $f"
          done
          echo "All files preserved."

  run-bats-tests:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Bats
        run: |
          sudo apt-get update && sudo apt-get install -y bats

      - name: Run Bats tests
        run: |
          bats .github/workflows/sign-mac-artifacts/tests/bats/test_sign_mac.bats
