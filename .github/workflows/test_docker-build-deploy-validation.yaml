name: "Test: Docker build-deploy input validation"

# Static tests for reusable_docker-build-deploy.yaml and the Quay/OpenShift
# test-bundle plan. Kept out of test_docker-build-deploy-workflow.yaml because
# that workflow serialises on the jfrog-test-deploy concurrency group, which
# would queue this suite behind real registry pushes.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/reusable_docker-build-deploy.yaml
      - .github/workflows/docker-build-deploy/**
      - .github/workflows/test_docker-build-deploy-validation.yaml
      - .github/workflows/test_docker-destination-bundles.yaml

permissions:
  contents: read

jobs:
  bats:
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No yq package exists for jammy, and the runner image does not ship one.
      - name: Install yq
        env:
          YQ_VERSION: v4.44.3
          YQ_SHA256: a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  /tmp/yq" | sha256sum -c -
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          yq --version

      - name: Install bats
        uses: bats-core/bats-action@3566550e0f594451ac0f58fcbfdeca93aa29a45e # 4.1.0
        with:
          bats-version: 1.12.0
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false

      - name: Run docker-build-deploy bats tests
        run: bats .github/workflows/docker-build-deploy/tests/bats/
