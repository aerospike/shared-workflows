name: "Test: Docker build-deploy input validation"

# Static tests for reusable_docker-build-deploy.yaml's input handling. Kept out
# of test_docker-build-deploy-workflow.yaml because that workflow serialises on
# the jfrog-test-deploy concurrency group, which would queue a two-second suite
# behind real registry pushes.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/reusable_docker-build-deploy.yaml
      - .github/workflows/docker-build-deploy/**
      - .github/workflows/test_docker-build-deploy-validation.yaml

permissions:
  contents: read

jobs:
  context-artifact-validation:
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-yaml

      - name: Install bats
        run: |
          git init bats-core
          cd bats-core
          git remote add origin https://github.com/bats-core/bats-core.git
          git fetch --depth 1 origin cf931b7b7c79998ded0f364126dbc9d46739a76f # v1.12.0
          git checkout --detach FETCH_HEAD
          sudo ./install.sh /usr/local
          cd ..
          rm -rf bats-core

      - name: Run build-context validation bats tests
        run: bats .github/workflows/docker-build-deploy/tests/bats/
