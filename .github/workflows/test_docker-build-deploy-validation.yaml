name: "Test: Docker build-deploy input validation"

# Static tests for reusable_docker-build-deploy.yaml's input handling. Kept out
# of test_docker-build-deploy-workflow.yaml because that workflow serialises on
# the jfrog-test-deploy concurrency group, which would queue a two-second suite
# behind real registry pushes.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/reusable_docker-build-deploy.yaml
      - .github/workflows/docker-build-deploy/**
      - .github/workflows/test_docker-build-deploy-validation.yaml

permissions:
  contents: read

jobs:
  context-artifact-validation:
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # No yq package exists for jammy, and the runner image does not ship one.
      - name: Install yq
        env:
          YQ_VERSION: v4.44.3
          YQ_SHA256: a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  /tmp/yq" | sha256sum -c -
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          yq --version

      # The helper libraries are off because no bats suite in this repo uses
      # them; every existing `load` is a local helper file.
      - name: Install bats
        uses: bats-core/bats-action@5b1e60c2ee94cb1b44a616ea4b1f466f9d6e38ef # 4.0.0
        with:
          bats-version: 1.12.0
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false

      - name: Run build-context validation bats tests
        run: bats .github/workflows/docker-build-deploy/tests/bats/
