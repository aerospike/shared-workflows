name: "Test: Docker build-deploy input validation"

# Static tests for reusable_docker-build-deploy.yaml's input handling. Kept out
# of test_docker-build-deploy-workflow.yaml because that workflow serialises on
# the jfrog-test-deploy concurrency group, which would queue a two-second suite
# behind real registry pushes.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/reusable_docker-build-deploy.yaml
      - .github/workflows/docker-build-deploy/**
      - .github/workflows/test_docker-build-deploy-validation.yaml

permissions:
  contents: read

jobs:
  context-artifact-validation:
    runs-on: ubuntu-22.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y yq

      # The helper libraries are off because no bats suite in this repo uses
      # them; every existing `load` is a local helper file.
      - name: Install bats
        uses: bats-core/bats-action@5b1e60c2ee94cb1b44a616ea4b1f466f9d6e38ef # 4.0.0
        with:
          bats-version: 1.12.0
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false

      - name: Run build-context validation bats tests
        run: bats .github/workflows/docker-build-deploy/tests/bats/
