name: Extract Version
description: Extracts version from explicit input, VERSION file, Git tag, or fallback
inputs:
  version:
    description: Explicit version override (highest priority, bypasses all auto-detection)
    required: false
    default: ""
  tag-prefix:
    description: "Prefix to remove from tag (default: 'v')"
    required: false
    default: v
  version-file:
    description: "Path to VERSION file (default: 'VERSION')"
    required: false
    default: VERSION
outputs:
  version:
    description: Extracted version
    value: ${{ steps.extract.outputs.version }}
  git_tag:
    description: Full git tag or source
    value: ${{ steps.extract.outputs.git_tag }}
  source:
    description: Where version came from (input, file, tag, or fallback)
    value: ${{ steps.extract.outputs.source }}
runs:
  using: composite
  steps:
    - name: Extract Version
      id: extract
      shell: bash
      run: |
        ${{ github.action_path }}/entrypoint.sh \
          --version "${{ inputs.version }}" \
          --version-file "${{ inputs.version-file }}" \
          --tag-prefix "${{ inputs.tag-prefix }}"
