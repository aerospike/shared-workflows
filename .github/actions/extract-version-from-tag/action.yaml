name: Extract Version
description: Extracts version from VERSION file, Git tag, or manual input
inputs:
  tag-prefix:
    description: "Prefix to remove from tag (default: 'v')"
    required: false
    default: v
  version-file:
    description: "Path to VERSION file (default: 'VERSION')"
    required: false
  default-version:
    description: Default version to use if no version is found
    required: false
outputs:
  version:
    description: Extracted version
    value: ${{ steps.extract.outputs.version }}
  git_tag:
    description: Full git tag or source
    value: ${{ steps.extract.outputs.git_tag }}
  source:
    description: Where version came from (file, tag, or fallback)
    value: ${{ steps.extract.outputs.source }}
runs:
  using: composite
  steps:
    - name: Extract Version
      id: extract
      shell: bash
      run: |
        # Priority order: VERSION file -> Git tag
        if [[ -f "${{ inputs.version-file }}" ]]; then
          # Use VERSION file
          TAG=$(cat "${{ inputs.version-file }}" | tr -d '\n\r' | xargs)
          SOURCE="file"
        elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
          # Triggered by tag push
          TAG=${GITHUB_REF##*/}
          SOURCE="tag"
        else
          echo "No version sources found"
          if [[ -n "${{ inputs.default-version }}" ]]; then
            VERSION="${{ inputs.default-version }}"
            SOURCE="fallback"
          else
            echo "No version sources found, exiting"
            exit 1
          fi
        fi

        # Strip the prefix if it exists
        if [[ "$TAG" == "${{ inputs.tag-prefix }}"* ]]; then
            VERSION=${TAG#${{ inputs.tag-prefix }}}
        else
            VERSION=$TAG
        fi

        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "git_tag=$TAG" >> $GITHUB_OUTPUT
        echo "source=$SOURCE" >> $GITHUB_OUTPUT
        echo "Final version: $VERSION (from: $SOURCE)"
