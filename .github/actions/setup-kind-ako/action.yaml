name: Setup kind and AKO
description: >
  Starts a kind cluster, installs the chosen Aerospike Kubernetes Operator
  version, applies an AerospikeCluster with configuredIP or networkLoadBalancer
  alternate access and one or many pods per node, installs ingress-nginx with a
  tcp-services ConfigMap, and adds the CoreDNS entry that lets the server
  resolve the endpoint hostname.

inputs:
  admin-password:
    description: Aerospike admin password. Generated when empty.
    required: false
    default: ""
  ako-helm-repo:
    description: >
      Helm repository that serves the aerospike-kubernetes-operator and
      aerospike-cluster charts. Empty uses the repository pinned in
      deps/Chart.yaml.
    required: false
    default: ""
  ako-version:
    description: >
      aerospike-kubernetes-operator chart version. Empty uses the version pinned
      in deps/Chart.yaml. latest resolves to the newest release in ako-helm-repo
      at run time; a prerelease such as 4.8.0-dev1 installs only when named.
    required: false
    default: ""
  alternate-access:
    description: >
      AerospikeCluster alternateAccess, configuredIP or networkLoadBalancer.
      Both advertise the endpoint hostname with each pod's Service NodePort.
      networkLoadBalancer is experimental and needs an AKO build with KO-649.
    required: false
    default: configuredIP
  cluster-chart-version:
    description: >
      aerospike-cluster chart version that renders the AerospikeCluster. Empty
      uses the resolved ako-version; set it for a dev build, which ships no
      matching cluster chart.
    required: false
    default: ""
  cluster-size:
    description: >
      Initial AerospikeCluster size. One server keeps setup inside the L3
      3-5 minute budget.
    required: false
    default: "1"
  enable-tls:
    description: >
      Serve TLS on tls-port 4333 with tls-name aerospike-tls, from a generated
      CA and a server certificate whose only SAN is that tls-name.
    required: false
    default: "false"
  features-content:
    description: Enterprise feature-key file contents
    required: true
  kind-node-image:
    description: kind node image. Its Kubernetes version must be one the ako-version supports.
    required: false
    default: kindest/node:v1.35.0
  multi-pod-per-host:
    description: >
      true runs every pod on one kind node. false sets multiPodPerHost false
      and adds cluster-size + 1 kind workers; it needs alternate-access
      networkLoadBalancer and is experimental.
    required: false
    default: "true"
  server-image:
    description: Aerospike server image used by the AerospikeCluster, as repository:tag
    required: false
    default: aerospike/aerospike-server-enterprise:8.1.2.5

outputs:
  admin-password:
    description: Aerospike admin password
    value: ${{ steps.prepare.outputs.admin-password }}
  alternate-access:
    description: alternateAccess the AerospikeCluster was built with
    value: ${{ steps.setup.outputs.alternate-access }}
  endpoint-hostname:
    description: Hostname the client and the server both resolve
    value: ${{ steps.setup.outputs.endpoint-hostname }}
  ingress-ports:
    description: Comma-separated ingress-nginx tcp-services host ports
    value: ${{ steps.setup.outputs.ingress-ports }}
  kubeconfig:
    description: kubeconfig written by kind
    value: ${{ steps.setup.outputs.kubeconfig }}
  service-node-ports:
    description: Comma-separated NodePorts for the Aerospike service port, pod order
    value: ${{ steps.setup.outputs.service-node-ports }}
  tls-ca-file:
    description: CA certificate that signed the server certificate. Set when enable-tls is true
    value: ${{ steps.setup.outputs.tls-ca-file }}
  tls-name:
    description: tls-name the server certificate carries. Set when enable-tls is true
    value: ${{ steps.setup.outputs.tls-name }}

runs:
  using: composite
  steps:
    - name: Validate inputs
      id: prepare
      shell: bash
      env:
        ADMIN_PASSWORD: ${{ inputs.admin-password }}
        AKO_HELM_REPO: ${{ inputs.ako-helm-repo }}
        AKO_VERSION: ${{ inputs.ako-version }}
        ALTERNATE_ACCESS: ${{ inputs.alternate-access }}
        CLUSTER_CHART_VERSION: ${{ inputs.cluster-chart-version }}
        CLUSTER_SIZE: ${{ inputs.cluster-size }}
        ENABLE_TLS: ${{ inputs.enable-tls }}
        FEATURES_CONTENT: ${{ inputs.features-content }}
        KIND_NODE_IMAGE: ${{ inputs.kind-node-image }}
        MULTI_POD_PER_HOST: ${{ inputs.multi-pod-per-host }}
        SERVER_IMAGE: ${{ inputs.server-image }}
      run: bash "${{ github.action_path }}/entrypoint.sh" prepare

    # install_only, because kind-action's post step deletes the cluster it created, which took 10 minutes
    - name: Install kind and kubectl
      uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      with:
        version: v0.33.0
        kubectl_version: v1.35.0
        install_only: true
        ignore_failed_clean: true

    - name: Create kind cluster
      shell: bash
      env:
        KIND_CONFIG: ${{ steps.prepare.outputs.kind-config }}
        KIND_NODE_IMAGE: ${{ inputs.kind-node-image }}
      run: kind create cluster --name kind-ako --image "$KIND_NODE_IMAGE" ${KIND_CONFIG:+--config "$KIND_CONFIG"} --wait 180s

    - name: Install helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      with:
        version: v3.22.1

    - name: Install AKO, the AerospikeCluster, and ingress-nginx
      id: setup
      shell: bash
      env:
        ADMIN_PASSWORD: ${{ steps.prepare.outputs.admin-password }}
        AKO_HELM_REPO: ${{ inputs.ako-helm-repo }}
        AKO_VERSION: ${{ inputs.ako-version }}
        ALTERNATE_ACCESS: ${{ inputs.alternate-access }}
        CLUSTER_CHART_VERSION: ${{ inputs.cluster-chart-version }}
        CLUSTER_SIZE: ${{ inputs.cluster-size }}
        ENABLE_TLS: ${{ inputs.enable-tls }}
        FEATURES_CONTENT: ${{ inputs.features-content }}
        KIND_NODE_IMAGE: ${{ inputs.kind-node-image }}
        MULTI_POD_PER_HOST: ${{ inputs.multi-pod-per-host }}
        SERVER_IMAGE: ${{ inputs.server-image }}
      run: bash "${{ github.action_path }}/entrypoint.sh" setup
