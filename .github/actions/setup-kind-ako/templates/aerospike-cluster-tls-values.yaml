# Layered over aerospike-cluster-values.yaml by entrypoint.sh when enable-tls is
# true. entrypoint.sh adds the CA, the server certificate and its key to
# aerospike-secret, which aerospike-cluster-values.yaml already mounts at
# /etc/aerospike/secret, so no volume is added.
aerospikeNetworkPolicy:
  # Same as access and alternateAccess in aerospike-cluster-values.yaml.
  tlsAccess: pod
  tlsAlternateAccess: configuredIP
operatorClientCert:
  secretCertSource:
    secretName: aerospike-secret
    caCertsFilename: ca.crt
aerospikeConfig:
  network:
    service:
      tls-name: aerospike-tls
      tls-port: 4333
      tls-authenticate-client: "false"
    tls:
      - name: aerospike-tls
        cert-file: /etc/aerospike/secret/server.crt
        key-file: /etc/aerospike/secret/server.key
        ca-file: /etc/aerospike/secret/ca.crt
