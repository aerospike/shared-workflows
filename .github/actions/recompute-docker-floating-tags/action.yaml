name: Recompute Docker floating tags
description: >-
  Point a tag the caller named at the manifest of a version tag already in the
  given repository. With only project, repo, bundle, and version, nothing is attached.
inputs:
  jf-project:
    description: JFrog project key
    required: true
  docker-repo:
    description: >-
      Stage Docker or OCI repository key to retag (for example
      connect-docker-stage-local). Supply the repository directly; this action
      does not rewrite a dev-local name.
    required: true
  bundle-name:
    description: Release bundle whose docker.floating_tags property names the images
    required: true
  version:
    description: Release bundle version
    required: true
  floating-tags:
    description: >-
      Optional image:tag list the caller typed, separated by semicolons
      (for example aerospike-graph-service:dev).
    required: false
    default: ""
  latest:
    description: Apply the latest tag. Optional, off by default.
    required: false
    default: "false"
  latest-slim:
    description: Apply the latest-slim tag. Optional, off by default.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Recompute floating tags
      shell: bash
      env:
        JF_PROJECT: ${{ inputs.jf-project }}
        DOCKER_REPO: ${{ inputs.docker-repo }}
        BUNDLE_NAME: ${{ inputs.bundle-name }}
        BUNDLE_VERSION: ${{ inputs.version }}
        FLOATING_TAGS: ${{ inputs.floating-tags }}
        LATEST: ${{ inputs.latest }}
        LATEST_SLIM: ${{ inputs.latest-slim }}
      run: |
        set -euo pipefail
        if [[ -z $FLOATING_TAGS && $LATEST != true && $LATEST_SLIM != true ]]; then
          echo "No tag was named. latest and latest-slim are off. Attaching nothing."
          exit 0
        fi
        args=(
          retag
          --project "$JF_PROJECT"
          --repo "$DOCKER_REPO"
          --bundle-name "$BUNDLE_NAME"
          --version "$BUNDLE_VERSION"
        )
        if [[ -n $FLOATING_TAGS ]]; then
          args+=(--floating-tags "$FLOATING_TAGS")
        fi
        if [[ $LATEST == true ]]; then
          args+=(--latest)
        fi
        if [[ $LATEST_SLIM == true ]]; then
          args+=(--latest-slim)
        fi
        python3 "${{ github.action_path }}/recompute.py" "${args[@]}"
