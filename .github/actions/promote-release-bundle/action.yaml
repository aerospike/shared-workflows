name: Promote Release Bundle
description: Promote a JFrog release bundle to a target environment. JFrog CLI must be configured by the caller.
inputs:
  bundle-name:
    description: Release bundle name
    required: true
  version:
    description: Release bundle version to promote
    required: true
  environment:
    description: Target environment (DEV, TEST, STAGE, PROD, etc.)
    required: true
  jf-project:
    description: JFrog project key
    required: true
  include-repos:
    description: Semicolon-separated list of target repos to include in promotion (limits scope)
    required: false
    default: ""
  exclude-repos:
    description: Semicolon-separated list of target repos to exclude from promotion
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Show bundle before promotion
      shell: bash
      run: |
        echo "Bundle to promote: ${{ inputs.bundle-name }} ${{ inputs.version }}"
        jf release-bundle-search versions "${{ inputs.bundle-name }}" \
          --project="${{ inputs.jf-project }}" --format=json | \
          jq --arg v "${{ inputs.version }}" \
          '.release_bundles[] | select(.release_bundle_version == $v)'

    - name: Promote release bundle
      shell: bash
      run: |
        echo "Promoting ${{ inputs.bundle-name }} ${{ inputs.version }} to ${{ inputs.environment }}..."
        promote_args=("${{ inputs.bundle-name }}" "${{ inputs.version }}" "${{ inputs.environment }}")
        promote_args+=(--project="${{ inputs.jf-project }}")
        if [[ -n "${{ inputs.include-repos }}" ]]; then
          promote_args+=(--include-repos="${{ inputs.include-repos }}")
        fi
        if [[ -n "${{ inputs.exclude-repos }}" ]]; then
          promote_args+=(--exclude-repos="${{ inputs.exclude-repos }}")
        fi
        jf release-bundle-promote "${promote_args[@]}"
