name: Promote Release Bundle
description: Promote a JFrog release bundle to a target environment. JFrog CLI must be configured by the caller.
inputs:
  bundle-name:
    description: Release bundle name
    required: true
  version:
    description: Release bundle version to promote
    required: true
  environment:
    description: Target environment (DEV, TEST, STAGE, PROD, etc.)
    required: true
  jf-project:
    description: JFrog project key
    required: true
  include-repos:
    description: Semicolon-separated list of target repos to include in promotion (limits scope)
    required: false
    default: ""
  exclude-repos:
    description: Semicolon-separated list of target repos to exclude from promotion
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Show bundle before promotion
      shell: bash
      run: |
        echo "Bundle to promote: ${{ inputs.bundle-name }} ${{ inputs.version }}"
        jf release-bundle-search versions "${{ inputs.bundle-name }}" \
          --project="${{ inputs.jf-project }}" --format=json | \
          jq --arg v "${{ inputs.version }}" \
          '.release_bundles[] | select(.release_bundle_version == $v)'

    - name: Promote release bundle
      shell: bash
      run: |
        echo "Promoting ${{ inputs.bundle-name }} ${{ inputs.version }} to ${{ inputs.environment }}..."
        promote_args=("${{ inputs.bundle-name }}" "${{ inputs.version }}" "${{ inputs.environment }}")
        promote_args+=(--project="${{ inputs.jf-project }}")
        if [[ -n "${{ inputs.include-repos }}" ]]; then
          promote_args+=(--include-repos="${{ inputs.include-repos }}")
        fi
        if [[ -n "${{ inputs.exclude-repos }}" ]]; then
          promote_args+=(--exclude-repos="${{ inputs.exclude-repos }}")
        fi
        set -o pipefail
        jf release-bundle-promote "${promote_args[@]}" | tee "${RUNNER_TEMP}/release-bundle-promote.out"

    - name: Recompute Docker floating tags in the target repository
      shell: bash
      env:
        BUNDLE_NAME: ${{ inputs.bundle-name }}
        BUNDLE_VERSION: ${{ inputs.version }}
        JF_PROJECT: ${{ inputs.jf-project }}
        ENVIRONMENT: ${{ inputs.environment }}
      run: |
        set -euo pipefail
        # Same retag as .github/actions/recompute-docker-floating-tags. GitHub
        # checks out the action repository, so the sibling script is on disk.
        script="${{ github.action_path }}/../recompute-docker-floating-tags/recompute.py"
        if [[ ! -f $script ]]; then
          echo "::error::recompute-docker-floating-tags is not available next to this action"
          exit 1
        fi
        tags=$(python3 "$script" print-property \
          --project "$JF_PROJECT" --bundle-name "$BUNDLE_NAME" --version "$BUNDLE_VERSION")
        if [[ -z $tags ]]; then
          echo "Bundle has no docker.floating_tags property; not retagging."
          exit 0
        fi
        out="${RUNNER_TEMP}/release-bundle-promote.out"
        repos=""
        if [[ -s $out ]] && jq -e . "$out" >/dev/null 2>&1; then
          repos=$(python3 "$script" repos --environment "$ENVIRONMENT" --version "$BUNDLE_VERSION" <"$out")
        fi
        if [[ -z $repos ]]; then
          enc_project=$(jq -rn --arg v "$JF_PROJECT" '$v|@uri')
          catalog=$(jf rt curl -XGET "/api/repositories?project=${enc_project}" \
            -H "Accept: application/json" --silent)
          repos=$(printf '%s\n' "$catalog" | python3 "$script" repos --environment "$ENVIRONMENT" --version "$BUNDLE_VERSION")
        fi
        if [[ -z $repos ]]; then
          echo "::error::docker.floating_tags is set but the promotion result has no target Docker repository"
          exit 1
        fi
        while IFS= read -r repo; do
          [[ -n $repo ]] || continue
          python3 "$script" retag \
            --project "$JF_PROJECT" \
            --repo "$repo" \
            --bundle-name "$BUNDLE_NAME" \
            --version "$BUNDLE_VERSION" \
            --floating-tags "$tags"
        done <<<"$repos"
