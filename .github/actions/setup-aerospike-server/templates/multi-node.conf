service {
    ${FEATURE_KEY_FILE}
    cluster-name docker
}

${SECURITY}

logging {
    console {
        context any info
    }
}

network {
${TLS_CONFIG}
    service {
        address any
        port 3000
${TLS_SERVICE}
    }
    heartbeat {
        mode mesh
        address any
        port 3002
        interval 150
        timeout 10
${MESH_SEEDS}
    }
    fabric {
        address any
        port 3001
    }
}

${NAMESPACE}
