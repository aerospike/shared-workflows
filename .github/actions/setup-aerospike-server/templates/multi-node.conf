service {
    feature-key-file /etc/aerospike/features.conf
    cluster-name docker
}

__SECURITY__

logging {
    console {
        context any info
    }
}

network {
    service {
        address any
        port 3000
    }
    heartbeat {
        mode mesh
        address any
        port 3002
        interval 150
        timeout 10
__MESH_SEEDS__
    }
    fabric {
        address any
        port 3001
    }
}

__NAMESPACE__
