name: Setup Aerospike Server
description: >
  Starts one or more Aerospike Server containers, optionally forming
  a cluster, with support for custom config, feature files, and environment
  variable passthrough.

inputs:
  server-tag:
    description: Aerospike Docker image tag (version)
    required: false
    default: latest
  num-nodes:
    description: Number of cluster nodes (1+)
    required: false
    default: "1"
  start-nodes:
    description: >
      Number of nodes to start (1 to num-nodes). Defaults to num-nodes.
      Nodes after the first start-nodes are created and configured but not
      started; start them later with the aerospike-node-control action.
      When set, readiness also waits for a cluster of start-nodes nodes.
    required: false
    default: ""
  container-name-prefix:
    description: "Container name prefix (nodes: prefix-1, prefix-2, ...)"
    required: false
    default: aerospike
  features-file:
    description: Path to a features.conf on the runner
    required: false
    default: ""
  features-content:
    description: Raw features.conf content (e.g. from a GitHub secret). Ignored if features-file is set.
    required: false
    default: ""
  config-file:
    description: >
      Path to an aerospike.conf on the runner. {{NODE_INDEX}} (1-based) and
      {{NODE_NAME}} (container name) are replaced in each node's copy.
    required: false
    default: ""
  config-content:
    description: >
      Raw aerospike.conf content. Ignored if config-file is set.
      {{NODE_INDEX}} and {{NODE_NAME}} are replaced as for config-file.
    required: false
    default: ""
  env-vars:
    description: Semicolon-delimited KEY=VALUE pairs passed as -e flags to each container. Use \\; for literal semicolons, \\\\ for literal backslashes.
    required: false
    default: ""
  extra-hosts:
    description: >
      Comma-separated name:ip entries passed as --add-host flags to each
      container (e.g. db.example:10.0.0.5,gateway:host-gateway).
    required: false
    default: ""
  container-repo-url:
    description: Docker registry hostname
    required: false
    default: aerospike.jfrog.io
  server-container-repo:
    description: Image repository path within the registry
    required: false
    default: database-docker-virtual/aerospike-server-enterprise
  server-edition:
    description: Server edition. Use auto to infer from server-container-repo.
    required: false
    default: auto
  jfrog-platform-url:
    description: JFrog platform URL
    required: false
    default: https://aerospike.jfrog.io
  oidc-provider:
    description: JFrog OIDC provider name
    required: true
  oidc-audience:
    description: JFrog OIDC audience
    required: true
  network-name:
    description: Docker network name
    required: false
    default: aerospike-net
  network-subnet:
    description: >
      IPv4 subnet for the Docker network (e.g. 172.30.0.0/24). Node N gets
      the fixed IP network address + N + 1 (172.30.0.2 for node 1). Fails if
      network-name already exists with a different subnet.
    required: false
    default: ""
  base-port:
    description: Base host port (node N maps to base-port + N - 1)
    required: false
    default: "3000"
  service-port:
    description: Aerospike service port inside the container (must match aerospike.conf)
    required: false
    default: "3000"
  publish-ports:
    description: >
      Publish container ports to the runner host. Set false for L2 discovery
      topologies so tests cannot accidentally connect via localhost mappings.
    required: false
    default: "true"
  startup-timeout:
    description: Seconds to wait for each node and cluster formation
    required: false
    default: "30"
  enable-tls:
    description: Enable TLS on Aerospike Server containers
    required: false
    default: "false"
  tls-base-port:
    description: Base host port for TLS (node N maps to tls-base-port + N - 1)
    required: false
    default: "4333"
  tls-cert-cn:
    description: >
      Common Name on the generated server certificate. Defaults to the
      config tls-name (aerospike-tls). Set a different DNS name when a
      test needs that tls-name only as a SAN.
    required: false
    default: aerospike-tls
  include-tls-name-san:
    description: >
      Include the config tls-name (aerospike-tls) as a DNS SAN on the
      server certificate. Set false when a test needs that name only in
      the CN. Other SANs (container names, localhost, docker, 127.0.0.1)
      are always included.
    required: false
    default: "true"
  enable-security:
    description: Enable Aerospike security (authentication with default admin/admin credentials)
    required: false
    default: "false"
  enable-strong-consistency:
    description: Enable strong consistency on the test namespace. Requires a features file.
    required: false
    default: "false"
  sc-stability-timeout-seconds:
    description: Seconds to wait for SC cluster stability after roster setup
    required: false
    default: "30"
  tools-tag:
    description: Aerospike tools Docker image tag
    required: false
    default: 12.1.1_2
  enable-bash-trace-mode:
    description: Show commands being executed in shell scripts for debugging
    required: false
    default: "false"

outputs:
  container-names:
    description: Comma-separated container names
    value: ${{ steps.start-containers.outputs.container-names }}
  network-name:
    description: Docker network name created
    value: ${{ steps.create-network.outputs.network-name }}
  node-addresses:
    description: >
      Comma-separated node IPs on network-name, in node order. Without
      network-subnet, the entry for a node that was not started is empty.
    value: ${{ steps.start-containers.outputs.node-addresses }}
  service-ports:
    description: Comma-separated host ports
    value: ${{ steps.start-containers.outputs.service-ports }}
  tls-service-ports:
    description: Comma-separated TLS host ports (empty if TLS disabled)
    value: ${{ steps.start-containers.outputs.tls-service-ports }}
  tls-cert-dir:
    description: Directory containing generated TLS certs (empty if TLS disabled)
    value: ${{ steps.generate-tls-certs.outputs.tls-cert-dir }}
  cluster-settings:
    description: Cluster settings as JSON, passed to aerospike-node-control
    value: ${{ steps.cluster-settings.outputs.cluster-settings }}

runs:
  using: composite
  steps:
    - name: Validate inputs
      id: validate
      shell: bash
      env:
        ENABLE_BASH_TRACE_MODE: ${{ inputs.enable-bash-trace-mode }}
        EXTRA_HOSTS: ${{ inputs.extra-hosts }}
        NETWORK_SUBNET: ${{ inputs.network-subnet }}
      run: |
        echo "ENABLE_BASH_TRACE_MODE=$ENABLE_BASH_TRACE_MODE" >> "$GITHUB_ENV"
        if [[ "$ENABLE_BASH_TRACE_MODE" == "true" ]]; then
          set -x
        fi

        # shellcheck source=/dev/null
        source "${{ github.action_path }}/config-helpers.sh"

        error() { echo "Error: $1" >&2; exit 1; }

        [[ "${{ inputs.num-nodes }}" =~ ^[1-9][0-9]*$ ]] \
          || error "num-nodes must be a positive integer (got: '${{ inputs.num-nodes }}')"
        [[ "${{ inputs.base-port }}" =~ ^[1-9][0-9]*$ ]] \
          || error "base-port must be a positive integer (got: '${{ inputs.base-port }}')"
        [[ "${{ inputs.startup-timeout }}" =~ ^[1-9][0-9]*$ ]] \
          || error "startup-timeout must be a positive integer (got: '${{ inputs.startup-timeout }}')"
        [[ "${{ inputs.service-port }}" =~ ^[1-9][0-9]*$ ]] \
          || error "service-port must be a positive integer (got: '${{ inputs.service-port }}')"
        [[ "${{ inputs.publish-ports }}" == "true" || "${{ inputs.publish-ports }}" == "false" ]] \
          || error "publish-ports must be 'true' or 'false' (got: '${{ inputs.publish-ports }}')"

        if [[ "${{ inputs.enable-tls }}" == "true" ]]; then
          [[ "${{ inputs.tls-base-port }}" =~ ^[1-9][0-9]*$ ]] \
            || error "tls-base-port must be a positive integer (got: '${{ inputs.tls-base-port }}')"
          [[ "${{ inputs.include-tls-name-san }}" == "true" || "${{ inputs.include-tls-name-san }}" == "false" ]] \
            || error "include-tls-name-san must be 'true' or 'false' (got: '${{ inputs.include-tls-name-san }}')"
          [[ "${{ inputs.tls-cert-cn }}" =~ ^[A-Za-z0-9]([A-Za-z0-9.-]{0,251}[A-Za-z0-9])?$ ]] \
            || error "tls-cert-cn must be a DNS name (got: '${{ inputs.tls-cert-cn }}')"
        fi

        parse_extra_hosts "$EXTRA_HOSTS" >/dev/null \
          || error "extra-hosts must be comma-separated name:ip entries (got: '$EXTRA_HOSTS')"

        if [[ -n "$NETWORK_SUBNET" ]]; then
          subnet_node_addresses "$NETWORK_SUBNET" "${{ inputs.num-nodes }}" >/dev/null || exit 1
        fi

        effective_security="${{ inputs.enable-security }}"
        server_edition=$(resolve_server_edition "${{ inputs.server-edition }}" "${{ inputs.server-container-repo }}") \
          || error "server-edition must be one of: auto, enterprise, community; use enterprise or community when auto cannot infer from server-container-repo"

        if [[ "${{ inputs.num-nodes }}" -gt 1 && "$server_edition" == "enterprise" ]]; then
          [[ -n "${{ inputs.features-file }}" || -n "${{ inputs.features-content }}" ]] \
            || error "features-file or features-content is required for multi-node enterprise clusters (asdb-cluster-nodes-limit 0 must be set)"
        fi

        if [[ "${{ inputs.enable-strong-consistency }}" == "true" ]]; then
          [[ "$server_edition" == "enterprise" ]] \
            || error "enable-strong-consistency requires Aerospike Server Enterprise"
          [[ -n "${{ inputs.features-file }}" || -n "${{ inputs.features-content }}" ]] \
            || error "features-file or features-content is required for strong consistency"
        fi

        echo "effective-security=$effective_security" >> "$GITHUB_OUTPUT"
        echo "server-edition=$server_edition" >> "$GITHUB_OUTPUT"

    - name: Record cluster settings
      id: cluster-settings
      shell: bash
      env:
        PREFIX: ${{ inputs.container-name-prefix }}
        NETWORK_NAME: ${{ inputs.network-name }}
        SERVICE_PORT: ${{ inputs.service-port }}
        SECURITY: ${{ steps.validate.outputs.effective-security }}
        ENABLE_SC: ${{ inputs.enable-strong-consistency }}
        TOOLS_IMAGE: ${{ inputs.container-repo-url }}/database-docker-virtual/aerospike-tools:${{ inputs.tools-tag }}
      run: |
        settings=$(jq -nc --arg prefix "$PREFIX" --arg network "$NETWORK_NAME" --arg service_port "$SERVICE_PORT" \
          --arg security "$SECURITY" --arg strong_consistency "$ENABLE_SC" --arg tools_image "$TOOLS_IMAGE" \
          '$ARGS.named')
        echo "cluster-settings=$settings" >> "$GITHUB_OUTPUT"

    - name: Set up JFrog CLI
      id: jf
      uses: step-security/setup-jfrog-cli@a6b41f8338bea0983ddff6bd4ede7d2dcd81e1fa # v4.8.1
      env:
        JF_URL: ${{ inputs.jfrog-platform-url }}
      with:
        oidc-provider-name: ${{ inputs.oidc-provider }}
        oidc-audience: ${{ inputs.oidc-audience }}

    - name: Docker login
      uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
      with:
        registry: ${{ inputs.container-repo-url }}
        username: ${{ steps.jf.outputs.oidc-user }}
        password: ${{ steps.jf.outputs.oidc-token }}

    - name: Create volumes to send TLS files and server config file to the server
      id: server-volume
      run: |
        if [[ "$ENABLE_BASH_TRACE_MODE" == "true" ]]; then
          set -x
        fi

        CONFIG_FILES_VOLUME_NAME="server_volume_${{ github.run_id }}_${{ github.run_attempt }}"
        echo "conf_volume_name=$CONFIG_FILES_VOLUME_NAME" >> "$GITHUB_OUTPUT"
        docker volume create "$CONFIG_FILES_VOLUME_NAME"

        CONTAINER_NAME_TO_LOAD_VOLUME="container_to_load_volume_${{ github.run_id }}_${{ github.run_attempt }}"
        echo "container_name_to_load_volume=$CONTAINER_NAME_TO_LOAD_VOLUME" >> "$GITHUB_OUTPUT"

        # Avoid overriding the default config files in /etc/aerospike
        VOLUME_DEST_DIR=/etc/aerospike-custom
        echo "conf_volume_dest_dir=$VOLUME_DEST_DIR" >> "$GITHUB_OUTPUT"

        TLS_VOLUME_NAME="tls_server_volume_${{ github.run_id }}_${{ github.run_attempt }}"
        echo "tls_volume_name=$TLS_VOLUME_NAME" >> "$GITHUB_OUTPUT"
        docker volume create "$TLS_VOLUME_NAME"

        TLS_VOLUME_DEST_DIR=/etc/aerospike/tls
        echo "tls_volume_dest_dir=$TLS_VOLUME_DEST_DIR" >> "$GITHUB_OUTPUT"

        docker run --name "$CONTAINER_NAME_TO_LOAD_VOLUME" -d \
          -v "$CONFIG_FILES_VOLUME_NAME:$VOLUME_DEST_DIR" \
          -v "$TLS_VOLUME_NAME:$TLS_VOLUME_DEST_DIR" \
          alpine tail -f /dev/null
      shell: bash
      env:
        # Prevents volume directories from being expanded since they start with /
        MSYS_NO_PATHCONV: 1

    - name: Generate TLS certificates
      id: generate-tls-certs
      if: inputs.enable-tls == 'true'
      shell: bash
      env:
        # Prevents subject name from being treated like a path while running openssl commands
        MSYS_NO_PATHCONV: 1
        TLS_CERT_CN: ${{ inputs.tls-cert-cn }}
        INCLUDE_TLS_NAME_SAN: ${{ inputs.include-tls-name-san }}
        TLS_NUM_NODES: ${{ inputs.num-nodes }}
        TLS_NAME_PREFIX: ${{ inputs.container-name-prefix }}
      run: |
        if [[ "$ENABLE_BASH_TRACE_MODE" == "true" ]]; then
          set -x
        fi

        cert_dir="$(mktemp -d)"

        # tls-name is fixed in templates/tls-service.conf and tls-network.conf.
        # tls-cert-cn and include-tls-name-san change only the certificate shape.
        "${{ github.action_path }}/generate-tls-certs.sh" \
          --out-dir "$cert_dir" \
          --num-nodes "$TLS_NUM_NODES" \
          --name-prefix "$TLS_NAME_PREFIX" \
          --cn "$TLS_CERT_CN" \
          --tls-name aerospike-tls \
          --include-tls-name-san "$INCLUDE_TLS_NAME_SAN"

        echo "Generated TLS certificates in $cert_dir"
        ls -la "$cert_dir"
        echo "tls-cert-dir=$cert_dir" >> "$GITHUB_OUTPUT"

        # Make sure that docker gets the actual Windows path of the user's temp folder in order to copy properly
        # MSYS2_ARG_CONV_EXCL is another way to do this, but I had trouble using it
        if [[ "${{ runner.os }}" == "Windows" ]]; then
          copy_path="$(cygpath -w "$cert_dir")\\."
        else
          copy_path="$cert_dir/."
        fi
        docker cp "$copy_path" "${{ steps.server-volume.outputs.container_name_to_load_volume }}:${{ steps.server-volume.outputs.tls_volume_dest_dir }}"
        docker exec "${{ steps.server-volume.outputs.container_name_to_load_volume }}" ls "${{ steps.server-volume.outputs.tls_volume_dest_dir }}"

    - name: Prepare config files
      id: prepare-config
      shell: bash
      env:
        FEATURES_CONTENT: ${{ inputs.features-content }}
        CONFIG_CONTENT: ${{ inputs.config-content }}
      run: |
        if [[ "$ENABLE_BASH_TRACE_MODE" == "true" ]]; then
          set -x
        fi

        features_path="${{ inputs.features-file }}"
        config_path="${{ inputs.config-file }}"
        effective_security="${{ steps.validate.outputs.effective-security }}"
        server_edition="${{ steps.validate.outputs.server-edition }}"
        enable_sc="${{ inputs.enable-strong-consistency }}"
        num_nodes=${{ inputs.num-nodes }}
        tpl_dir="${{ github.action_path }}/templates"

        render_tpl="${{ github.action_path }}/render-template.sh"
        # shellcheck source=/dev/null
        source "${{ github.action_path }}/config-helpers.sh"

        # Build security stanza from template
        export SECURITY=""
        if [[ "$effective_security" == "true" ]]; then
          SECURITY=$(cat "$tpl_dir/security.conf")
        fi

        # Build namespace block from template
        if [[ "$enable_sc" == "true" ]]; then
          export REPLICATION_FACTOR=$(( num_nodes < 2 ? num_nodes : 2 ))
          export NAMESPACE=$("$render_tpl" "$tpl_dir/namespace-sc.conf")
        else
          export REPLICATION_FACTOR=1
          export NAMESPACE=$("$render_tpl" "$tpl_dir/namespace-memory.conf")
        fi

        if [[ "$server_edition" == "community" ]]; then
          if [[ -n "$features_path" || -n "${FEATURES_CONTENT}" ]]; then
            echo "::notice::Ignoring features-file/features-content for Aerospike Server Community"
          fi
          features_path=""
        else
          # Write features-content to temp file only when the edition can use it.
          if [[ -z "$features_path" && -n "${FEATURES_CONTENT}" ]]; then
            features_path="$(mktemp)"
            printf '%s' "${FEATURES_CONTENT}" > "$features_path"
            echo "Wrote features-content to $features_path"
          fi

          if ! should_use_features_file "$server_edition" "$features_path"; then
            export FEATURE_KEY_FILE=""
            features_path=""
          else
            features_conf_filename=$(basename "$features_path")

            export FEATURE_KEY_FILE
            FEATURE_KEY_FILE=$(build_feature_key_file_directive "$server_edition" "${{ inputs.features-file }}" "${FEATURES_CONTENT}" "${{ steps.server-volume.outputs.conf_volume_dest_dir }}/$features_conf_filename")
          fi
        fi

        # Write config-content to temp file if no file path was given
        if [[ -z "$config_path" && -n "${CONFIG_CONTENT}" ]]; then
          config_path="$(mktemp)"
          printf '%s' "${CONFIG_CONTENT}" > "$config_path"
          echo "Wrote config-content to $config_path"
        fi

        # If user provided a custom config, handle security/SC injection
        if [[ -n "$config_path" ]]; then
          if [[ "$server_edition" == "community" ]] && config_declares_feature_key_file "$config_path"; then
            sanitized_config_path="$(mktemp)"
            strip_feature_key_file_directive "$config_path" "$sanitized_config_path"
            config_path="$sanitized_config_path"
            echo "::notice::Removed enterprise-only feature-key-file directive from Aerospike Server Community config"
          fi

          if [[ "$effective_security" == "true" ]]; then
            # Append security stanza if not already present
            if ! grep -q 'security {' "$config_path" 2>/dev/null; then
              echo "" >> "$config_path"
              echo "$SECURITY" >> "$config_path"
              echo "Appended security stanza to user-provided config"
            fi
          fi
          if [[ "$enable_sc" == "true" ]]; then
            echo "::warning::Strong consistency directives must be present in your custom config; the action does not inject namespace SC settings into user-provided configs"
          fi
        fi

        # config_path is still empty when neither config-file nor config-content
        # was set. Render the single-node default here. Leave multi-node empty
        # so start-containers takes its generated-config branch and renders
        # multi-node.conf, including the TLS listener when enable-tls is set.
        if [[ "$num_nodes" -eq 1 && -z "$config_path" ]]; then
          if [[ "${{ inputs.enable-tls }}" == "true" ]]; then
            export_tls_template_vars "$tpl_dir" "true"
            config_path="$(mktemp)"
            "$render_tpl" "$tpl_dir/tls.conf" "$config_path"
            echo "Generated default TLS-enabled aerospike.conf at $config_path"
          elif [[ "$effective_security" == "true" || "$enable_sc" == "true" ]]; then
            config_path="$(mktemp)"
            "$render_tpl" "$tpl_dir/default.conf" "$config_path"
            echo "Generated default security/SC-enabled aerospike.conf at $config_path"
          fi
        fi

        echo "features-path=$features_path" >> "$GITHUB_OUTPUT"
        echo "config-path=$config_path" >> "$GITHUB_OUTPUT"

        if [[ "$server_edition" == "enterprise" && -n "$features_path" ]]; then
          docker cp "$features_path" "${{ steps.server-volume.outputs.container_name_to_load_volume }}:${{ steps.server-volume.outputs.conf_volume_dest_dir }}"
        fi

    - name: Create Docker network
      id: create-network
      shell: bash
      env:
        NETWORK_NAME: ${{ inputs.network-name }}
        NETWORK_SUBNET: ${{ inputs.network-subnet }}
      run: |
        "${{ github.action_path }}/create-network.sh" \
          --network "$NETWORK_NAME" \
          --subnet "$NETWORK_SUBNET"

    - name: Start Aerospike Server containers
      id: start-containers
      shell: bash
      env:
        ENV_VARS: ${{ inputs.env-vars }}
        EXTRA_HOSTS: ${{ inputs.extra-hosts }}
        START_NODES: ${{ inputs.start-nodes }}
        NETWORK_SUBNET: ${{ inputs.network-subnet }}
      run: |
        "${{ github.action_path }}/start-containers.sh" \
          --num-nodes "${{ inputs.num-nodes }}" \
          --start-nodes "$START_NODES" \
          --network-subnet "$NETWORK_SUBNET" \
          --base-port "${{ inputs.base-port }}" \
          --container-name-prefix "${{ inputs.container-name-prefix }}" \
          --service-port "${{ inputs.service-port }}" \
          --image "${{ inputs.container-repo-url }}/${{ inputs.server-container-repo }}:${{ inputs.server-tag }}" \
          --network "${{ inputs.network-name }}" \
          --features-path "${{ steps.prepare-config.outputs.features-path }}" \
          --config-path "${{ steps.prepare-config.outputs.config-path }}" \
          --publish-ports "${{ inputs.publish-ports }}" \
          --enable-tls "${{ inputs.enable-tls }}" \
          --tls-base-port "${{ inputs.tls-base-port }}" \
          --security "${{ steps.validate.outputs.effective-security }}" \
          --enable-sc "${{ inputs.enable-strong-consistency }}" \
          --server-edition "${{ steps.validate.outputs.server-edition }}" \
          --conf-volume-name "${{ steps.server-volume.outputs.conf_volume_name }}" \
          --conf-volume-dest-dir "${{ steps.server-volume.outputs.conf_volume_dest_dir }}" \
          --tls-volume-name "${{ steps.server-volume.outputs.tls_volume_name }}" \
          --tls-volume-dest-dir "${{ steps.server-volume.outputs.tls_volume_dest_dir }}" \
          --loader-container "${{ steps.server-volume.outputs.container_name_to_load_volume }}"

    - name: Wait for Aerospike Server readiness
      shell: bash
      env:
        START_NODES: ${{ inputs.start-nodes }}
      run: |
        chmod +x "${{ github.action_path }}/wait-for-aerospike-server.sh"

        bash_command=( "bash" )
        if [[ "$ENABLE_BASH_TRACE_MODE" == "true" ]]; then
          bash_command+=("-x")
        fi

        container_names="${{ steps.start-containers.outputs.container-names }}"
        size_args=()
        if [[ -n "$START_NODES" ]]; then
          container_names=$(cut -d, -f "1-$START_NODES" <<<"$container_names")
          size_args=(--cluster-size "$START_NODES")
        fi

        "${bash_command[@]}" "${{ github.action_path }}/wait-for-aerospike-server.sh" \
          --container-names "$container_names" \
          "${size_args[@]}" \
          --timeout "${{ inputs.startup-timeout }}" \
          --service-port "${{ inputs.service-port }}" \
          --security "${{ steps.validate.outputs.effective-security }}" \
          --enable-sc "${{ inputs.enable-strong-consistency }}" \
          --tools-image "${{ inputs.container-repo-url }}/database-docker-virtual/aerospike-tools:${{ inputs.tools-tag }}" \
          --network "${{ inputs.network-name }}"

    - name: Print Aerospike server version
      shell: bash
      run: |
        if [[ "$ENABLE_BASH_TRACE_MODE" == "true" ]]; then
          set -x
        fi

        image="${{ inputs.container-repo-url }}/${{ inputs.server-container-repo }}:${{ inputs.server-tag }}"
        first_container="${{ inputs.container-name-prefix }}-1"

        echo "============================================"
        echo "Aerospike Server Image"
        echo "============================================"
        echo "Aerospike server image: ${image}"
        echo "Aerospike server image tag: ${{ inputs.server-tag }}"
        echo ""

        echo "============================================"
        echo "Aerospike Server Version (from container)"
        echo "============================================"
        if version_output=$(docker exec "$first_container" asd --version 2>&1); then
          echo "Aerospike server version: ${version_output}"
        else
          echo "::warning::Could not retrieve Aerospike server version via 'asd --version': ${version_output}"
          # Fall back to checking container logs for the version line
          if log_version=$(docker logs "$first_container" 2>&1 | grep -m1 'Aerospike'); then
            echo "Aerospike server version (from logs): ${log_version}"
          else
            echo "::warning::Could not determine Aerospike server version from container logs either"
          fi
        fi
        echo "============================================"

    - name: Setup strong consistency
      if: inputs.enable-strong-consistency == 'true'
      shell: bash
      run: |
        if [[ "$ENABLE_BASH_TRACE_MODE" == "true" ]]; then
          set -x
        fi

        tools_image="${{ inputs.container-repo-url }}/database-docker-virtual/aerospike-tools:${{ inputs.tools-tag }}"
        network="${{ inputs.network-name }}"
        first_container="${{ inputs.container-name-prefix }}-1"
        service_port=${{ inputs.service-port }}

        auth_flags=""
        if [[ "${{ steps.validate.outputs.effective-security }}" == "true" ]]; then
          auth_flags="-U admin -P admin"
        fi

        echo "Setting up strong consistency roster..."
        echo "  Tools image: $tools_image"
        echo "  Network: $network"
        echo "  Target: $first_container:$service_port"
        echo "  Auth flags: ${auth_flags:-(none)}"

        # Grant sys-admin role so admin has service-ctrl permission for roster commands
        if [[ -n "$auth_flags" ]]; then
          echo "  Granting sys-admin role to admin user..."
          # shellcheck disable=SC2086
          docker run --rm --network "$network" "$tools_image" \
            asadm -h "$first_container" -p "$service_port" $auth_flags \
            --enable --execute "manage acl grant user admin roles sys-admin" 2>&1 || {
            echo "Error: failed to grant sys-admin role (exit code $?)" >&2
            exit 1
          }
        fi

        echo "  Running: asadm manage roster stage observed ns test"
        # shellcheck disable=SC2086 -- auth_flags contains multiple arguments that must be word split
        docker run --rm --network "$network" "$tools_image" \
          asadm -h "$first_container" -p "$service_port" $auth_flags \
          --enable --execute "manage roster stage observed ns test" 2>&1 || {
          echo "Error: roster stage command failed (exit code $?)" >&2
          echo "Server logs:" >&2
          docker logs --tail 30 "$first_container" >&2
          exit 1
        }

        echo "  Running: asadm manage recluster"
        # shellcheck disable=SC2086 -- auth_flags contains multiple arguments that must be word split
        docker run --rm --network "$network" "$tools_image" \
          asadm -h "$first_container" -p "$service_port" $auth_flags \
          --enable --execute "manage recluster" 2>&1 || {
          echo "Error: recluster command failed (exit code $?)" >&2
          echo "Server logs:" >&2
          docker logs --tail 30 "$first_container" >&2
          exit 1
        }

        # Wait for SC partitions to become active after recluster
        num_nodes=${{ inputs.start-nodes || inputs.num-nodes }}
        timeout=${{ inputs.sc-stability-timeout-seconds }}
        echo "  Waiting for cluster stability (size=$num_nodes, ignore-migrations=false)..."
        elapsed=0
        while (( elapsed < timeout )); do
          rc=0
          # shellcheck disable=SC2086
          result=$(docker run --rm --network "$network" "$tools_image" \
            asinfo -h "$first_container" -p "$service_port" $auth_flags \
            -v "cluster-stable:size=$num_nodes;ignore-migrations=false" 2>&1) || rc=$?
          if [[ $rc -eq 0 && -n "$result" && "$result" != *"ERROR"* ]]; then
            echo "  Cluster is stable after recluster (${elapsed}s): $result"
            break
          fi
          sleep 1
          elapsed=$((elapsed + 1))
        done

        if (( elapsed >= timeout )); then
          echo "Error: Cluster did not stabilize within ${timeout}s after recluster" >&2
          echo "Last result: $result" >&2
          docker logs --tail 30 "$first_container" >&2
          exit 1
        fi

        echo "Strong consistency roster setup complete."

    - name: Cleanup
      if: ${{ always() && steps.server-volume.outcome == 'success' }}
      shell: bash
      run: |
        # No longer need these
        docker stop ${{ steps.server-volume.outputs.container_name_to_load_volume }}
        docker container rm -f ${{ steps.server-volume.outputs.container_name_to_load_volume }}
