service {
    feature-key-file /etc/aerospike-custom/features.conf
    cluster-name docker
}


logging {
    console {
        context any info
    }
}

network {
    service {
        address any
        port 3000
    }
    heartbeat {
        mode mesh
        address any
        port 3002
        interval 150
        timeout 10
        mesh-seed-address-port aerospike-1 3002
        mesh-seed-address-port aerospike-2 3002
        mesh-seed-address-port aerospike-3 3002
    }
    fabric {
        address any
        port 3001
    }
}

namespace test {
    replication-factor 2
    storage-engine memory {
        data-size 1G
    }
}
