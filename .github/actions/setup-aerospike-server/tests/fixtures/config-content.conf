service {
    cluster-name custom
    proto-fd-max 15000
}

logging {
    console {
        context any info
    }
}

network {
    service {
        address any
        port 3000
    }
    heartbeat {
        mode mesh
        address any
        port 3002
    }
    fabric {
        address any
        port 3001
    }
}

namespace test {
    replication-factor 2
    storage-engine memory {
        data-size 1G
    }
}
