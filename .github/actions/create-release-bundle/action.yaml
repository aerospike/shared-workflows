name: Create Release Bundle
description: Create a JFrog release bundle from one or more builds. JFrog CLI must be configured by the caller.
inputs:
  build-names:
    description: |
      Comma-separated list of build name:version pairs to include in the release bundle.
      Format: "build-name1:version1,build-name2:version2"
    required: true
  bundle-name:
    description: Name for the release bundle
    required: true
  version:
    description: Version of the release bundle
    required: true
  jf-project:
    description: JFrog project key
    required: true
  dry-run:
    description: Whether to run in dry-run mode
    required: false
    default: "false"
  bundle-revision:
    description: |
      Appended to `version` to form the bundle version, so a rebuild of a release becomes a new
      bundle revision rather than colliding with the bundle the first build created. The artifacts
      keep the clean release version. Set to `auto` to use the run id and attempt.
    required: false
    default: ""
  entrypoint-path:
    description: Path to the create-release-bundle entrypoint script (relative to workspace)
    required: false
    default: .github/workflows/create-release-bundle/entrypoint.sh
  bundle-metadata-path:
    description: |
      Optional path to `.maven-bundle-metadata.json` (e.g. detect-artifacts output `bundle-metadata-path`).
      When set and the file exists, key=value pairs from the JSON are applied to the release bundle version using
      `jf release-bundle-annotate` after `jf release-bundle-create`. Relative paths are resolved from the job workspace.
    required: false
    default: ""
outputs:
  bundle-version:
    description: Bundle version that was created, including the revision when one was requested
    value: ${{ steps.create.outputs.bundle-version }}
runs:
  using: composite
  steps:
    - name: Create Release Bundle
      id: create
      shell: bash
      run: |
        entrypoint="${{ inputs.entrypoint-path }}"
        if [[ ! -f "$entrypoint" ]]; then
          echo "Error: entrypoint not found at $entrypoint" >&2
          echo "The caller must checkout the shared-workflows repo (or at least the entrypoint script) before calling this action." >&2
          exit 1
        fi
        chmod +x "$entrypoint"
        dry_run_arg=""
        if [ "${{ inputs.dry-run }}" = "true" ]; then
          dry_run_arg="--dry-run"
        fi
        meta_arg=()
        if [[ -n "${{ inputs.bundle-metadata-path }}" ]]; then
          meta_arg=(--bundle-metadata "${{ inputs.bundle-metadata-path }}")
        fi
        revision_arg=()
        revision="${{ inputs.bundle-revision }}"
        if [[ "$revision" == "auto" ]]; then
          revision="${{ github.run_id }}-${{ github.run_attempt }}"
        fi
        if [[ -n "$revision" ]]; then
          revision_arg=(--revision "$revision")
        fi
        "$entrypoint" \
          --project "${{ inputs.jf-project }}" \
          --build-names "${{ inputs.build-names }}" \
          --bundle-name "${{ inputs.bundle-name }}" \
          --version "${{ inputs.version }}" \
          "${meta_arg[@]}" \
          "${revision_arg[@]}" \
          $dry_run_arg
