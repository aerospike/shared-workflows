name: Fetch conformance fixtures
description: >
  Download one pinned aerospike-client-conformance release from JFrog and
  extract it so the destination has VERSION at its root.

inputs:
  version:
    description: Fixture set version, MAJOR.MINOR.PATCH, with no v prefix
    required: true
  destination:
    description: Workspace-relative directory to extract into
    required: false
    default: conformance-fixtures
  oidc-provider-name:
    description: JFrog OIDC provider name
    required: true
  oidc-audience:
    description: JFrog OIDC audience
    required: true

outputs:
  fixtures-directory:
    description: Absolute directory containing VERSION
    value: ${{ steps.fetch.outputs.fixtures-directory }}

runs:
  using: composite
  steps:
    - name: Set up JFrog CLI
      uses: step-security/setup-jfrog-cli@a6b41f8338bea0983ddff6bd4ede7d2dcd81e1fa # v4.8.1
      env:
        JF_URL: https://aerospike.jfrog.io
      with:
        oidc-provider-name: ${{ inputs.oidc-provider-name }}
        oidc-audience: ${{ inputs.oidc-audience }}

    - name: Download and extract the fixture set
      id: fetch
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        DESTINATION: ${{ inputs.destination }}
      run: |
        set -euo pipefail
        [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must be MAJOR.MINOR.PATCH (got: '$VERSION')"; exit 1; }
        [[ -n $DESTINATION && $DESTINATION != /* && $DESTINATION != *..* ]] ||
          { echo "::error::destination must be a relative path inside the workspace (got: '$DESTINATION')"; exit 1; }
        dest="$GITHUB_WORKSPACE/$DESTINATION"
        [[ ! -e $dest ]] || { echo "::error::destination already exists: $dest"; exit 1; }

        name="aerospike-client-conformance-${VERSION}"
        work=$(mktemp -d)
        jf rt download "database-generic-dev-local/aerospike-client-conformance/${VERSION}/${name}.zip" "$work/" \
          --flat=true --fail-no-op --project=database
        # unzip drops ../ from entry names but extracts symlinks as-is.
        if unzip -Z "$work/${name}.zip" | grep -q '^l'; then
          echo "::error::release zip contains a symlink"
          exit 1
        fi
        unzip -q "$work/${name}.zip" -d "$work"
        found=$(tr -d '[:space:]' <"$work/$name/VERSION")
        [[ $found == "$VERSION" ]] || { echo "::error::VERSION is ${found}, expected ${VERSION}"; exit 1; }

        mkdir -p "$(dirname "$dest")"
        mv "$work/$name" "$dest"
        echo "fixtures-directory=$dest" >>"$GITHUB_OUTPUT"
        echo "Extracted fixture set ${VERSION} to ${dest}"
