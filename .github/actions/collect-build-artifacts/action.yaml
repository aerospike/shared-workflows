name: Collect Build Artifacts
description: Download per-matrix build artifacts and merge them into a single artifact for downstream jobs.
inputs:
  pattern:
    description: Glob pattern to match artifact names (e.g. build-artifacts-*)
    required: false
    default: build-artifacts-*
  output-name:
    description: Name for the merged output artifact
    required: false
    default: build-artifacts
  retention-days:
    description: Number of days to retain the merged artifact
    required: false
    default: "1"
runs:
  using: composite
  steps:
    - name: Download matrix artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: ${{ inputs.pattern }}
        path: ${{ inputs.output-name }}
        merge-multiple: true
    - name: Upload merged artifacts
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: ${{ inputs.output-name }}
        path: ${{ inputs.output-name }}
        retention-days: ${{ inputs.retention-days }}
