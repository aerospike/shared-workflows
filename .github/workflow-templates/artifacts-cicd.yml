# Artifacts CI/CD
#
# Copy into your repository as .github/workflows/ci.yml (or use as a GitHub workflow template).
#
# This is the recommended "just works" artifact pipeline:
# build → sign → deploy

name: CI/CD (artifacts)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  cicd:
    uses: aerospike/shared-workflows/.github/workflows/reusable_artifacts-cicd.yaml@v2.0.3
    with:
      gh-workflows-ref: v2.0.3 # Must match @v2.0.3 above
      jf-project: my-project
      jf-build-name: my-app
      version: 0.0.0-dev
      gh-artifact-directory: dist
      build-script: |
        set -euo pipefail
        make build

      # Optional:
      # preset: default|dotnet|custom
      # matrix-json: >-
      #   {"include":[
      #     {"runs-on":"ubuntu-22.04","distro":"jammy","arch":"x86_64"},
      #     {"runs-on":"ubuntu-22.04","distro":"noble","arch":"x86_64"}
      #   ]}
      # post-sign hook (advanced):
      # - add a follow-on job that depends on this job and consumes signed artifacts
    secrets: inherit
